<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lernapp zum Apfel für Klasse 1 mit Vorlesefunktion">
<title>Apfel Rudi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}
/* Layout wie Igel Pieks: eine Bildschirm-App mit großen Bildkacheln, Kopfleiste mit Haus + Vorlese-Knopf */
:root{
  --meadow:#eaf1da; --meadow2:#d5e4bd; --card:#fffdf6; --ink:#2f3528; --ink2:#5f6a57;
  --bark:#7a4f2f; --sun:#f0a12b; --sunsoft:#fde7bf; --apple:#d93a2b;
  --ok:#3b9450; --oksoft:#d9f0dc; --no:#cf5236; --nosoft:#fadcd3;
  --font:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
html{touch-action:manipulation}
body{background:var(--meadow);color:var(--ink);font-family:var(--font);font-size:20px;line-height:1.35;padding-inline:16px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button,[role="button"]{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.tile,.item,.season,.film,.icard,.choice{cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.app{max-width:1100px;margin:0 auto;padding-block:12px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--meadow);padding-block:8px;z-index:5}
header h1{flex:1;margin:0;font-size:clamp(26px,4vw,38px);display:flex;align-items:center;gap:10px;min-width:0}
.round{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 3px 0 var(--meadow2);flex:none}
.round svg{width:32px;height:32px}
.round.big{width:78px;height:78px;background:var(--sun);box-shadow:0 4px 0 #c47e17}
.round.big svg{width:42px;height:42px}
.spk{width:44px;height:44px;border-radius:50%;background:var(--sunsoft);display:inline-grid;place-items:center;flex:none;vertical-align:middle}
.spk svg{width:24px;height:24px}
.spk:active{transform:scale(.92)}
.word{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.hint{color:var(--ink2);font-size:17px;margin:0}
[hidden]{display:none!important}

/* Startseite */
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr);gap:16px;align-items:center}
.hero .apfel{width:100%;max-height:340px}
.bubble{background:var(--card);border-radius:28px;padding:18px 22px;font-size:24px;position:relative;box-shadow:0 4px 0 var(--meadow2);display:flex;gap:12px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.tile{background:var(--card);border-radius:26px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 5px 0 var(--meadow2);position:relative;text-align:center}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--meadow2)}
.tile .pic{font-size:62px;line-height:1;height:78px;display:grid;place-items:center}
.tile .pic svg{height:78px;width:auto}
.tile .lab{font-size:22px;font-weight:700;display:flex;align-items:center;gap:6px}
.tile .done{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.tile .done svg{width:18px;height:18px}
.tile.test{background:var(--sunsoft)}

/* Apfel-Grafik */
.apfel{display:block;max-width:100%;overflow:visible}
.apfel [data-part]{cursor:pointer}
.apfel .hi :not(.hit){stroke:var(--sun);stroke-width:6px;paint-order:stroke}
.apfel .hit{fill:transparent}
.apfel .ring{fill:none}
.apfel .lbl rect{fill:var(--card);stroke:var(--sun);stroke-width:3}
.apfel .lbl text{font-family:var(--font);font-weight:700;font-size:22px;fill:var(--ink)}
.apfel .lbl line{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:4 4}
.mampf{animation:mampf .5s 2}
.nein{animation:nein .45s 2}
@keyframes mampf{50%{transform:scale(1.06) translateY(-6px)}}
@keyframes nein{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

/* Teile */
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--card);border-radius:26px;padding:16px;box-shadow:0 5px 0 var(--meadow2);display:flex;flex-direction:column;gap:12px;min-width:0}
.modes{display:flex;gap:10px;flex-wrap:wrap}
.mode{padding:10px 16px;border-radius:999px;background:var(--card);box-shadow:0 3px 0 var(--meadow2);font-weight:700;display:flex;align-items:center;gap:8px}
.mode[aria-pressed="true"]{background:var(--sun);color:#2a1a05;box-shadow:0 3px 0 #c47e17}
.cards{display:flex;flex-wrap:wrap;gap:10px}
.wcard{background:var(--meadow);border-radius:18px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:8px;font-size:24px;font-weight:700;border:4px solid transparent}
.wcard.sel{border-color:var(--sun);background:var(--sunsoft)}
.wcard.ok{background:var(--oksoft);opacity:.55}
.info{font-size:22px;display:flex;gap:10px;align-items:flex-start}
.info big{display:block;font-size:30px;font-weight:700}

/* Küche + Wachsen */
.feed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:center}
.feed .apfel{max-height:240px;margin:0 auto}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:46px;height:46px;border-radius:50%;border:3px dashed var(--bark);display:grid;place-items:center;font-size:26px}
.slot.full{border-style:solid;background:var(--oksoft);border-color:var(--ok)}
.food{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.item{background:var(--card);border-radius:22px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 var(--meadow2);position:relative}
.item .pic{font-size:54px;line-height:1.1;height:66px;display:grid;place-items:center}
.item .pic svg{height:62px;width:auto}
.item .pic .sm svg{height:36px}
.item .lab{font-size:17px;font-weight:700;display:flex;align-items:center;gap:4px;text-align:center}
.item .lab .spk{width:34px;height:34px}.item .lab .spk svg{width:18px;height:18px}
.item.eaten{visibility:hidden}
.item.bad{background:var(--nosoft)}
.item.bad::after{content:"";position:absolute;inset:10px;background:linear-gradient(45deg,transparent 46%,var(--no) 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,var(--no) 46% 54%,transparent 54%);opacity:.5;pointer-events:none}
.gslots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.gslot{aspect-ratio:1;border:3px dashed var(--bark);border-radius:20px;display:grid;place-items:center;position:relative;background:#fff}
.gslot .num{position:absolute;top:4px;left:9px;font-weight:700;color:var(--ink2);font-size:20px}
.gslot .in{width:72%}
.gslot .in svg{width:100%;height:auto;display:block}
.gslot .in .sm{display:block;width:60%;margin:0 auto}
.gslot.full{border-style:solid;background:var(--oksoft);border-color:var(--ok);animation:pop .3s}
.gslot.next{border-color:var(--sun);border-width:5px}
.stk{position:relative;display:inline-block}
.stk .bee{position:absolute;right:-8%;top:-12%;font-size:.5em;line-height:1}
.item .stk .bee{font-size:28px}
.gslot .stk{display:block}.gslot .stk .bee{font-size:min(6vw,42px)}

/* Szenen */
.scene{border-radius:24px;position:relative;overflow:hidden;aspect-ratio:16/9;max-width:100%;container-type:inline-size}
.bg-fruehling{background:linear-gradient(#bfe3f5,#e8f6ff 55%,#9fd27f 55%,#7fbf5f)}
.bg-sommer{background:linear-gradient(#8fd0f2,#d8f1ff 55%,#a9cf6a 55%,#86b84c)}
.bg-herbst{background:linear-gradient(#f6d39a,#fbe7c4 55%,#c9893f 55%,#a86d2e)}
.bg-winter{background:linear-gradient(#c6d6e8,#eef4fa 55%,#ffffff 55%,#e2ebf3)}
.bg-garten{background:linear-gradient(#a6dcf5,#e4f6ff 55%,#8fc66a 55%,#6fae4d)}
.deco{position:absolute;line-height:1;pointer-events:none}
.seasons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.season{border-radius:22px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--meadow2);border:4px solid transparent}
.season[aria-pressed="true"]{border-color:var(--sun)}
.season .pic{font-size:48px;line-height:1.1}
.season .lab{font-size:20px;font-weight:700;display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:2px 4px 2px 12px}
.season .lab .spk{width:36px;height:36px}
.s-fruehling{background:#d6efc4}.s-sommer{background:#fbe9a6}.s-herbst{background:#f6c88f}.s-winter{background:#e2ecf6}

/* Bühne */
.actor{position:absolute;transition:left 3s linear,bottom 1.2s ease,opacity 1s,transform 1s;line-height:1}
.actor > svg{width:100%;height:auto;display:block}
.say-bub{position:absolute;background:#fff;color:#2f3528;border-radius:14px;padding:.3em .6em;font-weight:700;font-size:3.4cqw;white-space:nowrap;animation:pop .3s;z-index:6}
@keyframes pop{from{transform:scale(.3)}}
.fall{position:absolute;top:-10%;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(120cqw) rotate(360deg)}}
.caption{font-size:24px;min-height:2.6em;background:var(--card);border-radius:18px;padding:10px 16px;display:flex;align-items:center}
.films{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.film{background:var(--card);border-radius:22px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 var(--meadow2);border:4px solid transparent;position:relative}
.film[aria-pressed="true"]{border-color:var(--sun)}
.film .pic{font-size:46px}
.film .lab{font-weight:700;font-size:18px;text-align:center}
.film .play{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:var(--sun);display:grid;place-items:center}
.film .play svg{width:14px;height:14px}

/* Info-Karten */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.icard{background:var(--card);border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 5px 0 var(--meadow2);border:4px solid transparent;text-align:center}
.icard .pic{font-size:64px;line-height:1.1}
.icard .lab{font-size:22px;font-weight:700;display:flex;align-items:center;gap:6px}
.icard p{margin:0;font-size:17px;color:var(--ink2)}
.icard.on{border-color:var(--sun)}
.icard.animal{background:#fff6ec}
.icard.help{background:#effaef}
.sect{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;margin:6px 0 0}
.sect .dot{width:18px;height:18px;border-radius:50%}
.bigbtn{background:var(--sun);color:#2a1a05;border-radius:999px;padding:14px 24px;font-size:24px;font-weight:700;box-shadow:0 4px 0 #c47e17;display:inline-flex;align-items:center;gap:10px}
.bigbtn svg{width:30px;height:30px}

/* Weiter-Leiste */
.stepnav{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(234,241,218,0),var(--meadow) 35%);z-index:4;margin-top:8px}
.stepnav{pointer-events:none}.stepnav>*{pointer-events:auto}
.stepnav .back{background:var(--card);box-shadow:0 4px 0 var(--meadow2)}
/* Test */
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--card);border:2px solid var(--meadow2)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}.dots i.no{background:var(--no);border-color:var(--no)}.dots i.now{border-color:var(--sun);border-width:4px}
.qbar{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:24px;padding:12px 16px;font-size:26px;font-weight:700;box-shadow:0 5px 0 var(--meadow2)}
.qbar span{flex:1;min-width:0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.choice{background:var(--card);border-radius:26px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--meadow2);border:5px solid transparent;position:relative}
.choice .pic{font-size:78px;line-height:1.1;height:96px;display:grid;place-items:center}
.choice .pic svg{height:96px;width:auto}
.choice .pic .sm svg{height:52px}
.choice .pic .stk .bee{font-size:40px}
.choice .lab{font-size:18px;font-weight:700;display:flex;align-items:center;gap:4px;text-align:center}
.choice .lab .spk{width:36px;height:36px}
.choice.right{border-color:var(--ok);background:var(--oksoft)}
.choice.wrong{border-color:var(--no);background:var(--nosoft)}
.yn{display:flex;gap:30px;justify-content:center}
.yn button{width:130px;height:130px;border-radius:50%;font-size:68px;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.15);border:6px solid transparent}
.yn .yes{background:var(--oksoft)}.yn .no{background:var(--nosoft)}
.yn button.right{border-color:var(--ok)}.yn button.wrong{border-color:var(--no)}
.ynpic{font-size:90px;text-align:center;line-height:1.1}
.feedback{display:flex;align-items:center;gap:14px;justify-content:center;font-size:26px;font-weight:700;flex-wrap:wrap}
.mark{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;flex:none}
.mark svg{width:40px;height:40px}
.mark.ok{background:var(--ok)}.mark.no{background:var(--no)}
.stars{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:44px}
.stars .off{filter:grayscale(1);opacity:.3}
.center{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}

@media (max-width:760px){
  .hero,.split,.feed{grid-template-columns:minmax(0,1fr)}
  .seasons{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gslots{gap:6px}
  body{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="round" id="homeBtn" aria-label="Zur Startseite" hidden></button>
    <h1 id="title"></h1>
    <button class="round big" id="earBtn" aria-label="Noch einmal vorlesen"></button>
  </header>
  <main id="main"></main>
</div>

<script>
/* ---------- Icons ---------- */
const ICON={
 spk:'<svg viewBox="0 0 24 24" fill="none" stroke="#7a4f2f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#7a4f2f"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
 ear:'<svg viewBox="0 0 24 24" fill="none" stroke="#2a1a05" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2a1a05"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="#7a4f2f" stroke-width="2.4" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10" fill="#fde7bf"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
 cross:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 play:'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#2a1a05"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="#2a1a05" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>',
 next:'<svg viewBox="0 0 24 24" fill="none" stroke="#2a1a05" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
 again:'<svg viewBox="0 0 24 24" fill="none" stroke="#2a1a05" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>',
 stop:'<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="#2a1a05"/></svg>'
};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const spk=t=>`<button class="spk" data-say="${esc(t)}" aria-label="Vorlesen: ${esc(t)}">${ICON.spk}</button>`;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- Sprache & Töne ---------- */
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));voice=vs.find(v=>/Anna|Helena|Petra|Marlene|Google Deutsch/i.test(v.name))||vs[0]||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
let sayTimer=null,saySeq=0;
const SS=()=>window.speechSynthesis;
function say(t){return new Promise(res=>{
  const my=++saySeq;let done=false;const fin=()=>{if(!done){done=true;res()}};
  try{
    const ss=SS();if(!ss){fin();return}
    t=t.replace(/Biomüll/g,'Bio-Müll').replace(/Kerngehäuse/g,'Kern-Gehäuse');
    const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(voice)u.voice=voice;u.rate=.88;u.pitch=1.05;
    u.onend=fin;u.onerror=fin;
    setTimeout(fin,1500+t.length*95);
    clearTimeout(sayTimer);
    const busy=ss.speaking||ss.pending;
    if(busy)ss.cancel();
    if(ss.paused)ss.resume();
    const go=()=>{if(my!==saySeq){fin();return}try{ss.speak(u)}catch(e){fin()}};
    if(busy)sayTimer=setTimeout(go,150);else go();
  }catch(e){fin()}})}
function hush(){saySeq++;clearTimeout(sayTimer);try{SS().cancel()}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hush()});
window.addEventListener('pageshow',()=>{try{SS().cancel();SS().resume()}catch(e){}});
let actx=null,actxT=null;
function tone(kind){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=='running')actx.resume();clearTimeout(actxT);actxT=setTimeout(()=>{try{actx.suspend()}catch(e){}},900);const now=actx.currentTime;
  const notes=kind==='ok'?[660,880,1175]:kind==='win'?[523,659,784,1046]:[220,180];
  notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=kind==='no'?'triangle':'sine';o.frequency.value=f;
   g.gain.setValueAtTime(0,now+i*.11);g.gain.linearRampToValueAtTime(.18,now+i*.11+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.11+.3);
   o.connect(g);g.connect(actx.destination);o.start(now+i*.11);o.stop(now+i*.11+.32)})}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('.spk');if(b){e.stopPropagation();e.preventDefault();say(b.dataset.say)}},true);

/* ---------- Grafiken ---------- */
const BODY='M200 120C150 85 60 100 55 200C50 300 130 370 200 350C270 370 350 300 345 200C340 100 250 85 200 120Z';
const LEAF='<path d="M214 82C232 45 282 36 306 52C292 84 248 100 214 82Z" fill="#5fa83a"/><path d="M216 80C245 66 272 56 300 54" stroke="#3f7d22" stroke-width="3" fill="none"/>';
const STEM='<path d="M200 125C200 100 205 80 216 60" stroke="#6b4423" stroke-width="10" fill="none" stroke-linecap="round"/>';
const FACE='<ellipse cx="160" cy="215" rx="11" ry="14" fill="#2b1a12"/><ellipse cx="240" cy="215" rx="11" ry="14" fill="#2b1a12"/><circle cx="164" cy="210" r="3.5" fill="#fff"/><circle cx="244" cy="210" r="3.5" fill="#fff"/><circle cx="132" cy="252" r="15" fill="#ff8f8f" opacity=".55"/><circle cx="268" cy="252" r="15" fill="#ff8f8f" opacity=".55"/><path d="M172 255Q200 284 228 255" stroke="#2b1a12" stroke-width="6" fill="none" stroke-linecap="round"/>';
function apfelInner(o={}){const c=o.c||'#d93a2b',d=o.d||'#a8261b';
 return `<path d="${BODY}" fill="${c}"/>
 <path d="M200 350C270 370 350 300 345 200C342 150 320 118 290 105C325 150 330 250 270 310C245 335 220 345 200 350Z" fill="${d}" opacity=".5"/>

function seasonScene(k){const fall=(e,n)=>Array.from({length:n},(_,i)=>`<span class="fall" style="left:${(i*97)%100}%;font-size:${3+(i%3)}cqw;animation-duration:${5+(i%4)}s;animation-delay:-${i*0.7}s">${e}</span>`).join('');
 const T=(x,w)=>`<div class="actor" style="left:${x}%;bottom:2%;width:${w}%">${baum(k)}</div>`;
 if(k==='fruehling')return `<div class="scene bg-fruehling"><span class="deco" style="right:6%;top:8%;font-size:8cqw">🌤️</span>${T(28,44)}<span class="deco" style="left:72%;top:36%;font-size:5cqw">🐝</span><span class="deco" style="left:20%;top:22%;font-size:4cqw">🐝</span><span class="deco" style="left:6%;bottom:6%;font-size:6cqw">🌷</span></div>`;
 if(k==='sommer')return `<div class="scene bg-sommer"><span class="deco" style="right:6%;top:6%;font-size:9cqw">☀️</span>${T(28,44)}<span class="deco" style="left:6%;bottom:6%;font-size:6cqw">🌼</span></div>`;
 if(k==='herbst')return `<div class="scene bg-herbst">${fall('🍂',8)}${T(22,44)}<span class="deco" style="right:8%;bottom:6%;font-size:10cqw">🧺</span></div>`;
 return `<div class="scene bg-winter">${fall('❄️',14)}${T(28,44)}<span class="deco" style="left:6%;bottom:6%;font-size:8cqw">⛄</span></div>`}
function jahreszeiten(){setTitle('Apfelbaum','🌳');intro='So lebt der Apfelbaum im Jahr. Tippe auf eine Jahreszeit.';
 main.innerHTML=`<div class="seasons">${Object.entries(SEASONS).map(([k,s])=>`<div role="button" tabindex="0" class="season s-${k}" data-k="${k}" aria-pressed="false"><span class="pic">${s.e}</span><span class="lab">${s.w} ${spk(s.w)}</span></div>`).join('')}</div>
 <div class="panel" style="margin-top:14px"><div id="sScene"></div><div class="info" id="sText"></div></div>`;
 const show=k=>{main.querySelectorAll('.season').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));document.getElementById('sScene').innerHTML=seasonScene(k);
  document.getElementById('sText').innerHTML=`${spk(SEASONS[k].w+'. '+SEASONS[k].t)}<div><big>${SEASONS[k].w}</big>${SEASONS[k].t}</div>`};
 const SK=Object.keys(SEASONS);const sayS=k=>say(SEASONS[k].w+'. '+SEASONS[k].t);
 const nav=stepNav(SK.length,i=>{show(SK[i]);sayS(SK[i])},'jahreszeiten');
 main.querySelectorAll('.season').forEach(b=>b.onclick=()=>{show(b.dataset.k);sayS(b.dataset.k);nav.set(SK.indexOf(b.dataset.k))});show('fruehling');nav.set(0)}

/* ---------- Apfel-Küche ---------- */
function kueche(){setTitle('Apfel-Küche','🥧');intro='Was kann man aus Äpfeln machen? Tippe auf die Bilder. Finde alles, was aus Äpfeln gemacht wird.';
 let found=0;
 main.innerHTML=`<div class="feed"><div class="panel"><div id="kApfel">${apfel({face:1})}</div><div class="slots">${KUECHE.filter(f=>f.g).map(()=>'<span class="slot"></span>').join('')}</div>
  <div class="info">${spk('Aus Äpfeln kann man viele leckere Sachen machen. Was gehört dazu?')}<div>Aus Äpfeln kann man viele <b>leckere Sachen</b> machen.</div></div></div>
  <div class="food">${shuffle(KUECHE).map(f=>`<div role="button" tabindex="0" class="item" data-w="${f.w}"><span class="pic">${f.e}</span><span class="lab">${f.w} ${spk(f.w)}</span></div>`).join('')}</div></div>`;
 const ap=()=>document.querySelector('#kApfel svg'),slots=[...main.querySelectorAll('.slot')];
 main.querySelectorAll('.item').forEach(b=>b.onclick=()=>{const f=KUECHE.find(x=>x.w===b.dataset.w);
  if(f.g){if(b.classList.contains('eaten'))return;b.classList.add('eaten');slots[found].textContent=f.e;slots[found].classList.add('full');found++;bump(ap(),'mampf');tone('ok');
   if(found===slots.length){say(f.t+' Super! Du hast alles gefunden.');setTimeout(()=>tone('win'),400)}else say(f.t)}
  else{b.classList.add('bad');bump(ap(),'nein');tone('no');say(f.t)}});
 stepNav(0,null,'kueche')}

/* ---------- Tiere und ich ---------- */
function infoCards(list,cls){return `<div class="grid3">${list.map((c,i)=>`<div role="button" tabindex="0" class="icard ${cls||''}" data-i="${i}"><span class="pic">${c.e}</span><span class="lab">${c.w} ${spk(c.w)}</span><p>${c.t}</p></div>`).join('')}</div>`}
function bindCards(root,list,cb){root.querySelectorAll('.icard').forEach(b=>b.onclick=()=>{selCard(b);const c=list[b.dataset.i];say(c.w+'. '+c.t);cb&&cb(+b.dataset.i)})}
function tiere(){setTitle('Tiere und ich','🐛');intro='Viele Tiere mögen Äpfel. Tippe auf ein Bild. Unten erfährst du, was du beim Apfelessen wissen solltest.';
 main.innerHTML=`<div class="sect"><span class="dot" style="background:var(--apple)"></span>Diese Tiere mögen Äpfel ${spk('Diese Tiere mögen Äpfel.')}</div><div id="ti">${infoCards(TIERE,'animal')}</div>
 <div class="sect" style="margin-top:20px"><span class="dot" style="background:var(--ok)"></span>Der Apfel und ich ${spk('Der Apfel und ich.')}</div><div id="ic">${infoCards(ICH,'help')}</div>`;
 const ALL=[...TIERE,...ICH],cards=[...main.querySelectorAll('.icard')];
 const nav=stepNav(ALL.length,i=>{selCard(cards[i]);say((i===TIERE.length?'Der Apfel und ich. ':'')+ALL[i].w+'. '+ALL[i].t)},'tiere');
 bindCards(document.getElementById('ti'),TIERE,i=>nav.set(i));bindCards(document.getElementById('ic'),ICH,i=>nav.set(TIERE.length+i))}

/* ---------- Kino ---------- */
let filmRun=0;
const FILMS=[
 {e:'🐝',w:'Die Biene und die Blüte',run:async S=>{S.bg('fruehling');S.add(baum('fruehling'),0,1,40);const bl=S.add(ast({what:'bluete'}),32,-25,60);
   await S.say('Es ist Frühling. Der Apfelbaum blüht. Die Blüten sind weiß und rosa.');
   const b=S.deco('🐝',105,80,7);b.style.transition='left 2.5s ease-in-out,bottom 2.5s ease-in-out';await S.wait(60);b.style.left='76%';b.style.bottom='57%';
   await S.say('Da kommt eine Biene. Sie fliegt zur Blüte.');S.pop(b,'Summ!');
   await S.say('Die Biene trinkt süßen Saft. Dabei bringt sie Blütenstaub von einer anderen Blüte mit.');
   b.style.left='110%';b.style.bottom='90%';S.rain('🌸',8);
   await S.say('Ein paar Tage später fallen die Blütenblätter ab.');S.rain(null);bl.innerHTML=ast({...GREEN,s:.12});await S.wait(60);growTo(bl,.2);
   await S.say('Schau! Jetzt wächst dort ein kleiner grüner Apfel.')}},
 {e:'🍏',w:'Der Apfel wird groß',run:async S=>{S.bg('sommer');S.deco('☀️',82,62,10);const a=S.add(ast({...GREEN,s:.25}),18,12,60);
   await S.say('Es ist Sommer. Der kleine grüne Apfel hängt am Ast.');
   S.rain('💧',12);await S.say('Die Sonne scheint. Es regnet. Der Apfel bekommt Wasser und wird größer.');growTo(a,.4);await S.wait(1300);S.rain(null);
   S.bg('herbst');a.innerHTML=ast({c:'#e6c84a',d:'#c9a52c',s:.4});await S.wait(60);growTo(a,.55);await S.say('Es wird Herbst. Der Apfel wird groß und bekommt Farbe.');
   a.innerHTML=ast({face:1,s:.55});await S.wait(60);growTo(a,.68);await S.say('Jetzt ist der Apfel reif. Er ist rot und süß. Lecker!')}},
 {e:'🧺',w:'Apfelernte',run:async S=>{S.bg('herbst');S.add(baum('herbst',{ground:0}),2,2,42);const kid=S.deco('🧒',50,6,14);S.deco('🧺',74,4,13);
   await S.say('Es ist Herbst. Die Äpfel sind reif. Tim hilft bei der Apfelernte.');
   const a=S.add(apfel(),26,44,5);a.style.transition='left 1.6s ease,bottom 1.6s ease';
   await S.say('Er pflückt einen Apfel vom Baum.');S.pop(kid,'Hmm!');a.style.left='79%';a.style.bottom='15%';await S.wait(1700);
   await S.say('Der Apfel kommt in den Korb.');
   const f=S.add(apfel(),12,38,5);f.style.transition='bottom .9s ease-in';await S.wait(60);f.style.bottom='3%';await S.wait(1000);S.pop(f,'Plumps!');
   await S.say('Plumps! Ein Apfel fällt herunter. Das nennt man Fallobst.');
   const v=S.deco('🐦',-10,40,7);v.style.transition='left 2s ease,bottom 2s ease';await S.wait(60);v.style.left='18%';v.style.bottom='3%';
   await S.say('Eine Amsel kommt. Sie pickt am Fallobst.');
   await S.say('Tim wäscht seinen Apfel. Dann beißt er hinein.');S.pop(kid,'Knack!');await S.say('Mmmh! Frische Äpfel sind lecker.')}},
 {e:'🌱',w:'Vom Kern zum Baum',run:async S=>{S.bg('garten');const kid=S.deco('🧒',10,6,14);const k=S.add(KERN,47,10,2.5);
   await S.say('Tim hat einen Apfelkern. Er steckt den Kern in die Erde.');k.style.transition='bottom 1s,opacity 1s';k.style.bottom='3%';k.style.opacity=.3;await S.wait(1000);
   S.rain('💧',10);await S.say('Es regnet. Der Kern bekommt Wasser.');S.rain(null);
   const sp=S.deco('🌱',43,4,9);sp.style.transformOrigin='50% 100%';sp.style.transform='scale(.2)';await S.wait(80);sp.style.transform='scale(1)';k.style.opacity=0;
   await S.say('Nach einiger Zeit wächst ein kleiner Keimling.');
   sp.style.opacity=0;const t=S.add(baum('sommer',{apples:0}),32,2,34);t.style.transformOrigin='50% 100%';t.style.transform='scale(.3)';await S.wait(80);t.style.transition='transform 3s ease';t.style.transform='scale(1)';
   await S.say('Der Keimling wird ein kleiner Baum. Das dauert viele Jahre.');
   t.innerHTML=baum('herbst');await S.say('Jetzt ist der Baum groß. Er trägt viele Äpfel. Wunderbar!');S.pop(kid,'Hurra!')}}];
function kino(){setTitle('Kino','🎬');intro='Hier gibt es kleine Filme über den Apfel. Tippe auf einen Film.';
 main.innerHTML=`<div class="films">${FILMS.map((f,i)=>`<div role="button" tabindex="0" class="film" data-i="${i}" aria-pressed="false"><span class="play">${ICON.play}</span><span class="pic">${f.e}</span><span class="lab">${f.w}</span>${spk(f.w)}</div>`).join('')}</div>
 <div class="panel" style="margin-top:14px"><div class="scene bg-garten" id="stage"></div><div class="caption" id="cap">Tippe oben auf einen Film.</div>
 <div class="center"><button class="bigbtn" id="again" hidden>${ICON.again}<span>Nochmal</span></button><button class="bigbtn" id="stopB" hidden>${ICON.stop}<span>Stopp</span></button></div></div>`;
 const stage=document.getElementById('stage'),cap=document.getElementById('cap'),again=document.getElementById('again'),stopB=document.getElementById('stopB');let cur=null;
 async function play(i){const id=++filmRun;cur=i;hush();stage.innerHTML='';stage.className='scene';again.hidden=true;stopB.hidden=false;
  main.querySelectorAll('.film').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===i));
  const chk=()=>{if(id!==filmRun)throw 'stop'};let rain=[];
  const add=(html,x,b,w)=>{const d=document.createElement('div');d.className='actor';d.style.cssText=`left:${x}%;bottom:${b}%;width:${w}%;font-size:${w*.85}cqw`;d.innerHTML=html;stage.appendChild(d);return d};
  const S={bg:k=>{stage.className='scene bg-'+k},
   add,deco:(e,x,b,w)=>add(`<span>${e}</span>`,x,b,w),
   wait:async ms=>{await new Promise(r=>setTimeout(r,ms));chk()},
   say:async t=>{chk();cap.textContent=t;await say(t);chk();await new Promise(r=>setTimeout(r,350));chk()},
   pop:(el,t)=>{const b=document.createElement('div');b.className='say-bub';b.textContent=t;b.style.left=el.style.left;b.style.bottom=Math.min(85,parseFloat(el.style.bottom)+parseFloat(el.style.width)*1.5)+'%';stage.appendChild(b);setTimeout(()=>b.remove(),1600)},
   rain:(e,n)=>{rain.forEach(r=>r.remove());rain=[];if(!e)return;for(let j=0;j<n;j++){const s=document.createElement('span');s.className='fall';s.textContent=e;s.style.cssText=`left:${(j*97)%100}%;font-size:${3+j%3}cqw;animation-duration:${5+j%4}s;animation-delay:-${j*.7}s`;stage.appendChild(s);rain.push(s)}}};
  try{await FILMS[i].run(S);tone('win');cap.textContent='Ende. '+cap.textContent;stopB.hidden=true;again.hidden=false}catch(e){}}
 const nav=stepNav(FILMS.length,i=>play(i),'kino');
 main.querySelectorAll('.film').forEach(b=>b.onclick=()=>{play(+b.dataset.i);nav.set(+b.dataset.i)});
 again.onclick=()=>play(cur);stopB.onclick=()=>{filmRun++;hush();stopB.hidden=true;again.hidden=false;cap.textContent='Gestoppt.'};
 stage.innerHTML=seasonScene('herbst').replace(/^<div class="scene bg-herbst">|<\/div>$/g,'');stage.className='scene bg-herbst';
 cleanup=()=>{filmRun++}}

/* ---------- Test ---------- */
const PIC={BLUETE:()=>bluete(),KLEIN:()=>sm(apfel(GREEN)),GROSS:()=>apfel(),KNOSPE:()=>knospe()};
const Q=[
 {type:'part',q:'Tippe auf den Stiel.',a:'stiel',x:'Mit dem Stiel hängt der Apfel am Baum.'},
 {type:'pick',q:'Was wächst am Apfelbaum?',c:[['GROSS','Apfel',1],['🍌','Banane'],['🥕','Karotte']],x:'Am Apfelbaum wachsen Äpfel.'},
 {type:'part',q:'Tippe auf die Kerne.',a:'kerne',x:'Die Kerne sind in der Mitte, im Kerngehäuse.'},
 {type:'season',q:'Wann blüht der Apfelbaum?',a:'fruehling',x:'Im Frühling blüht der Apfelbaum.'},
 {type:'pick',q:'Wer hilft der Blüte, damit ein Apfel wächst?',c:[['🐝','Biene',1],['🐌','Schnecke'],['🐟','Fisch']],x:'Die Biene bringt Blütenstaub zur Blüte.'},
 {type:'yesno',q:'Aus einem Apfelkern kann ein neuer Apfelbaum wachsen. Stimmt das?',pic:'🌱',a:1,x:'Aus einem Kern wächst ein Keimling. Daraus wird ein Baum.'},
 {type:'pick',q:'Was ist zuerst da?',c:[['BLUETE','Blüte',1],['KLEIN','kleiner Apfel'],['GROSS','großer Apfel']],x:'Zuerst ist die Blüte da. Dann wächst der Apfel.'},
 {type:'season',q:'Wann sind die Äpfel reif?',a:'herbst',x:'Im Herbst sind die Äpfel reif.'},
 {type:'pick',q:'Was macht man aus Äpfeln?',c:[['🧃','Apfelsaft',1],['🍟','Pommes'],['🍿','Popcorn']],x:'Aus Äpfeln macht man Apfelsaft.'},
 {type:'part',q:'Tippe auf die Schale.',a:'schale',x:'Die Schale schützt den Apfel.'},
 {type:'yesno',q:'Im Winter hängen viele Äpfel am Baum. Stimmt das?',pic:'❄️',a:0,x:'Im Winter hat der Apfelbaum keine Blätter und keine Äpfel.'},
 {type:'pick',q:'Welches Tier frisst gerne Äpfel?',c:[['🐴','Pferd',1],['🦈','Hai'],['🕷️','Spinne']],x:'Pferde fressen gerne Äpfel.'},
 {type:'yesno',q:'Vor dem Essen wasche ich den Apfel. Stimmt das?',pic:'🚰',a:1,x:'Ein Apfel wird vor dem Essen gewaschen.'}];
function test(){setTitle('Test','⭐');let n=0,res=[];
 function dots(){return `<div class="dots">${Q.map((_,i)=>`<i class="${res[i]===1?'ok':res[i]===0?'no':i===n?'now':''}"></i>`).join('')}</div>`}
 function show(){if(n>=Q.length)return end();const q=Q[n];intro=q.q;let body='';
  if(q.type==='part')body=`<div class="panel" id="tBody" style="max-width:520px;margin:0 auto;width:100%">${apfelHalb()}</div>`;
  if(q.type==='pick')body=`<div class="choices">${shuffle(q.c).map(c=>`<div role="button" tabindex="0" class="choice" data-ok="${c[2]?1:0}"><span class="pic">${PIC[c[0]]?PIC[c[0]]():c[0]}</span><span class="lab">${c[1]} ${spk(c[1])}</span></div>`).join('')}</div>`;
  if(q.type==='season')body=`<div class="seasons">${shuffle(Object.keys(SEASONS)).map(k=>`<div role="button" tabindex="0" class="season choice s-${k}" data-ok="${k===q.a?1:0}"><span class="pic">${SEASONS[k].e}</span><span class="lab">${SEASONS[k].w} ${spk(SEASONS[k].w)}</span></div>`).join('')}</div>`;
  if(q.type==='yesno')body=`<div class="ynpic">${q.pic}</div><div class="yn"><button class="yes choice" data-ok="${q.a?1:0}" aria-label="Stimmt">👍</button><button class="no choice" data-ok="${q.a?0:1}" aria-label="Stimmt nicht">👎</button></div>`;
  main.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">${dots()}<div class="qbar">${spk(q.q)}<span>${q.q}</span></div>${body}<div id="fb"></div></div>`;
  let answered=false;
  const finish=ok=>{if(answered)return;answered=true;res[n]=ok?1:0;tone(ok?'ok':'no');
   document.getElementById('fb').innerHTML=`<div class="feedback"><span class="mark ${ok?'ok':'no'}">${ok?ICON.check:ICON.cross}</span><span>${ok?'Richtig!':'Leider falsch.'}</span>${spk(q.x)}<button class="bigbtn" id="nx">${ICON.next}<span>Weiter</span></button></div>`;
   say((ok?'Richtig! ':'Leider falsch. ')+q.x);document.getElementById('nx').onclick=()=>{n++;show();if(n<Q.length)say(Q[n].q)}};
  if(q.type==='part'){const svg=main.querySelector('#tBody svg');svg.onclick=e=>{const p=e.target.closest('[data-part]');if(!p||answered)return;
    svg.querySelectorAll('[data-part]').forEach(g=>g.classList.toggle('hi',g.dataset.part===q.a));finish(p.dataset.part===q.a)}}
  else main.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(answered)return;const ok=b.dataset.ok==='1';b.classList.add(ok?'right':'wrong');
    if(!ok)main.querySelector('.choice[data-ok="1"]').classList.add('right');finish(ok)})}
 function end(){const s=res.filter(x=>x===1).length;intro=`Du hast ${s} von ${Q.length} Sternen. ${s>=10?'Super! Du bist ein Apfel-Profi!':s>=7?'Gut gemacht!':'Schau dir die Stationen noch einmal an und versuche es wieder.'}`;
  main.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px;align-items:center"><div style="width:min(300px,100%)">${apfel({face:1})}</div>
   <div class="stars">${Q.map((_,i)=>`<span class="${res[i]===1?'':'off'}">⭐</span>`).join('')}</div>
   <div class="qbar" style="width:100%">${spk(intro)}<span>${s} von ${Q.length} Sternen</span></div>
   <div class="center"><button class="bigbtn" id="re">${ICON.again}<span>Nochmal</span></button><button class="bigbtn" id="hm">${ICON.home.replace('#7a4f2f','#2a1a05')}<span>Start</span></button></div></div>`;
  tone('win');say(intro);document.getElementById('re').onclick=()=>{n=0;res=[];show();say(Q[0].q)};document.getElementById('hm').onclick=()=>go('home')}
 show()}

go('home',true);
</script>
