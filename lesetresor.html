<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lese-Tresor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF5EA; --paper:#FFFDF8; --ink:#2A2733; --muted:#6B6577; --line:#E8DFCF;
  --vault:#1F3A4D; --vault2:#2C5470; --gold:#E8B04A; --ok:#2E8B57; --okbg:#E3F4EA;
  --bad:#C8553D; --badbg:#FBE9E4; --accent:#3B6EA5; --mark:#FFE58A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Andika","Trebuchet MS",sans-serif;font-size:19px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
h1,h2,h3,.baloo{font-family:"Baloo 2","Andika",sans-serif;line-height:1.2;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}

/* Header */
.hero{background:linear-gradient(160deg,var(--vault),var(--vault2));color:#fff;padding:28px 16px 34px;text-align:center;border-radius:0 0 28px 28px;margin-bottom:22px}
.hero h1{font-size:2.3rem;font-weight:800;letter-spacing:.5px}
.hero h1 span{color:var(--gold)}
.hero p{margin:8px auto 0;max-width:520px;opacity:.92;font-size:1.02rem}
.hero .total{display:inline-block;margin-top:14px;background:rgba(255,255,255,.14);padding:6px 16px;border-radius:999px;font-weight:700}

/* Cards */
.serie{font-size:1.25rem;margin:22px 4px 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.serie span{font-family:"Andika",sans-serif;font-size:.85rem;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;gap:14px;align-items:flex-start;transition:transform .15s,border-color .15s;width:100%}
.card:active{transform:scale(.98)}
.card .emo{font-size:2.6rem;width:64px;height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.card h3{font-size:1.2rem;color:var(--c)}
.card .theme{font-size:.85rem;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:999px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:999px}
.card .meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:6px}
.badge-done{font-weight:700;color:var(--ok)}

/* Top bar */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.back{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 14px;font-weight:700}
.top .ttl{flex:1;min-width:0}
.top .ttl h2{font-size:1.15rem;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;margin-top:4px}
.dots b{width:26px;height:8px;border-radius:999px;background:var(--line)}
.dots b.on{background:var(--c)}
.dots b.now{background:color-mix(in srgb,var(--c) 45%,#fff)}

/* Reading */
.paper{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:22px 20px;margin-top:6px}
.paper h3{font-size:1.05rem;color:var(--muted);margin-bottom:10px;font-weight:600}
.story p{margin:0 0 1em;font-size:1.15rem;line-height:1.75}
.story p:last-child{margin-bottom:0}
.recap{background:color-mix(in srgb,var(--c) 8%,#fff);border-left:5px solid var(--c);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:1rem;color:var(--muted)}
.recap b{color:var(--ink)}
.btn{display:block;width:100%;border:none;border-radius:18px;padding:16px 18px;font-weight:700;font-size:1.1rem;margin-top:16px;position:relative;overflow:hidden}
.btn.primary{background:var(--c,var(--accent));color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c,var(--accent)) 70%,#000)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--c,var(--accent)) 70%,#000)}
.btn:disabled{background:#CFC8BB;box-shadow:none;color:#fff;cursor:default}
.btn .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28);width:0;transition:width .5s linear}
.btn .lbl{position:relative}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:10px;display:block;margin:6px auto 0;font-size:1rem}
.navrow{display:flex;gap:10px}
.navrow .btn{flex:1}

/* Quiz */
.locks{display:flex;justify-content:center;gap:12px;font-size:2.1rem;margin:4px 0 10px}
.locks span{display:inline-block;transition:transform .3s}
.locks span.open{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(-12deg)}100%{transform:scale(1)}}
.qnum{font-size:.9rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.qcard h2{font-size:1.35rem;margin:6px 0 16px;font-family:"Andika",sans-serif;font-weight:700}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;font-size:1.08rem;transition:border-color .15s,background .15s}
.ans.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.ans .no{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--line);align-items:center;justify-content:center;font-weight:700;margin-right:10px;font-size:.95rem}
.ans.sel .no{background:var(--c);color:#fff}
.wordrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:1.15rem}
.wordrow input{flex:1;min-width:160px;font-family:inherit;font-size:1.2rem;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.wordrow input:focus{outline:none;border-color:var(--c)}
.hint{font-size:.92rem;color:var(--muted);margin-top:8px}
.feedback{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700;display:none}
.feedback.ok{display:block;background:var(--okbg);color:var(--ok)}
.feedback.soft{display:block;background:#FFF4D6;color:#8A6110}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* Overlay */
.ov{position:fixed;inset:0;background:rgba(20,28,38,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:620px){.ov{align-items:center;padding:20px}}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px 26px}
@media(min-width:620px){.sheet{border-radius:24px}}
.sheet h2{font-size:1.4rem;margin-bottom:6px}
.sheet .story p{font-size:1.08rem}
mark{background:var(--mark);padding:1px 3px;border-radius:4px;box-shadow:0 0 0 2px var(--mark)}
.passage{background:#fff;border:2px dashed var(--gold);border-radius:16px;padding:14px 16px;margin:12px 0}
.timer{display:flex;align-items:center;gap:14px;margin-top:6px}
.ring{width:64px;height:64px;flex:0 0 64px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.bad{color:var(--bad)}

/* Unlock / Done */
.center{text-align:center}
.big{font-size:5rem;line-height:1;margin:10px 0}
.stars{font-size:1.8rem;letter-spacing:4px;margin:8px 0}
.vaultdoor{animation:swing 1s ease-out}
@keyframes swing{0%{transform:scale(.5) rotate(-30deg);opacity:0}60%{transform:scale(1.15) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}

/* Adults */
.foot{text-align:center;margin-top:26px}
.hold{background:none;border:2px solid var(--line);border-radius:999px;padding:8px 18px;color:var(--muted);font-size:.9rem;position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--line)}
.hold span{position:relative}
table{width:100%;border-collapse:collapse;font-size:.95rem;margin:8px 0 14px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:700}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set select{font-family:inherit;font-size:1rem;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:#fff}
.small{font-size:.88rem;color:var(--muted)}
.danger{background:var(--badbg);color:var(--bad);border:none;border-radius:12px;padding:10px 14px;font-weight:700;margin:4px 6px 4px 0}
</style>
</head>
<body>
<div id="app"></div>

<script>

const STORIES = [
{
 id:"villa", titel:"Die Spürnasen: Licht in der Villa", emoji:"🔍", thema:"Detektive", farbe:"#6C4AB6",
 abzeichen:"Spürnasen-Abzeichen", abzeichenEmoji:"🕵️",
 teile:[

   "„Ich habe einen neuen Fall für uns“, sagt Mira an einem kalten Dienstag im Oktober. Sie lässt ihr Fahrrad ins Gras fallen und schnauft. „Die Villa Lindner! Dort brennt nachts Licht.“",

  ], fragen:[

  {text:[

   {t:"mc", q:"Was ist an den Fußspuren besonders?", a:["An ihnen klebt rote Erde.","Sie sind ganz klein.","Es sind Pfotenabdrücke.","Sie führen zum Bauwagen."], b:"an manchen Stellen kleben rote Erdklumpen"},

  {text:[

{

   "Kira läuft los. Papa und Jonas laufen hinterher. Der Waldweg ist matschig, und die Bäume sehen im Nebel aus wie graue Riesen. Nach einer Weile bleibt Kira an einer Weggabelung stehen. Links geht es zum Bach. Rechts geht es zum alten Steinbruch. Kira schnüffelt in beide Richtungen.",
   "Dann findet Jonas etwas im Matsch: eine kleine rosa Haarspange mit einem Schmetterling. „Die gehört Lena!“, ruft er. Kira bellt und rennt nach rechts, in Richtung Steinbruch. Papa wird blass. „Der Steinbruch ist gefährlich“, sagt er. „Dort geht es steil nach unten.“",
   "Sie laufen, so schnell sie können. Kira ist so schnell, dass sie bald im Nebel verschwindet. Nur ihr Bellen ist noch zu hören. Dann wird es plötzlich still im Wald. Ganz still. Und aus der Ferne hören Jonas und Papa ein leises Weinen."
  ], fragen:[
   {t:"mc", q:"Was macht Papa, als er hört, dass Lena weg ist?", a:["Er holt die Taschenlampe und ruft Mama an.","Er repariert weiter den Traktor.","Er schickt Jonas ins Haus.","Er wartet, bis Lena zurückkommt."], b:"Er holt seine Taschenlampe und ruft Mama auf dem Handy an."},
   {t:"wort", q:"Was findet Jonas im Matsch?", pre:"Eine kleine rosa", l:["Haarspange","Spange"], b:"eine kleine rosa Haarspange mit einem Schmetterling"},
   {t:"mc", q:"Wohin führt der rechte Weg an der Gabelung?", a:["Zum alten Steinbruch","Zum Bach","Zurück zum Bauernhof","Ins Nachbardorf"], b:"Rechts geht es zum alten Steinbruch."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Lena spielt mit ihrem roten Ball.","Kira bellt ganz laut.","Jonas findet die Haarspange.","Kira verschwindet im Nebel."]}
  ]},
  {text:[
   "„Lena!“, ruft Papa. „Wo bist du?“ – „Hier unten!“, kommt eine dünne Stimme zurück. Am Rand des Steinbruchs steht Kira. Sie bellt und schaut immer wieder nach unten.",
   "Papa leuchtet mit der Taschenlampe in die Tiefe. Etwa drei Meter unter ihnen sitzt Lena auf einem schmalen Felsvorsprung. Ihre Jacke ist schmutzig, und sie hält sich an einer Wurzel fest. „Ich wollte den Hasen streicheln“, schluchzt sie. „Und dann bin ich abgerutscht.“",
   "„Bleib ganz still sitzen, mein Schatz“, sagt Papa ruhig. „Wir holen dich.“ Er legt sich auf den Bauch und streckt den Arm aus. Aber er kommt nicht bis zu Lena. Es fehlt fast ein ganzer Meter.",
   "„Wir brauchen ein Seil“, sagt Papa. „Jonas, du bleibst hier und redest mit Lena. Ich laufe zurück zum Hof.“ – „Das dauert viel zu lange!“, ruft Jonas. Da springt Kira plötzlich auf, dreht sich um und rast in den Nebel davon. „Kira! Komm zurück!“, ruft Jonas. Doch Kira ist schon weg.",
   "Ein kleiner Stein löst sich unter Lena und fällt in die Tiefe. Man hört ihn lange nicht aufschlagen. Lena wimmert. „Jonas, die Wurzel wackelt!“"
  ], fragen:[
   {t:"mc", q:"Wo sitzt Lena?", a:["Auf einem schmalen Felsvorsprung im Steinbruch","Oben auf einem hohen Baum","Am Ufer vom Bach","In einer Höhle im Wald"], b:"sitzt Lena auf einem schmalen Felsvorsprung"},
   {t:"mc", q:"Warum ist Lena in den Wald gelaufen?", a:["Sie wollte einen Hasen streicheln.","Sie wollte ihren Ball holen.","Sie hat Kira gesucht.","Sie wollte zu Mama."], b:"„Ich wollte den Hasen streicheln“, schluchzt sie."},
   {t:"mc", q:"Warum kann Papa Lena nicht hochziehen?", a:["Sein Arm ist fast einen Meter zu kurz.","Er hat sich am Fuß verletzt.","Lena will nicht.","Es ist zu dunkel."], b:"Es fehlt fast ein ganzer Meter."},
   {t:"mc", q:"Was macht Kira, als Papa ein Seil holen will?", a:["Sie rennt in den Nebel davon.","Sie springt zu Lena hinunter.","Sie legt sich neben Jonas.","Sie bellt einen Hasen an."], b:"rast in den Nebel davon"}
  ]},
  {text:[
   "„Halt dich gut fest und schau zu mir hoch, nicht nach unten“, sagt Jonas. Er versucht, ganz ruhig zu klingen. Dann erzählt er Lena die Geschichte aus seinem Comic, von dem kleinen Ritter und dem Drachen. Lena hört zu und schnieft. Sie bewegt sich nicht.",
   "Die Minuten kommen Jonas vor wie Stunden. Dann hört er ein Bellen im Wald. Und Stimmen! Aus dem Nebel kommt Kira angerannt. Hinter ihr laufen Mama und Herr Becker, der Nachbar. Herr Becker trägt ein dickes Seil über der Schulter.",
   "„Kira stand plötzlich vor unserem Auto auf dem Feldweg“, keucht Mama. „Sie hat gebellt und ist immer wieder ein Stück vorgelaufen. Da wussten wir, dass wir ihr folgen müssen.“",
   "Herr Becker knotet das Seil um einen dicken Baum. Papa bindet es sich um den Bauch und klettert vorsichtig ein Stück hinunter. Dann greift er Lena unter den Armen. Mama und Herr Becker ziehen am Seil, Stück für Stück. Endlich sind beide oben.",
   "Lena fällt Jonas um den Hals. Dann kniet sie sich hin und drückt Kira ganz fest. Kira leckt ihr über das Gesicht. Am Abend bekommt Kira eine extra große Wurst. Und Jonas legt seinen Comic weg. Heute will er lieber neben Kira auf dem Teppich liegen – neben der echten Heldin des Tages."
  ], fragen:[
   {t:"mc", q:"Wie beruhigt Jonas seine Schwester?", a:["Er erzählt ihr die Geschichte aus seinem Comic.","Er singt ihr ein Lied vor.","Er wirft ihr Schokolade zu.","Er klettert zu ihr hinunter."], b:"Dann erzählt er Lena die Geschichte aus seinem Comic"},
   {t:"mc", q:"Wen bringt Kira mit?", a:["Mama und den Nachbarn Herrn Becker","Die Feuerwehr","Oma und Opa","Einen Förster mit seinem Hund"], b:"Hinter ihr laufen Mama und Herr Becker, der Nachbar."},
   {t:"mc", q:"Woher wusste Mama, dass sie Kira folgen muss?", a:["Kira hat gebellt und ist immer wieder ein Stück vorgelaufen.","Jonas hat sie angerufen.","Sie hat Lena weinen gehört.","Herr Becker hat es ihr gesagt."], b:"Sie hat gebellt und ist immer wieder ein Stück vorgelaufen."},
   {t:"wort", q:"Was bekommt Kira am Abend?", pre:"Eine extra große", l:["Wurst"], b:"eine extra große Wurst"}
  ]}
 ]
},
{
 id:"perla", titel:"Perla, der weiße Delfin", emoji:"🐬", thema:"Meer & Delfine", farbe:"#1A7F9E",
 abzeichen:"Meeresretter-Abzeichen", abzeichenEmoji:"🌊",
 teile:[
  {text:[
   "Nele verbringt die Herbstferien bei ihrem Opa auf einer kleinen Insel im Meer. Opa Hinnerk war früher Fischer. Jetzt fährt er nur noch zum Spaß mit seinem alten blauen Boot hinaus. Das Boot heißt Möwe.",
   "„Heute zeige ich dir etwas ganz Besonderes“, sagt Opa am ersten Morgen. „Aber nur, wenn du ganz leise bist.“ Sie fahren hinaus aufs Meer. Die Sonne glitzert auf den Wellen, und der Wind riecht nach Salz.",
   "Nach einer Weile stellt Opa den Motor ab. Das Boot schaukelt sanft. „Und jetzt warten wir“, flüstert er. Nele wartet. Und wartet. Gerade als sie ungeduldig wird, taucht neben dem Boot etwas auf. Etwas Weißes, Glänzendes.",
   "Es ist ein Delfin! Aber kein grauer, wie Nele sie aus Büchern kennt. Dieser Delfin ist ganz weiß, fast wie Perlmutt. „Das ist Perla“, sagt Opa leise. „Sie kommt seit drei Jahren in unsere Bucht. Weiße Delfine sind sehr, sehr selten.“",
   "Perla schwimmt einmal um das Boot herum. Dann hebt sie den Kopf aus dem Wasser und macht ein Geräusch, das wie Kichern klingt. Nele lacht vor Freude. Von diesem Tag an fahren die beiden jeden Morgen hinaus. Doch am vierten Tag kommt Perla nicht. Sie warten eine ganze Stunde. Dann sieht Nele es: Weit draußen, bei den Felsen, wirbelt das Wasser. Etwas Weißes zappelt dort – und es sieht so aus, als könnte es nicht mehr richtig auftauchen."
  ], fragen:[
   {t:"wort", q:"Wie heißt Opas Boot?", pre:"Das Boot heißt", l:["Möwe"], b:"Das Boot heißt Möwe."},
   {t:"mc", q:"Was war Opa Hinnerk früher von Beruf?", a:["Fischer","Kapitän auf einem großen Schiff","Leuchtturmwärter","Lehrer"], b:"Opa Hinnerk war früher Fischer."},
   {t:"mc", q:"Was ist an Perla besonders?", a:["Sie ist ganz weiß.","Sie kann sprechen.","Sie ist winzig klein.","Sie hat nur eine Flosse."], b:"Dieser Delfin ist ganz weiß, fast wie Perlmutt."},
   {t:"mc", q:"Was passiert am vierten Tag?", a:["Perla kommt nicht zum Boot.","Opas Boot geht kaputt.","Nele fährt nach Hause.","Es regnet den ganzen Tag."], b:"Doch am vierten Tag kommt Perla nicht."}
  ]},
  {text:[
   "„Schnell, Opa!“, ruft Nele. Opa startet den Motor, und die Möwe fährt auf die Felsen zu. Je näher sie kommen, desto besser kann Nele sehen, was los ist. Perla hat sich in einem alten Fischernetz verfangen. Das Netz ist um ihre Flosse und ihren Bauch gewickelt.",
   "„Oh nein“, murmelt Opa. „Solche alten Netze treiben manchmal herrenlos im Meer. Sie sind gefährlich für die Tiere.“ Perla zappelt und schlägt mit dem Schwanz. Aber je mehr sie zappelt, desto fester zieht sich das Netz zu.",
   "„Delfine müssen zum Atmen an die Oberfläche“, erklärt Opa schnell. „Wenn das Netz sie nach unten zieht, bekommt sie keine Luft.“ Nele bekommt einen Kloß im Hals. „Dann müssen wir sie befreien! Sofort!“",
   "Opa holt sein altes Fischermesser aus der Kiste. Er lehnt sich weit über den Bootsrand. Perla ist ganz nah. Nele sieht ihr dunkles Auge, das sie anschaut. Es sieht aus, als würde Perla um Hilfe bitten.",
   "Opa schneidet die erste Schnur durch. Dann die zweite. Doch plötzlich kommt eine hohe Welle. Das Boot schwankt heftig. Opa rutscht aus und hält sich gerade noch fest. Aber das Messer gleitet ihm aus der Hand und versinkt im dunklen Wasser. Und Perla wird vom Netz langsam nach unten gezogen …"
  ], fragen:[
   {t:"mc", q:"Warum kann Perla nicht richtig auftauchen?", a:["Sie hat sich in einem alten Fischernetz verfangen.","Sie ist krank.","Ein Hai jagt sie.","Sie hat sich an den Felsen verletzt."], b:"Perla hat sich in einem alten Fischernetz verfangen."},
   {t:"mc", q:"Warum ist das Netz so gefährlich für Perla?", a:["Delfine müssen zum Atmen an die Oberfläche.","Das Netz ist giftig.","Das Netz ist sehr heiß.","Perla kann darin nichts sehen."], b:"„Delfine müssen zum Atmen an die Oberfläche“, erklärt Opa schnell."},
   {t:"mc", q:"Was passiert, wenn Perla zappelt?", a:["Das Netz zieht sich noch fester zu.","Das Netz reißt kaputt.","Opa fällt ins Wasser.","Sie schwimmt davon."], b:"desto fester zieht sich das Netz zu"},
   {t:"mc", q:"Warum fällt Opa das Messer aus der Hand?", a:["Eine hohe Welle bringt das Boot zum Schwanken.","Perla stößt ihn an.","Nele erschreckt ihn.","Das Messer ist zu schwer."], b:"Doch plötzlich kommt eine hohe Welle."}
  ]},
  {text:[
   "„Das Messer!“, schreit Nele. Opa starrt ins Wasser. „Weg“, sagt er. „Es ist weg.“ Nele schaut sich verzweifelt im Boot um. Eine Angel, ein Eimer, eine Rettungsweste, Opas Thermoskanne. Und dann fällt ihr etwas ein.",
   "„Opa, die Schere! In meinem Rucksack ist die Bastelschere!“ Am Vortag hatte Nele Muscheln gesammelt und daraus eine Kette gebastelt. Die kleine Schere mit den gelben Griffen ist noch in der Seitentasche.",
   "Opa nimmt die Schere. Sie ist klein, aber scharf. Er beugt sich wieder über den Bootsrand. „Halt meine Jacke fest, Nele! Ganz fest!“ Nele hält mit beiden Händen und stemmt die Füße gegen den Boden des Bootes.",
   "Schnipp. Eine Schnur ist durch. Schnipp. Noch eine. Perla taucht kurz auf und holt pustend Luft. Dann wird sie wieder nach unten gezogen. „Schneller, Opa!“, ruft Nele.",
   "Noch drei Schnüre. Noch zwei. Opas Arm ist schon bis zur Schulter nass. Da bemerkt Nele, wie dunkle Wolken über den Himmel ziehen. Der Wind wird stärker. Und Opa sagt mit ernster Stimme: „Die letzte Schnur ist ganz eng um ihre Flosse gewickelt. Da komme ich mit der Schere nicht ran, ohne Perla zu verletzen.“"
  ], fragen:[
   {t:"mc", q:"Was benutzt Opa statt des Messers?", a:["Neles Bastelschere","Eine Angel","Seine Zähne","Ein Stück Glas"], b:"In meinem Rucksack ist die Bastelschere!"},
   {t:"wort", q:"Was hat Nele am Vortag gesammelt?", pre:"Sie hat", post:"gesammelt.", l:["Muscheln","Muschel"], b:"Am Vortag hatte Nele Muscheln gesammelt"},
   {t:"mc", q:"Wie hilft Nele ihrem Opa?", a:["Sie hält seine Jacke ganz fest.","Sie steuert das Boot.","Sie springt ins Wasser.","Sie ruft mit dem Handy Hilfe."], b:"Nele hält mit beiden Händen und stemmt die Füße gegen den Boden des Bootes."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Nele sieht Perla zum ersten Mal.","Perla hat sich im Netz verfangen.","Das Messer versinkt im Wasser.","Opa schneidet mit der Schere."]}
  ]},
  {text:[
   "Nele erinnert sich an etwas, das Opa gesagt hat: Je mehr Perla zappelt, desto fester zieht sich das Netz zu. „Opa“, flüstert sie. „Wenn sie ganz ruhig wird, wird das Netz vielleicht lockerer.“",
   "Nele beugt sich über den Rand und spricht ganz leise und sanft mit Perla. „Ruhig, Perla. Wir helfen dir. Ganz ruhig.“ Sie weiß nicht, ob der Delfin sie versteht. Aber Perla hört auf zu zappeln. Sie treibt still im Wasser und schaut Nele an.",
   "Und tatsächlich: Das Netz um die Flosse wird ein kleines bisschen lockerer. Opa schiebt vorsichtig zwei Finger darunter und schneidet. Schnipp! Die letzte Schnur ist durch.",
   "Perla ist frei! Sie schießt aus dem Wasser, hoch in die Luft, und landet mit einem riesigen Platsch neben dem Boot. Nele und Opa werden von oben bis unten nass. Aber das ist ihnen egal. Sie lachen und jubeln.",
   "Opa fischt das alte Netz mit einem Haken aus dem Wasser, damit sich kein anderes Tier darin verfängt. Dann fahren sie schnell nach Hause, bevor der Sturm kommt. Am nächsten Morgen ist das Meer wieder ruhig. Und neben der Möwe taucht etwas Weißes auf. Perla schwimmt eine Runde um das Boot und kichert. Nele ist sicher: Das ist ihr Dankeschön."
  ], fragen:[
   {t:"mc", q:"An welchen Satz von Opa erinnert sich Nele?", a:["Je mehr Perla zappelt, desto fester zieht sich das Netz zu.","Weiße Delfine sind sehr selten.","Halt meine Jacke fest!","Heute zeige ich dir etwas Besonderes."], b:"Je mehr Perla zappelt, desto fester zieht sich das Netz zu."},
   {t:"mc", q:"Was macht Perla, als Nele leise mit ihr spricht?", a:["Sie hört auf zu zappeln.","Sie schwimmt weg.","Sie beißt ins Netz.","Sie springt ins Boot."], b:"Aber Perla hört auf zu zappeln."},
   {t:"mc", q:"Warum fischt Opa das alte Netz aus dem Wasser?", a:["Damit sich kein anderes Tier darin verfängt","Weil er es wieder benutzen will","Weil es ihm gehört","Weil Nele es behalten möchte"], b:"damit sich kein anderes Tier darin verfängt"},
   {t:"mc", q:"Wie bedankt sich Perla am nächsten Morgen – so glaubt Nele?", a:["Sie schwimmt um das Boot und kichert.","Sie bringt einen Fisch mit.","Sie springt über das Boot.","Sie bringt das Messer zurück."], b:"Perla schwimmt eine Runde um das Boot und kichert."}
  ]}
 ]
},
{
 id:"luna", titel:"Alarm auf der Mondstation", emoji:"🚀", thema:"Weltraum", farbe:"#3D3F96",
 abzeichen:"Mond-Medaille", abzeichenEmoji:"🌙",
 teile:[
  {text:[
   "Im Jahr 2085 ist es nichts Besonderes mehr, auf dem Mond zu wohnen. Trotzdem ist Ella furchtbar aufgeregt. Zum ersten Mal darf sie ihre Mutter für zwei Wochen auf die Mondstation Luna 7 begleiten. Ihre Mutter ist Forscherin. Sie untersucht, wie Pflanzen auf dem Mond wachsen.",
   "Der Flug dauert drei Tage. Als Ella endlich ankommt, drückt sie ihre Nase an das große runde Fenster. Draußen ist alles grau und staubig. Der Himmel ist schwarz, obwohl die Sonne scheint. Und ganz weit weg schwebt eine blau-weiße Kugel: die Erde.",
   "„Willkommen auf Luna 7!“, piepst eine Stimme. Vor Ella rollt ein kleiner Roboter. Er ist so groß wie ein Mülleimer, rund und silbern, und hat zwei Greifarme. Auf seinem Bildschirm leuchten zwei freundliche Augen. „Ich bin Pixel. Ich zeige dir alles.“",
   "Pixel führt Ella durch die Station. Sie sehen die Küche, die Schlafkabinen und den Fitnessraum. Am schönsten findet Ella das Gewächshaus. Dort wachsen unter hellen Lampen Tomaten, Salat und sogar Erdbeeren. „Die Pflanzen helfen uns, frische Luft zu machen“, erklärt Pixel.",
   "Am dritten Abend liegt Ella in ihrer Schlafkabine. Sie ist fast eingeschlafen. Da gibt es einen lauten Knall. Die ganze Station zittert. Das Licht geht aus, und eine rote Lampe beginnt zu blinken. Eine Computerstimme sagt: „Achtung! Achtung! Druckverlust in Abschnitt C!“ Ella setzt sich erschrocken auf. Abschnitt C – dort ist das Gewächshaus. Und dort arbeitet ihre Mutter heute Abend noch …"
  ], fragen:[
   {t:"wort", q:"Wie heißt die Mondstation?", pre:"Luna", l:["7","sieben"], b:"Mondstation Luna 7"},
   {t:"mc", q:"Was untersucht Ellas Mutter?", a:["Wie Pflanzen auf dem Mond wachsen","Wie Steine auf dem Mond entstehen","Wie Roboter denken","Wie lange man ohne Schlaf auskommt"], b:"Sie untersucht, wie Pflanzen auf dem Mond wachsen."},
   {t:"mc", q:"Wie sieht Pixel aus?", a:["Rund und silbern, mit zwei Greifarmen","Groß und eckig, mit vier Beinen","Klein und grün, mit Flügeln","Wie ein Mensch mit Helm"], b:"rund und silbern, und hat zwei Greifarme"},
   {t:"mc", q:"Warum macht sich Ella Sorgen um ihre Mutter?", a:["Ihre Mutter arbeitet im Gewächshaus, wo der Druckverlust ist.","Ihre Mutter ist zur Erde geflogen.","Ihre Mutter ist krank.","Ihre Mutter hat Ella vergessen."], b:"Abschnitt C – dort ist das Gewächshaus."}
  ]},
  {text:[
   "Ella springt aus dem Bett. Im Flur blinkt überall das rote Licht. Pixel rollt auf sie zu. „Ella, du musst in die Schutzkabine“, piepst er. „Das ist die Regel bei Alarm.“ – „Aber meine Mama!“, ruft Ella. „Sie ist im Gewächshaus!“",
   "Pixel blinkt nachdenklich. Dann sagt er: „Ich prüfe das.“ Auf seinem Bildschirm erscheint ein Plan der Station. Abschnitt C leuchtet rot. „Ein kleiner Meteorit hat ein Loch in die Wand gerissen“, erklärt Pixel. „Die Luft entweicht langsam. Die Türen zu Abschnitt C haben sich automatisch geschlossen, damit die restliche Station sicher bleibt.“",
   "„Und Mama?“ Pixel zeigt ein kleines grünes Licht in Abschnitt C. „Deine Mutter ist dort. Ihr Notfall-Armband sendet. Es geht ihr gut. Aber sie ist eingeschlossen.“",
   "Ella holt tief Luft. „Kann man das Loch flicken?“ – „Ja“, sagt Pixel. „Mit einem Flickenset. Das liegt im Werkzeugraum. Ich kann es durch den engen Wartungsschacht zum Gewächshaus bringen. Aber dafür brauche ich Hilfe. Meine Greifarme reichen nicht bis zur Klappe oben am Schacht.“",
   "Gemeinsam rennen sie zum Werkzeugraum. Ella findet das Flickenset in einer gelben Kiste. Dann hebt sie Pixel hoch und öffnet die Klappe zum Schacht. Pixel rollt mit dem Set hinein. „Ich melde mich über Funk“, piepst er. Ella wartet. Eine Minute. Zwei Minuten. Dann knistert der Funk: „Ella … mein Akku … nur noch drei Prozent …“ Danach ist es still."
  ], fragen:[
   {t:"mc", q:"Was hat den Alarm ausgelöst?", a:["Ein kleiner Meteorit hat ein Loch in die Wand gerissen.","Ein Feuer in der Küche","Pixel hat einen falschen Knopf gedrückt.","Ein Raumschiff ist gelandet."], b:"Ein kleiner Meteorit hat ein Loch in die Wand gerissen"},
   {t:"mc", q:"Warum haben sich die Türen zu Abschnitt C geschlossen?", a:["Damit die restliche Station sicher bleibt","Weil es Nacht ist","Weil Ellas Mutter es so wollte","Weil Pixel sie abgeschlossen hat"], b:"damit die restliche Station sicher bleibt"},
   {t:"mc", q:"Woher weiß Pixel, dass es Ellas Mutter gut geht?", a:["Ihr Notfall-Armband sendet ein Signal.","Sie hat Ella angerufen.","Pixel kann durch Wände sehen.","Ella hört sie rufen."], b:"Ihr Notfall-Armband sendet."},
   {t:"wort", q:"Welche Farbe hat die Kiste mit dem Flickenset?", pre:"Die Kiste ist", l:["gelb","gelbe","gelben"], b:"in einer gelben Kiste"}
  ]},
  {text:[
   "„Pixel? Pixel!“, ruft Ella in den Funk. Keine Antwort. Ella leuchtet mit einer Taschenlampe in den Schacht. Er ist eng und dunkel. Ganz hinten sieht sie ein schwaches Blinken. Das ist Pixel. Er ist mitten im Schacht stehen geblieben.",
   "Da knackt der Funk. Es ist Kommandant Okafor aus der Zentrale. „Ella, ich sehe dich auf der Kamera. Der Schacht ist zu eng für uns Erwachsene. Aber du könntest es schaffen. Die Luft im Schacht ist sicher. Traust du dich?“ Ella schluckt. Dann sagt sie: „Ja.“",
   "Sie steckt ein Ladekabel in ihre Hosentasche und kriecht in den Schacht. Es ist kalt, und die Metallwände drücken gegen ihre Schultern. Meter für Meter schiebt sie sich vorwärts. Endlich erreicht sie Pixel. Seine Augen auf dem Bildschirm sind fast ganz dunkel.",
   "Ella steckt das Ladekabel in Pixels Anschluss und das andere Ende in eine Steckdose an der Schachtwand. Ein leises Summen. Pixels Augen flackern. „Ella?“, piepst er schwach. „Du bist gekommen!“ – „Natürlich“, sagt Ella. „Wir sind doch ein Team.“",
   "Nach ein paar Minuten hat Pixel wieder genug Strom. Zusammen kriechen und rollen sie bis zum Ende des Schachts. Dort ist ein kleines Fenster zum Gewächshaus. Ella schaut hindurch. Sie sieht ihre Mutter. Sie trägt eine Sauerstoffmaske und winkt. Aber hinter ihr, an der Wand, ist der Riss größer geworden. Die Tomatenpflanzen flattern im Luftzug. Und Pixel sagt: „Wir müssen uns beeilen. Die Luft reicht nur noch für zehn Minuten.“"
  ], fragen:[
   {t:"mc", q:"Warum kriecht Ella in den Schacht und nicht ein Erwachsener?", a:["Der Schacht ist zu eng für Erwachsene.","Die Erwachsenen schlafen alle.","Ella hat es niemandem gesagt.","Pixel will nur mit Ella arbeiten."], b:"Der Schacht ist zu eng für uns Erwachsene."},
   {t:"wort", q:"Wie heißt der Kommandant der Station?", pre:"Kommandant", l:["Okafor"], b:"Kommandant Okafor"},
   {t:"mc", q:"Was nimmt Ella mit in den Schacht?", a:["Ein Ladekabel","Eine Sauerstoffmaske","Das Flickenset","Eine Tomate"], b:"Sie steckt ein Ladekabel in ihre Hosentasche"},
   {t:"mc", q:"Was sagt Ella zu Pixel?", a:["„Wir sind doch ein Team.“","„Du bist ein kaputter Roboter.“","„Ich will nach Hause.“","„Ich habe Angst im Dunkeln.“"], b:"Wir sind doch ein Team."}
  ]},
  {text:[
   "Neben dem Fenster gibt es ein kleines Schleusenfach. Damit kann man Dinge ins Gewächshaus schicken, ohne dass Luft entweicht. Pixel legt das Flickenset hinein und drückt auf einen Knopf. Zisch! Auf der anderen Seite nimmt Ellas Mutter das Set heraus.",
   "Ella sieht durch das Fenster zu. Ihre Mutter klappt das Set auf. Darin ist ein großer silberner Flicken, der wie ein Pflaster aussieht. Sie zieht die Schutzfolie ab und drückt den Flicken fest auf den Riss. Dann sprüht sie noch grauen Schaum über die Ränder.",
   "Die Tomatenpflanzen hören auf zu flattern. Pixel piept fröhlich. „Der Druck steigt wieder. Das Loch ist dicht!“ Kurz darauf meldet sich Kommandant Okafor: „Gute Arbeit, ihr drei. Ich öffne jetzt die Türen zu Abschnitt C.“",
   "Mit einem Zischen gleitet die Tür auf. Ellas Mutter nimmt die Maske ab und schließt Ella ganz fest in die Arme. „Du warst unglaublich mutig“, flüstert sie. „Pixel auch“, sagt Ella. Pixel lässt auf seinem Bildschirm ein kleines rotes Herz erscheinen.",

{
 id:"polizei", titel:"Kommissarin Demir und die Fahrraddiebe", emoji:"🚓", thema:"Polizei", farbe:"#2456A6",
 abzeichen:"Polizeistern", abzeichenEmoji:"⭐",
 teile:[
  {text:[
   "Luis hat zum Geburtstag ein neues Fahrrad bekommen. Es ist dunkelblau, hat 21 Gänge und eine Klingel, die wie ein Fußball aussieht. Unten auf den Rahmen hat Luis einen Aufkleber mit einem gelben Blitz geklebt. Jeden Morgen fährt er stolz damit zur Schule und schließt es am Fahrradständer ab.",
   "Am Donnerstag nach der sechsten Stunde rennt Luis als Erster aus dem Schulhaus. Er freut sich auf das Fußballtraining. Doch am Fahrradständer bleibt er wie angewurzelt stehen. Sein Fahrrad ist weg. Nur das Schloss liegt noch auf dem Boden. Es ist durchgeschnitten.",
   "„Das gibt es doch nicht“, flüstert Luis. Seine Freundin Aylin kommt dazu. „Bei mir in der Straße wurden letzte Woche auch zwei Fahrräder geklaut“, sagt sie. „Und beim Schwimmbad eins.“",
   "Luis' Mutter ruft die Polizei an. Am Nachmittag klingelt es an der Tür. Eine Polizistin in Uniform steht davor. „Guten Tag, ich bin Kommissarin Demir“, sagt sie freundlich. „Ich möchte dir ein paar Fragen zu deinem Fahrrad stellen.“",
   "Luis erzählt ihr alles: von den Gängen, der Fußballklingel und dem Aufkleber. Kommissarin Demir schreibt alles auf. „Seit einem Monat werden in unserer Stadt viele Fahrräder gestohlen“, sagt sie. „Wir glauben, es ist immer dieselbe Bande. Aber wir wissen nicht, wo sie die Räder verstecken.“ Sie gibt Luis eine kleine Karte mit ihrer Telefonnummer. „Wenn dir etwas auffällt, ruf mich sofort an. Aber versuch nie, selbst einen Dieb zu fangen.“",
   "Am Samstag geht Luis mit Aylin über den Flohmarkt auf dem Marktplatz. Plötzlich packt Aylin ihn am Arm. „Luis! Da hinten! Ist das nicht …?“"
  ], fragen:[
   {t:"mc", q:"Woran kann man Luis' Fahrrad gut erkennen?", a:["An dem Aufkleber mit dem gelben Blitz","An dem roten Korb","An den Blumen am Lenker","An einem Namensschild"], b:"einen Aufkleber mit einem gelben Blitz"},
   {t:"mc", q:"Was liegt noch am Fahrradständer?", a:["Das durchgeschnittene Schloss","Die Fußballklingel","Ein Zettel vom Dieb","Luis' Helm"], b:"Nur das Schloss liegt noch auf dem Boden."},
   {t:"wort", q:"Wie heißt die Polizistin?", pre:"Kommissarin", l:["Demir"], b:"ich bin Kommissarin Demir"},
   {t:"mc", q:"Was soll Luis tun, wenn ihm etwas auffällt?", a:["Sofort die Kommissarin anrufen","Den Dieb selbst festhalten","Es seiner Lehrerin erzählen","Ein Foto in der Zeitung zeigen"], b:"Wenn dir etwas auffällt, ruf mich sofort an."}
  ]},
  {text:[
   "Zwischen einem Stand mit alten Büchern und einem Stand mit Spielzeug stehen viele Fahrräder in einer Reihe. Ein Mann mit Sonnenbrille und einer grünen Mütze verkauft sie. Ganz am Ende steht ein dunkelblaues Fahrrad.",
   "Luis' Herz klopft schneller. Das Fahrrad sieht genauso aus wie seins. Aber die Fußballklingel fehlt. Stattdessen ist da eine ganz normale silberne Klingel. „Vielleicht ist es doch nicht deins“, sagt Aylin leise. „Es gibt viele blaue Fahrräder.“",
   "Luis schleicht näher heran. Er tut so, als würde er sich die Bücher am Nachbarstand ansehen. Dann bückt er sich und schaut unten auf den Rahmen. Dort hat jemand mit schwarzer Farbe über eine Stelle gesprüht. Aber an einer Ecke ist die Farbe abgeblättert. Darunter schimmert etwas Gelbes hervor. Ein Stück von einem Blitz!",
   "„Das ist es!“, flüstert Luis. „Das ist mein Fahrrad!“ Am liebsten würde er es sofort packen und wegfahren. Aber Aylin hält ihn zurück. „Nicht!“, zischt sie. „Denk an das, was Kommissarin Demir gesagt hat. Wir sollen sie anrufen, wenn uns etwas auffällt.“",
   "Luis holt die Karte aus seiner Hosentasche. Aylin leiht ihm ihr Handy. Mit zitternden Fingern tippt er die Nummer. Es klingelt einmal, zweimal. Da dreht sich der Mann mit der grünen Mütze um. Er schaut genau in ihre Richtung. Dann nimmt er sein eigenes Handy und sagt etwas hinein. Und schon schiebt er die Fahrräder hastig zu einem grauen Lastwagen …"
  ], fragen:[
   {t:"mc", q:"Was ist anders an dem Fahrrad auf dem Flohmarkt?", a:["Es hat eine normale silberne Klingel statt der Fußballklingel.","Es ist rot statt blau.","Es hat nur drei Gänge.","Es hat keinen Sattel."], b:"Stattdessen ist da eine ganz normale silberne Klingel."},
   {t:"mc", q:"Wie findet Luis heraus, dass es sein Fahrrad ist?", a:["Unter der schwarzen Farbe schimmert ein Stück vom gelben Blitz.","Sein Name steht auf dem Sattel.","Der Verkäufer sagt es ihm.","Die Fußballklingel liegt daneben."], b:"Darunter schimmert etwas Gelbes hervor."},
   {t:"mc", q:"Warum hält Aylin Luis zurück?", a:["Sie sollen die Kommissarin anrufen und nichts allein unternehmen.","Sie glaubt nicht, dass es sein Fahrrad ist.","Sie will das Fahrrad selbst haben.","Sie will zuerst Bücher kaufen."], b:"Wir sollen sie anrufen, wenn uns etwas auffällt."},
   {t:"wort", q:"Welche Farbe hat die Mütze des Verkäufers?", pre:"Die Mütze ist", l:["grün","grüne","grünen"], b:"einer grünen Mütze"}
  ]},
  {text:[
   "„Kommissarin Demir“, meldet sich endlich eine Stimme am Telefon. Luis spricht so schnell, dass er sich fast verhaspelt. „Hier ist Luis. Mein Fahrrad ist auf dem Flohmarkt! Der Mann lädt gerade alle Räder in einen grauen Lastwagen!“",
   "„Bleibt, wo ihr seid“, sagt die Kommissarin ruhig. „Könnt ihr das Nummernschild erkennen?“ Luis kneift die Augen zusammen. Der Lastwagen steht schräg hinter einem Gemüsestand. Er kann nur die ersten Buchstaben sehen: IGB.",
   "„Gut gemacht“, sagt Kommissarin Demir. „Wir sind gleich da.“ Aber der Mann ist schnell. Er hat schon fast alle Fahrräder eingeladen. Jetzt schiebt er auch Luis' Fahrrad die Rampe hinauf. Dann knallt er die Ladetür zu.",
   "„Er fährt gleich weg!“, ruft Aylin. Luis schaut sich um. Der Marktplatz hat nur eine Ausfahrt. Und genau dort steht ein Lieferwagen vom Bäcker, der gerade Brot auslädt. Der graue Lastwagen kommt nicht vorbei. Der Mann hupt wütend.",
   "Der Bäcker winkt nur und lädt weiter Brot aus. Da springt der Mann mit der grünen Mütze aus dem Führerhaus. Er schaut sich um. Dann sieht er Luis und Aylin, die immer noch mit dem Handy hinter dem Bücherstand stehen. Er kneift die Augen zusammen und kommt mit großen Schritten direkt auf sie zu."
  ], fragen:[
   {t:"wort", q:"Mit welchen Buchstaben beginnt das Nummernschild?", pre:"Es beginnt mit", l:["IGB"], b:"Er kann nur die ersten Buchstaben sehen: IGB."},
   {t:"mc", q:"Was sagt die Kommissarin am Telefon zu den Kindern?", a:["„Bleibt, wo ihr seid.“","„Lauft dem Lastwagen hinterher.“","„Fahrt mit dem Bus nach Hause.“","„Haltet den Mann fest.“"], b:"Bleibt, wo ihr seid"},
   {t:"mc", q:"Warum kann der Lastwagen nicht wegfahren?", a:["Ein Lieferwagen vom Bäcker steht in der Ausfahrt.","Er hat einen platten Reifen.","Die Polizei steht schon davor.","Er hat kein Benzin mehr."], b:"Und genau dort steht ein Lieferwagen vom Bäcker, der gerade Brot auslädt."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Luis' Fahrrad wird an der Schule gestohlen.","Kommissarin Demir besucht Luis zu Hause.","Luis entdeckt den gelben Blitz unter der Farbe.","Der Mann lädt die Fahrräder in den Lastwagen."]}
  ]},
  {text:[
   "Luis wird ganz kalt. Aylin greift seine Hand. „Schnell, zu den Leuten!“, flüstert sie. Die beiden laufen zum Stand mit dem Spielzeug, wo viele Erwachsene stehen. Dort fühlen sie sich sicherer.",
   "Doch der Mann kommt nicht weit. Mit Blaulicht biegen zwei Polizeiautos auf den Marktplatz. Die Türen fliegen auf. Kommissarin Demir und drei Polizisten steigen aus. Der Mann mit der grünen Mütze bleibt stehen. Er weiß, dass er verloren hat.",
   "Im Lastwagen finden die Polizisten zwölf gestohlene Fahrräder. Und in einer Kiste unter dem Sitz liegen viele Klingeln, Lampen und Körbe. Ganz oben liegt eine Klingel, die aussieht wie ein Fußball.",
   "„Die Bande hat die Räder umlackiert und Teile ausgetauscht, damit niemand sie wiedererkennt“, erklärt Kommissarin Demir. „Aber euren Augen ist nichts entgangen. Und ihr habt genau richtig gehandelt: Ihr habt uns angerufen und seid nicht selbst hinter dem Dieb hergelaufen.“",
   "Eine Woche später kommt Kommissarin Demir in Luis' Klasse. Sie bringt sein Fahrrad mit. Die schwarze Farbe ist entfernt, und die Fußballklingel ist wieder dran. Die ganze Klasse klatscht. Und Luis klebt einen zweiten Aufkleber auf den Rahmen: einen kleinen Polizeistern."
  ], fragen:[
   {t:"mc", q:"Wohin laufen Luis und Aylin, als der Mann auf sie zukommt?", a:["Zum Spielzeugstand, wo viele Erwachsene sind","Nach Hause","Zum grauen Lastwagen","In die Bäckerei"], b:"Die beiden laufen zum Stand mit dem Spielzeug, wo viele Erwachsene stehen."},
   {t:"wort", q:"Wie viele gestohlene Fahrräder finden die Polizisten?", pre:"Sie finden", post:"Fahrräder.", l:["zwölf","12"], b:"zwölf gestohlene Fahrräder"},
   {t:"mc", q:"Warum hat die Bande die Räder umlackiert?", a:["Damit niemand sie wiedererkennt","Weil die alte Farbe kaputt war","Weil Schwarz schöner ist","Damit sie schneller fahren"], b:"damit niemand sie wiedererkennt"},
   {t:"mc", q:"Was lobt die Kommissarin besonders?", a:["Dass die Kinder angerufen haben und nicht selbst hinter dem Dieb hergelaufen sind","Dass Luis so schnell rennen kann","Dass Aylin ein Handy hat","Dass die Kinder den Dieb festgehalten haben"], b:"Ihr habt uns angerufen und seid nicht selbst hinter dem Dieb hergelaufen."}

 ]

{
 id:"feuer", titel:"Einsatz für Löschzug 3", emoji:"🚒", thema:"Feuerwehr", farbe:"#C0392B",
 abzeichen:"Feuerwehr-Abzeichen", abzeichenEmoji:"🧯",
 teile:[
  {text:[
   "Pauls Tante Mia ist bei der Feuerwehr. Heute ist Tag der offenen Tür in der Feuerwache, und Paul darf den ganzen Nachmittag dabei sein. Er hat sich schon die ganze Woche darauf gefreut.",
   "Tante Mia zeigt ihm alles. Die großen roten Fahrzeuge glänzen in der Halle. Paul darf in das Führerhaus vom Löschfahrzeug klettern. Er sieht die vielen Knöpfe, das Funkgerät und das Lenkrad, das größer ist als ein Pizzablech.",
   "Dann zeigt Tante Mia ihm ihre Schutzkleidung. Die Jacke ist dick und schwer. „Die schützt vor Hitze und Flammen“, erklärt sie. „Und das hier ist mein Atemschutzgerät. Damit bekomme ich frische Luft, auch wenn überall Rauch ist.“ Paul probiert den Helm auf. Er rutscht ihm fast über die Nase.",
   "„Weißt du, was bei einem Brand das Gefährlichste ist?“, fragt Tante Mia. „Das Feuer?“, rät Paul. „Nein, der Rauch“, sagt sie. „Er ist giftig. Deshalb ist es so wichtig, dass jede Wohnung einen Rauchmelder hat. Der piept, wenn es brennt, auch wenn man schläft.“",
   "Gerade will Paul fragen, wie die lange Rutschstange funktioniert. Da schrillt plötzlich ein lauter Ton durch die ganze Wache. Ein Lautsprecher knackt. „Alarm für Löschzug 3! Brand in einer Scheune, Lindenhof, Waldstraße 12. Menschen und Tiere möglicherweise in Gefahr!“ Tante Mia rennt sofort los. „Paul, bleib bei Herrn Krause!“, ruft sie über die Schulter. Paul schaut ihr hinterher. Der Lindenhof – dort wohnt doch seine Freundin Emma …"
  ], fragen:[
   {t:"mc", q:"Warum ist Paul in der Feuerwache?", a:["Es ist Tag der offenen Tür, und seine Tante arbeitet dort.","Er hat einen Brand gemeldet.","Er macht eine Prüfung für die Feuerwehr.","Seine Klasse macht einen Ausflug."], b:"Heute ist Tag der offenen Tür in der Feuerwache"},
   {t:"mc", q:"Wozu braucht Tante Mia das Atemschutzgerät?", a:["Damit sie frische Luft bekommt, auch wenn überall Rauch ist","Damit sie unter Wasser tauchen kann","Damit sie im Dunkeln besser sieht","Damit sie mit den anderen funken kann"], b:"Damit bekomme ich frische Luft, auch wenn überall Rauch ist."},
   {t:"mc", q:"Was ist bei einem Brand am gefährlichsten – sagt Tante Mia?", a:["Der giftige Rauch","Die Flammen","Das Löschwasser","Die laute Sirene"], b:"Er ist giftig."},
   {t:"wort", q:"Was sollte jede Wohnung haben?", pre:"Einen", l:["Rauchmelder"], b:"dass jede Wohnung einen Rauchmelder hat"}
  ]},
  {text:[
   "Herr Krause ist schon älter und leitet die Jugendfeuerwehr. Er legt Paul die Hand auf die Schulter. „Keine Sorge“, sagt er. „Deine Tante und ihr Team sind die Besten.“ Durch das große Tor sieht Paul, wie die Feuerwehrleute in ihre Stiefel springen, die Jacken überziehen und in die Fahrzeuge klettern. Keine zwei Minuten später rasen sie mit Blaulicht und Martinshorn vom Hof.",
   "„Herr Krause, auf dem Lindenhof wohnt meine Freundin Emma“, sagt Paul mit zitternder Stimme. Herr Krause überlegt kurz. Dann nimmt er seinen Autoschlüssel. „Ich muss sowieso zum Einsatzort und Ersatzschläuche bringen. Du kommst mit. Aber du bleibst die ganze Zeit im Auto oder direkt neben mir. Versprochen?“ – „Versprochen!“",
   "Schon von Weitem sieht Paul die dicke, schwarze Rauchwolke über den Bäumen. Als sie ankommen, stellt Herr Krause das Auto weit weg vom Feuer auf eine Wiese. Die Scheune brennt lichterloh. Flammen schlagen aus dem Dach. Es knistert und kracht.",
   "Die Feuerwehrleute rollen Schläuche aus. Wasser schießt in hohem Bogen auf das Feuer. Am Rand der Wiese steht Emma mit ihren Eltern. Sie sind in Sicherheit. Paul atmet erleichtert auf. Doch Emma weint. Paul geht mit Herrn Krause zu ihr. „Was ist los?“, fragt er.",
   "„Flocke“, schluchzt Emma. „Unsere Katze. Sie hat heute Morgen in der Scheune ihre Babys bekommen. Vier kleine Kätzchen! Sie sind noch drin!“ Paul schaut zur Scheune. In diesem Moment kracht ein brennender Balken vom Dach herunter."
  ], fragen:[
   {t:"mc", q:"Wer ist Herr Krause?", a:["Der Leiter der Jugendfeuerwehr","Emmas Vater","Der Bürgermeister","Pauls Lehrer"], b:"leitet die Jugendfeuerwehr"},
   {t:"mc", q:"Was muss Paul Herrn Krause versprechen?", a:["Dass er im Auto oder direkt neben ihm bleibt","Dass er beim Löschen hilft","Dass er niemandem davon erzählt","Dass er Emma allein sucht"], b:"Aber du bleibst die ganze Zeit im Auto oder direkt neben mir."},
   {t:"mc", q:"Wo parkt Herr Krause das Auto?", a:["Weit weg vom Feuer auf einer Wiese","Direkt neben der Scheune","Im Hof der Feuerwache","Vor Emmas Haustür"], b:"weit weg vom Feuer auf eine Wiese"},
   {t:"wort", q:"Wie heißt Emmas Katze?", pre:"Die Katze heißt", l:["Flocke"], b:"„Flocke“, schluchzt Emma."}
  ]},
  {text:[
   "Funken fliegen durch die Luft. Herr Krause zieht Paul und Emma ein paar Schritte zurück. „Die Kätzchen!“, ruft Emma und will losrennen. Doch ihr Vater hält sie fest. „Nein, Emma. Das ist viel zu gefährlich.“",
   "Paul denkt an das, was Tante Mia ihm erzählt hat: Feuerwehrleute haben Schutzkleidung und Atemschutz. Nur sie dürfen in ein brennendes Gebäude. „Wir müssen es der Feuerwehr sagen!“, ruft Paul. „Sofort!“",
   "Herr Krause nickt und geht mit den Kindern schnell zum Einsatzleiter. Das ist ein Mann mit einem weißen Helm. Er steht neben dem Löschfahrzeug und spricht in sein Funkgerät. „In der Scheune sind noch eine Katze und vier Kätzchen!“, ruft Paul. „Wo genau?“, fragt der Einsatzleiter. Emma überlegt. „In der hinteren Ecke, links. In einer Kiste mit Stroh.“",
   "Der Einsatzleiter spricht in sein Funkgerät: „Trupp 2, Tiere in der Scheune. Hintere linke Ecke, Kiste mit Stroh.“ Zwei Feuerwehrleute mit Atemschutzmasken laufen los. Einer davon ist Tante Mia! Paul erkennt sie an dem roten Streifen auf ihrem Helm.",
   "Die beiden verschwinden im Rauch. Paul hält den Atem an. Emma drückt sich ganz fest an ihre Mutter. Eine Minute vergeht. Dann zwei. Aus der Scheune quillt immer mehr Rauch. Plötzlich gibt es ein lautes Knacken, und ein Teil des Daches stürzt ein. Genau über der Ecke, in die Tante Mia gelaufen ist."
  ], fragen:[
   {t:"mc", q:"Warum darf Emma nicht in die Scheune laufen?", a:["Weil es viel zu gefährlich ist","Weil die Tür abgeschlossen ist","Weil die Kätzchen schon draußen sind","Weil sie keine Schuhe anhat"], b:"Das ist viel zu gefährlich."},
   {t:"mc", q:"Was ist Pauls gute Idee?", a:["Der Feuerwehr Bescheid zu sagen","Selbst in die Scheune zu laufen","Wasser mit einem Eimer zu holen","Die Katze ganz laut zu rufen"], b:"Wir müssen es der Feuerwehr sagen!"},
   {t:"mc", q:"Woran erkennt man den Einsatzleiter?", a:["An seinem weißen Helm","An seiner roten Mütze","An seiner Trillerpfeife","An seinem langen Bart"], b:"Das ist ein Mann mit einem weißen Helm."},
   {t:"mc", q:"Warum ist es wichtig, dass Emma genau sagt, wo die Kätzchen sind?", a:["Damit die Feuerwehrleute sie im Rauch schnell finden","Damit Emma selbst hineingehen kann","Damit Paul es aufschreiben kann","Damit Flocke ihren Namen hört"], b:"In der hinteren Ecke, links. In einer Kiste mit Stroh."}
  ]},
  {text:[
   "„Mia!“, schreit Paul. Der Einsatzleiter drückt auf sein Funkgerät. „Trupp 2, bitte melden!“ Es rauscht. Nichts. Dann noch einmal: „Trupp 2, bitte melden!“",
   "Endlich knackt es im Funkgerät. „Hier Trupp 2. Alles in Ordnung. Wir haben die Tiere und kommen durch das hintere Tor raus.“ Paul spürt, wie seine Beine vor Erleichterung ganz weich werden.",
   "Kurz darauf kommen die beiden Feuerwehrleute um die Ecke der Scheune. Tante Mia trägt eine Kiste mit Stroh im Arm. Darin liegen vier winzige Kätzchen, die leise fiepen. Ihr Kollege hält eine fauchende, rußige Katze fest: Flocke.",
   "Emma weint wieder, aber diesmal vor Freude. Ein Sanitäter untersucht die Tiere. „Ein bisschen Rauch geschluckt, aber sie sind gesund“, sagt er. Nach zwei Stunden ist das Feuer gelöscht. Die Scheune ist kaputt, aber alle Menschen und Tiere sind gerettet.",
   "Am Abend sitzt Paul mit Tante Mia in der Feuerwache und isst Pizza. „Du hast heute genau richtig gehandelt“, sagt sie. „Du bist nicht selbst ins Feuer gelaufen, sondern hast uns gesagt, was los ist. Das ist das Wichtigste.“ Paul grinst. Und zwei Wochen später bekommt er von Emma ein Geschenk: Er darf einem der Kätzchen einen Namen geben. Er nennt es Funke."
  ], fragen:[
   {t:"mc", q:"Wie kommen die Feuerwehrleute aus der Scheune?", a:["Durch das hintere Tor","Durch das Dach","Durch ein Fenster","Durch die Vordertür"], b:"kommen durch das hintere Tor raus"},
   {t:"mc", q:"Was trägt Tante Mia im Arm?", a:["Eine Kiste mit vier Kätzchen","Die Katze Flocke","Einen Feuerlöscher","Emmas Puppe"], b:"Tante Mia trägt eine Kiste mit Stroh im Arm."},
   {t:"folge", q:"Was ist in der Geschichte passiert? Tippe in der richtigen Reihenfolge.", a:["Paul probiert den Helm auf.","Der Alarm schrillt durch die Wache.","Emma erzählt von den Kätzchen.","Tante Mia bringt die Kätzchen aus der Scheune."]},
   {t:"wort", q:"Welchen Namen gibt Paul dem Kätzchen?", pre:"Er nennt es", l:["Funke"], b:"Er nennt es Funke."}
  ]}
 ]
},
{
 id:"pokal", titel:"Die Spürnasen: Der verschwundene Pokal", emoji:"🏆", thema:"Detektive · 2. Fall", farbe:"#6C4AB6",
 abzeichen:"Spürnasen-Lupe", abzeichenEmoji:"🔎",
 teile:[
  {text:[
   "Nur noch fünf Tage bis zum Schulfest! In der Eingangshalle der Schule steht eine Glasvitrine. Darin glänzt der goldene Fußballpokal, den die Schulmannschaft im Frühling gewonnen hat. Beim Schulfest soll er feierlich auf die Bühne getragen werden. Ben, Mira und Tim sind stolz darauf. Tim war sogar der Torwart.",
   "Doch am Montagmorgen bleibt Ben vor der Vitrine stehen und reißt die Augen auf. „Der Pokal!“, ruft er. „Er ist weg!“ Die Glastür der Vitrine steht einen Spalt offen. Auf dem Brett, wo der Pokal stand, ist nur noch ein runder, sauberer Kreis im Staub.",
   "Schnell kommen andere Kinder dazu. Dann eilt auch Frau Albers herbei, die Schulleiterin. Sie sieht sehr ernst aus. „Wer hat das getan?“, fragt sie. Aber niemand antwortet.",
   "Die Spürnasen schauen sich an. Sie wissen: Das ist ein Fall für sie. In der großen Pause untersuchen sie die Vitrine ganz genau. Mira entdeckt auf dem Boden einen winzigen goldenen Splitter. Ben findet am Glas einen klebrigen Fingerabdruck. „Das riecht nach Kleber“, sagt er und schnuppert.",
   "Tim schreibt alles in das Notizbuch. Da ruft Mira leise: „Schaut mal! Hinter dem Schild liegt ein Zettel!“ Sie zieht ihn vorsichtig heraus. Darauf steht in grüner Schrift: Der Pokal ist in Sicherheit. Bitte sucht nicht nach ihm!"
  ], fragen:[
   {t:"mc", q:"Warum ist der Pokal beim Schulfest so wichtig?", a:["Er soll feierlich auf die Bühne getragen werden.","Er ist aus echtem Gold.","Frau Albers hat ihn selbst gewonnen.","Er wird beim Fest verlost."], b:"Beim Schulfest soll er feierlich auf die Bühne getragen werden."},
   {t:"mc", q:"Was war Tim in der Schulmannschaft?", a:["Torwart","Kapitän","Trainer","Schiedsrichter"], b:"Tim war sogar der Torwart."},
   {t:"mc", q:"Welche Spuren finden die Spürnasen an der Vitrine?", a:["Einen goldenen Splitter und einen klebrigen Fingerabdruck","Fußspuren mit roter Erde","Ein Haar und einen Knopf","Einen Schlüssel und eine Taschenlampe"], b:"Mira entdeckt auf dem Boden einen winzigen goldenen Splitter."},
   {t:"wort", q:"In welcher Farbe ist der Zettel geschrieben?", pre:"In", post:"Schrift", l:["grün","grüner","grüne"], b:"Darauf steht in grüner Schrift"}
  ]},
  {text:[
   "Nach der Schule setzen sich die drei in die Zentrale, den alten Bauwagen. Sie legen den Zettel auf den Tisch. „Wer nimmt einen Pokal weg und schreibt dann, er ist in Sicherheit?“, fragt Mira. „Das ist komisch.“",
   "Tim betrachtet das Papier mit der Lupe. „Es ist aus einem Heft gerissen“, sagt er. „Mit Kästchen. Ein Matheheft.“ Ben zeigt auf die Schrift. „Und schaut euch das I an. Über dem I ist kein Punkt, sondern ein kleiner Kreis.“",
   "Am nächsten Morgen achten die Spürnasen in der Schule auf jede Kleinigkeit. In der Pause sieht Mira einen Jungen aus der 4b. Er heißt Felix. Felix hat ein großes Pflaster am Daumen. Und seine Finger glänzen ein bisschen golden.",
   "„Das kann Zufall sein“, sagt Ben. „Wir brauchen einen Beweis.“ Tim hat eine Idee. Er fragt Felix, ob er ihm einen Stift leihen kann. Felix gibt ihm einen grünen Filzstift. Dann schreibt er seinen Namen auf einen Zettel, damit Tim das Zurückgeben nicht vergisst. Über dem I von Felix ist ein kleiner Kreis.",
   "Nach der Schule hören die Spürnasen ein Klopfen aus dem Werkraum. Dabei ist der Werkraum nachmittags immer abgeschlossen. Die Tür steht einen Spalt offen. Leise schleichen sie näher. Auf der Werkbank liegt etwas Goldenes. Und darüber beugt sich eine Gestalt mit einem kleinen Hammer in der Hand …"
  ], fragen:[
   {t:"mc", q:"Woher stammt das Papier des Zettels?", a:["Aus einem Matheheft mit Kästchen","Aus einem Malblock","Aus einer Zeitung","Aus dem Kalender von Frau Albers"], b:"Ein Matheheft."},
   {t:"mc", q:"Was ist an der Schrift besonders?", a:["Über dem I ist ein kleiner Kreis statt eines Punktes.","Alle Buchstaben sind ganz groß.","Die Schrift ist rückwärts geschrieben.","Jedes Wort ist unterstrichen."], b:"Über dem I ist kein Punkt, sondern ein kleiner Kreis."},
   {t:"wort", q:"Wie heißt der Junge aus der 4b?", pre:"Er heißt", l:["Felix"], b:"Er heißt Felix."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Ben entdeckt, dass der Pokal fehlt.","Mira findet den Zettel hinter dem Schild.","Felix leiht Tim einen grünen Stift.","Die Spürnasen hören ein Klopfen aus dem Werkraum."]}
  ]},
  {text:[
   "Die Gestalt dreht sich um. Es ist Herr Brandt, der Hausmeister. Er hält einen kleinen Hammer und einen Pinsel in der Hand. „Was macht ihr denn hier?“, brummt er. „Der Werkraum ist kein Spielplatz.“",
   "Ben zeigt auf die Werkbank. Dort liegt der goldene Pokal. Aber einer der beiden Henkel ist abgebrochen. Daneben stehen eine Tube Kleber und ein Döschen mit goldener Farbe. „Sie haben den Pokal?“, ruft Mira. „Haben Sie ihn etwa gestohlen?“",
   "Herr Brandt schüttelt den Kopf. „Gestohlen? Nein. Ich habe ihn heute früh hier gefunden. Jemand hat versucht, den Henkel festzukleben. Aber das hält nicht. Jetzt repariere ich ihn richtig, mit einem kleinen Stift aus Metall.“",
   "„Und wer hat ihn hierhergebracht?“, fragt Tim. Der Hausmeister zuckt mit den Schultern. „Das weiß ich nicht. Aber derjenige hatte einen Schlüssel. Und vom Werkraum gibt es nur zwei: meinen und den von der Bastel-AG.“ Tim schaut in sein Notizbuch. Die Bastel-AG ist immer montags. Und Felix ist dort dabei.",
   "In diesem Moment geht hinter ihnen die Tür auf. Herein kommt Felix mit einer Tüte in der Hand. Er sieht den Pokal auf der Werkbank. Er sieht den Hausmeister. Und er sieht die Spürnasen. Felix wird kreidebleich. Die Tüte fällt auf den Boden. Dann dreht er sich um und rennt davon."
  ], fragen:[
   {t:"mc", q:"Wer ist die Gestalt im Werkraum?", a:["Herr Brandt, der Hausmeister","Felix aus der 4b","Frau Albers, die Schulleiterin","Ein Dieb mit Mütze"], b:"Es ist Herr Brandt, der Hausmeister."},
   {t:"mc", q:"Was ist mit dem Pokal passiert?", a:["Ein Henkel ist abgebrochen.","Er ist ganz verbogen.","Er wurde schwarz angemalt.","Er ist in zwei Teile zerbrochen."], b:"Aber einer der beiden Henkel ist abgebrochen."},
   {t:"mc", q:"Wie repariert Herr Brandt den Pokal richtig?", a:["Mit einem kleinen Stift aus Metall","Mit viel Klebeband","Mit Kaugummi","Er kauft einen neuen Pokal."], b:"mit einem kleinen Stift aus Metall"},
   {t:"wort", q:"Wie viele Schlüssel gibt es vom Werkraum?", pre:"Es gibt", post:"Schlüssel.", l:["zwei","2"], b:"Und vom Werkraum gibt es nur zwei"}
  ]},
  {text:[
   "Die Spürnasen laufen hinterher. Sie finden Felix hinter der Turnhalle. Er sitzt auf einer Bank und weint. Mira setzt sich neben ihn. „Was ist passiert?“, fragt sie leise.",
   "Felix schnieft. „Am Freitag nach der Schule habe ich in der Eingangshalle mit meinem Ball gespielt. Obwohl das verboten ist. Der Ball ist gegen die Vitrine geflogen. Die Tür war nicht richtig zu. Der Pokal ist umgefallen, und der Henkel ist abgebrochen.“",
   "„Und dann?“, fragt Ben. „Dann hatte ich Angst“, sagt Felix. „Ich wollte ihn heimlich reparieren, bevor es jemand merkt. Ich habe ihn in den Werkraum gebracht und den Zettel geschrieben, damit niemand denkt, er ist gestohlen. Aber mein Kleber hat nicht gehalten. In der Tüte ist neuer Kleber.“",
   "Tim überlegt. „Weißt du was? Jeder macht mal einen Fehler. Aber wenn du es Frau Albers selbst sagst, ist das viel mutiger als Verstecken.“ Felix schluckt. „Kommt ihr mit?“ Die Spürnasen nicken.",
   "Frau Albers hört sich alles in Ruhe an. „Im Haus Ball zu spielen war nicht in Ordnung“, sagt sie. „Aber dass du jetzt die Wahrheit sagst, finde ich stark.“ Felix darf Herrn Brandt bei der Reparatur helfen. Beim Schulfest glänzt der Pokal wie neu auf der Bühne. Und am Abend schreibt Tim in das Notizbuch: Fall Pokal – gelöst. Und einen neuen Freund gefunden."
  ], fragen:[
   {t:"mc", q:"Wie ist der Pokal kaputtgegangen?", a:["Felix' Ball ist gegen die Vitrine geflogen.","Herr Brandt hat ihn fallen lassen.","Ein Dieb hat ihn mitgenommen.","Die Vitrine ist umgekippt."], b:"Der Ball ist gegen die Vitrine geflogen."},
   {t:"mc", q:"Warum hat Felix den Zettel geschrieben?", a:["Damit niemand denkt, der Pokal ist gestohlen","Damit die Spürnasen ihn finden","Weil Frau Albers es wollte","Weil er ein Spiel spielen wollte"], b:"damit niemand denkt, er ist gestohlen"},
   {t:"mc", q:"Was rät Tim Felix?", a:["Es Frau Albers selbst zu sagen","Den Pokal besser zu verstecken","Noch mehr Kleber zu kaufen","Einfach nichts zu sagen"], b:"Aber wenn du es Frau Albers selbst sagst, ist das viel mutiger als Verstecken."},
   {t:"mc", q:"Was findet Frau Albers stark?", a:["Dass Felix die Wahrheit sagt","Dass Felix gut Ball spielen kann","Dass der Pokal so glänzt","Dass die Spürnasen so schnell rennen"], b:"Aber dass du jetzt die Wahrheit sagst, finde ich stark."}
  ]}
 ]
},
{
 id:"kira2", titel:"Kira und die Gewitternacht", emoji:"⛈️", thema:"Hunde · Kira 2", farbe:"#B86B1E",
 abzeichen:"Retterinnen-Halstuch", abzeichenEmoji:"🧣",
 teile:[
  {text:[
   "Es ist ein heißer Tag im Juli. Jonas und Lena helfen Herrn Becker, dem Nachbarn. Herr Becker ist Imker. Auf der Waldwiese hinter dem Hof stehen seine Bienenkästen. Er trägt einen weißen Anzug und einen Hut mit Netz. Kira darf nicht mit auf die Wiese. „Hunde und Bienen sind keine guten Freunde“, sagt Herr Becker und lacht.",
   "Zum Dank bekommt jedes Kind ein Glas Honig. Und Kira bekommt einen Hundekeks aus seiner Jackentasche. Das macht er immer. Deshalb rennt Kira jedes Mal schwanzwedelnd zu ihm, wenn sie ihn sieht.",
   "Am Abend wird der Himmel plötzlich dunkel. Der Wind pfeift um das Haus. Dann donnert es so laut, dass die Fenster zittern. Kira hat furchtbare Angst vor Gewitter. Sie verkriecht sich unter dem Küchentisch und zittert am ganzen Körper.",
   "„Arme Kira“, sagt Lena und streichelt sie. Mama macht leise Musik an, damit Kira den Donner nicht so laut hört. Jonas holt ihre Lieblingsdecke. Nach dem Essen gehen alle früh schlafen.",
   "Mitten in der Nacht wacht Jonas auf. Es regnet immer noch. Aber irgendetwas ist anders. Er geht in die Küche. Unter dem Tisch liegt nur die leere Decke. Und die Haustür steht weit offen. Draußen zuckt ein Blitz über den Himmel. Kira ist verschwunden."
  ], fragen:[
   {t:"mc", q:"Was ist Herr Becker von Beruf?", a:["Imker","Bäcker","Förster","Tierarzt"], b:"Herr Becker ist Imker."},
   {t:"mc", q:"Warum rennt Kira immer zu Herrn Becker?", a:["Er gibt ihr immer einen Hundekeks.","Er geht oft mit ihr spazieren.","Er hat auch einen Hund.","Er wirft ihr immer einen Ball."], b:"Und Kira bekommt einen Hundekeks aus seiner Jackentasche."},
   {t:"wort", q:"Wo verkriecht sich Kira beim Gewitter?", pre:"Unter dem", l:["Küchentisch","Tisch"], b:"Sie verkriecht sich unter dem Küchentisch"},
   {t:"mc", q:"Was entdeckt Jonas in der Nacht?", a:["Die Haustür steht offen, und Kira ist weg.","Lena ist verschwunden.","Der Strom ist ausgefallen.","Herr Becker steht vor der Tür."], b:"Und die Haustür steht weit offen."}
  ]},
  {text:[
   "„Papa! Mama! Kira ist weg!“ Jonas rüttelt an der Schlafzimmertür. Papa ist sofort wach. „Sie kann doch Türen mit der Pfote öffnen“, sagt er. „Bestimmt ist sie vor Angst weggelaufen.“",
   "Im selben Moment klingelt das Telefon. Es ist Frau Becker. Ihre Stimme klingt ganz aufgeregt. „Ist mein Mann bei euch? Er wollte vor dem Gewitter nur schnell nach den Bienenkästen sehen. Er ist immer noch nicht zurück, und sein Handy ist aus!“",
   "Papa zieht seine Regenjacke an und nimmt die große Taschenlampe. „Ich suche ihn“, sagt er. Jonas zieht schon seine Gummistiefel an. „Ich komme mit. Kira ist vielleicht auch dort.“ Papa überlegt kurz. Dann nickt er. „Aber du bleibst immer dicht hinter mir.“ Mama bleibt mit Lena zu Hause am Telefon.",
   "Draußen hat das Gewitter nachgelassen. Es grummelt nur noch in der Ferne. Der Weg zur Waldwiese ist voller Pfützen. Überall liegen abgebrochene Äste. Papa leuchtet hin und her. „Herr Becker!“, ruft er. „Kira!“, ruft Jonas.",
   "Da hören sie es: ein Bellen. Laut und aufgeregt. Es kommt von der Waldwiese. „Das ist Kira!“, ruft Jonas. Sie rennen los. Doch nach der nächsten Kurve bleibt Papa stehen. Quer über dem Weg liegt ein riesiger umgestürzter Baum. Und dahinter bellt Kira immer lauter."
  ], fragen:[
   {t:"mc", q:"Wie ist Kira wohl aus dem Haus gekommen – glaubt Papa?", a:["Sie hat die Tür mit der Pfote geöffnet.","Jemand hat sie hinausgelassen.","Sie ist durch ein Fenster gesprungen.","Die Tür war kaputt."], b:"Sie kann doch Türen mit der Pfote öffnen"},
   {t:"mc", q:"Warum ruft Frau Becker an?", a:["Ihr Mann ist nach dem Gewitter nicht zurückgekommen.","Ihre Bienen sind weggeflogen.","Sie hat Kira gefunden.","Ihr Dach ist kaputt."], b:"Er ist immer noch nicht zurück, und sein Handy ist aus!"},
   {t:"mc", q:"Was muss Jonas Papa versprechen?", a:["Immer dicht hinter ihm zu bleiben","Zu Hause zu bleiben","Die Taschenlampe zu tragen","Ganz leise zu sein"], b:"Aber du bleibst immer dicht hinter mir."},
   {t:"wort", q:"Was liegt quer über dem Weg?", pre:"Ein riesiger umgestürzter", l:["Baum"], b:"Quer über dem Weg liegt ein riesiger umgestürzter Baum."}
  ]},
  {text:[
   "Papa hilft Jonas über den dicken Stamm. Die nasse Rinde ist glitschig, und Jonas rutscht fast ab. Aber dann sind sie drüben. Sie laufen weiter bis zur Waldwiese.",
   "Im Licht der Taschenlampe sehen sie Kira. Sie liegt neben einer Gestalt im weißen Anzug, ganz dicht, und bellt in ihre Richtung. Es ist Herr Becker! Er sitzt am Boden. Über seinem Bein liegt ein schwerer Ast.",
   "„Endlich!“, stöhnt Herr Becker. „Der Ast ist beim Sturm heruntergefallen. Mein Fuß tut schrecklich weh. Und mein Handy ist dabei kaputtgegangen.“ Er streichelt Kira. „Eure Kira hat mich gefunden. Sie liegt schon die ganze Zeit neben mir und wärmt mich.“",
   "Papa kniet sich hin. Er versucht, den Ast hochzuheben. Er stemmt sich mit aller Kraft dagegen. Aber der Ast bewegt sich nur ein kleines bisschen. Er ist viel zu schwer, um ihn ganz wegzuheben.",
   "Da hört Jonas über sich ein Knarren. Er leuchtet nach oben. Hoch im Baum hängt noch ein großer Ast. Er ist halb abgebrochen und schaukelt im Wind. Genau über Herrn Becker. Und mit jedem Windstoß knarrt er lauter."
  ], fragen:[
   {t:"mc", q:"Wo liegt Kira, als Papa und Jonas sie finden?", a:["Ganz dicht neben Herrn Becker","Unter dem umgestürzten Baum","Bei den Bienenkästen","Mitten in einer Pfütze"], b:"Sie liegt neben einer Gestalt im weißen Anzug, ganz dicht"},
   {t:"mc", q:"Warum konnte Herr Becker nicht um Hilfe rufen?", a:["Sein Handy ist kaputtgegangen.","Er hat seine Stimme verloren.","Er hatte Angst vor Kira.","Er hat geschlafen."], b:"Und mein Handy ist dabei kaputtgegangen."},
   {t:"mc", q:"Wie hilft Kira Herrn Becker?", a:["Sie liegt neben ihm und wärmt ihn.","Sie zieht den Ast weg.","Sie holt Frau Becker.","Sie bringt ihm sein Handy."], b:"Sie liegt schon die ganze Zeit neben mir und wärmt mich."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Herr Becker schenkt den Kindern Honig.","Kira verkriecht sich unter dem Küchentisch.","Frau Becker ruft an.","Papa versucht, den Ast hochzuheben."]}
  ]},
  {text:[
   "„Wir müssen ihn hier wegbringen!“, ruft Papa. Er hebt den schweren Ast mit aller Kraft ein kleines Stück an. „Jonas, schieb einen Stein darunter!“ Jonas rollt schnell einen dicken Stein heran und schiebt ihn unter den Ast. Jetzt ist genug Platz. Papa zieht Herrn Becker vorsichtig nach hinten, weg vom Baum.",
   "Keine Sekunde zu früh. Mit einem lauten Krachen stürzt der obere Ast herunter. Genau dorthin, wo Herr Becker eben noch gesessen hat. Jonas hält sich die Ohren zu. Kira jault.",
   "Papa ruft mit seinem Handy den Notruf 112 an. Er erklärt genau, wo sie sind. Eine halbe Stunde später leuchten Blaulichter am Waldrand. Sanitäter tragen Herrn Becker auf einer Trage zum Krankenwagen. „Der Knöchel ist gebrochen“, sagt eine Sanitäterin. „Aber das wird wieder.“",
   "Eine Woche später humpelt Herr Becker mit einem Gips am Bein über den Hof. Er hat einen großen Korb dabei. Darin sind drei Gläser Honig, eine Tüte Hundekekse und ein rotes Halstuch. Auf dem Halstuch steht: Kira – Retterin.",
   "„Weißt du, warum sie dich gefunden hat?“, fragt Jonas. Herr Becker lacht. „Ich glaube, sie hat die Hundekekse in meiner Tasche gerochen.“ Kira wedelt mit dem Schwanz. Und beim nächsten Gewitter liegt sie wieder zitternd unter dem Küchentisch – aber jetzt mit einem roten Halstuch um den Hals."
  ], fragen:[
   {t:"mc", q:"Wie schaffen Papa und Jonas Platz unter dem Ast?", a:["Jonas schiebt einen dicken Stein darunter.","Sie sägen den Ast durch.","Kira zieht den Ast weg.","Sie warten auf die Feuerwehr."], b:"Jonas rollt schnell einen dicken Stein heran und schiebt ihn unter den Ast."},
   {t:"mc", q:"Was passiert kurz danach?", a:["Der obere Ast stürzt herunter.","Es fängt an zu schneien.","Herr Becker steht auf und läuft weg.","Die Bienen fliegen aus."], b:"Mit einem lauten Krachen stürzt der obere Ast herunter."},
   {t:"wort", q:"Welche Nummer ruft Papa an?", pre:"Den Notruf", l:["112"], b:"den Notruf 112"},
   {t:"mc", q:"Was steht auf dem roten Halstuch?", a:["Kira – Retterin","Bester Hund der Welt","Danke, Jonas","Honig-Hund"], b:"Kira – Retterin"}
  ]}
 ]
},
{
 id:"perla2", titel:"Perla und das Delfinbaby", emoji:"🌊", thema:"Meer & Delfine · Perla 2", farbe:"#1A7F9E",
 abzeichen:"Meeresschützer-Abzeichen", abzeichenEmoji:"🐚",
 teile:[
  {text:[
   "Ein ganzes Jahr hat Nele gewartet. Jetzt sind endlich wieder Ferien, und sie ist bei Opa Hinnerk auf der Insel. Gleich am ersten Morgen fahren sie mit der Möwe hinaus in die Bucht.",
   "Nele hält Ausschau. Dann taucht neben dem Boot etwas Weißes auf. „Perla!“, ruft Nele. Die weiße Delfindame schwimmt eine Runde und kichert. Doch diesmal ist sie nicht allein. Dicht neben ihr schwimmt ein kleiner grauer Delfin. Er ist nicht einmal halb so groß wie seine Mutter.",
   "„Perla hat ein Baby bekommen!“, flüstert Opa. „Das Kleine bleibt immer ganz nah bei seiner Mutter. Es trinkt noch Milch und muss erst lernen, Fische zu fangen.“",
   "Nele darf dem Baby einen Namen geben. Sie überlegt lange. Das Kleine ist grau und glatt wie ein Stein am Strand. „Kiesel“, sagt sie. „Es heißt Kiesel.“",
   "Jeden Morgen beobachten Nele und Opa die beiden. Kiesel springt schon kleine Bögen aus dem Wasser. Doch am dritten Tag hört Nele plötzlich ein lautes Brummen. Ein Jetski rast um die Felsen herum in die Bucht. Er ist schnell, und er fährt genau auf Perla und Kiesel zu."
  ], fragen:[
   {t:"mc", q:"Was ist neu bei Perla?", a:["Sie hat ein Baby bekommen.","Sie ist grau geworden.","Sie hat eine Verletzung.","Sie wohnt jetzt in einer anderen Bucht."], b:"Perla hat ein Baby bekommen!"},
   {t:"mc", q:"Was trinkt das Delfinbaby noch?", a:["Milch","Salzwasser","Regenwasser","Saft"], b:"Es trinkt noch Milch"},
   {t:"wort", q:"Welchen Namen bekommt das Delfinbaby?", pre:"Es heißt", l:["Kiesel"], b:"„Kiesel“, sagt sie."},
   {t:"mc", q:"Warum wählt Nele genau diesen Namen?", a:["Das Baby ist grau und glatt wie ein Stein am Strand.","Das Baby liegt gern auf dem Sand.","Das Baby ist ganz rund.","Opa hat den Namen ausgesucht."], b:"Das Kleine ist grau und glatt wie ein Stein am Strand."}
  ]},
  {text:[
   "„Halt!“, schreit Opa und winkt mit beiden Armen. Aber der Fahrer hört ihn nicht. Der Jetski donnert mitten durch die Bucht. Perla taucht blitzschnell ab. Kiesel erschrickt und schwimmt in die andere Richtung davon, zur Sandbank hin.",
   "Dann ist der Jetski wieder verschwunden. Die Bucht ist still. Opa ist sehr wütend. „Hier sollten keine Jetskis fahren!“, schimpft er. „Die Tiere bekommen Angst.“ Nele hat sich die Nummer auf dem Jetski gemerkt: K 47. Sie schreibt sie sofort in ihr Ferienheft.",
   "Den ganzen Nachmittag suchen sie nach Perla und Kiesel. Sie sehen nur Perla. Sie schwimmt unruhig hin und her und pfeift immer wieder laut. „Sie ruft nach ihrem Baby“, sagt Opa leise. Nele kann in der Nacht kaum schlafen.",
   "Am nächsten Morgen ist Ebbe. Das Meer hat sich weit zurückgezogen. Wo gestern noch Wasser war, liegt jetzt nasser Sand mit kleinen Pfützen. Nele und Opa laufen am Strand entlang. Sie suchen nach Muscheln – und nach Kiesel.",
   "Da sieht Nele etwas Graues zwischen den Sandbänken. Sie rennt los. In einer kleinen Pfütze, kaum größer als eine Badewanne, liegt Kiesel. Das Wasser reicht ihm nur bis zum Bauch. Und die Sonne brennt schon heiß vom Himmel."
  ], fragen:[
   {t:"mc", q:"Wohin schwimmt Kiesel vor Schreck?", a:["Zur Sandbank","Zu Opas Boot","Ins offene Meer","Zu den Felsen"], b:"zur Sandbank hin"},
   {t:"wort", q:"Welche Nummer hat der Jetski?", pre:"Nummer:", l:["K 47","K47"], b:"Nele hat sich die Nummer auf dem Jetski gemerkt: K 47."},
   {t:"mc", q:"Woran merkt man, dass Perla ihr Baby sucht?", a:["Sie schwimmt unruhig hin und her und pfeift laut.","Sie springt ins Boot.","Sie schwimmt ganz weit weg.","Sie schläft am Strand."], b:"Sie schwimmt unruhig hin und her und pfeift immer wieder laut."},
   {t:"mc", q:"Was bedeutet Ebbe?", a:["Das Meer hat sich weit zurückgezogen.","Es gibt einen Sturm.","Das Wasser ist besonders warm.","Die Fische schlafen."], b:"Das Meer hat sich weit zurückgezogen."}
  ]},
  {text:[
   "„Opa! Hier ist Kiesel!“, ruft Nele. Opa kommt angelaufen und kniet sich neben die Pfütze. Kiesel atmet schnell. „Er ist bei der Flucht zu nah an die Sandbank geschwommen“, sagt Opa. „Dann kam die Ebbe, und er war gefangen.“",
   "Nele will Kiesel sofort an den Flossen ins Meer ziehen. Aber Opa hält sie zurück. „Nicht! Seine Flossen sind empfindlich. Sie können dabei verletzt werden. Wir brauchen Hilfe von Fachleuten.“ Er ruft die Meeresschutzstation an. Dort arbeitet Frau Doktor Hansen. „Wir kommen“, sagt sie. „Aber wir brauchen eine Stunde. Haltet seine Haut nass, aber lasst das Atemloch auf dem Kopf frei!“",
   "Nele rennt zum Boot und holt den Eimer. Sie schöpft Meerwasser und gießt es vorsichtig über Kiesels Rücken. Opa legt ein nasses Handtuch über ihn, damit die Sonne seine Haut nicht verbrennt. Das Atemloch lässt er frei.",
   "Eimer um Eimer schleppt Nele heran. Ihre Arme werden schwer. Aber sie hört nicht auf. „Du schaffst das, Kiesel“, flüstert sie. Kiesel schaut sie mit seinen dunklen Augen an.",
   "Doch nach einer halben Stunde merkt Nele etwas Schlimmes. Das Wasser in der Pfütze versickert im Sand. Es wird immer weniger. Kiesel atmet jetzt noch schneller. Und draußen im Meer schwimmt Perla hin und her und pfeift verzweifelt."
  ], fragen:[
   {t:"mc", q:"Warum soll Nele Kiesel nicht an den Flossen ziehen?", a:["Die Flossen sind empfindlich und können verletzt werden.","Kiesel könnte beißen.","Kiesel ist viel zu schwer.","Opa will ihn behalten."], b:"Seine Flossen sind empfindlich."},
   {t:"mc", q:"Was sagt Frau Doktor Hansen am Telefon?", a:["Haltet seine Haut nass, aber lasst das Atemloch frei.","Zieht ihn schnell ins Meer.","Gebt ihm Fische zu essen.","Lasst ihn in der Sonne trocknen."], b:"Haltet seine Haut nass, aber lasst das Atemloch auf dem Kopf frei!"},
   {t:"wort", q:"Womit schöpft Nele das Meerwasser?", pre:"Mit dem", l:["Eimer"], b:"Nele rennt zum Boot und holt den Eimer."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Kiesel springt kleine Bögen aus dem Wasser.","Ein Jetski rast in die Bucht.","Nele findet Kiesel in einer Pfütze.","Nele gießt Wasser über Kiesels Rücken."]}
  ]},
  {text:[
   "„Wir graben die Pfütze tiefer!“, sagt Nele. Mit ihren Händen und dem Eimer schaufelt sie den Sand neben Kiesel weg. Opa hilft mit. Bald sammelt sich in der Grube wieder mehr Wasser. Es reicht Kiesel jetzt bis zu den Seiten.",
   "Endlich hört Nele ein Motorengeräusch. Ein Geländewagen der Meeresschutzstation holpert über den Strand. Frau Doktor Hansen und zwei Helfer springen heraus. Sie haben eine große, weiche Trage dabei. Vorsichtig schieben sie die Trage unter Kiesel. Dann tragen sie ihn zu viert ins tiefere Wasser.",
   "Kiesel liegt kurz still. Dann schlägt er mit der Schwanzflosse und schwimmt los. Aus dem Meer kommt ein lauter Pfiff. Perla! Sie schießt auf ihr Baby zu und schwimmt ganz dicht neben ihm. Nele hüpft vor Freude und spritzt alle nass.",
   "„Ohne euch hätte er es nicht geschafft“, sagt Frau Doktor Hansen. „Das nasse Handtuch und die tiefe Grube waren genau richtig.“ Nele zeigt ihr die Nummer aus dem Ferienheft. Frau Doktor Hansen gibt sie an die Wasserschutzpolizei weiter. Der Jetski-Fahrer muss eine hohe Strafe bezahlen.",

   {t:"mc", q:"Was passiert mit dem Jetski-Fahrer?", a:["Er muss eine hohe Strafe bezahlen.","Er bekommt einen Preis.","Er muss Kiesel füttern.","Gar nichts."], b:"Der Jetski-Fahrer muss eine hohe Strafe bezahlen."},
