{
 id:"polizei2", titel:"Kommissarin Demir und der falsche Polizist", emoji:"📞", thema:"Polizei · Luis & Aylin 2", farbe:"#2456A6",
 abzeichen:"Sicherheits-Profi", abzeichenEmoji:"🛡️",
 teile:[
  {text:[
   "Kommissarin Demir besucht heute die Klasse von Luis und Aylin. Sie erzählt von ihrer Arbeit. Am Ende sagt sie etwas sehr Wichtiges: „Es gibt Betrüger, die am Telefon so tun, als wären sie von der Polizei. Sie wollen vor allem älteren Menschen Geld und Schmuck abnehmen. Aber merkt euch: Echte Polizisten fragen am Telefon niemals nach Geld oder Schmuck!“",
   "Am Nachmittag besucht Aylin ihre Oma Leyla. Oma wohnt allein in einer Wohnung im zweiten Stock. Es gibt Tee und frische Pfannkuchen. Aylin erzählt gerade von der Kommissarin, da klingelt das Telefon.",
   "Oma nimmt ab. Aylin hört nur, was Oma sagt. „Ja … Polizei? Oh nein … Einbrecher hier in der Straße? … Ja, ich habe Schmuck und etwas Geld im Schrank …“ Omas Gesicht wird immer blasser.",
   "Dann legt Oma auf. „Das war ein Kommissar Wolf“, sagt sie aufgeregt. „Er sagt, in unserer Straße sind Einbrecher unterwegs. Ein Polizist kommt gleich vorbei. Ich soll ihm meinen Schmuck und mein Geld geben. Er bringt alles in Sicherheit.“",
   "Aylin bekommt ein ganz komisches Gefühl im Bauch. Sie denkt an die Worte von Kommissarin Demir. „Oma, warte!“, sagt sie. Doch in diesem Moment klingelt es schon an der Wohnungstür. Draußen steht ein Mann im Anzug. „Guten Tag“, sagt er durch die Tür. „Ich komme von der Polizei.“"
  ], fragen:[
   {t:"mc", q:"Was sollen sich die Kinder merken?", a:["Echte Polizisten fragen am Telefon niemals nach Geld oder Schmuck.","Man soll der Polizei immer die Tür aufmachen.","Polizisten tragen immer einen Anzug.","Betrüger rufen nur nachts an."], b:"Echte Polizisten fragen am Telefon niemals nach Geld oder Schmuck!"},
   {t:"mc", q:"Wo wohnt Oma Leyla?", a:["Allein in einer Wohnung im zweiten Stock","In einem Haus am Meer","Bei Aylins Familie","Im Altenheim"], b:"Oma wohnt allein in einer Wohnung im zweiten Stock."},
   {t:"wort", q:"Wie nennt sich der Anrufer?", pre:"Kommissar", l:["Wolf"], b:"Das war ein Kommissar Wolf"},
   {t:"mc", q:"Was soll Oma mit ihrem Schmuck und Geld machen – sagt der Anrufer?", a:["Sie soll alles einem Polizisten geben.","Sie soll alles zur Bank bringen.","Sie soll alles im Garten vergraben.","Sie soll alles Aylin geben."], b:"Ich soll ihm meinen Schmuck und mein Geld geben."}
  ]},
  {text:[
   "„Oma, mach nicht auf!“, flüstert Aylin. „Kommissarin Demir hat heute gesagt: Echte Polizisten verlangen nie Geld oder Schmuck. Das ist bestimmt ein Betrüger!“ Oma schaut sie unsicher an. Dann nickt sie langsam.",
   "Oma legt die Kette vor und öffnet die Tür nur einen kleinen Spalt. „Zeigen Sie mir bitte Ihren Ausweis“, sagt sie. Der Mann hält eine Karte hoch. Darauf steht in großen Buchstaben: POLIZIE. Aylin stößt Oma leicht an. „Das ist falsch geschrieben!“, flüstert sie.",
   "„Einen Moment, ich muss erst meine Brille holen“, sagt Oma zu dem Mann. Dann schließt sie die Tür und dreht den Schlüssel zweimal um. Aylin nimmt das Telefon und wählt 110. „Polizei-Notruf, wie kann ich helfen?“, fragt eine ruhige Stimme. Aylin erklärt alles.",
   "„Das hast du sehr gut gemacht“, sagt die Frau am Telefon. „Macht auf keinen Fall die Tür auf. Wir schicken sofort einen Streifenwagen.“",
   "Vor der Tür wird der Mann ungeduldig. Er klingelt Sturm. Dann hört Aylin, wie er mit jemandem telefoniert. „Die Frau macht nicht auf. Irgendwas stimmt nicht. Ich verschwinde.“ Schnelle Schritte poltern die Treppe hinunter. Der Betrüger haut ab!"
  ], fragen:[
   {t:"mc", q:"Warum glaubt Aylin, dass der Mann ein Betrüger ist?", a:["Echte Polizisten verlangen nie Geld oder Schmuck.","Er hat keine Uniform an.","Er ist viel zu jung.","Er klingelt zu leise."], b:"Echte Polizisten verlangen nie Geld oder Schmuck."},
   {t:"mc", q:"Was ist an dem Ausweis falsch?", a:["Das Wort Polizei ist falsch geschrieben.","Es ist kein Foto darauf.","Die Karte ist rosa.","Der Ausweis ist zerrissen."], b:"Das ist falsch geschrieben!"},
   {t:"wort", q:"Welche Nummer wählt Aylin?", pre:"Sie wählt", l:["110"], b:"Aylin nimmt das Telefon und wählt 110."},
   {t:"mc", q:"Was sagt die Frau vom Notruf?", a:["Macht auf keinen Fall die Tür auf.","Lauft dem Mann hinterher.","Gebt ihm ruhig das Geld.","Ruft morgen noch einmal an."], b:"Macht auf keinen Fall die Tür auf."}
  ]},
  {text:[
   "Aylin rennt zum Fenster. Unten auf der Straße steigt der Mann in ein kleines rotes Auto. Auf der Heckscheibe klebt ein Aufkleber mit einer Palme. Aylin sieht sich alles genau an. „Rotes Auto, Palmen-Aufkleber“, murmelt sie und schreibt es auf einen Zettel.",
   "Das Auto fährt mit quietschenden Reifen davon. Es biegt um die Ecke in die Lindenstraße. Aylin erzählt der Frau am Notruf sofort davon. „Prima“, sagt die Frau. „Das gebe ich an die Kollegen weiter.“",
   "Dann ruft Aylin Luis an. Er wohnt in der Lindenstraße. „Luis, schau mal aus dem Fenster! Siehst du ein rotes Auto mit einem Palmen-Aufkleber?“ Luis rennt zum Fenster. „Ja! Es parkt vor dem Kiosk. Ein Mann im Anzug geht gerade hinein.“",
   "„Bleib drin und beobachte nur!“, sagt Aylin. Sie gibt die Nachricht an die Polizei weiter. Oma setzt sich auf das Sofa und trinkt einen Schluck Tee. Ihre Hände zittern noch. „Ich hätte ihm fast alles gegeben“, flüstert sie.",
   "Nach zehn Minuten wird es draußen ganz still. Aylin wartet. Was ist mit dem Betrüger? Haben sie ihn erwischt? Da klingelt es wieder an der Wohnungstür. Lang und laut. Aylin und Oma erstarren. Ist er etwa zurückgekommen?"
  ], fragen:[
   {t:"mc", q:"Woran kann man das Auto des Betrügers erkennen?", a:["Es ist rot und hat einen Palmen-Aufkleber.","Es ist blau und sehr groß.","Es hat ein Blaulicht auf dem Dach.","Es ist ein Lastwagen."], b:"Auf der Heckscheibe klebt ein Aufkleber mit einer Palme."},
   {t:"wort", q:"In welche Straße biegt das Auto ein?", pre:"In die", l:["Lindenstraße"], b:"Es biegt um die Ecke in die Lindenstraße."},
   {t:"mc", q:"Was sagt Aylin zu Luis?", a:["Bleib drin und beobachte nur!","Lauf schnell zum Kiosk!","Halte das Auto auf!","Komm sofort zu Oma!"], b:"Bleib drin und beobachte nur!"},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Kommissarin Demir besucht die Klasse.","Oma Leyla bekommt einen Anruf.","Aylin wählt den Notruf.","Luis sieht das rote Auto vor dem Kiosk."]}
  ]},
  {text:[
   "Oma geht leise zur Tür und schaut durch den Türspion. Dann atmet sie auf. „Es ist eine Frau in Uniform“, sagt sie. Trotzdem lässt sie die Kette vor der Tür. „Bitte zeigen Sie mir Ihren Ausweis.“",
   "„Sehr gut, genau so macht man das“, sagt eine bekannte Stimme. Es ist Kommissarin Demir! Sie hält ihren Dienstausweis an den Türspalt. Darauf sind ihr Foto, ihr Name und ein Polizeistern. Und Polizei ist richtig geschrieben.",
   "Kommissarin Demir erzählt, was passiert ist. Die Polizisten haben den Mann vor dem Kiosk festgenommen. In seinem Auto lagen falsche Ausweise und eine Liste mit Telefonnummern. „Er hat heute schon fünf ältere Leute angerufen“, sagt die Kommissarin. „Dank euch kann er niemanden mehr betrügen.“",
   "Dann lobt sie Aylin. „Du hast alles richtig gemacht: Ihr habt die Tür nicht aufgemacht, ihr habt nach dem Ausweis gefragt und selbst die 110 angerufen. Und du hast dir das Auto genau gemerkt.“ Auch Luis bekommt ein Lob, weil er nur aus dem Fenster beobachtet hat.",
   "Am nächsten Tag backt Oma Leyla eine riesige Portion Baklava für die ganze Klasse. Aylin und Luis malen ein Plakat für den Hausflur. Darauf steht in großen Buchstaben: Echte Polizisten wollen nie Ihr Geld! Im Zweifel: Auflegen und selbst 110 wählen!"
  ], fragen:[
   {t:"mc", q:"Warum lässt Oma die Kette vor der Tür, obwohl draußen eine Frau in Uniform steht?", a:["Sie will zuerst den Ausweis sehen.","Die Kette klemmt.","Sie hat Angst vor Uniformen.","Sie will nicht gestört werden."], b:"Bitte zeigen Sie mir Ihren Ausweis."},
   {t:"mc", q:"Was ist auf dem echten Dienstausweis zu sehen?", a:["Ihr Foto, ihr Name und ein Polizeistern","Nur ein Polizeiauto","Ein Aufkleber mit einer Palme","Das Wort POLIZIE"], b:"Darauf sind ihr Foto, ihr Name und ein Polizeistern."},
   {t:"wort", q:"Wie viele Leute hat der Betrüger heute schon angerufen?", pre:"Schon", post:"Leute.", l:["fünf","5"], b:"Er hat heute schon fünf ältere Leute angerufen"},
   {t:"mc", q:"Was steht auf dem Plakat der Kinder?", a:["Echte Polizisten wollen nie Ihr Geld!","Immer die Tür aufmachen!","Bester Kiosk der Stadt","Vorsicht, bissiger Hund!"], b:"Echte Polizisten wollen nie Ihr Geld!"}
  ]}
 ]
},
{
 id:"feuer2", titel:"Paul und der Rauchmelder", emoji:"🚨", thema:"Feuerwehr · Paul 2", farbe:"#C0392B",
 abzeichen:"Brandschutz-Urkunde", abzeichenEmoji:"📜",
 teile:[
  {text:[
   "Paul wohnt mit seinen Eltern in einem großen Mietshaus im dritten Stock. Neben ihnen wohnt Herr Schulze. Er ist schon über achtzig Jahre alt und hört sehr schlecht. Wenn Paul ihn im Treppenhaus trifft, muss er ganz laut sprechen. Herr Schulze schenkt ihm dann oft ein Bonbon.",
   "In der Schule gibt es diese Woche eine Projektwoche zum Thema Feuer. Paul erzählt der Klasse, was er von Tante Mia bei der Feuerwehr gelernt hat. Er malt ein großes Plakat. Darauf stehen die W-Fragen für einen Notruf: Wo ist es passiert? Was ist passiert? Wie viele Menschen sind betroffen? Und dann: Warten auf Rückfragen!",
   "„Und das Wichtigste“, sagt Paul zur Klasse, „wenn es brennt und im Treppenhaus Rauch ist, darf man nicht hinausgehen. Der Rauch ist giftig. Man bleibt in der Wohnung, macht die Tür zu und ruft 112.“ Seine Lehrerin nickt anerkennend.",
   "In der Nacht von Donnerstag auf Freitag wacht Paul plötzlich auf. Er weiß nicht, warum. Es ist dunkel und still. Dann riecht er es. Ein beißender, rauchiger Geruch. Er klettert aus dem Bett und öffnet seine Zimmertür.",
   "Im Flur riecht es noch stärker. Und dann hört er etwas: ein schrilles, lautes Piepen. Es kommt nicht aus ihrer Wohnung. Es kommt von nebenan. Aus der Wohnung von Herrn Schulze. Und Herr Schulze hört doch so schlecht …"
  ], fragen:[
   {t:"mc", q:"Was weißt du über Herrn Schulze?", a:["Er ist über achtzig und hört sehr schlecht.","Er ist Feuerwehrmann.","Er hat einen großen Hund.","Er wohnt im Keller."], b:"Er ist schon über achtzig Jahre alt und hört sehr schlecht."},
   {t:"mc", q:"Was malt Paul auf sein Plakat?", a:["Die W-Fragen für einen Notruf","Ein Feuerwehrauto","Seine Tante Mia","Einen Plan von seinem Haus"], b:"Darauf stehen die W-Fragen für einen Notruf"},
   {t:"mc", q:"Was soll man tun, wenn im Treppenhaus Rauch ist?", a:["In der Wohnung bleiben, Tür zu und 112 rufen","Schnell die Treppe hinunterrennen","Mit dem Aufzug fahren","Im Treppenhaus ein Fenster öffnen"], b:"Man bleibt in der Wohnung, macht die Tür zu und ruft 112."},
   {t:"wort", q:"Aus wessen Wohnung kommt das Piepen?", pre:"Von Herrn", l:["Schulze"], b:"Aus der Wohnung von Herrn Schulze."}
  ]},
  {text:[
   "„Mama! Papa! Wacht auf! Es brennt!“ Paul rennt ins Schlafzimmer und schaltet das Licht an. Papa springt sofort aus dem Bett. Er läuft zur Wohnungstür und schaut durch den Türspion. Das Treppenhaus ist voller grauer Rauch.",
   "„Wir bleiben drin“, sagt Papa ruhig. Er erinnert sich an das, was Paul erzählt hat. Mama holt nasse Handtücher aus dem Bad. Sie legen sie unten vor die Wohnungstür, damit kein Rauch hereinkommt.",
   "Papa wählt 112. Paul steht neben ihm und flüstert die W-Fragen. „Wo?“, flüstert er. „Goethestraße 8, dritter Stock“, sagt Papa ins Telefon. „Was?“ – „Es brennt in der Nachbarwohnung. Das Treppenhaus ist voller Rauch.“ – „Wie viele?“ – „Wir sind drei Personen. Und nebenan wohnt ein alter Mann, der sehr schlecht hört.“",
   "„Bleiben Sie in der Wohnung und gehen Sie ans Fenster“, sagt der Mann am Telefon. „Die Feuerwehr ist unterwegs.“ Papa legt nicht sofort auf. Er wartet auf Rückfragen, genau wie auf Pauls Plakat.",
   "Sie laufen alle ins Wohnzimmer und öffnen das Fenster. Frische, kalte Nachtluft strömt herein. Paul lehnt sich vorsichtig hinaus und schaut zur Seite. Und da sieht er es. Im Küchenfenster von Herrn Schulze flackert ein orangefarbenes Licht. Flammen!"
  ], fragen:[
   {t:"mc", q:"Was sieht Papa durch den Türspion?", a:["Das Treppenhaus ist voller grauer Rauch.","Herr Schulze steht vor der Tür.","Die Feuerwehr ist schon da.","Alles ist ruhig und dunkel."], b:"Das Treppenhaus ist voller grauer Rauch."},
   {t:"mc", q:"Wozu legt Mama nasse Handtücher vor die Tür?", a:["Damit kein Rauch hereinkommt","Damit der Boden sauber bleibt","Damit die Tür nicht klemmt","Damit man das Piepen nicht hört"], b:"damit kein Rauch hereinkommt"},
   {t:"wort", q:"Welche Hausnummer hat das Haus in der Goethestraße?", pre:"Goethestraße", l:["8","acht"], b:"Goethestraße 8, dritter Stock"},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Paul malt ein Plakat mit den W-Fragen.","Paul riecht in der Nacht Rauch.","Papa ruft die 112 an.","Paul sieht Flammen im Küchenfenster."]}
  ]},
  {text:[
   "Wenige Minuten später hört Paul die Martinshörner. Zwei Löschfahrzeuge und eine Drehleiter halten vor dem Haus. Blaulicht zuckt über die Hauswände. Feuerwehrleute mit Atemschutzmasken springen heraus. Einer von ihnen hat einen roten Streifen auf dem Helm. „Tante Mia!“, ruft Paul.",
   "Paul winkt mit beiden Armen aus dem Fenster. „Hier oben! Nebenan wohnt Herr Schulze! Er hört ganz schlecht!“ Tante Mia hebt den Daumen. Sie hat verstanden.",
   "Ein Trupp läuft ins Treppenhaus. Sie haben eine Ramme dabei, um die Tür von Herrn Schulze aufzubrechen. Paul hört ein lautes Krachen. Dann zischt Wasser. Gleichzeitig fährt die Drehleiter langsam zu Pauls Fenster hoch.",
   "Der Feuerwehrmann hilft Mama, dann Paul und zuletzt Papa in den Korb der Drehleiter. Sanft schwebt der Korb nach unten. Unten bekommen sie warme Decken. Pauls Beine zittern, aber er schaut immer wieder nach oben zum Küchenfenster. Das Feuer dort ist schon fast gelöscht.",
   "Dann kommt Tante Mia aus dem Haus. Sie nimmt die Maske ab. Ihr Gesicht ist voller Ruß und sehr ernst. „Die Küche ist gelöscht“, sagt sie zum Einsatzleiter. „Aber Herr Schulze ist nicht in der Wohnung. Wir haben jedes Zimmer abgesucht. Er ist verschwunden!“"
  ], fragen:[
   {t:"mc", q:"Woran erkennt Paul Tante Mia?", a:["An dem roten Streifen auf ihrem Helm","An ihrer Stimme","An ihrem weißen Helm","An ihrer gelben Jacke"], b:"Einer von ihnen hat einen roten Streifen auf dem Helm."},
   {t:"mc", q:"Wozu haben die Feuerwehrleute eine Ramme dabei?", a:["Um die Tür von Herrn Schulze aufzubrechen","Um das Fenster zu putzen","Um die Drehleiter festzumachen","Um Wasser zu pumpen"], b:"Sie haben eine Ramme dabei, um die Tür von Herrn Schulze aufzubrechen."},
   {t:"mc", q:"Wie kommt Pauls Familie aus dem Haus?", a:["Im Korb der Drehleiter","Durch das Treppenhaus","Mit dem Aufzug","Über das Dach"], b:"in den Korb der Drehleiter"},
   {t:"wort", q:"Was bekommen sie unten?", pre:"Warme", l:["Decken","Decke"], b:"Unten bekommen sie warme Decken."}
  ]},
  {text:[
   "Paul überlegt fieberhaft. Wo kann Herr Schulze sein? Dann fällt es ihm ein. Im Sommer hat Herr Schulze ihm seinen kleinen Wintergarten gezeigt. Er ist auf der Rückseite des Hauses, hinter dem Schlafzimmer. Die Tür dorthin ist mit Tapete beklebt und sieht aus wie eine Wand. Dort steht ein Sessel, in dem Herr Schulze abends gern Radio hört. „Manchmal schlafe ich dort einfach ein“, hatte er gesagt.",
   "„Tante Mia!“, ruft Paul. „Der Wintergarten! Hinter dem Schlafzimmer! Die Tür sieht aus wie eine Wand!“ Tante Mia zögert keine Sekunde. Sie setzt die Maske wieder auf und läuft mit einem Kollegen zurück ins Haus.",
   "Gleichzeitig fährt die Drehleiter zur Rückseite des Hauses. Paul hält den Atem an. Dann hört er über Funk Tante Mias Stimme: „Person gefunden! Er schläft im Sessel. Er hat von allem nichts gemerkt!“ Über die Drehleiter bringen sie Herrn Schulze nach unten. Er trägt noch seinen Schlafanzug und schaut sehr verwirrt.",
   "Ein Sanitäter untersucht ihn. Zum Glück hat er kaum Rauch eingeatmet, weil die Tür zum Wintergarten zu war. Herr Schulze erzählt, dass er abends noch Suppe warm machen wollte. Dann hat er den Topf auf dem Herd vergessen und ist beim Radiohören eingeschlafen.",
   "Eine Woche später bekommt Herr Schulze einen besonderen Rauchmelder. Wenn es brennt, blinkt er hell und lässt ein Kissen unter seinem Kopf vibrieren. So wacht er auch auf, obwohl er schlecht hört. Und Paul? Der bekommt von Herrn Schulze eine riesige Tüte Bonbons. Und von Tante Mia eine Urkunde: Für schnelles Denken und richtiges Handeln."
  ], fragen:[
   {t:"mc", q:"Warum haben die Feuerwehrleute Herrn Schulze nicht gefunden?", a:["Die Tür zum Wintergarten sieht aus wie eine Wand.","Er hat sich absichtlich versteckt.","Er war beim Einkaufen.","Er ist aus dem Fenster geklettert."], b:"Die Tür dorthin ist mit Tapete beklebt und sieht aus wie eine Wand."},
   {t:"mc", q:"Warum hat Herr Schulze kaum Rauch eingeatmet?", a:["Weil die Tür zum Wintergarten zu war","Weil er eine Maske trug","Weil das Fenster offen war","Weil er unter der Bettdecke lag"], b:"weil die Tür zum Wintergarten zu war"},
   {t:"mc", q:"Wie ist das Feuer entstanden?", a:["Herr Schulze hat einen Topf auf dem Herd vergessen.","Eine Kerze ist umgefallen.","Ein Blitz hat eingeschlagen.","Der Fernseher war kaputt."], b:"Dann hat er den Topf auf dem Herd vergessen"},
   {t:"mc", q:"Wie funktioniert Herrn Schulzes neuer Rauchmelder?", a:["Er blinkt hell und lässt ein Kissen vibrieren.","Er ruft automatisch Paul an.","Er spielt laute Musik.","Er löscht das Feuer selbst."], b:"Wenn es brennt, blinkt er hell und lässt ein Kissen unter seinem Kopf vibrieren."}
  ]}
 ]
},
{
 id:"uhrturm", titel:"Die Spürnasen: Spuk im Uhrturm", emoji:"🕰️", thema:"Detektive · 3. Fall", farbe:"#6C4AB6",
 abzeichen:"Geisterjäger-Abzeichen", abzeichenEmoji:"👻",
 teile:[
  {text:[
   "In der Mitte des Marktplatzes steht ein alter Turm mit einer großen Uhr. Zu jeder vollen Stunde schlägt eine Glocke. Um zwölf Uhr mittags schlägt sie zwölfmal, um drei Uhr dreimal. So ist es seit über hundert Jahren.",
   "Doch seit einer Woche passiert etwas Seltsames. Jede Nacht um Mitternacht schlägt die Glocke nicht zwölfmal, sondern dreizehnmal! In der Zeitung steht schon eine Überschrift: Spukt es im Uhrturm?",
   "„Gespenster gibt es nicht“, sagt Ben in der Zentrale. „Es gibt immer eine Erklärung.“ Mira nickt. „Und Frau Kessler hat mir erzählt, dass nachts jemand das Katzenfutter von ihrer Terrasse klaut. Sie wohnt direkt neben dem Turm.“ Tim notiert beides im Notizbuch.",
   "Am Freitag dürfen die drei bei Tim übernachten. Aus seinem Zimmerfenster kann man genau auf den Uhrturm schauen. Sie bleiben bis kurz vor Mitternacht wach. Ben hat ein Fernglas dabei.",
   "Es ist eine Minute vor zwölf. Alle starren auf das große Zifferblatt. Da stößt Mira einen leisen Schrei aus. „Da oben! Neben der Zahl Zwölf!“ Ben reißt das Fernglas hoch. Hinter dem Zifferblatt leuchten zwei kleine Augen in der Dunkelheit. Und dann beginnt die Glocke zu schlagen: eins, zwei, drei …"
  ], fragen:[
   {t:"mc", q:"Wie oft schlägt die Glocke seit einer Woche um Mitternacht?", a:["Dreizehnmal","Zwölfmal","Gar nicht","Nur einmal"], b:"sondern dreizehnmal!"},
   {t:"mc", q:"Was sagt Ben über Gespenster?", a:["Es gibt sie nicht – es gibt immer eine Erklärung.","Er hat schon eins gesehen.","Sie wohnen in alten Türmen.","Man muss sie mit Katzenfutter füttern."], b:"Es gibt immer eine Erklärung."},
   {t:"mc", q:"Was hat Frau Kessler erzählt?", a:["Nachts klaut jemand das Katzenfutter von ihrer Terrasse.","Sie hat ein Gespenst gesehen.","Ihre Katze ist verschwunden.","Die Uhr geht falsch."], b:"dass nachts jemand das Katzenfutter von ihrer Terrasse klaut"},
   {t:"wort", q:"Was hat Ben bei der Übernachtung dabei?", pre:"Ein", l:["Fernglas"], b:"Ben hat ein Fernglas dabei."}
  ]},
  {text:[
   "Am nächsten Morgen klingeln die Spürnasen bei Herrn Kowalski. Er ist Uhrmacher und kümmert sich seit vielen Jahren um die Turmuhr. „Dreizehn Schläge?“, brummt er. „Das kann ich mir nicht erklären. Das Uhrwerk ist in Ordnung.“",
   "„Dürfen wir mit Ihnen in den Turm?“, fragt Tim. Herr Kowalski überlegt. Dann holt er einen großen eisernen Schlüssel. „Aber ihr bleibt immer bei mir. Die Treppe ist alt und steil.“",
   "Die Wendeltreppe hat 112 Stufen. Es ist staubig und riecht muffig. Auf halber Höhe bleibt Mira stehen. „Seht mal!“ Im Staub auf den Stufen sind kleine Abdrücke. Sie sehen aus wie winzige Hände mit fünf langen Fingern.",
   "Ein Stück weiter findet Ben eine zerrissene Packung. „Katzenfutter!“, ruft er. „Das ist bestimmt die Packung von Frau Kessler.“ Tim macht ein Foto und schreibt: Spuren wie kleine Hände. Katzenfutter. Wer klettert hier hoch?",
   "Endlich sind sie oben. Vor ihnen ist eine Holztür zum Raum mit dem Uhrwerk. Sie steht einen Spalt offen. Von drinnen hört man das laute Ticken der großen Zahnräder. Und dann noch etwas anderes: ein Kratzen. Und ein leises Fauchen in der Dunkelheit."
  ], fragen:[
   {t:"mc", q:"Wer ist Herr Kowalski?", a:["Ein Uhrmacher, der sich um die Turmuhr kümmert","Der Bürgermeister","Tims Opa","Ein Polizist"], b:"Er ist Uhrmacher und kümmert sich seit vielen Jahren um die Turmuhr."},
   {t:"wort", q:"Wie viele Stufen hat die Wendeltreppe?", pre:"Sie hat", post:"Stufen.", l:["112","hundertzwölf"], b:"Die Wendeltreppe hat 112 Stufen."},
   {t:"mc", q:"Wie sehen die Abdrücke im Staub aus?", a:["Wie winzige Hände mit fünf langen Fingern","Wie große Stiefel","Wie Vogelfüße","Wie Katzenpfoten"], b:"Sie sehen aus wie winzige Hände mit fünf langen Fingern."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Die Glocke schlägt um Mitternacht dreizehnmal.","Die Spürnasen sehen zwei leuchtende Augen am Turm.","Mira entdeckt die Abdrücke im Staub.","Ben findet die Packung Katzenfutter."]}
  ]},
  {text:[
   "Herr Kowalski knipst das Licht an. Der Raum ist voller Zahnräder, Stangen und Drähte. In der Mitte hängt ein langer Draht, der hinauf zum Glockenhammer führt. Aber niemand ist zu sehen. Das Kratzen hat aufgehört.",
   "Mira leuchtet hinter das große Zahnrad. „Hier ist etwas!“ In einer Ecke liegt ein weiches Nest aus alten Zeitungen, Stroh und Wolle. Es ist leer, aber noch warm. „Hier wohnt jemand“, flüstert Ben.",
   "Herr Kowalski untersucht den Draht. „Seht ihr das? Der Draht ist ganz zerkratzt. Wenn jemand daran zieht, schlägt der Hammer gegen die Glocke. Dann gibt es einen Schlag zu viel.“ Tim schreibt schnell mit: Jemand zieht am Draht. Aber wer?",
   "Ben hat eine Idee. „Mein Papa hat eine Wildkamera. Damit fotografiert er Vögel im Garten. Die Kamera macht von allein ein Foto, sobald sich etwas bewegt.“ Herr Kowalski ist einverstanden. Am Nachmittag hängen sie die Kamera gegenüber vom Nest auf.",
   "Am Sonntagmorgen holen sie die Kamera wieder ab. Mit klopfendem Herzen schauen sie sich die Bilder an. Die ersten Fotos sind fast schwarz. Auf einem sieht man nur einen Schwanz mit Ringeln. Dann kommt das letzte Bild. Und darauf ist ein Gesicht mit einer schwarzen Maske – ganz nah vor der Kamera!"
  ], fragen:[
   {t:"mc", q:"Was finden die Kinder hinter dem Zahnrad?", a:["Ein warmes Nest aus Zeitungen, Stroh und Wolle","Eine Kiste mit Gold","Ein altes Gespenstertuch","Eine Taschenlampe"], b:"In einer Ecke liegt ein weiches Nest aus alten Zeitungen, Stroh und Wolle."},
   {t:"mc", q:"Wie entsteht der dreizehnte Glockenschlag?", a:["Jemand zieht am Draht zum Glockenhammer.","Das Uhrwerk ist kaputt.","Der Wind bewegt die Glocke.","Herr Kowalski macht einen Scherz."], b:"Wenn jemand daran zieht, schlägt der Hammer gegen die Glocke."},
   {t:"mc", q:"Was macht die Wildkamera?", a:["Sie macht von allein ein Foto, wenn sich etwas bewegt.","Sie filmt die ganze Nacht mit Ton.","Sie macht laute Geräusche.","Sie leuchtet hell auf."], b:"Die Kamera macht von allein ein Foto, sobald sich etwas bewegt."},
   {t:"wort", q:"Was sieht man auf dem letzten Foto?", pre:"Ein Gesicht mit einer schwarzen", l:["Maske"], b:"ein Gesicht mit einer schwarzen Maske"}
  ]},
  {text:[
   "„Ein Waschbär!“, ruft Tim. „Ganz sicher. Waschbären haben eine schwarze Gesichtsmaske, einen Ringelschwanz und Pfoten, die wie kleine Hände aussehen.“ Ben schaut sich die anderen Fotos noch einmal an. Auf einem sieht man drei kleine Köpfe im Nest. „Und Babys hat sie auch!“",
   "Jetzt ist alles klar. Die Waschbär-Mama klettert jede Nacht den Turm hinauf und hinunter. Sie holt sich Katzenfutter bei Frau Kessler. Und kurz vor Mitternacht hält sie sich am Draht fest, um zum Nest zu klettern. Dabei zieht sie am Glockenhammer.",
   "Herr Kowalski lacht so laut, dass es im Turm hallt. „Ein Gespenst mit Ringelschwanz! Das muss ich der Zeitung erzählen.“ Dann wird er ernst. „Aber die Familie kann hier nicht bleiben. Die Zahnräder sind gefährlich für die Kleinen.“",
   "Sie rufen Frau Ortmann von der Wildtierhilfe an. Sie kommt am Nachmittag mit einer großen Transportbox. „Waschbären sind keine Haustiere“, erklärt sie. „Man darf sie nicht füttern. Auch Katzenfutter draußen lockt sie an.“ Behutsam setzt sie die Mama und die Babys in die Box. Später bringt sie die Familie in einen ruhigen Wald weit weg von der Stadt.",
   "Frau Kessler stellt das Katzenfutter jetzt immer ins Haus. Und Herr Kowalski baut einen Schutzkasten um den Draht. Seitdem schlägt die Glocke um Mitternacht wieder genau zwölfmal. In der Zeitung steht: Spürnasen lösen Rätsel im Uhrturm. Und Tim klebt den Artikel in das Notizbuch."
  ], fragen:[
   {t:"mc", q:"Woran erkennt Tim einen Waschbären?", a:["An der schwarzen Maske, dem Ringelschwanz und den Pfoten wie kleine Hände","An den langen Ohren","An den Flügeln","An dem roten Fell"], b:"Waschbären haben eine schwarze Gesichtsmaske, einen Ringelschwanz und Pfoten, die wie kleine Hände aussehen."},
   {t:"wort", q:"Wie viele Waschbär-Babys sind im Nest?", pre:"Es sind", post:"Babys.", l:["drei","3"], b:"Auf einem sieht man drei kleine Köpfe im Nest."},
   {t:"mc", q:"Warum zieht die Waschbär-Mama am Glockenhammer?", a:["Sie hält sich am Draht fest, um zum Nest zu klettern.","Sie spielt gern mit Glocken.","Sie will die Leute erschrecken.","Sie will Futter bestellen."], b:"hält sie sich am Draht fest, um zum Nest zu klettern"},
   {t:"mc", q:"Was erklärt Frau Ortmann?", a:["Man darf Waschbären nicht füttern.","Waschbären sind tolle Haustiere.","Waschbären fressen nur Gras.","Waschbären schlafen nie."], b:"Man darf sie nicht füttern."}
  ]}
 ]
},
{
 id:"botschaft", titel:"Die Spürnasen: Die geheime Botschaft", emoji:"✉️", thema:"Detektive · 4. Fall", farbe:"#6C4AB6",
 abzeichen:"Messing-Lupe", abzeichenEmoji:"🗝️",
 teile:[
  {text:[
   "An einem Montag liegt ein Briefumschlag auf der Treppe vom Bauwagen. Darauf steht in schöner, geschwungener Schrift: An die Spürnasen. Persönlich! Ben reißt ihn neugierig auf. Darin ist ein Zettel. Aber statt Wörtern stehen nur Zahlen darauf.",
   "16 – 1 – 18 – 11 – 2 – 1 – 14 – 11. „Was soll das denn heißen?“, fragt Ben. Mira grinst. „Das ist eine Geheimschrift! Ich glaube, jede Zahl ist ein Buchstabe. Die 1 ist das A, die 2 ist das B und so weiter.“",
   "Tim schreibt das ganze Alphabet in sein Notizbuch und nummeriert es durch. Dann übersetzen sie Zahl für Zahl. Die 16 ist ein P. Die 1 ist ein A. Die 18 ist ein R. Am Ende steht da ein Wort: PARKBANK.",
   "„Es gibt nur eine Parkbank, die so wichtig ist“, sagt Mira. „Die alte Bank am Ententeich im Stadtpark. Dort sitzen wir doch immer.“ Sie schnappen sich ihre Fahrräder und fahren los.",
   "Als sie um die letzte Kurve biegen, sehen sie die Bank am Teich. Ein Junge mit einer roten Mütze kniet davor. Er schiebt gerade etwas unter die Bank. Dann hört er die Fahrräder. Er springt auf, schaut kurz zu ihnen herüber und rennt in die Büsche davon."
  ], fragen:[
   {t:"mc", q:"Was steht auf dem Zettel im Umschlag?", a:["Nur Zahlen","Ein Foto","Eine Landkarte","Ein Gedicht"], b:"Aber statt Wörtern stehen nur Zahlen darauf."},
   {t:"mc", q:"Wie funktioniert die Geheimschrift?", a:["Jede Zahl ist ein Buchstabe: 1 ist A, 2 ist B.","Man muss den Zettel rückwärts lesen.","Man muss den Zettel ins Wasser legen.","Jede Zahl ist eine Hausnummer."], b:"Die 1 ist das A, die 2 ist das B und so weiter."},
   {t:"wort", q:"Welches Wort kommt bei der Geheimschrift heraus?", pre:"Das Wort heißt", l:["Parkbank"], b:"Am Ende steht da ein Wort: PARKBANK."},
   {t:"mc", q:"Was macht der Junge mit der roten Mütze?", a:["Er schiebt etwas unter die Bank und rennt weg.","Er füttert die Enten.","Er liest ein Buch.","Er winkt den Spürnasen zu."], b:"Er schiebt gerade etwas unter die Bank."}
  ]},
  {text:[
   "„Hinterher!“, ruft Ben. Aber der Junge ist schon zwischen den dichten Büschen verschwunden. Tim kniet sich vor die Bank. Darunter klebt eine kleine blaue Dose mit Klebeband. Er löst sie vorsichtig ab.",
   "In der Dose liegen ein alter, verschnörkelter Schlüssel und ein neuer Zettel. Diesmal ist es keine Zahlenschrift, sondern ein Rätsel: Ich habe viele Seiten, aber ich bin kein Haus. Ich erzähle Geschichten, doch ich habe keinen Mund. Wo viele von mir wohnen, geht es weiter.",
   "Die drei denken nach. „Viele Seiten …“, murmelt Ben. „Ein Würfel?“ Mira schüttelt den Kopf. „Ein Würfel erzählt keine Geschichten. Es ist ein Buch! Und wo viele Bücher wohnen, das ist …“ – „Die Bücherei!“, rufen alle drei gleichzeitig.",
   "Die Stadtbücherei ist nur zwei Straßen weiter. Frau Yilmaz, die Bibliothekarin, lächelt, als sie hereinkommen. „Ah, die Spürnasen“, sagt sie geheimnisvoll. „Ich habe schon auf euch gewartet. Schaut mal im Regal mit den Detektivbüchern nach.“",
   "Die Spürnasen rennen zum Regal. Doch dort steht schon jemand. Es ist wieder der Junge mit der roten Mütze! Er zieht ein dickes Buch aus dem Regal, klemmt es unter den Arm und läuft schnell zum Ausgang. „Halt!“, ruft Mira. Aber die Tür fällt schon hinter ihm zu."
  ], fragen:[
   {t:"mc", q:"Was ist in der blauen Dose?", a:["Ein alter Schlüssel und ein neuer Zettel","Ein Goldstück","Ein Handy","Bonbons"], b:"In der Dose liegen ein alter, verschnörkelter Schlüssel und ein neuer Zettel."},
   {t:"mc", q:"Was ist die Lösung des Rätsels?", a:["Ein Buch","Ein Würfel","Ein Haus","Ein Brief"], b:"Es ist ein Buch!"},
   {t:"wort", q:"Wie heißt die Bibliothekarin?", pre:"Frau", l:["Yilmaz"], b:"Frau Yilmaz, die Bibliothekarin"},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Die Spürnasen finden einen Umschlag am Bauwagen.","Sie übersetzen die Zahlen-Geheimschrift.","Tim findet die blaue Dose unter der Bank.","Die Spürnasen lösen das Bücher-Rätsel."]}
  ]},
  {text:[
   "„Er hat das Buch mitgenommen!“, sagt Ben enttäuscht. Doch Frau Yilmaz zwinkert. „Von diesem Buch haben wir zwei. Schaut noch einmal genau hin.“ Tim sucht das Regal ab. Ganz unten steht noch ein Buch mit dem Titel: Die besten Fälle der Kriminalpolizei.",
   "Als er es aufschlägt, fällt ein gefaltetes Papier heraus. Es ist eine Zeichnung von einem Garten. Man sieht ein großes Haus, einen Teich und ein kleines Gartenhaus. Neben dem Gartenhaus ist ein rotes X. Und darunter steht: Der Schlüssel passt.",
   "„Den Garten kenne ich!“, ruft Mira. „Das ist die Villa Lindner! Dort haben wir doch unseren ersten großen Fall gelöst.“ Ben nickt aufgeregt. „Frau Lindner ist im Sommer wieder in ihre Villa eingezogen. Mit ihrer Familie.“",
   "Sie fahren zur Villa. Das Gartentor ist offen, und am Tor hängt ein Schild: Spürnasen willkommen! Leise gehen sie über den Rasen bis zum Gartenhaus. Es ist aus dunklem Holz und hat eine dicke Tür mit einem alten Schloss.",
   "Tim steckt den verschnörkelten Schlüssel ins Schloss. Er passt! Langsam dreht er ihn um. Knarrend öffnet sich die Tür. Drinnen ist es dunkel. Die drei treten vorsichtig hinein. Da sagt hinter ihnen eine Stimme: „Endlich seid ihr da!“"
  ], fragen:[
   {t:"mc", q:"Warum finden die Spürnasen das Buch trotzdem?", a:["Die Bücherei hat dieses Buch zweimal.","Der Junge hat es zurückgebracht.","Tim hatte es schon zu Hause.","Frau Yilmaz hat es schnell gekauft."], b:"Von diesem Buch haben wir zwei."},
   {t:"mc", q:"Was ist auf der Zeichnung zu sehen?", a:["Ein Garten mit Haus, Teich und Gartenhaus","Ein Schiff auf dem Meer","Ein Plan der Schule","Ein Bild von Frau Lindner"], b:"Man sieht ein großes Haus, einen Teich und ein kleines Gartenhaus."},
   {t:"mc", q:"Wo ist das rote X?", a:["Neben dem Gartenhaus","Mitten im Teich","Auf dem Dach der Villa","Am Gartentor"], b:"Neben dem Gartenhaus ist ein rotes X."},
   {t:"wort", q:"Was steht auf dem Schild am Tor?", pre:"Spürnasen", l:["willkommen"], b:"Spürnasen willkommen!"}
  ]},
  {text:[
   "Die Spürnasen fahren herum. Im Licht, das durch die Tür fällt, steht der Junge mit der roten Mütze. Neben ihm sitzt eine alte Dame im Rollstuhl. Es ist Frau Lindner! Sie lacht. „Herzlich willkommen, ihr drei! Das hier ist mein Enkel Max.“",
   "Max nimmt seine Mütze ab und grinst ein bisschen verlegen. „Tut mir leid, dass ich immer weggerannt bin. Ich sollte die Hinweise verstecken, aber ihr durftet mich nicht sehen. Das war Omas Idee.“",
   "Frau Lindner erklärt: „Ihr habt damals den Dieb in meiner Villa entdeckt. Dafür wollte ich mich richtig bedanken. Und weil ihr Detektive seid, sollte es eine Schatzsuche sein.“ Sie zeigt auf einen Tisch. Darauf stehen ein großer Schokoladenkuchen und eine alte Holzkiste.",
   "In der Kiste liegen eine glänzende Lupe aus Messing, ein Fingerabdruck-Set und ein dickes Notizbuch aus Leder. „Das gehörte meinem Mann“, sagt Frau Lindner leise. „Er war viele Jahre Kommissar bei der Kriminalpolizei. Er hätte sich gefreut, dass seine Sachen jetzt echten Detektiven gehören.“",
   "Beim Kuchenessen erzählt Max, dass er sich die Geheimschrift selbst ausgedacht hat. Ben, Mira und Tim schauen sich an. Dann fragt Mira: „Max, willst du nicht auch eine Spürnase werden?“ Max strahlt. Und am Abend schreibt Tim in das neue Notizbuch: Die Spürnasen – jetzt sind wir zu viert!"
  ], fragen:[
   {t:"mc", q:"Wer ist der Junge mit der roten Mütze?", a:["Max, der Enkel von Frau Lindner","Felix aus der 4b","Miras Bruder","Ein Dieb"], b:"Das hier ist mein Enkel Max."},
   {t:"mc", q:"Warum ist Max immer weggerannt?", a:["Die Spürnasen durften ihn nicht sehen.","Er hatte Angst vor ihnen.","Er hatte etwas gestohlen.","Er musste schnell nach Hause."], b:"Ich sollte die Hinweise verstecken, aber ihr durftet mich nicht sehen."},
   {t:"mc", q:"Warum möchte sich Frau Lindner bedanken?", a:["Die Spürnasen haben damals den Dieb in ihrer Villa entdeckt.","Die Spürnasen haben ihren Garten gepflegt.","Die Spürnasen haben ihr Bücher gebracht.","Die Spürnasen haben ihren Hund gefunden."], b:"Ihr habt damals den Dieb in meiner Villa entdeckt."},
   {t:"wort", q:"Was war Frau Lindners Mann von Beruf?", pre:"Er war", l:["Kommissar"], b:"Er war viele Jahre Kommissar bei der Kriminalpolizei."}
  ]}
 ]
},
{
 id:"kira3", titel:"Kira und das Lamm auf dem Eis", emoji:"❄️", thema:"Hunde · Kira 3", farbe:"#B86B1E",
 abzeichen:"Eis-Retterin", abzeichenEmoji:"🐑",
 teile:[
  {text:[
   "Es ist Januar und bitterkalt. Der Teich hinter dem Bauernhof ist zugefroren. Lena möchte unbedingt darauf schlittern. Aber Papa schüttelt den Kopf. „Das Eis ist noch viel zu dünn“, sagt er streng. „Niemals aufs Eis gehen, bevor ein Erwachsener es erlaubt hat! Wer einbricht, kann im eiskalten Wasser in wenigen Minuten erfrieren.“",
   "Am Nachmittag zieht eine große Schafherde durch das Dorf. Sie gehört der Schäferin Frau Wendt. Sie bringt ihre Schafe auf eine Winterweide hinter dem Wald. Ihr Hütehund Bruno läuft immer um die Herde herum, damit kein Schaf verloren geht.",
   "Frau Wendt macht eine Pause auf dem Hof. Lena darf die Lämmer streicheln. Ein ganz kleines Lamm hat einen schwarzen Fleck am Ohr. „Das ist Wölkchen“, sagt Frau Wendt. „Sie ist die Neugierigste von allen.“ Kira beobachtet die Schafe ganz aufmerksam. Ihre Ohren sind gespitzt.",
   "„Kira wäre bestimmt eine gute Hütehündin“, lacht Frau Wendt. „Sie schaut genau wie Bruno.“ Dann zieht die Herde weiter. Lena winkt Wölkchen nach, bis die Schafe im Wald verschwunden sind.",
   "Am nächsten Morgen klingelt das Telefon. Es ist Frau Wendt. Sie klingt besorgt. „Wölkchen ist weg! Sie muss sich in der Nacht davongeschlichen haben. Bruno hat überall gesucht. Habt ihr sie vielleicht gesehen?“ Jonas schaut aus dem Fenster. Draußen ist frischer Schnee gefallen. Und darin sind kleine Spuren. Sie führen direkt zum Teich."
  ], fragen:[
   {t:"mc", q:"Warum dürfen die Kinder nicht aufs Eis?", a:["Das Eis ist noch viel zu dünn.","Der Teich gehört Herrn Becker.","Es ist schon zu dunkel.","Lena hat keine Schlittschuhe."], b:"Das Eis ist noch viel zu dünn"},
   {t:"wort", q:"Wie heißt der Hütehund von Frau Wendt?", pre:"Er heißt", l:["Bruno"], b:"Ihr Hütehund Bruno läuft immer um die Herde herum"},
   {t:"mc", q:"Woran erkennt man Wölkchen?", a:["An einem schwarzen Fleck am Ohr","An einer roten Schleife","An ihrem braunen Fell","An einer Glocke am Hals"], b:"Ein ganz kleines Lamm hat einen schwarzen Fleck am Ohr."},
   {t:"mc", q:"Wohin führen die Spuren im Schnee?", a:["Direkt zum Teich","In den Wald","Zur Scheune","Ins Dorf"], b:"Sie führen direkt zum Teich."}
  ]},
  {text:[
   "Jonas, Lena und Papa ziehen sich schnell warm an. Kira ist schon an der Tür und wedelt aufgeregt mit dem Schwanz. Zusammen folgen sie den kleinen Spuren durch den Schnee. Sie führen über die Wiese, am Zaun entlang und hinunter zum Teich.",
   "Am Ufer bleiben sie stehen. Lena hält die Luft an. Mitten auf dem Teich steht Wölkchen. Das Lamm zittert und blökt kläglich. Rund um seine Beine ist das Eis dunkel und hat feine Risse. „Es traut sich nicht mehr weiter“, sagt Papa leise.",
   "„Wir müssen es holen!“, ruft Lena und macht einen Schritt nach vorne. Papa hält sie sofort am Arm fest. „Nein! Denk daran, was ich gesagt habe. Das Eis trägt kein Kind und keinen Erwachsenen. Wir gehen nicht aufs Eis.“ Er holt sein Handy heraus und wählt die 112.",
   "„Ein Lamm ist auf dem zugefrorenen Teich am Bauernhof, Waldweg 3“, sagt Papa. „Das Eis ist dünn und hat Risse.“ Die Frau am Telefon antwortet: „Die Feuerwehr kommt mit Geräten für die Eisrettung. Bleiben Sie alle am Ufer.“",
   "Da knackt es laut auf dem Teich. Wölkchen erschrickt und blökt. Und plötzlich reißt sich Kira los. Bevor Jonas sie festhalten kann, rennt sie mit großen Sätzen auf das Eis hinaus, direkt auf das Lamm zu."
  ], fragen:[
   {t:"mc", q:"Wo steht Wölkchen?", a:["Mitten auf dem Teich","Am Ufer im Schilf","Im Wald","Im Stall"], b:"Mitten auf dem Teich steht Wölkchen."},
   {t:"mc", q:"Was sieht man rund um Wölkchens Beine?", a:["Dunkles Eis mit feinen Rissen","Ein großes Loch","Frischen Schnee","Viele Fußspuren"], b:"Rund um seine Beine ist das Eis dunkel und hat feine Risse."},
   {t:"mc", q:"Was macht Papa, statt aufs Eis zu gehen?", a:["Er ruft die 112 an.","Er holt ein Boot.","Er wirft einen Stein.","Er ruft Frau Wendt an."], b:"Er holt sein Handy heraus und wählt die 112."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Frau Wendt macht mit der Herde Pause auf dem Hof.","Frau Wendt ruft an, weil Wölkchen weg ist.","Sie finden Wölkchen mitten auf dem Teich.","Kira rennt auf das Eis hinaus."]}
  ]},
  {text:[
   "„Kira! Platz!“, schreit Jonas, so laut er kann. Kira hört das Kommando. Mitten auf dem Eis bleibt sie stehen und legt sich flach auf den Bauch. Sie zittert, aber sie bleibt liegen. Jonas' Herz klopft wie verrückt.",
   "„Gut gemacht, Jonas“, sagt Papa. „Wenn sie flach liegt, verteilt sich ihr Gewicht. Dann bricht das Eis nicht so leicht.“ Ganz ruhig ruft Jonas: „Kira, komm! Langsam!“ Kira robbt auf dem Bauch zurück zum Ufer. Zentimeter für Zentimeter. Endlich ist sie da. Jonas drückt sie ganz fest an sich.",
   "Wölkchen aber steht immer noch auf dem Eis. Es blökt und macht einen Schritt nach vorne, in Richtung Ufer. Und noch einen. „Bleib stehen!“, ruft Lena. Doch das Lamm versteht sie nicht.",
   "In der Ferne hören sie schon das Martinshorn. Die Feuerwehr ist unterwegs. Aber Wölkchen läuft weiter. Es ist nur noch fünf Meter vom Ufer entfernt. Dort ist das Eis noch dünner, weil unter dem Schilf eine Quelle sprudelt.",
   "Plötzlich gibt es ein lautes Krachen. Das Eis bricht unter Wölkchen weg. Mit einem Platsch fällt das kleine Lamm ins eiskalte Wasser. Es strampelt und blökt. Und sein Kopf verschwindet für einen Moment unter der Oberfläche."
  ], fragen:[
   {t:"wort", q:"Welches Kommando ruft Jonas?", pre:"Kira,", l:["Platz"], b:"Kira! Platz!"},
   {t:"mc", q:"Warum ist es gut, dass Kira flach auf dem Eis liegt?", a:["Ihr Gewicht verteilt sich, und das Eis bricht nicht so leicht.","So wird ihr wärmer.","So kann sie besser sehen.","So erschreckt sie das Lamm nicht."], b:"Wenn sie flach liegt, verteilt sich ihr Gewicht."},
   {t:"mc", q:"Warum ist das Eis am Ufer besonders dünn?", a:["Unter dem Schilf sprudelt eine Quelle.","Dort scheint die Sonne.","Die Feuerwehr hat es aufgehackt.","Dort schwimmen viele Fische."], b:"weil unter dem Schilf eine Quelle sprudelt"},
   {t:"mc", q:"Was passiert mit Wölkchen am Ende dieses Teils?", a:["Es bricht ein und fällt ins eiskalte Wasser.","Es springt ans Ufer.","Es legt sich auf das Eis.","Es rennt zurück in den Wald."], b:"Mit einem Platsch fällt das kleine Lamm ins eiskalte Wasser."}
  ]},
  {text:[
   "„Schnell!“, ruft Papa. Er legt sich am Ufer flach auf den Boden und hält einen langen Ast aufs Wasser. Aber das Lamm ist zu klein, um sich festzuhalten. Da quietschen Reifen auf dem Waldweg. Das Feuerwehrauto ist da!",
   "Zwei Feuerwehrleute springen heraus. Sie tragen dicke orange Anzüge, die im Wasser schwimmen. Sie schieben einen flachen Rettungsschlitten aufs Eis. Einer legt sich darauf und rutscht vorsichtig zu dem Loch. Dann greift er ins Wasser und zieht Wölkchen heraus.",
   "Am Ufer wickeln sie das klatschnasse Lamm in eine warme Decke. Wölkchen zittert und blökt leise. Papa trägt es ins warme Haus. Lena reibt es mit einem Handtuch trocken, und Mama legt eine Wärmflasche dazu. Nach einer halben Stunde steht Wölkchen schon wieder auf seinen wackeligen Beinen.",
   "Kurz darauf kommt Frau Wendt mit Bruno angelaufen. Sie nimmt Wölkchen glücklich in die Arme. Der Feuerwehrmann sagt zu Jonas: „Das war ganz wichtig, dass ihr alle am Ufer geblieben seid. Und dass du deinen Hund zurückgerufen hast.“",
   "Zum Dank lädt Frau Wendt Jonas und Kira auf die Winterweide ein. Dort darf Kira zusammen mit Bruno die Herde zusammenhalten. Sie rennt in großen Bögen um die Schafe herum, als hätte sie nie etwas anderes gemacht. „Ich hab's ja gesagt“, lacht Frau Wendt. „Eine geborene Hütehündin.“"
  ], fragen:[
   {t:"mc", q:"Warum kann Papa Wölkchen nicht mit dem Ast retten?", a:["Das Lamm ist zu klein, um sich festzuhalten.","Der Ast ist zu kurz.","Papa traut sich nicht.","Kira nimmt ihm den Ast weg."], b:"Aber das Lamm ist zu klein, um sich festzuhalten."},
   {t:"mc", q:"Wie kommt der Feuerwehrmann zu dem Loch im Eis?", a:["Er rutscht auf einem flachen Rettungsschlitten.","Er läuft einfach über das Eis.","Er schwimmt durch den Teich.","Er kommt mit einem Hubschrauber."], b:"Einer legt sich darauf und rutscht vorsichtig zu dem Loch."},
   {t:"wort", q:"Was legt Mama zu Wölkchen, damit es warm wird?", pre:"Eine", l:["Wärmflasche"], b:"Mama legt eine Wärmflasche dazu"},
   {t:"mc", q:"Wofür lobt der Feuerwehrmann die Familie?", a:["Dass alle am Ufer geblieben sind","Dass sie das Lamm selbst aus dem Wasser geholt haben","Dass sie so schnell rennen können","Dass sie Kekse gebacken haben"], b:"Das war ganz wichtig, dass ihr alle am Ufer geblieben seid."}
  ]}
 ]
},
{
 id:"kira4", titel:"Kira im Maislabyrinth", emoji:"🌽", thema:"Hunde · Kira 4", farbe:"#B86B1E",
 abzeichen:"Schulhund-Medaille", abzeichenEmoji:"🎒",
 teile:[
  {text:[
   "Jonas' Mama ist Lehrerin an seiner Schule. Seit einem halben Jahr übt sie mit Kira für eine besondere Aufgabe: Kira soll ein Schulhund werden. Ein Schulhund kommt mit in den Unterricht. Er hilft den Kindern, ruhiger zu werden, und macht vielen Mut.",
   "Am ersten Schultag mit Kira hängt Mama ein Plakat an die Tafel. Darauf stehen die Hunde-Regeln: Erst fragen, dann streicheln. Kira nicht füttern. Leise sein, nicht rennen. Wenn Kira auf ihrer Decke liegt, hat sie Pause.",
   "Die meisten Kinder freuen sich riesig. Nur ein Junge versteckt sich hinter dem Schrank. Er heißt Ole. „Ich habe Angst vor Hunden“, flüstert er. „Ein großer Hund ist mal an mir hochgesprungen.“ Mama nickt verständnisvoll. „Du musst nicht zu Kira gehen. Sie kommt auch nicht zu dir, wenn du das nicht willst.“",
   "Kira legt sich auf ihre Decke, ganz weit weg von Ole. Sie legt den Kopf auf die Pfoten und rührt sich nicht. Ole schaut immer wieder vorsichtig hinter dem Schrank hervor. Am Ende der Stunde setzt er sich schon an seinen Platz.",
   "Zwei Wochen später ist Wandertag. Die Klasse besucht ein riesiges Maislabyrinth. Die Maispflanzen sind viel höher als die Erwachsenen. Kira darf auch mit. Nach dem Picknick versammeln sich alle am Ausgang. Mama zählt die Kinder. Sie zählt noch einmal. Ein Kind fehlt. Es ist Ole."
  ], fragen:[
   {t:"mc", q:"Was macht ein Schulhund?", a:["Er kommt mit in den Unterricht und hilft den Kindern.","Er bewacht nachts die Schule.","Er lernt lesen und schreiben.","Er frisst die Hausaufgaben."], b:"Ein Schulhund kommt mit in den Unterricht."},
   {t:"mc", q:"Welche Regel steht auf dem Plakat?", a:["Erst fragen, dann streicheln.","Kira jeden Tag füttern.","Mit Kira um die Wette rennen.","Kira immer aufwecken."], b:"Erst fragen, dann streicheln."},
   {t:"mc", q:"Warum hat Ole Angst vor Hunden?", a:["Ein großer Hund ist mal an ihm hochgesprungen.","Ein Hund hat seine Jacke zerrissen.","Er hat einen gruseligen Film gesehen.","Kira hat ihn angebellt."], b:"Ein großer Hund ist mal an mir hochgesprungen."},
   {t:"wort", q:"Wohin geht die Klasse am Wandertag?", pre:"In ein riesiges", l:["Maislabyrinth"], b:"Die Klasse besucht ein riesiges Maislabyrinth."}
  ]},
  {text:[
   "„Ole!“, ruft Mama. „Ole, wo bist du?“ Keine Antwort. Nur die Maisblätter rascheln im Wind. Die anderen Kinder schauen sich erschrocken an. Herr Fuchs, der zweite Lehrer, bleibt mit der Klasse am Ausgang. Mama, Jonas und Kira gehen zurück ins Labyrinth.",
   "Das Labyrinth ist riesig. Überall sehen die Wege gleich aus. Links, rechts, geradeaus – und immer wieder Sackgassen. „Wie sollen wir ihn hier bloß finden?“, fragt Jonas verzweifelt.",
   "Da hat Mama eine Idee. Auf der Picknickdecke liegt noch Oles grüne Mütze. Mama hält sie Kira unter die Nase. „Kira, such Ole!“ Kira schnüffelt lange an der Mütze. Dann senkt sie die Nase auf den Boden und läuft los, mal nach links, mal nach rechts.",
   "Jonas und Mama folgen ihr durch die engen Gänge. Kira ist ganz sicher. Nach einer Weile hören sie ein leises Weinen. „Das ist Ole!“, flüstert Jonas. „Er muss ganz nah sein.“",
   "Doch plötzlich bleibt Kira stocksteif stehen. Ihr Fell sträubt sich, und sie knurrt leise. Vor ihnen raschelt es laut im Mais. Dann schiebt sich ein dunkler, borstiger Kopf zwischen den Pflanzen hervor. Ein großes Wildschwein steht mitten auf dem Weg und schnaubt."
  ], fragen:[
   {t:"mc", q:"Wer bleibt mit der Klasse am Ausgang?", a:["Herr Fuchs, der zweite Lehrer","Jonas","Oles Mama","Der Bauer"], b:"Herr Fuchs, der zweite Lehrer, bleibt mit der Klasse am Ausgang."},
   {t:"mc", q:"Warum ist es so schwer, Ole zu finden?", a:["Im Labyrinth sehen alle Wege gleich aus.","Es ist schon dunkel.","Ole versteckt sich absichtlich.","Es regnet sehr stark."], b:"Überall sehen die Wege gleich aus."},
   {t:"wort", q:"Woran schnüffelt Kira, um Oles Spur zu finden?", pre:"An Oles grüner", l:["Mütze"], b:"Auf der Picknickdecke liegt noch Oles grüne Mütze."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Mama hängt das Plakat mit den Hunde-Regeln auf.","Ole versteckt sich hinter dem Schrank.","Mama merkt, dass Ole fehlt.","Kira schnüffelt an Oles Mütze."]}
  ]},
  {text:[
   "„Nicht bewegen“, flüstert Mama. „Und auf keinen Fall wegrennen.“ Sie hält Kira ganz fest an der Leine. Jonas steht wie eine Statue. Das Wildschwein schaut sie an. Es grunzt. Dann dreht es sich um und verschwindet raschelnd im Mais.",
   "„Wildschweine greifen meistens nur an, wenn sie Angst haben oder ihre Jungen beschützen“, erklärt Mama leise. „Wenn man ruhig bleibt und ihnen Platz lässt, laufen sie weg.“ Jonas atmet tief aus. Seine Knie zittern.",
   "Kira schnüffelt weiter. Zwei Kurven später finden sie Ole. Er sitzt zusammengekauert zwischen den Maispflanzen und hält sich den Fuß. „Ich wollte allein den Ausgang finden“, schluchzt er. „Dann bin ich umgeknickt. Und dann habe ich ein Grunzen gehört und hatte schreckliche Angst.“",
   "Mama kniet sich neben ihn. „Jetzt bist du nicht mehr allein“, sagt sie sanft. Aber dann sieht Ole Kira. Er reißt die Augen auf und rutscht rückwärts in den Mais. „Nein! Nicht der Hund! Bitte nicht!“",
   "Kira macht einen Schritt auf Ole zu. Ole schreit auf und hält sich die Arme vors Gesicht. Er zittert am ganzen Körper. „Mama“, flüstert Jonas. „Wie sollen wir ihn hier rausbringen, wenn er solche Angst vor Kira hat? Nur sie kennt den Weg zurück!“"
  ], fragen:[
   {t:"mc", q:"Was soll man tun, wenn man einem Wildschwein begegnet?", a:["Ruhig bleiben und nicht wegrennen","Laut schreien und wegrennen","Es streicheln","Es füttern"], b:"Und auf keinen Fall wegrennen."},
   {t:"mc", q:"Wann greifen Wildschweine meistens an?", a:["Wenn sie Angst haben oder ihre Jungen beschützen","Wenn sie Hunger haben","Immer bei Sonnenschein","Wenn sie Mais sehen"], b:"Wildschweine greifen meistens nur an, wenn sie Angst haben oder ihre Jungen beschützen"},
   {t:"mc", q:"Warum sitzt Ole im Mais?", a:["Er ist umgeknickt und hat sich den Fuß verletzt.","Er spielt Verstecken.","Er ist eingeschlafen.","Er sucht seine Mütze."], b:"Dann bin ich umgeknickt."},
   {t:"mc", q:"Warum ist Oles Angst vor Kira jetzt ein großes Problem?", a:["Nur Kira kennt den Weg zurück.","Kira will nach Hause.","Kira ist sehr müde.","Mama ist sauer auf Ole."], b:"Nur sie kennt den Weg zurück!"}
  ]},
  {text:[
   "Mama sagt ruhig: „Kira, Platz.“ Kira legt sich sofort hin. Sie legt den Kopf auf die Pfoten, genau wie im Klassenzimmer. Dann bleibt sie ganz still liegen und schaut Ole nur mit ihren braunen Augen an.",
   "„Siehst du?“, sagt Jonas leise und setzt sich neben Ole. „Kira springt nie an jemandem hoch. Das hat sie gelernt. Sie wartet einfach.“ Ole schnieft. Ganz langsam nimmt er die Arme vom Gesicht.",
   "„Wenn du willst, kannst du ihr deine Hand zeigen“, sagt Mama. „Halt sie einfach hin, mit der Faust nach unten. Dann darf sie schnuppern.“ Ole zögert lange. Dann streckt er ganz vorsichtig die Hand aus. Kira schnuppert daran und wedelt sanft mit dem Schwanz. Ole muss fast lachen. „Das kitzelt!“",
   "Mama hilft Ole hoch und stützt ihn. Jonas nimmt Kiras Leine. „Kira, zum Ausgang!“ Kira läuft voraus, Kurve für Kurve, und führt alle sicher aus dem Labyrinth. Die Klasse jubelt, als sie herauskommen. Herr Fuchs hat schon einen Kühlbeutel für Oles Fuß bereit.",
   "Ein paar Wochen später besteht Kira die Prüfung zum Schulhund. Und wer sitzt in der ersten Stunde gleich neben ihrer Decke? Ole. Er hat sogar ein Bild für sie gemalt. Darauf ist ein goldbrauner Hund in einem Maisfeld. Und darunter steht: Kira, meine Retterin."
  ], fragen:[
   {t:"mc", q:"Was macht Kira, als Mama „Platz“ sagt?", a:["Sie legt sich hin und bleibt ganz still liegen.","Sie springt zu Ole.","Sie bellt laut.","Sie läuft weg."], b:"Dann bleibt sie ganz still liegen und schaut Ole nur mit ihren braunen Augen an."},
   {t:"mc", q:"Wie soll Ole Kira seine Hand zeigen?", a:["Mit der Faust nach unten, damit sie schnuppern kann","Mit einem Leckerli darin","Ganz schnell vor ihre Nase","Hoch über ihren Kopf"], b:"Halt sie einfach hin, mit der Faust nach unten."},
   {t:"wort", q:"Was sagt Ole, als Kira an seiner Hand schnuppert?", pre:"Das", l:["kitzelt"], b:"Das kitzelt!"},
   {t:"mc", q:"Woran merkt man, dass Ole keine Angst mehr vor Kira hat?", a:["Er sitzt neben ihrer Decke und malt ihr ein Bild.","Er bleibt lieber zu Hause.","Er versteckt sich wieder hinter dem Schrank.","Er wechselt die Klasse."], b:"Er hat sogar ein Bild für sie gemalt."}
  ]}
 ]
},
{
 id:"perla3", titel:"Perla im Nebel", emoji:"🌫️", thema:"Meer & Delfine · Perla 3", farbe:"#1A7F9E",
 abzeichen:"Lotsen-Abzeichen", abzeichenEmoji:"🧭",
 teile:[
  {text:[
   "Es ist Opa Hinnerks Geburtstag. Er wünscht sich nur eins: mit Nele zur Vogelinsel fahren. Dort brüten im Sommer Hunderte Seevögel auf den Felsen. Opa packt seinen alten Kompass ein, Nele die Geburtstagskekse.",
   "Im Radio warnt der Wetterbericht: Am Nachmittag kann Nebel aufziehen. „Bis dahin sind wir längst zurück“, sagt Opa. Er zieht Nele trotzdem eine Rettungsweste an und legt das Funkgerät griffbereit neben das Steuer.",
   "Die Fahrt dauert eine Stunde. An der Vogelinsel ist es laut. Überall kreischen Möwen, und kleine Papageitaucher mit bunten Schnäbeln sitzen auf den Felsen. Nele zählt sie, bis sie durcheinanderkommt. Dann tauchen Perla und Kiesel neben dem Boot auf und begleiten sie ein Stück.",
   "Auf der Rückfahrt merkt Nele, dass es kühler wird. Am Horizont liegt ein grauer Streifen. Er wird schnell breiter. „Der Nebel kommt früher als gedacht“, murmelt Opa und gibt mehr Gas.",
   "Doch der Nebel ist schneller. Nach wenigen Minuten ist um sie herum alles grau. Nele kann nicht einmal mehr das Ende des Bootes richtig sehen. Da beginnt der Motor zu stottern. Er hustet, ruckelt – und geht aus. Plötzlich ist es ganz still."
  ], fragen:[
   {t:"mc", q:"Was wünscht sich Opa zum Geburtstag?", a:["Mit Nele zur Vogelinsel zu fahren","Einen neuen Kompass","Ein neues Boot","Einen großen Kuchen"], b:"mit Nele zur Vogelinsel fahren"},
   {t:"mc", q:"Wovor warnt der Wetterbericht?", a:["Vor Nebel am Nachmittag","Vor einem Gewitter","Vor großer Hitze","Vor Schnee"], b:"Am Nachmittag kann Nebel aufziehen."},
   {t:"wort", q:"Welche Vögel mit bunten Schnäbeln sitzen auf den Felsen?", pre:"Kleine", l:["Papageitaucher"], b:"kleine Papageitaucher mit bunten Schnäbeln"},
   {t:"mc", q:"Was passiert, als der Nebel da ist?", a:["Der Motor stottert und geht aus.","Perla springt ins Boot.","Opa schläft ein.","Die Sonne kommt heraus."], b:"Da beginnt der Motor zu stottern."}
  ]},
  {text:[
   "Opa versucht, den Motor wieder anzulassen. Einmal, zweimal, dreimal. Er springt nicht an. „Der Treibstofffilter ist verstopft“, brummt Opa. „Das dauert eine Weile, bis ich ihn sauber habe.“",
   "Er nimmt das Funkgerät und stellt es auf Kanal 16. Das ist der Notrufkanal für Schiffe. „Hier ist die Möwe“, sagt er ruhig. „Wir treiben mit Motorschaden im Nebel, zwischen Vogelinsel und Hafen.“ Eine Stimme antwortet: „Verstanden, Möwe. Der Seenotrettungskreuzer ist unterwegs. Er braucht etwa vierzig Minuten.“",
   "Nele schaut auf den Kompass. Die Nadel dreht sich langsam. „Opa, wir drehen uns!“ – „Die Strömung treibt uns“, sagt Opa. Sein Gesicht wird ernst. „Und sie treibt uns nach Westen. Dort liegen die Teufelszähne.“",
   "Nele weiß, was die Teufelszähne sind. Es sind spitze Felsen, die nur knapp aus dem Wasser ragen. Schon viele Boote sind dort kaputtgegangen. Opa hat ihr das oft erzählt.",
   "Nele hält den Atem an und lauscht. Durch den dichten Nebel hört sie ein Geräusch. Ein dumpfes Rauschen und Krachen. Es sind Wellen, die gegen Felsen schlagen. Und das Geräusch kommt immer näher."
  ], fragen:[
   {t:"mc", q:"Warum springt der Motor nicht an?", a:["Der Treibstofffilter ist verstopft.","Der Tank ist leer.","Perla hat ihn kaputt gemacht.","Der Schlüssel ist ins Wasser gefallen."], b:"Der Treibstofffilter ist verstopft"},
   {t:"wort", q:"Welchen Kanal stellt Opa am Funkgerät ein?", pre:"Kanal", l:["16","sechzehn"], b:"stellt es auf Kanal 16"},
   {t:"mc", q:"Wie lange braucht der Seenotrettungskreuzer?", a:["Etwa vierzig Minuten","Fünf Minuten","Zwei Stunden","Einen ganzen Tag"], b:"Er braucht etwa vierzig Minuten."},
   {t:"mc", q:"Was sind die Teufelszähne?", a:["Spitze Felsen knapp über dem Wasser","Große Haie","Hohe Wellen","Ein alter Leuchtturm"], b:"Es sind spitze Felsen, die nur knapp aus dem Wasser ragen."}
  ]},
  {text:[
   "„Anker werfen!“, ruft Opa. Er wuchtet den schweren Anker über den Bootsrand. Das Seil rauscht ins Wasser. Dann spannt es sich. Das Boot bleibt stehen. „Der Anker hält“, sagt Opa erleichtert. „Jetzt treiben wir nicht weiter.“",
   "Er beugt sich wieder über den Motor und schraubt am Filter. Nele hält ihm die Taschenlampe. Ihre Hände sind kalt. Durch den Nebel hört sie die Brandung. Sie ist jetzt ganz nah.",
   "Da bewegt sich etwas im Wasser. Etwas Weißes. „Perla!“, ruft Nele. Und neben ihr taucht eine kleine graue Rückenflosse auf. Kiesel! Die beiden Delfine schwimmen dicht am Boot. Perla pfeift laut, schwimmt ein Stück weg und kommt wieder zurück. Immer wieder in dieselbe Richtung.",
   "„Sie will uns etwas zeigen“, flüstert Nele. Opa schaut auf. „Delfine kennen sich hier besser aus als jeder Kapitän“, sagt er. „Zwischen den Teufelszähnen gibt es eine tiefe Rinne. Dort schwimmen sie immer hindurch.“",
   "In diesem Moment kommt eine große Welle. Das Boot wird hochgehoben und reißt am Ankerseil. Es gibt einen lauten Knall. Das Seil ist gerissen! Die Möwe treibt wieder. Und vor ihnen, im Nebel, taucht der erste spitze Felsen auf."
  ], fragen:[
   {t:"mc", q:"Warum wirft Opa den Anker?", a:["Damit das Boot nicht weiter treibt","Um Fische zu fangen","Weil der Anker zu schwer ist","Um die Wassertiefe zu messen"], b:"Jetzt treiben wir nicht weiter."},
   {t:"mc", q:"Was macht Perla immer wieder?", a:["Sie schwimmt weg und kommt zurück – immer in dieselbe Richtung.","Sie springt über das Boot.","Sie stupst den Anker an.","Sie taucht tief hinunter und bleibt weg."], b:"Perla pfeift laut, schwimmt ein Stück weg und kommt wieder zurück."},
   {t:"mc", q:"Was gibt es zwischen den Teufelszähnen?", a:["Eine tiefe Rinne, durch die Delfine schwimmen","Eine kleine Insel","Einen Hafen","Einen Leuchtturm"], b:"Zwischen den Teufelszähnen gibt es eine tiefe Rinne."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Nele zählt die Papageitaucher.","Der Motor geht im Nebel aus.","Opa funkt auf Kanal 16.","Das Ankerseil reißt."]}
  ]},
  {text:[
   "„Opa, der Motor!“, schreit Nele. Opa dreht ein letztes Mal an der Schraube und reißt am Startseil. Der Motor hustet, spuckt – und läuft! „Halt dich fest!“, ruft Opa und dreht das Steuer herum, gerade noch rechtzeitig vor dem Felsen.",
   "„Folge Perla!“, ruft Nele und zeigt nach vorne. Dort schwimmt die weiße Delfindame langsam vor dem Boot her. Kiesel ist direkt neben ihr. Opa steuert ganz langsam hinter ihnen her. Links ragt ein Felsen aus dem Wasser, rechts noch einer. Aber das Boot gleitet genau in der Mitte hindurch.",
   "Nach ein paar bangen Minuten wird das Rauschen der Brandung leiser. Sie haben die Teufelszähne hinter sich gelassen! Und dann sieht Nele ein helles Licht im Nebel. Ein großes oranges Schiff kommt auf sie zu. Es ist der Seenotrettungskreuzer.",
   "Die Seenotretter begleiten die Möwe sicher in den Hafen. Der Kapitän schüttelt Opa die Hand. „Durch die Teufelszähne, im Nebel? Wie habt ihr das geschafft?“ Opa lächelt und zeigt aufs Wasser. Dort tauchen gerade eine weiße und eine graue Flosse auf und wieder ab.",
   "Am Abend gibt es doch noch eine Geburtstagsfeier. Opa pustet die Kerzen auf seinem Kuchen aus. „Das war der aufregendste Geburtstag meines Lebens“, sagt er. „Und ich habe zwei neue Lotsen.“ Nele weiß, wen er meint. Ein Lotse ist jemand, der Schiffe sicher durch gefährliche Gewässer führt."
  ], fragen:[
   {t:"mc", q:"Was passiert gerade noch rechtzeitig?", a:["Der Motor springt wieder an.","Das Ankerseil wird repariert.","Der Nebel verschwindet.","Opa schwimmt zum Ufer."], b:"Der Motor hustet, spuckt – und läuft!"},
   {t:"mc", q:"Wie kommt das Boot durch die Teufelszähne?", a:["Es folgt Perla genau durch die Mitte.","Es fährt ganz schnell geradeaus.","Der Kreuzer zieht es an einem Seil.","Es wartet, bis der Nebel weg ist."], b:"Aber das Boot gleitet genau in der Mitte hindurch."},
   {t:"wort", q:"Welche Farbe hat der Seenotrettungskreuzer?", pre:"Er ist", l:["orange","oranges"], b:"Ein großes oranges Schiff kommt auf sie zu."},
   {t:"mc", q:"Was ist ein Lotse?", a:["Jemand, der Schiffe sicher durch gefährliche Gewässer führt","Ein Fisch mit langer Nase","Ein Kapitän im Ruhestand","Ein Leuchtturm"], b:"Ein Lotse ist jemand, der Schiffe sicher durch gefährliche Gewässer führt."}
  ]}
 ]
},
{
 id:"perla4", titel:"Kiesel und der Plastikring", emoji:"♻️", thema:"Meer & Delfine · Perla 4", farbe:"#1A7F9E",
 abzeichen:"Strandputz-Held", abzeichenEmoji:"🪣",
 teile:[
  {text:[
   "Diesmal fährt Nele in den Herbstferien zu Opa. Am ersten Tag macht sie einen langen Spaziergang am Strand. Doch sie findet nicht nur Muscheln. Überall liegen Plastikflaschen, Tüten, Strohhalme und kaputte Fischernetze.",
   "„Das wird jedes Jahr mehr“, sagt Opa traurig. „Der Wind und die Wellen bringen es von weit her. Für die Tiere im Meer ist Plastik sehr gefährlich. Manche fressen es, weil sie es für Futter halten. Andere verheddern sich darin.“",
   "Nele sammelt eine ganze Tüte voll. Dabei findet sie auch die Plastikringe, mit denen Getränkedosen zusammengehalten werden. „Die sind besonders schlimm“, sagt Opa. „Ein Tier steckt den Kopf hinein und kommt nicht mehr heraus.“",
   "Am nächsten Morgen fahren sie mit der Möwe in die Bucht. Perla kommt sofort. Aber sie ist ganz anders als sonst. Sie kichert nicht. Sie stupst immer wieder mit der Schnauze gegen das Boot und pfeift aufgeregt.",
   "„Wo ist Kiesel?“, fragt Nele. Da taucht er hinter seiner Mutter auf. Er ist dünner geworden. Und um seine Schnauze glänzt etwas. Nele kneift die Augen zusammen. Es ist ein durchsichtiger Plastikring. Er ist so eng um Kiesels Maul gewickelt, dass er es kaum noch öffnen kann."
  ], fragen:[
   {t:"mc", q:"Was findet Nele am Strand außer Muscheln?", a:["Viel Plastikmüll wie Flaschen, Tüten und Strohhalme","Einen Schatz","Einen Seestern","Ein altes Boot"], b:"Überall liegen Plastikflaschen, Tüten, Strohhalme und kaputte Fischernetze."},
   {t:"mc", q:"Warum ist Plastik für Meerestiere so gefährlich?", a:["Sie fressen es oder verheddern sich darin.","Es ist zu laut.","Es macht das Wasser warm.","Es blendet sie."], b:"Manche fressen es, weil sie es für Futter halten."},
   {t:"mc", q:"Wie verhält sich Perla an diesem Morgen?", a:["Sie stupst gegen das Boot und pfeift aufgeregt.","Sie kichert fröhlich.","Sie springt hoch in die Luft.","Sie kommt gar nicht."], b:"Sie stupst immer wieder mit der Schnauze gegen das Boot und pfeift aufgeregt."},
   {t:"wort", q:"Was steckt um Kiesels Schnauze?", pre:"Ein durchsichtiger", l:["Plastikring","Ring"], b:"Es ist ein durchsichtiger Plastikring."}
  ]},
  {text:[
   "„Er kann nicht richtig fressen!“, ruft Nele. „Deshalb ist er so dünn.“ Opa nickt besorgt. Er ruft sofort Frau Doktor Hansen von der Meeresschutzstation an. Sie erinnert sich noch gut an Kiesel.",
   "„Den Ring muss man durchschneiden“, sagt sie. „Dafür habe ich eine lange Stange mit einer kleinen, scharfen Klinge vorne dran. Aber Kiesel muss ganz nah an das Boot kommen und dabei ruhig bleiben.“",
   "Opa schaut aufs Meer. Der Himmel im Westen ist schwarz. „Heute geht es nicht mehr“, sagt Frau Doktor Hansen am Telefon. „Ein Sturm zieht auf. Mit dem Boot ist das viel zu gefährlich. Wir versuchen es morgen ganz früh.“",
   "In der Nacht heult der Sturm um Opas Haus. Der Regen prasselt gegen die Fenster. Nele kann nicht schlafen. Sie denkt an Kiesel, der draußen im wilden Meer ist und nichts fressen kann. „Halt durch, Kiesel“, flüstert sie in ihr Kissen.",
   "Am Morgen ist der Sturm vorbei. Nele, Opa und Frau Doktor Hansen fahren mit der Möwe hinaus. Sie suchen die ganze Bucht ab. Eine Stunde lang. Aber nirgendwo ist eine weiße oder graue Flosse zu sehen. Die Bucht ist leer."
  ], fragen:[
   {t:"mc", q:"Warum ist Kiesel so dünn geworden?", a:["Er kann wegen des Rings nicht richtig fressen.","Er schwimmt zu viel.","Er ist vom Sturm krank.","Perla gibt ihm keine Milch."], b:"Er kann nicht richtig fressen!"},
   {t:"mc", q:"Womit will Frau Doktor Hansen den Ring durchschneiden?", a:["Mit einer langen Stange mit einer scharfen Klinge","Mit Opas Küchenschere","Mit einem Taschenmesser","Mit einer Säge"], b:"Dafür habe ich eine lange Stange mit einer kleinen, scharfen Klinge vorne dran."},
   {t:"mc", q:"Warum können sie es nicht sofort versuchen?", a:["Ein Sturm zieht auf.","Es ist schon Nacht.","Opas Boot ist kaputt.","Frau Doktor Hansen ist im Urlaub."], b:"Ein Sturm zieht auf."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Nele sammelt Plastikmüll am Strand.","Perla stupst aufgeregt gegen das Boot.","Nele entdeckt den Ring um Kiesels Schnauze.","In der Nacht heult der Sturm."]}
  ]},
  {text:[
   "Nele ist den Tränen nahe. Doch dann hat sie eine Idee. Sie setzt sich an den Bootsrand, hält die Hand ins Wasser und macht das Geräusch nach, das Perla immer macht. Ein leises, kicherndes Pfeifen. Immer wieder.",
   "Nach ein paar Minuten antwortet ein Pfiff. Perla taucht auf! Und hinter ihr kommt langsam Kiesel. Er sieht müde aus. Perla schwimmt ganz dicht an das Boot heran. Kiesel folgt ihr zögernd.",
   "„Ganz ruhig“, flüstert Frau Doktor Hansen. Sie schiebt die lange Stange vorsichtig ins Wasser. Die kleine Klinge kommt dem Ring immer näher. Noch ein paar Zentimeter. Nele traut sich kaum zu atmen.",
   "Doch genau in dem Moment klatscht eine Welle gegen das Boot. Die Stange wackelt und stößt gegen Kiesels Kopf. Kiesel erschrickt. Mit einem kräftigen Schlag seiner Schwanzflosse schießt er davon.",
   "„Nein, Kiesel! Komm zurück!“, ruft Nele. Aber Kiesel taucht ab. Tiefer und tiefer, bis er im dunklen Wasser verschwunden ist. Nele starrt auf die Stelle. Sekunden vergehen. Eine Minute. Zwei Minuten. Kiesel kommt nicht wieder hoch."
  ], fragen:[
   {t:"mc", q:"Was ist Neles Idee?", a:["Sie macht Perlas kicherndes Pfeifen nach.","Sie springt ins Wasser.","Sie wirft Fische ins Meer.","Sie hupt mit dem Boot."], b:"macht das Geräusch nach, das Perla immer macht"},
   {t:"mc", q:"Wer kommt zuerst zum Boot?", a:["Perla","Kiesel","Ein Seehund","Ein anderes Boot"], b:"Perla taucht auf!"},
   {t:"mc", q:"Warum erschrickt Kiesel?", a:["Eine Welle lässt die Stange gegen seinen Kopf stoßen.","Nele schreit laut.","Der Motor springt an.","Perla stupst ihn weg."], b:"Die Stange wackelt und stößt gegen Kiesels Kopf."},
   {t:"wort", q:"Womit schlägt Kiesel, als er davonschießt?", pre:"Mit seiner", l:["Schwanzflosse","Flosse"], b:"Mit einem kräftigen Schlag seiner Schwanzflosse schießt er davon."}
  ]},
  {text:[
   "„Delfine können viele Minuten lang tauchen“, sagt Frau Doktor Hansen leise. „Aber er ist geschwächt.“ Da taucht Perla neben dem Boot ab. Nele hält sich am Bootsrand fest und wartet.",
   "Dann wirbelt das Wasser auf. Perla kommt nach oben. Und sie schiebt mit ihrer Schnauze Kiesel vor sich her, bis er an der Oberfläche ist. Kiesel bläst pustend Luft aus seinem Atemloch. Perla bleibt ganz dicht neben ihm, als wollte sie sagen: Keine Angst, ich bin da.",
   "Diesmal ist kein Wind. Das Wasser ist glatt. Nele pfeift leise weiter. Frau Doktor Hansen schiebt die Stange ganz langsam unter den Ring. Ein kleiner Ruck – und der Ring springt auf! Er treibt auf dem Wasser, und Opa fischt ihn mit dem Kescher heraus.",
   "Kiesel öffnet sein Maul weit. Er schüttelt den Kopf, taucht ab und kommt mit einem Fisch im Maul wieder hoch. Nele jubelt so laut, dass die Möwen am Himmel kreischen. „Er frisst!“, ruft sie. „Er kann wieder fressen!“",
   "Zurück in der Schule erzählt Nele ihrer Klasse alles. Gemeinsam organisieren sie einen Müllsammeltag am Fluss neben der Schule. Sie sammeln zwölf große Säcke voll. Und Nele malt ein Plakat für den Schulflur: Plastikringe immer durchschneiden, bevor sie in den Müll kommen! So kann kein Tier darin hängen bleiben."
  ], fragen:[
   {t:"mc", q:"Wie hilft Perla ihrem Baby?", a:["Sie schiebt Kiesel mit der Schnauze an die Oberfläche.","Sie bringt ihm einen Fisch.","Sie beißt den Ring durch.","Sie ruft andere Delfine."], b:"Und sie schiebt mit ihrer Schnauze Kiesel vor sich her, bis er an der Oberfläche ist."},
   {t:"mc", q:"Warum klappt es beim zweiten Versuch?", a:["Es ist kein Wind, und das Wasser ist glatt.","Kiesel schläft.","Opa hält Kiesel fest.","Sie benutzen eine Schere."], b:"Diesmal ist kein Wind. Das Wasser ist glatt."},
   {t:"mc", q:"Woran sieht man, dass es Kiesel wieder besser geht?", a:["Er taucht ab und kommt mit einem Fisch im Maul hoch.","Er springt ins Boot.","Er wird weiß wie seine Mutter.","Er schläft sofort ein."], b:"kommt mit einem Fisch im Maul wieder hoch"},
   {t:"wort", q:"Wie viele Säcke Müll sammelt Neles Klasse?", pre:"Sie sammeln", post:"Säcke.", l:["zwölf","12"], b:"Sie sammeln zwölf große Säcke voll."}
  ]}
 ]
},
{
 id:"luna3", titel:"Ein blinder Passagier", emoji:"🐱", thema:"Weltraum · Ella & Pixel 3", farbe:"#3D3F96",
 abzeichen:"Katzen-Retterin", abzeichenEmoji:"☄️",
 teile:[
  {text:[
   "Diesmal fliegt Ella mit dem Frachtraumschiff Kolibri zum Mond. Es bringt Wasser, Essen und Ersatzteile zur Station Luna 7. Die Pilotin heißt Frau Sato. Sie ist sehr nett und lässt Ella sogar einmal ans Steuer – natürlich nur, wenn der Autopilot an ist.",
   "Im Raumschiff gibt es keine Schwerkraft. Alles schwebt, wenn man es nicht festmacht. Ella schwebt durch die Gänge wie ein Fisch im Wasser. Sie findet das großartig. Zum Schlafen kriecht sie in einen Schlafsack, der an der Wand befestigt ist.",
   "Am zweiten Tag passiert etwas Merkwürdiges. Aus Ellas Tasche fehlen drei Kekse. Am Abend fehlt ein Stück Käse aus dem Vorratsfach. Und in der Nacht hört Ella ein leises Kratzen im Frachtraum. „Hast du das auch gehört?“, fragt sie ihre Mutter. Doch die schläft tief und fest.",
   "Am nächsten Morgen schwebt Ella leise in den Frachtraum. Dort sind viele große Kisten mit Gurten festgemacht. Es ist halbdunkel. Ella schaltet ihre Taschenlampe an und leuchtet zwischen die Kisten.",
   "Da sieht sie es. Ganz hinten, zwischen zwei Kisten, leuchten zwei grüne Augen. Sie starren Ella an. Dann bewegt sich etwas Kleines, Graues. Und ein leises, heiseres Geräusch kommt aus der Dunkelheit."
  ], fragen:[
   {t:"wort", q:"Wie heißt das Frachtraumschiff?", pre:"Es heißt", l:["Kolibri"], b:"mit dem Frachtraumschiff Kolibri"},
   {t:"mc", q:"Was ist im Raumschiff anders als auf der Erde?", a:["Es gibt keine Schwerkraft, alles schwebt.","Es ist immer dunkel.","Man kann nicht sprechen.","Alles ist aus Gummi."], b:"Im Raumschiff gibt es keine Schwerkraft."},
   {t:"mc", q:"Was verschwindet am zweiten Tag?", a:["Drei Kekse und ein Stück Käse","Ellas Taschenlampe","Ein Raumanzug","Die Sternenkarte"], b:"Aus Ellas Tasche fehlen drei Kekse."},
   {t:"mc", q:"Was sieht Ella zwischen den Kisten?", a:["Zwei grüne Augen","Einen Roboter","Ein Loch in der Wand","Ein Funkgerät"], b:"leuchten zwei grüne Augen"}
  ]},
  {text:[
   "„Miau“, macht es. Ganz leise. Ella traut ihren Augen nicht. Zwischen den Kisten schwebt ein kleines graues Kätzchen! Es paddelt mit den Pfoten in der Luft und dreht sich dabei langsam im Kreis. Es sieht sehr verwirrt aus.",
   "Ella fängt das Kätzchen vorsichtig ein und drückt es an sich. Es schnurrt sofort. Dann bringt sie es zu ihrer Mutter und zu Frau Sato. „Wie kommt denn eine Katze in mein Raumschiff?“, ruft Frau Sato. „Sie muss sich auf der Erde in eine Kiste geschlichen haben, als wir beladen haben.“",
   "„Auf der Station sind Tiere eigentlich verboten“, sagt Ellas Mutter. „Aber umkehren können wir nicht.“ Frau Sato funkt Kommandant Okafor an. Er seufzt. Dann sagt er: „Na gut. Das Kätzchen darf bleiben. Aber nur in Ellas Kabine. Und es darf nirgendwo hineinkriechen.“",
   "Ella nennt das Kätzchen Komet, weil es so plötzlich aufgetaucht ist. Zwei Tage später landet die Kolibri auf dem Mond. Pixel rollt zur Begrüßung heran. Als er Komet sieht, blinken auf seinem Bildschirm zwei große Fragezeichen.",
   "Doch als die Schleuse zur Station aufgeht, passiert es. Komet erschrickt vor dem Zischen. Sie springt aus Ellas Armen, flitzt über den Boden und schlüpft blitzschnell durch ein Gitter in einen Lüftungsschacht. „Komet!“, ruft Ella. Aber vom Kätzchen ist nur noch der graue Schwanz zu sehen. Dann ist es weg."
  ], fragen:[
   {t:"mc", q:"Wie ist das Kätzchen in das Raumschiff gekommen?", a:["Es hat sich auf der Erde in eine Kiste geschlichen.","Frau Sato hat es mitgebracht.","Es ist auf dem Mond geboren.","Ella hat es heimlich eingepackt."], b:"Sie muss sich auf der Erde in eine Kiste geschlichen haben"},
   {t:"mc", q:"Was erlaubt Kommandant Okafor?", a:["Das Kätzchen darf bleiben, aber nur in Ellas Kabine.","Das Kätzchen darf überall herumlaufen.","Das Kätzchen muss sofort zurück.","Das Kätzchen darf bei Pixel wohnen."], b:"Aber nur in Ellas Kabine."},
   {t:"wort", q:"Welchen Namen gibt Ella dem Kätzchen?", pre:"Sie nennt es", l:["Komet"], b:"Ella nennt das Kätzchen Komet"},
   {t:"mc", q:"Warum springt Komet aus Ellas Armen?", a:["Sie erschrickt vor dem Zischen der Schleuse.","Sie hat Hunger.","Pixel hat sie angepiept.","Sie will spielen."], b:"Komet erschrickt vor dem Zischen."}
  ]},
  {text:[
   "„Pixel, du musst mir helfen!“, ruft Ella. Pixel blinkt. „Ich habe einen Wärmesensor. Damit kann ich warme Lebewesen auch durch dünne Wände sehen.“ Er rollt langsam an der Wand entlang. Auf seinem Bildschirm erscheint ein kleiner orangefarbener Punkt. „Da! Sie krabbelt im Schacht nach links.“",
   "Ella und Pixel folgen dem Punkt durch die Gänge. Am Gewächshaus vorbei, an der Küche vorbei, bis zum Maschinenraum. Ellas Mutter und Kommandant Okafor laufen hinterher. „Die Lüftungsschächte führen durch die ganze Station“, sagt Kommandant Okafor besorgt. „Und im Maschinenraum ist der große Lüfter.“",
   "Der große Lüfter ist wie ein riesiger Ventilator. Er pustet frische Luft durch alle Schächte der Station. Jeden Tag um zwölf Uhr springt er für eine Stunde auf volle Kraft. Ella schaut auf die Uhr an der Wand. Es ist elf Uhr fünfzig.",
   "Pixel bleibt vor einem großen Gitter stehen. Dahinter dreht sich langsam ein Rad mit breiten Flügeln. Und auf der anderen Seite, direkt vor dem Gitter, sitzt Komet. Das Kätzchen hat sich in den engen Schacht gequetscht und kommt weder vor noch zurück. Es miaut kläglich.",
   "„Wir müssen den Lüfter ausschalten!“, ruft Ella. Kommandant Okafor drückt auf einen Knopf am Bedienfeld. Nichts passiert. Er drückt noch einmal. Auf dem Bildschirm steht: Automatischer Start in 5 Minuten. Abbrechen nicht möglich."
  ], fragen:[
   {t:"mc", q:"Wie findet Pixel das Kätzchen im Schacht?", a:["Mit seinem Wärmesensor","Mit seiner Nase","Mit einer Kamera im Schacht","Er hört es miauen."], b:"Ich habe einen Wärmesensor."},
   {t:"mc", q:"Was macht der große Lüfter?", a:["Er pustet frische Luft durch alle Schächte.","Er kocht das Essen.","Er macht Strom.","Er wäscht die Kleidung."], b:"Er pustet frische Luft durch alle Schächte der Station."},
   {t:"wort", q:"Um wie viel Uhr springt der Lüfter jeden Tag an?", pre:"Um", post:"Uhr.", l:["zwölf","12"], b:"Jeden Tag um zwölf Uhr springt er für eine Stunde auf volle Kraft."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Ella entdeckt zwei grüne Augen im Frachtraum.","Kommandant Okafor erlaubt, dass Komet bleibt.","Komet flitzt in einen Lüftungsschacht.","Pixel findet Komet vor dem großen Lüfter."]}
  ]},
  {text:[
   "„Dann müssen wir Komet in fünf Minuten da herausholen“, sagt Ellas Mutter. Kommandant Okafor schraubt schnell das Gitter vom Schacht ab. Aber der Schacht ist eng, und Komet sitzt weit hinten. Keine Hand passt hinein. Und Komet hat zu viel Angst, um herauszukommen.",
   "Pixel streckt seinen Greifarm aus. Er kann ihn ganz lang und dünn machen. „Ich versuche es“, piepst er. Doch als der Greifarm näher kommt, faucht Komet und weicht noch weiter zurück. Gefährlich nah an das Lüfterrad.",
   "Da hat Ella eine Idee. Sie rennt in die Küche und kommt mit einer kleinen Dose zurück. Thunfisch! Sie öffnet die Dose und legt etwas Thunfisch auf Pixels Greifarm. Pixel schiebt den Arm wieder in den Schacht. Noch drei Minuten.",
   "Komet schnuppert. Ihre Nase zuckt. Ganz langsam schiebt sie sich nach vorne und beginnt zu fressen. Stück für Stück zieht Pixel den Arm zurück. Und Komet folgt dem Thunfisch. Noch eine Minute. Dann ist sie am Ausgang. Ella greift zu und zieht das Kätzchen heraus. Im selben Moment brummt der Lüfter los.",
   "Am Abend liegt Komet zusammengerollt auf Ellas Bett und schnurrt. Kommandant Okafor lässt Gitter mit ganz feinen Löchern vor alle Schächte bauen. „Für unsere neue Mitbewohnerin“, sagt er. Und als Ella zwei Wochen später zur Erde zurückfliegt, fliegt Komet mit. Diesmal ganz offiziell – in einer Katzenbox mit ihrem Namen darauf."
  ], fragen:[

   {t:"mc", q:"Was macht Komet, als Pixels Greifarm kommt?", a:["Sie faucht und weicht zurück.","Sie springt auf den Arm.","Sie schläft ein.","Sie miaut fröhlich."], b:"faucht Komet und weicht noch weiter zurück"},
   {t:"wort", q:"Womit lockt Ella das Kätzchen heraus?", pre:"Mit", l:["Thunfisch"], b:"Thunfisch!"},

 ]
