{
 id:"luna4", titel:"Die lange Mondnacht", emoji:"🔦", thema:"Weltraum · Ella & Pixel 4", farbe:"#3D3F96",
 abzeichen:"Mondnacht-Medaille", abzeichenEmoji:"🌑",
 teile:[
  {text:[
   "Auf dem Mond dauert ein Tag fast einen ganzen Monat. Zwei Wochen lang scheint die Sonne. Dann ist es zwei Wochen lang dunkel. Diese Zeit nennt man die Mondnacht. Draußen wird es dann eiskalt, bis zu minus 170 Grad.",
   "Ella ist diesmal genau zur Mondnacht auf Luna 7. „Wie bekommt die Station Strom, wenn die Sonne nicht scheint?“, fragt sie Pixel. „Am Tag sammeln die Solarzellen draußen Sonnenstrom“, erklärt Pixel. „Den speichern wir in riesigen Batterien. Davon leben wir in der Nacht.“",
   "Pixel zeigt Ella auch die Eingangshalle. Dort hängt eine glänzende Tafel aus Metall. Darauf steht: Station Luna 7 – eröffnet am 12. April 2061. „Das ist der Geburtstag der Station“, piepst Pixel stolz. „Jedes Jahr feiern wir ihn mit Mondkuchen.“",
   "In der dritten Nacht sitzt Ella mit ihrer Mutter im Aufenthaltsraum. Durch das große Fenster sieht man die Erde. Sie leuchtet blau und weiß und taucht die Mondlandschaft in ein sanftes Licht. „Das nennt man Erdschein“, sagt ihre Mutter.",
   "Da flackert plötzlich das Licht. Einmal, zweimal. Dann wird es dunkel. Die Lüftung verstummt. Auch die Heizung hört auf zu summen. Nur ein paar rote Notlampen glimmen noch. Und eine Computerstimme sagt: „Achtung. Hauptbatterie ausgefallen. Notstrom für sechs Stunden.“"
  ], fragen:[
   {t:"mc", q:"Wie lange dauert die Mondnacht?", a:["Zwei Wochen","Eine Nacht wie auf der Erde","Ein ganzes Jahr","Drei Stunden"], b:"Dann ist es zwei Wochen lang dunkel."},
   {t:"mc", q:"Woher bekommt die Station in der Mondnacht Strom?", a:["Aus riesigen Batterien mit gespeichertem Sonnenstrom","Von der Erde über ein langes Kabel","Aus einem Lagerfeuer","Vom Erdschein"], b:"Den speichern wir in riesigen Batterien."},
   {t:"wort", q:"In welchem Jahr wurde die Station eröffnet?", pre:"Im Jahr", l:["2061"], b:"eröffnet am 12. April 2061"},
   {t:"mc", q:"Was passiert am Ende dieses Teils?", a:["Die Hauptbatterie fällt aus, und es wird dunkel.","Ein Raumschiff landet.","Die Sonne geht auf.","Pixel schläft ein."], b:"Hauptbatterie ausgefallen."}
  ]},
  {text:[
   "Kommandant Okafor kommt mit einer Stirnlampe in den Raum. „Ein Kabel zwischen den Batterien und der Station ist durchgebrochen“, erklärt er ruhig. „Wahrscheinlich wegen der Kälte. Ich gehe mit deiner Mutter hinaus und repariere es.“",
   "„Und was ist mit dem Gewächshaus?“, fragt Ella. Kommandant Okafor runzelt die Stirn. „Gute Frage. Ohne Heizung wird es dort schnell kalt. Die Pflanzen könnten erfrieren. Und wir brauchen sie für frische Luft und frisches Essen.“",
   "„Pixel und ich bringen die Pflanzen in den Notfallraum“, sagt Ella. „Der hat eine eigene Heizung mit Notstrom.“ Ihre Mutter nickt. „Gute Idee. Aber zieh dich warm an.“ Dann gehen die beiden Erwachsenen zur Schleuse und ziehen ihre Raumanzüge an.",
   "Ella und Pixel tragen Pflanzkiste um Pflanzkiste durch den dunklen Gang. Tomaten, Salat, Erdbeeren. Im Gewächshaus wird es immer kälter. Ellas Atem macht schon kleine weiße Wölkchen. Pixel rollt gerade noch einmal ins Gewächshaus, um die Kräuter zu holen.",
   "Da gibt es ein lautes Klacken. Die schwere Tür zum Gewächshaus fährt zu. Pixel ist drinnen. Ella steht draußen. „Ella!“, piepst Pixel durch die Tür. „Die Tür hat sich wegen der Kälte automatisch verriegelt! Und meine Batterie wird in der Kälte ganz schnell leer!“"
  ], fragen:[
   {t:"mc", q:"Warum ist die Hauptbatterie ausgefallen?", a:["Ein Kabel ist wegen der Kälte durchgebrochen.","Ein Meteorit hat sie getroffen.","Pixel hat den Stecker gezogen.","Die Sonne scheint zu stark."], b:"Ein Kabel zwischen den Batterien und der Station ist durchgebrochen"},
   {t:"mc", q:"Warum sind die Pflanzen so wichtig?", a:["Sie sorgen für frische Luft und frisches Essen.","Sie sehen schön aus.","Sie machen Strom.","Sie halten die Türen offen."], b:"Und wir brauchen sie für frische Luft und frisches Essen."},
   {t:"mc", q:"Wohin bringen Ella und Pixel die Pflanzen?", a:["In den Notfallraum mit eigener Heizung","In Ellas Kabine","Nach draußen","In die Küche"], b:"Der hat eine eigene Heizung mit Notstrom."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Pixel zeigt Ella die Tafel in der Eingangshalle.","Ella sieht den Erdschein durch das Fenster.","Die Hauptbatterie fällt aus.","Die Tür zum Gewächshaus verriegelt sich."]}
  ]},
  {text:[
   "Ella rüttelt an der Tür. Sie bewegt sich nicht. Neben der Tür ist ein roter Kasten mit der Aufschrift: Notöffnung. Ella klappt ihn auf. Darin steckt eine Kurbel. Sie dreht daran, so fest sie kann. Aber die Kurbel ist eingefroren und bewegt sich keinen Millimeter.",
   "Ella überlegt. Dann denkt sie an den Werkzeugraum. Sie rennt los und kommt mit einem langen Schraubenschlüssel zurück. Sie steckt ihn über den Griff der Kurbel. Jetzt hat sie einen viel längeren Hebel. Sie drückt mit ihrem ganzen Gewicht. Knirsch! Die Kurbel dreht sich.",
   "Langsam öffnet sich die Tür einen Spalt. Pixel rollt heraus. Er ist ganz langsam, und seine Augen auf dem Bildschirm sind trüb. Ella schließt ihn im Notfallraum sofort an ein Ladekabel an. „Danke, Ella“, piepst er schwach. „Du bist die beste Ingenieurin der Station.“",
   "Da knackt das Funkgerät. Es ist ihre Mutter. „Ella, hörst du mich? Wir haben das Kabel draußen repariert. Aber die Hauptbatterie springt nicht von allein wieder an. Jemand muss drinnen im Technikraum den Neustart machen.“",
   "Ella läuft in den Technikraum. Dort leuchtet ein Bildschirm. Darauf steht: Neustart der Hauptbatterie. Bitte Code eingeben. Und darunter in roter Schrift: Noch 3 Versuche. Danach wird das System für 24 Stunden gesperrt."
  ], fragen:[
   {t:"mc", q:"Warum lässt sich die Kurbel zuerst nicht drehen?", a:["Sie ist eingefroren.","Sie ist abgebrochen.","Sie ist zu klein.","Pixel hält sie fest."], b:"Aber die Kurbel ist eingefroren und bewegt sich keinen Millimeter."},
   {t:"mc", q:"Wie schafft Ella es, die Kurbel zu drehen?", a:["Mit einem langen Schraubenschlüssel als Hebel","Mit heißem Wasser","Mit einem Hammer","Mit Pixels Greifarm"], b:"Jetzt hat sie einen viel längeren Hebel."},
   {t:"mc", q:"Was muss im Technikraum gemacht werden?", a:["Der Neustart der Hauptbatterie","Das Licht ausschalten","Das Funkgerät reparieren","Die Heizung abstellen"], b:"Jemand muss drinnen im Technikraum den Neustart machen."},
   {t:"wort", q:"Wie viele Versuche hat Ella für den Code?", pre:"Noch", post:"Versuche", l:["3","drei"], b:"Noch 3 Versuche."}
  ]},
  {text:[
   "„Mama, wie heißt der Code?“, fragt Ella ins Funkgerät. Ihre Mutter antwortet, aber es knistert und rauscht. „Der Code ist … rrrsch … Geburtstag … rrrsch … Station.“ Dann ist die Verbindung weg.",
   "Ella denkt nach. Der Geburtstag der Station? Plötzlich erinnert sie sich an die glänzende Tafel in der Eingangshalle. Station Luna 7 – eröffnet am 12. April 2061. Der 12. April. Der zwölfte Tag im vierten Monat.",
   "Mit zitternden Fingern tippt Ella: 1 – 2 – 0 – 4. Sie hält den Atem an und drückt auf Bestätigen. Der Bildschirm blinkt. Einmal. Zweimal. Dann erscheint ein grüner Haken: Code richtig. Neustart läuft.",
   "Überall in der Station flackern die Lichter auf. Die Lüftung beginnt wieder zu rauschen. Die Heizung summt. Und aus dem Funkgerät hört Ella Jubel. „Ella, du hast es geschafft!“, ruft Kommandant Okafor. „Woher wusstest du den Code?“ – „Von der Tafel in der Eingangshalle“, sagt Ella stolz.",
   "Am nächsten Tag gibt es Mondkuchen, obwohl gar nicht der Geburtstag der Station ist. Kommandant Okafor lässt eine kleine Tafel machen und hängt sie neben die große. Darauf steht: Ella – Retterin der langen Mondnacht. Und Pixel? Der hat sich einen warmen Wollschal um seinen Bildschirm gewickelt. Nur für alle Fälle."
  ], fragen:[
   {t:"mc", q:"Warum versteht Ella den Code nicht ganz?", a:["Das Funkgerät knistert und rauscht.","Ihre Mutter spricht zu leise.","Pixel ist zu laut.","Sie hat ihn vergessen."], b:"Ihre Mutter antwortet, aber es knistert und rauscht."},
   {t:"wort", q:"Welchen Code tippt Ella ein?", pre:"Code:", l:["1204"], b:"1 – 2 – 0 – 4"},
   {t:"mc", q:"Woher weiß Ella den Code?", a:["Von der Tafel mit dem Geburtstag der Station","Aus ihrem Tagebuch","Pixel hat ihn verraten","Sie hat einfach geraten"], b:"Plötzlich erinnert sie sich an die glänzende Tafel in der Eingangshalle."},
   {t:"mc", q:"Was hat sich Pixel um den Bildschirm gewickelt?", a:["Einen warmen Wollschal","Ein Pflaster","Ein Ladekabel","Eine Medaille"], b:"Der hat sich einen warmen Wollschal um seinen Bildschirm gewickelt."}
  ]}
 ]
},
{
 id:"polizei3", titel:"Polizeihund Rocky ermittelt", emoji:"🐕‍🦺", thema:"Polizei · Luis & Aylin 3", farbe:"#2456A6",
 abzeichen:"Spürhund-Abzeichen", abzeichenEmoji:"🦴",
 teile:[
  {text:[
   "Heute ist ein besonderer Tag. Luis und Aylin dürfen Kommissarin Demir einen Vormittag lang im Polizeirevier besuchen. Die Kommissarin zeigt ihnen die Funkzentrale, die Büros und die Streifenwagen in der Garage. Luis darf sogar einmal das Blaulicht einschalten.",
   "Dann gehen sie ins Labor. Dort zeigt Kommissarin Demir, wie man Fingerabdrücke sichtbar macht. Sie streut ein feines graues Pulver auf ein Glas und pinselt vorsichtig darüber. Plötzlich erscheinen viele kleine Linien. „Jeder Mensch hat ganz eigene Fingerabdrücke“, erklärt sie. „Keine zwei sind gleich.“",
   "Zum Schluss lernen sie Rocky kennen. Rocky ist ein Schäferhund mit schwarzem Rücken und braunen Beinen. Er ist ein Polizeihund. Sein Hundeführer heißt Herr Klein. „Rockys Nase ist viele tausend Mal besser als unsere“, sagt Herr Klein. „Er kann einer Spur folgen, die viele Stunden alt ist.“",
   "Aylin darf Rocky streicheln, nachdem sie Herrn Klein gefragt hat. Rocky wedelt freundlich mit dem Schwanz. „Wenn er arbeitet, ist er ganz ernst“, sagt Herr Klein. „Aber jetzt hat er Pause.“",
   "Da piept das Funkgerät der Kommissarin. Eine Stimme sagt: „Einbruch in der Grundschule am Rosenhügel. Der Computerraum. Mehrere Laptops gestohlen.“ Luis und Aylin schauen sich erschrocken an. Die Grundschule am Rosenhügel – das ist ihre Schule!"
  ], fragen:[
   {t:"mc", q:"Was darf Luis auf dem Revier ausprobieren?", a:["Das Blaulicht einschalten","Eine Uniform anziehen","Mit Rocky spazieren gehen","Ein Polizeiauto fahren"], b:"Luis darf sogar einmal das Blaulicht einschalten."},
   {t:"mc", q:"Was ist besonders an Fingerabdrücken?", a:["Keine zwei sind gleich.","Sie sind immer rot.","Man sieht sie nur nachts.","Sie verschwinden sofort."], b:"Keine zwei sind gleich."},
   {t:"wort", q:"Wie heißt der Polizeihund?", pre:"Er heißt", l:["Rocky"], b:"Zum Schluss lernen sie Rocky kennen."},
   {t:"mc", q:"Was wurde aus der Schule gestohlen?", a:["Mehrere Laptops aus dem Computerraum","Der Fußballpokal","Bücher aus der Bücherei","Das Geld vom Schulfest"], b:"Mehrere Laptops gestohlen."}
  ]},
  {text:[
   "Kommissarin Demir fährt sofort los. Luis und Aylin dürfen mitkommen, aber sie müssen im Büro der Schulsekretärin warten. Durch das Fenster können sie den Schulhof sehen. Ein Fenster vom Computerraum ist eingeschlagen. Überall liegen Glasscherben.",
   "Zwei Polizisten von der Spurensicherung arbeiten im Computerraum. Sie tragen weiße Anzüge und Handschuhe. Sie streuen graues Pulver auf die Tische und fotografieren alles. Im weichen Blumenbeet unter dem Fenster finden sie Schuhabdrücke. Die Sohle hat ein Muster aus kleinen Sternen.",
   "Dann kommt Herr Klein mit Rocky. Rocky schnüffelt am Fenster, dann im Blumenbeet. Plötzlich zieht er an der Leine. Mit der Nase am Boden läuft er über den Schulhof, durch das Tor und die Straße hinunter. Herr Klein läuft hinterher.",
   "Nach zehn Minuten kommen die beiden zurück. Herr Klein schüttelt den Kopf. „Die Spur endet an der Bushaltestelle. Der Dieb ist mit dem Bus weggefahren. Da verliert auch Rocky die Spur.“ Die Kommissarin seufzt. „Dann brauchen wir einen anderen Hinweis.“",
   "Aylin hat genau zugehört. Auf dem Weg zum Revier sind sie heute Morgen an dieser Bushaltestelle vorbeigefahren. Dort saß ein Mann mit einem großen schwarzen Rucksack. Er hatte Turnschuhe an. Und auf den Schuhen waren kleine silberne Sterne. Aylin springt auf. „Frau Demir! Ich glaube, ich habe den Dieb gesehen!“"
  ], fragen:[
   {t:"mc", q:"Wo müssen Luis und Aylin warten?", a:["Im Büro der Schulsekretärin","Im Streifenwagen","Im Computerraum","Zu Hause"], b:"aber sie müssen im Büro der Schulsekretärin warten"},
   {t:"mc", q:"Welches Muster hat die Schuhsohle im Blumenbeet?", a:["Kleine Sterne","Kleine Herzen","Zickzack-Streifen","Kreise"], b:"Die Sohle hat ein Muster aus kleinen Sternen."},
   {t:"mc", q:"Warum verliert Rocky die Spur?", a:["Der Dieb ist an der Bushaltestelle in einen Bus gestiegen.","Es hat stark geregnet.","Rocky war müde.","Eine Katze hat ihn abgelenkt."], b:"Der Dieb ist mit dem Bus weggefahren."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Kommissarin Demir zeigt die Fingerabdrücke im Labor.","Das Funkgerät meldet den Einbruch.","Rocky folgt der Spur bis zur Bushaltestelle.","Aylin erinnert sich an den Mann mit den Stern-Schuhen."]}
  ]},
  {text:[
   "Kommissarin Demir setzt sich zu Aylin. „Erzähl mir alles ganz genau. Jede Kleinigkeit kann wichtig sein.“ Aylin schließt die Augen und erinnert sich. „Er war groß und hatte eine graue Kapuzenjacke an. Der Rucksack war schwarz und ganz dick. Und er hat immer wieder auf die Uhr geschaut, als hätte er es eilig.“",
   "Luis ergänzt: „An der Haltestelle fährt nur die Linie 4. Die fährt zum Bahnhof.“ Die Kommissarin nickt anerkennend und funkt die Beschreibung an ihre Kollegen. „Ein Mann, groß, graue Kapuzenjacke, schwarzer Rucksack, Turnschuhe mit silbernen Sternen. Vermutlich mit Linie 4 zum Bahnhof.“",
   "Am Nachmittag klingelt Kommissarin Demirs Telefon. Ein Kollege hat im Internet eine Anzeige gefunden. Dort verkauft jemand fünf gebrauchte Laptops, ganz billig. Auf einem Foto erkennt man einen Aufkleber auf einem Laptop. Darauf steht: Eigentum der Grundschule am Rosenhügel.",
   "„Der ist aber nicht schlau“, sagt Luis. Die Kommissarin lacht. „Viele Diebe sind nicht so schlau, wie sie denken.“ Ein Polizist meldet sich als Käufer und verabredet sich mit dem Verkäufer. Treffpunkt: morgen um 15 Uhr am Bahnhofsplatz.",
   "Am nächsten Tag sitzen Luis und Aylin mit Kommissarin Demir in einem Auto ohne Polizeiaufschrift. Es parkt weit weg vom Bahnhofsplatz. Durch ein Fernglas beobachten sie den Platz. Punkt 15 Uhr kommt ein großer Mann mit einer grauen Kapuzenjacke. Er trägt einen dicken schwarzen Rucksack. Er schaut sich nervös um. Dann sieht er einen Streifenwagen an der Ecke – und rennt los."
  ], fragen:[
   {t:"mc", q:"Was soll Aylin der Kommissarin erzählen?", a:["Alles ganz genau, jede Kleinigkeit","Nur den Namen des Mannes","Wo sie wohnt","Was sie gefrühstückt hat"], b:"Jede Kleinigkeit kann wichtig sein."},
   {t:"wort", q:"Welche Buslinie fährt an der Haltestelle?", pre:"Linie", l:["4","vier"], b:"An der Haltestelle fährt nur die Linie 4."},
   {t:"mc", q:"Wodurch verrät sich der Dieb im Internet?", a:["Auf einem Foto sieht man den Aufkleber der Schule.","Er schreibt seinen Namen dazu.","Er verkauft die Laptops sehr teuer.","Er zeigt sein Gesicht."], b:"Darauf steht: Eigentum der Grundschule am Rosenhügel."},
   {t:"mc", q:"Was macht der Mann, als er den Streifenwagen sieht?", a:["Er rennt los.","Er winkt.","Er setzt sich auf eine Bank.","Er gibt den Rucksack ab."], b:"Dann sieht er einen Streifenwagen an der Ecke – und rennt los."}
  ]},
  {text:[
   "„Rocky, fass!“, ruft Herr Klein, der hinter einem Kiosk gewartet hat. Rocky schießt los wie ein Pfeil. Er ist viel schneller als der Mann. Nach wenigen Metern hat er ihn eingeholt und packt ihn am Ärmel der Jacke. Der Mann stolpert und bleibt stehen. „Ruf ihn zurück!“, ruft er ängstlich.",
   "„Rocky, aus!“, sagt Herr Klein. Sofort lässt Rocky los und setzt sich brav hin. Zwei Polizisten legen dem Mann Handschellen an. In seinem Rucksack finden sie die fünf Laptops aus der Schule. Und an seinen Füßen trägt er Turnschuhe mit kleinen silbernen Sternen.",
   "Später vergleicht die Spurensicherung seine Schuhe mit den Abdrücken im Blumenbeet. Sie passen genau. Auch seine Fingerabdrücke finden sie auf einem Tisch im Computerraum. „Jetzt haben wir alle Beweise“, sagt Kommissarin Demir zufrieden.",
   "Ein paar Tage später kommt die Kommissarin mit Herrn Klein und Rocky in die Schule. In der Turnhalle sitzen alle Klassen. Die Schulleiterin bedankt sich bei der Polizei. Und die Kommissarin bedankt sich bei Aylin und Luis. „Ihr habt genau hingeschaut und euch alles gut gemerkt. Das ist das Wichtigste bei der Polizeiarbeit.“",
   "Dann darf Rocky zeigen, was er kann. Herr Klein versteckt einen Schlüsselbund irgendwo in der Turnhalle. Rocky findet ihn in weniger als einer Minute, unter einer Matte ganz hinten. Alle Kinder klatschen. Und Aylin weiß jetzt genau, was sie später einmal werden will: Hundeführerin bei der Polizei."
  ], fragen:[
   {t:"mc", q:"Was macht Rocky auf das Kommando „Aus“?", a:["Er lässt los und setzt sich brav hin.","Er rennt weiter.","Er bellt laut.","Er läuft weg."], b:"Sofort lässt Rocky los und setzt sich brav hin."},
   {t:"mc", q:"Was finden die Polizisten im Rucksack?", a:["Die fünf Laptops aus der Schule","Geld und Schmuck","Ein Fahrrad","Nur Butterbrote"], b:"In seinem Rucksack finden sie die fünf Laptops aus der Schule."},
   {t:"mc", q:"Welche Beweise passen zum Dieb?", a:["Seine Schuhe und seine Fingerabdrücke","Seine Haare und seine Stimme","Seine Mütze und sein Fahrrad","Sein Name auf einem Zettel"], b:"Auch seine Fingerabdrücke finden sie auf einem Tisch im Computerraum."},
   {t:"wort", q:"Was will Aylin später werden?", pre:"Sie will", post:"bei der Polizei werden.", l:["Hundeführerin"], b:"Hundeführerin bei der Polizei"}
  ]}
 ]
},
{
 id:"polizei4", titel:"Die Fahrradprüfung", emoji:"🚲", thema:"Polizei · Luis & Aylin 4", farbe:"#2456A6",
 abzeichen:"Fahrradführerschein", abzeichenEmoji:"🪖",
 teile:[
  {text:[
   "In der vierten Klasse machen alle Kinder die Fahrradprüfung. Dafür kommt Polizeihauptmeister Wagner in die Schule. Er übt mit den Kindern auf dem Verkehrsübungsplatz. Dort gibt es kleine Straßen, Ampeln, Zebrastreifen und Verkehrsschilder, genau wie in echt.",
   "„Das Allerwichtigste ist der Helm“, sagt Herr Wagner. „Der Helm schützt euren Kopf, wenn ihr stürzt. Ohne Helm fährt niemand los.“ Dann zeigt er den Kindern den Schulterblick. „Bevor ihr abbiegt, schaut ihr immer über die Schulter nach hinten. Und ihr streckt den Arm aus, damit alle sehen, wohin ihr wollt.“",
   "Luis und Aylin üben fleißig. Linksabbiegen ist am schwersten. Man muss sich einordnen, den Schulterblick machen, den Arm ausstrecken und auf den Gegenverkehr achten. Aber nach ein paar Runden klappt es immer besser.",
   "Nach der Übungsstunde fahren die beiden zusammen nach Hause. Sie tragen ihre Helme und fahren hintereinander am rechten Rand der Straße. Aylin fährt vorne. An der Kreuzung beim Supermarkt macht sie einen Schulterblick und streckt den rechten Arm aus. Alles richtig.",
   "Doch da kommt ein silbernes Auto von hinten. Es fährt viel zu schnell und viel zu dicht an Aylin vorbei. Der Außenspiegel streift ihren Lenker. Aylin schwankt, verliert das Gleichgewicht und stürzt auf die Straße. Das Auto bremst nicht. Es fährt einfach weiter."
  ], fragen:[
   {t:"mc", q:"Wer übt mit den Kindern für die Fahrradprüfung?", a:["Polizeihauptmeister Wagner","Kommissarin Demir","Herr Klein mit Rocky","Die Klassenlehrerin"], b:"Dafür kommt Polizeihauptmeister Wagner in die Schule."},
   {t:"mc", q:"Was ist laut Herrn Wagner das Allerwichtigste?", a:["Der Helm","Eine laute Klingel","Ein schnelles Fahrrad","Eine helle Lampe"], b:"Das Allerwichtigste ist der Helm"},
   {t:"wort", q:"Wie heißt der Blick über die Schulter vor dem Abbiegen?", pre:"Der", l:["Schulterblick"], b:"Dann zeigt er den Kindern den Schulterblick."},
   {t:"mc", q:"Was macht das silberne Auto?", a:["Es fährt zu dicht vorbei und streift Aylins Lenker.","Es hält an der Ampel.","Es hupt freundlich.","Es parkt am Supermarkt."], b:"Der Außenspiegel streift ihren Lenker."}
  ]},
  {text:[
   "„Aylin!“ Luis springt von seinem Fahrrad und rennt zu ihr. Aylin sitzt auf der Straße und hält sich das Knie. Ihre Hose ist zerrissen, und das Knie blutet. Ihr Helm hat eine lange Schramme. „Mein Kopf ist auf die Straße geknallt“, sagt sie zitternd. „Aber der Helm hat mich geschützt.“",
   "Luis hilft ihr vorsichtig an den Straßenrand. Eine Frau vom Supermarkt kommt angelaufen und bringt ein Pflaster. Luis holt sein Handy heraus und wählt die 110. „Ein Auto hat meine Freundin mit dem Fahrrad umgefahren und ist einfach weitergefahren“, sagt er. „An der Kreuzung beim Supermarkt.“",
   "Während sie warten, schaut sich Luis auf der Straße um. Da liegt etwas Glänzendes. Es ist ein abgebrochenes Stück von einem Außenspiegel. Silberfarben, mit einem gezackten Rand. Luis rührt es nicht an. „Das ist ein Beweisstück“, sagt er zu Aylin. „Das darf nur die Polizei aufheben.“",
   "Aylin denkt nach. „Auf der Heckklappe vom Auto war ein Aufkleber“, sagt sie. „Ein Hund mit einem Herz. Und darunter stand: Ich bremse auch für Tiere.“ Luis muss trotz allem grinsen. „Für Tiere bremst er, aber nicht für Kinder auf dem Fahrrad.“",
   "Ein paar Minuten später hält ein Streifenwagen an der Kreuzung. Kommissarin Demir steigt aus. „Ihr zwei schon wieder!“, sagt sie und kniet sich besorgt neben Aylin. In diesem Moment stößt Luis sie an. „Da! Da vorne an der Ampel!“ Ein silbernes Auto biegt gerade um die Ecke. Auf der Heckklappe klebt ein Aufkleber mit einem Hund. Und der rechte Außenspiegel fehlt."

   {t:"mc", q:"Was findet Luis auf der Straße?", a:["Ein Stück von einem Außenspiegel","Einen Autoschlüssel","Ein Nummernschild","Eine Brieftasche"], b:"Es ist ein abgebrochenes Stück von einem Außenspiegel."},
   {t:"mc", q:"Warum hebt Luis das Spiegelstück nicht auf?", a:["Es ist ein Beweisstück, das nur die Polizei aufheben darf.","Es ist zu heiß.","Es ist zu schwer.","Er hat Angst davor."], b:"Das darf nur die Polizei aufheben."},

  {text:[
   "Kommissarin Demir lässt das Spiegelstück zum Auto bringen. Die Spurensicherung hält es an den abgebrochenen Spiegel. Es passt genau, wie das letzte Teil eines Puzzles. Der gezackte Rand fügt sich perfekt in die Lücke.",

   "Da gibt der Mann es endlich zu. Er war spät dran und hat beim Fahren auf sein Handy geschaut. Deshalb hat er Aylin nicht richtig gesehen. Und dann hatte er Angst und ist einfach weitergefahren. „Das nennt man Unfallflucht“, erklärt die Kommissarin später. „Das ist verboten. Wer einen Unfall hat, muss immer anhalten und helfen.“",
   "Der Mann muss eine hohe Strafe bezahlen. Außerdem darf er drei Monate lang nicht Auto fahren. Seinen Führerschein muss er abgeben. Er schreibt Aylin einen Brief und entschuldigt sich. Und er bezahlt ihr einen neuen Helm.",
   "Eine Woche später ist die Fahrradprüfung. Aylin hat noch ein Pflaster am Knie, aber sie fährt sicher und konzentriert. Schulterblick, Arm raus, Gegenverkehr beachten – alles richtig. Luis schafft es auch. Herr Wagner überreicht beiden ihren Fahrradführerschein. Und Aylin klebt einen Aufkleber von der Polizei auf ihren neuen Helm: Helm auf – Kopf schlau!"

{
 id:"feuer3", titel:"Hochwasser am Mühlbach", emoji:"🌧️", thema:"Feuerwehr · Paul 3", farbe:"#C0392B",

 teile:[
  {text:[
   "Seit fünf Tagen regnet es ohne Pause. Der kleine Mühlbach, der mitten durch Pauls Stadt fließt, ist zu einem braunen, reißenden Fluss geworden. Das Wasser steht schon fast bis zum Rand der Ufermauer.",
   "Paul ist seit einem Monat bei der Jugendfeuerwehr. Am Samstagmorgen ruft Herr Krause alle Jugendlichen in die Feuerwache. „Wir müssen Sandsäcke füllen“, sagt er. „Wenn das Wasser über die Ufer tritt, bauen die Feuerwehrleute damit Mauern vor den Häusern.“",
   "Paul schaufelt Sand in Säcke, bis seine Arme brennen. Ein Sack ist ganz schön schwer. Neben ihm arbeitet Emma. Sie ist auch in die Jugendfeuerwehr gekommen. Ihr kleiner Bruder Tom, sieben Jahre alt, schaut zu. „Ich will das Hochwasser sehen!“, ruft er immer wieder. „Das ist bestimmt total spannend!“",
   "Herr Krause schüttelt ernst den Kopf. „Hochwasser ist nicht spannend, sondern gefährlich. Das Wasser ist viel stärker, als es aussieht. Es kann dich umreißen, selbst wenn es nur bis zu den Knien geht. Und unter dem braunen Wasser kann ein offener Gullydeckel sein. Niemals in Hochwasser hineingehen!“",
   "Am Nachmittag heulen plötzlich die Sirenen. Der Mühlbach ist über die Ufer getreten. In der Mühlenstraße steht das Wasser schon auf der Straße. Die Feuerwehrleute rennen zu den Fahrzeugen. Und da klingelt Emmas Handy. Sie hört kurz zu und wird blass. „Das war Mama“, flüstert sie. „Tom ist weg!“"

   {t:"wort", q:"Was füllt die Jugendfeuerwehr in der Feuerwache?", pre:"Sie füllen", l:["Sandsäcke","Säcke"], b:"Wir müssen Sandsäcke füllen"},
   {t:"mc", q:"Warum ist Hochwasser so gefährlich?", a:["Das Wasser kann einen umreißen, und darunter können offene Gullys sein.","Das Wasser ist sehr heiß.","Im Wasser schwimmen Haie.","Das Wasser ist giftig grün."], b:"Es kann dich umreißen, selbst wenn es nur bis zu den Knien geht."},
   {t:"mc", q:"Was erfährt Emma am Telefon?", a:["Ihr Bruder Tom ist verschwunden.","Ihr Haus ist trocken geblieben.","Die Schule fällt aus.","Die Katze hat Junge bekommen."], b:"Tom ist weg!"}

  {text:[
   "„Er wollte unbedingt das Hochwasser sehen“, schluchzt Emma. „Mama hat nur kurz die Wäsche aufgehängt. Da war er weg. Seine Gummistiefel fehlen auch.“ Herr Krause meldet es sofort über Funk an die Einsatzleitung. „Vermisstes Kind, sieben Jahre alt, wahrscheinlich in Richtung Mühlbach unterwegs.“",
   "Die Jugendfeuerwehr darf nicht mit zum Einsatz. Das ist viel zu gefährlich. Paul, Emma und die anderen bleiben mit Herrn Krause in der Feuerwache. Aus dem Funkgerät hören sie, wie die Feuerwehrleute nach Tom suchen. Aber sie finden ihn nicht.",
   "Paul denkt angestrengt nach. Wo könnte Tom hingegangen sein? Dann fällt es ihm ein. „Emma, die alte Steinbrücke!“, ruft er. „Weißt du noch? Im Sommer haben wir dort mit Tom Stöckchen-Rennen gespielt. Wir haben Stöcke ins Wasser geworfen und geschaut, welcher zuerst unter der Brücke durchschwimmt. Das hat er so geliebt!“",
   "Emma reißt die Augen auf. „Die Brücke im Mühlenweg! Da wollte er bestimmt hin!“ Herr Krause gibt die Information sofort weiter. „Einsatzleitung, hier Jugendfeuerwehr. Bitte an der alten Steinbrücke im Mühlenweg suchen.“",
   "Wenige Minuten später knistert das Funkgerät. Es ist Tante Mia. „Kind gefunden, an der Steinbrücke im Mühlenweg. Es steht auf dem Dach eines Autos mitten im Wasser. Die Strömung ist sehr stark.“ Dann eine Pause. „Achtung! Das Auto bewegt sich! Die Strömung schiebt es weg!“"
  ], fragen:[
   {t:"mc", q:"Warum darf die Jugendfeuerwehr nicht mit zum Einsatz?", a:["Es ist viel zu gefährlich.","Sie müssen Hausaufgaben machen.","Es gibt kein Auto für sie.","Sie sind zu müde."], b:"Das ist viel zu gefährlich."},
   {t:"mc", q:"Woran erinnert sich Paul?", a:["An das Stöckchen-Rennen an der alten Steinbrücke","An Toms Geburtstagsfeier","An einen Ausflug ans Meer","An Toms Lieblingsfilm"], b:"Im Sommer haben wir dort mit Tom Stöckchen-Rennen gespielt."},
   {t:"wort", q:"In welcher Straße ist die alte Steinbrücke?", pre:"Im", l:["Mühlenweg"], b:"Die Brücke im Mühlenweg!"},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Paul füllt in der Feuerwache Sandsäcke.","Die Sirenen heulen.","Emma erfährt, dass Tom weg ist.","Tante Mia meldet, dass Tom gefunden ist."]}

  {text:[
   "In der Feuerwache wird es ganz still. Alle starren auf das Funkgerät. Emma hält Pauls Hand so fest, dass es wehtut. Herr Krause legt beiden einen Arm um die Schultern.",

   "Im Funk hört man Wasserrauschen und Rufe. „Ich bin am Auto … Der Junge hat große Angst … Ich gebe ihm eine Rettungsweste …“ Dann knackt es lange. Niemand in der Feuerwache sagt ein Wort.",
   "„Seil festhalten! Zieht!“, ruft eine Stimme. Und dann endlich: „Wir haben ihn! Wir haben das Kind! Wir sind am Ufer.“ In der Feuerwache brechen alle in Jubel aus. Emma fällt Paul weinend um den Hals.",
   "Doch dann ruft Tante Mia noch einmal ins Funkgerät. Ihre Stimme klingt ernst. „Einsatzleitung, wir brauchen Hilfe am Kindergarten in der Mühlenstraße. Das Wasser steigt dort weiter. Die Sandsackmauer ist zu niedrig. Wenn wir sie nicht schnell höher machen, läuft das Wasser in den Keller mit der Heizung!“"

   {t:"mc", q:"Was sind Strömungsretter?", a:["Ausgebildete Feuerwehrleute, die an einem Seil gesichert ins Wasser gehen","Boote mit großem Motor","Hunde, die gut schwimmen können","Hubschrauber der Polizei"], b:"Strömungsretter sind besonders ausgebildete Feuerwehrleute."},
   {t:"wort", q:"Was gibt der Strömungsretter Tom zuerst?", pre:"Eine", l:["Rettungsweste"], b:"Ich gebe ihm eine Rettungsweste"},
   {t:"mc", q:"Welches neue Problem gibt es am Ende?", a:["Die Sandsackmauer am Kindergarten ist zu niedrig.","Tom ist wieder verschwunden.","Das Funkgerät ist kaputt.","Es fängt an zu schneien."], b:"Die Sandsackmauer ist zu niedrig."}

  {text:[
   "Herr Krause schaut auf die Jugendfeuerwehr. Dann auf die vielen gefüllten Sandsäcke in der Halle. „Die Säcke, die ihr heute gefüllt habt, werden jetzt gebraucht“, sagt er. „Wir laden sie auf den Lastwagen. Ihr tragt sie nur bis zum Tor. Weiter geht ihr nicht.“",
   "Alle packen mit an. Paul und Emma tragen zu zweit einen Sack nach dem anderen zum Tor. Dort laden ihn Feuerwehrleute auf den Lastwagen. Nach zwanzig Minuten ist der Lastwagen voll und fährt mit Blaulicht los.",
   "Eine Stunde später kommt die Nachricht über Funk: „Kindergarten gesichert. Die Mauer hält. Der Keller ist trocken.“ Herr Krause klatscht in die Hände. „Das war eure Arbeit! Ohne eure Sandsäcke hätten wir das nicht geschafft.“",
   "Am Abend kommt Tante Mia in die Feuerwache. Sie ist klatschnass und müde. Hinter ihr kommen Emmas Eltern mit Tom. Tom ist in eine Decke gewickelt und schaut auf den Boden. „Entschuldigung“, flüstert er. „Ich wollte nur das Wasser sehen. Ich wusste nicht, dass es so stark ist.“",
   "Tante Mia kniet sich zu ihm. „Jetzt weißt du es. Hochwasser schaut man sich nur von ganz weit weg an. Oder gar nicht.“ Dann wendet sie sich an Paul. „Und du hast heute zweimal geholfen: mit deinem guten Gedächtnis und mit deinen starken Armen.“ Paul wird ein bisschen rot. Aber er strahlt."
  ], fragen:[

   {t:"mc", q:"Was sagt Tom, als er sich entschuldigt?", a:["Er wusste nicht, dass das Wasser so stark ist.","Er hat sich verlaufen.","Er wollte schwimmen lernen.","Emma hat ihn geschickt."], b:"Ich wusste nicht, dass es so stark ist."},

{
 id:"feuer4", titel:"Feuer am Zeltlager", emoji:"⛺", thema:"Feuerwehr · Paul 4", farbe:"#C0392B",

 teile:[
  {text:[
   "In den Sommerferien fährt die Jugendfeuerwehr ins Zeltlager. Die Zelte stehen auf einer großen Wiese an einem See. Dahinter beginnt ein Kiefernwald. Paul teilt sich ein Zelt mit Emma und mit Lars, einem Jungen aus der Nachbarstadt. Lars hört abends immer Musik mit großen Kopfhörern.",
   "Es ist sehr heiß. Seit Wochen hat es nicht geregnet. Das Gras ist gelb und knistert unter den Schuhen. Am ersten Abend erklärt Herr Krause: „Heute gibt es kein Lagerfeuer. Im Wald gilt die höchste Waldbrandstufe. Ein einziger Funke kann reichen, und der ganze Wald brennt.“",
   "Stattdessen kochen sie Nudeln auf einem Gaskocher, auf einer Steinplatte weit weg vom Gras. Danach erklärt Herr Krause noch etwas Wichtiges. „Wenn nachts etwas passiert, treffen wir uns alle am Sammelplatz. Das ist der große Steg am See. Dort zählen wir durch, ob alle da sind.“",
   "Nach dem Abendessen gehen die Kinder schwimmen. Am anderen Ende der Wiese hat eine Familie gegrillt. Als sie nach Hause fahren, sieht Paul, dass sie ihren kleinen Einweggrill einfach im Gras am Waldrand stehen lassen. „Die haben ihren Müll vergessen“, denkt er.",
   "Mitten in der Nacht wacht Paul auf. Er muss aufs Klo. Als er aus dem Zelt kriecht, riecht er etwas. Rauch! Er schaut zum Waldrand. Zwischen den Bäumen flackert ein orangefarbenes Licht."
  ], fragen:[
   {t:"mc", q:"Mit wem teilt sich Paul das Zelt?", a:["Mit Emma und Lars","Mit Tante Mia","Mit Herrn Krause","Mit Tom und Ole"], b:"Paul teilt sich ein Zelt mit Emma und mit Lars"},
   {t:"mc", q:"Warum gibt es kein Lagerfeuer?", a:["Im Wald gilt die höchste Waldbrandstufe.","Es regnet zu stark.","Sie haben kein Holz dabei.","Herr Krause mag kein Feuer."], b:"Im Wald gilt die höchste Waldbrandstufe."},
   {t:"wort", q:"Wo ist der Sammelplatz?", pre:"Am großen", l:["Steg"], b:"Das ist der große Steg am See."},
   {t:"mc", q:"Was lässt die Familie am Waldrand stehen?", a:["Ihren Einweggrill","Ihr Zelt","Ihren Hund","Ihr Fahrrad"], b:"ihren kleinen Einweggrill einfach im Gras am Waldrand stehen lassen"}

  {text:[
   "Paul läuft nicht allein zum Feuer. Er rennt, so schnell er kann, zum Zelt von Herrn Krause. „Herr Krause! Aufwachen! Am Waldrand brennt es!“ Herr Krause ist sofort wach. Er schnappt sich den Feuerlöscher, der vor seinem Zelt steht, und läuft mit Paul los.",
   "Am Waldrand sehen sie, was passiert ist. Der Einweggrill war noch heiß. Er hat das trockene Gras darunter angezündet. Jetzt brennt ein Kreis, so groß wie ein Trampolin. Die Flammen sind noch klein, aber sie wandern langsam auf die ersten Bäume zu.",
   "Herr Krause sprüht mit dem Feuerlöscher auf die Flammen. Ein weißer Nebel zischt heraus. Das Feuer wird kleiner. „Paul, weck die anderen Betreuer!“, ruft er. „Sie sollen Eimer mit Wasser vom See holen. Ihr Kinder bleibt auf der Wiese!“",
   "Paul rennt zurück. Bald stehen die Betreuer in einer Reihe vom See bis zum Waldrand und reichen sich Eimer weiter. Das nennt man eine Eimerkette. Eimer um Eimer fliegt das Wasser auf die Flammen. Das Feuer zischt und qualmt.",
   "Doch dann kommt ein starker Windstoß. Er wirbelt glühende Funken hoch in die Luft. Die Funken fliegen über die Köpfe der Betreuer hinweg. Und landen in einem dichten, trockenen Gebüsch am Hang. Mit einem Fauchen schlagen dort neue Flammen hoch."
  ], fragen:[

   {t:"mc", q:"Wie ist das Feuer entstanden?", a:["Der heiße Einweggrill hat das trockene Gras angezündet.","Ein Blitz hat eingeschlagen.","Jemand hat eine Kerze vergessen.","Die Sonne hat das Gras angezündet."], b:"Er hat das trockene Gras darunter angezündet."},
   {t:"wort", q:"Wie heißt es, wenn viele Menschen sich in einer Reihe Eimer weiterreichen?", pre:"Eine", l:["Eimerkette"], b:"Das nennt man eine Eimerkette."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Herr Krause erklärt, warum es kein Lagerfeuer gibt.","Die Familie lässt den Einweggrill stehen.","Paul riecht in der Nacht Rauch.","Ein Windstoß wirbelt Funken ins Gebüsch."]}

  {text:[
   "„Das schaffen wir nicht mehr allein!“, ruft Herr Krause. Er holt sein Handy heraus und wählt die 112. „Waldbrand am Zeltlager am Kiefernsee. Das Feuer breitet sich am Hang aus. Im Lager sind zwanzig Kinder.“",
   "Dann dreht er sich zu Paul um. „Paul, du kennst den Plan. Weck alle Kinder. Alle gehen sofort zum Sammelplatz am Steg. Nichts mitnehmen. Nur Schuhe anziehen.“ Paul nickt. Sein Herz hämmert, aber er weiß genau, was zu tun ist.",
   "Er rennt von Zelt zu Zelt und ruft: „Feuer! Alle zum Steg! Sofort!“ Überall krabbeln verschlafene Kinder heraus. Einige weinen. Die Betreuer helfen den Kleinen. Emma nimmt ein Mädchen an die Hand, das vor Angst ganz starr ist.",
   "Am Steg zählt eine Betreuerin laut durch. „Achtzehn … neunzehn …“ Dann stockt sie. Sie zählt noch einmal. „Neunzehn. Es fehlt jemand!“ Paul schaut sich um. Emma ist da. Die beiden Zwillinge aus dem Nachbarzelt sind da. Aber wo ist Lars?",
   "Paul schaut zurück zur Wiese. Der Rauch zieht jetzt in dicken Schwaden über die Zelte. Und das Feuer am Hang ist schon ganz nah am letzten Zelt in der Reihe. Es ist das Zelt, in dem Paul, Emma und Lars schlafen."

   {t:"wort", q:"Wie viele Kinder sind im Zeltlager?", pre:"Es sind", post:"Kinder.", l:["zwanzig","20"], b:"Im Lager sind zwanzig Kinder."},
   {t:"mc", q:"Was sollen alle Kinder tun?", a:["Sofort zum Sammelplatz am Steg gehen","Ihre Sachen packen","Beim Löschen helfen","In den Zelten bleiben"], b:"Alle gehen sofort zum Sammelplatz am Steg."},
   {t:"mc", q:"Wie hilft Emma?", a:["Sie nimmt ein ängstliches Mädchen an die Hand.","Sie löscht das Feuer.","Sie ruft die Feuerwehr.","Sie packt die Zelte ein."], b:"Emma nimmt ein Mädchen an die Hand, das vor Angst ganz starr ist."},
   {t:"mc", q:"Wer fehlt am Sammelplatz?", a:["Lars","Emma","Herr Krause","Die Zwillinge"], b:"Aber wo ist Lars?"}

/* ================= App ================= */
const KEY = "lesetresor_v1";
const $app = document.getElementById("app");
let timers = [];
function clearTimers(){ timers.forEach(t=>{clearInterval(t);clearTimeout(t)}); timers=[]; }

function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return null;
}
let st = load() || {};
st.s = st.s || {};
st.set = Object.assign({pause:10, lesezeit:true, ton:true}, st.set||{});
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function ss(id){
  if(!st.s[id]) st.s[id] = {teil:0, phase:"read", done:false, sterne:[], fehler:[]};
  return st.s[id];
}
const byId = id => STORIES.find(x=>x.id===id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const sum = a => (a||[]).reduce((x,y)=>x+(y||0),0);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

/* Ton */
let actx=null;
function tone(freqs, dur){
  if(!st.set.ton) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=f;
      const t0=actx.currentTime+i*0.11;
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.18,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+dur+0.05);
    });
  }catch(e){}
}
const sndOk = ()=>tone([660,880],0.25);
const sndBad = ()=>tone([220],0.3);
const sndOpen = ()=>tone([523,659,784,1047],0.35);

function setColor(c){ document.body.style.setProperty("--c", c||"var(--accent)"); }

/* ---------- Übersicht ---------- */
function home(){
  clearTimers(); setColor(null); window.scrollTo(0,0);
  const totalStars = STORIES.reduce((n,s)=>n+sum(ss(s.id).sterne),0);
  const maxStars = STORIES.reduce((n,s)=>n+s.teile.length*4,0);
  let h = `<header class="hero"><h1>Lese-<span>Tresor</span> 🔐</h1>
    <p>Spannende Geschichten in mehreren Teilen. Jeder neue Teil ist verschlossen – beantworte 4 Fragen richtig, dann knackst du das Schloss!</p>
    <div class="total">⭐ ${totalStars} von ${maxStars} Sternen</div></header><div class="wrap">`;
  SERIES.forEach(se=>{
   const done = se.ids.filter(id=>ss(id).done).length;
   h += `<h2 class="serie">${se.emoji} ${esc(se.name)} <span>${done}/${se.ids.length} geschafft</span></h2><div class="grid">`;
   se.ids.map(byId).forEach(s=>{
    const p = ss(s.id), n = s.teile.length;
    const doneParts = p.done ? n : p.teil;
    const pct = Math.round(doneParts/n*100);
    const status = p.done ? `<span class="badge-done">${s.abzeichenEmoji} geschafft!</span>` : (doneParts===0 && p.phase==="read" ? "Neu" : `Teil ${p.teil+1} von ${n}`);
    h += `<button class="card" style="--c:${s.farbe}" data-id="${s.id}">
      <div class="emo">${s.emoji}</div>
      <div style="flex:1;min-width:0"><h3>${esc(s.titel)}</h3><div class="theme">${esc(s.thema)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="meta"><span>${status}</span><span>⭐ ${sum(p.sterne)}/${n*4}</span></div></div></button>`;
   });
   h += `</div>`;
  });
  h += `<div class="foot"><button class="hold" id="hold"><i></i><span>⚙︎ Für Erwachsene (gedrückt halten)</span></button></div></div>`;
  $app.innerHTML = h;
  $app.querySelectorAll(".card").forEach(b=>b.onclick=()=>openStory(b.dataset.id));
  setupHold(document.getElementById("hold"), adults);
}

function openStory(id){
  const p = ss(id);
  if(p.done) return read(id, 0);
  if(p.phase==="quiz") return quiz(id);
  if(p.phase==="unlocked") return unlocked(id);
  read(id);
}

/* ---------- Lesen ---------- */
function topbar(s, active){
  const p = ss(s.id);
  let dots = s.teile.map((_,i)=>{
    const cls = (p.done || i<p.teil) ? "on" : (i===active ? "now" : "");
    return `<b class="${cls}"></b>`;
  }).join("");
  return `<div class="top"><button class="back" id="back">← Übersicht</button>
    <div class="ttl"><h2>${s.emoji} ${esc(s.titel)}</h2><div class="dots">${dots}</div></div></div>`;
}
function paras(arr){ return arr.map(t=>`<p>${esc(t)}</p>`).join(""); }
function words(arr){ return arr.join(" ").split(/\s+/).length; }

function read(id, freeIdx){
  clearTimers(); window.scrollTo(0,0);
  const s = byId(id), p = ss(id); setColor(s.farbe);
  const free = p.done;
  const idx = free ? (freeIdx||0) : p.teil;
  const teil = s.teile[idx];
  let recap = "";
  if(idx>0){
    const prev = s.teile[idx-1].text;
    recap = `<div class="recap"><b>Was zuletzt geschah:</b> ${esc(prev[prev.length-1])}</div>`;
  }
  let h = `<div class="wrap">${topbar(s, idx)}<div class="paper"><h3>Teil ${idx+1} von ${s.teile.length}</h3>${recap}<div class="story">${paras(teil.text)}</div></div>`;
  if(free){
    h += `<div class="navrow">${idx>0?`<button class="btn ghost" id="prev">← Teil ${idx}</button>`:""}
      ${idx<s.teile.length-1?`<button class="btn primary" id="next">Teil ${idx+2} →</button>`:`<button class="btn primary" id="fin">Zur Übersicht</button>`}</div>`;
  } else {
    h += `<button class="btn primary" id="go"><span class="fill" id="fill"></span><span class="lbl" id="golbl">🔐 Zum Schloss – Fragen beantworten</span></button>`;
    if(idx>0) h += `<button class="link" id="older">📖 Frühere Teile nochmal lesen</button>`;
  }
  h += `</div>`;
  $app.innerHTML = h;
  document.getElementById("back").onclick = home;
  if(free){
    const pv=document.getElementById("prev"), nx=document.getElementById("next"), fi=document.getElementById("fin");
    if(pv) pv.onclick=()=>read(id,idx-1);
    if(nx) nx.onclick=()=>read(id,idx+1);
    if(fi) fi.onclick=home;
    return;
  }
  const older=document.getElementById("older"); if(older) older.onclick=()=>textOverlay(s, idx-1);
  const go = document.getElementById("go"), fill=document.getElementById("fill"), lbl=document.getElementById("golbl");
  const need = st.set.lesezeit ? Math.round(words(teil.text)*0.3) : 0; // Sekunden
  const t0 = Date.now();
  const startQuiz = ()=>{ p.phase="quiz"; save(); quiz(id); };
  if(need>0){
    go.disabled = true;
    const tick = ()=>{
      const el = (Date.now()-t0)/1000;
      const left = Math.max(0, Math.ceil(need-el));
      fill.style.width = Math.min(100, el/need*100)+"%";
      if(left>0){ lbl.textContent = `📖 Erst in Ruhe lesen … (${left})`; }
      else { go.disabled=false; fill.style.width="0"; lbl.textContent="🔐 Zum Schloss – Fragen beantworten"; clearTimers(); }
    };
    tick(); timers.push(setInterval(tick, 500));
  }
  go.onclick = ()=>{ if(!go.disabled) startQuiz(); };
}

/* Text-Overlay (nachsehen) */
function textOverlay(s, upto){
  const ov = document.createElement("div"); ov.className="ov";
  let h = `<div class="sheet" style="--c:${s.farbe}"><h2>📖 ${esc(s.titel)}</h2>`;
  for(let i=0;i<=upto;i++){
    h += `<div class="paper" style="margin-top:14px"><h3>Teil ${i+1}</h3><div class="story">${paras(s.teile[i].text)}</div></div>`;
  }
  h += `<button class="btn primary" id="close">Schließen</button></div>`;
  ov.innerHTML = h; document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector("#close").onclick=close;
  ov.onclick=e=>{ if(e.target===ov) close(); };
}

/* ---------- Fragen ---------- */
let Q = null;
function quiz(id){
  clearTimers(); window.scrollTo(0,0);
  const s = byId(id), p = ss(id); setColor(s.farbe);
  const teil = s.teile[p.teil];
  Q = { id, s, p, teil, list: teil.fragen.map(f=>({f, tries:0, order:null})), cur:0, opened:0, stars:0, sel:null, seq:[] };
  Q.list.forEach(it=>prepare(it));
  p.fehler[p.teil] = p.fehler[p.teil]||0;
  renderQ();
}
function prepare(it){
  const f = it.f;
  if(f.t==="mc"){
    const old = it.order ? it.order.indexOf(0) : -1;
    let ord; do{ ord = shuffle([0,1,2,3].slice(0,f.a.length)); }while(old!==-1 && ord.indexOf(0)===old);
    it.order = ord;
  } else if(f.t==="folge"){
    let ord; do{ ord = shuffle(f.a.map((_,i)=>i)); }while(ord.every((v,i)=>v===i));
    it.order = ord;
  }
}
function renderQ(){
  const {s,p,list,cur} = Q; const it = list[cur], f = it.f;
  Q.sel = null; Q.seq = [];
  const locks = list.map((_,i)=>`<span class="${i<Q.opened?'':''}">${i<Q.opened?"🔓":"🔒"}</span>`).join("");
  let body = "";
  if(f.t==="mc"){
    body = `<div class="answers">${it.order.map((k,n)=>`<button class="ans" data-k="${k}"><span class="no">${"ABCD"[n]}</span>${esc(f.a[k])}</button>`).join("")}</div>`;
  } else if(f.t==="wort"){
    body = `<div class="wordrow"><span>${esc(f.pre||"")}</span><input id="w" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Wort eintippen">${f.post?`<span>${esc(f.post)}</span>`:""}</div><div class="hint">✏️ Das Wort steht so im Text. Schreib es ab, wenn du es gefunden hast.</div>`;
  } else if(f.t==="folge"){
    body = `<div class="answers" id="fl">${it.order.map(k=>`<button class="ans" data-k="${k}"><span class="no">·</span>${esc(f.a[k])}</button>`).join("")}</div><button class="link" id="reset">↺ Neu anfangen</button>`;
  }
  $app.innerHTML = `<div class="wrap">${topbar(s,p.teil)}
    <div class="locks" id="locks">${locks}</div>
    <div class="paper qcard" id="qc"><div class="qnum">Schloss ${cur+1} von ${list.length}</div><h2>${esc(f.q)}</h2>${body}<div class="feedback" id="fb"></div></div>
    <button class="btn primary" id="check" disabled>Prüfen</button>
    <button class="link" id="peek">📖 Im Text nachsehen</button></div>`;
  document.getElementById("back").onclick = home;
  document.getElementById("peek").onclick = ()=>textOverlay(s, p.teil);
  const btn = document.getElementById("check");
  if(f.t==="mc"){
    $app.querySelectorAll(".ans").forEach(b=>b.onclick=()=>{
      $app.querySelectorAll(".ans").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); Q.sel = +b.dataset.k; btn.disabled=false;
    });
  } else if(f.t==="wort"){
    const w = document.getElementById("w");
    w.oninput = ()=>{ btn.disabled = w.value.trim().length===0; };
    w.onkeydown = e=>{ if(e.key==="Enter" && !btn.disabled) btn.click(); };
  } else if(f.t==="folge"){
    const upd = ()=>{
      $app.querySelectorAll("#fl .ans").forEach(b=>{
        const k=+b.dataset.k, pos=Q.seq.indexOf(k);
        b.classList.toggle("sel", pos>-1);
        b.querySelector(".no").textContent = pos>-1 ? pos+1 : "·";
      });
      btn.disabled = Q.seq.length !== f.a.length;
    };
    $app.querySelectorAll("#fl .ans").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, pos=Q.seq.indexOf(k);
      if(pos>-1) Q.seq = Q.seq.slice(0,pos); else Q.seq.push(k);
      upd();
    });
    document.getElementById("reset").onclick=()=>{Q.seq=[];upd();};
  }
  btn.onclick = check;
}

function norm(x){
  return String(x).toLowerCase().replace(/[„“"'.,!?;:()\-–—]/g,"").replace(/\s+/g,"")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
}
function lev(a,b){
  const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]);
  for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}

function check(){
  const it = Q.list[Q.cur], f = it.f;
  const btn = document.getElementById("check"), fb = document.getElementById("fb");
  let ok=false;
  if(f.t==="mc") ok = Q.sel===0;
  else if(f.t==="folge") ok = Q.seq.every((v,i)=>v===i);
  else if(f.t==="wort"){
    const v = norm(document.getElementById("w").value);
    const sol = f.l.map(norm);
    ok = sol.includes(v);
    if(!ok && v.length>=4 && sol.some(x=>x.length>=4 && lev(v,x)===1)){
      fb.className="feedback soft"; fb.textContent="Fast! Schau noch einmal genau, wie das Wort im Text geschrieben ist.";
      return;
    }
  }
  btn.disabled = true;
  if(ok){
    if(it.tries===0) Q.stars++;
    Q.opened++;
    sndOk();
    fb.className="feedback ok"; fb.textContent = it.tries===0 ? "Richtig – beim ersten Versuch! ⭐ Schloss geknackt!" : "Richtig! Schloss geknackt! 🔓";
    const lk = document.querySelectorAll("#locks span")[Q.cur];
    if(lk){ lk.textContent="🔓"; lk.classList.add("open"); }
    $app.querySelectorAll(".ans").forEach(b=>b.disabled=true);
    timers.push(setTimeout(()=>{
      Q.cur++;
      if(Q.cur>=Q.list.length) finishQuiz(); else renderQ();
    }, 1400));
  } else {
    it.tries++;
    Q.p.fehler[Q.p.teil] = (Q.p.fehler[Q.p.teil]||0)+1; save();
    sndBad();
    const qc=document.getElementById("qc"); qc.classList.remove("shake"); void qc.offsetWidth; qc.classList.add("shake");
    timers.push(setTimeout(()=>pauseOverlay(it), 500));
  }
}

function highlightPara(s, f, teilIdx){
  if(!f.b) return null;
  const ti = (f.bt!=null) ? f.bt : teilIdx;
  const tx = s.teile[ti].text;
  const para = tx.find(p=>p.includes(f.b));
  if(!para) return null;
  const i = para.indexOf(f.b);
  return esc(para.slice(0,i)) + "<mark>" + esc(f.b) + "</mark>" + esc(para.slice(i+f.b.length));
}

function pauseOverlay(it){
  const {s,p} = Q, f = it.f;
  const secs = Math.min(40, st.set.pause + 5*(it.tries-1));
  const passage = highlightPara(s, f, p.teil);
  const ov = document.createElement("div"); ov.className="ov";
  const msg = f.t==="folge"
    ? `<p>Überlege noch einmal: Was ist <b>zuerst</b> passiert, was danach? Du kannst im Text nachsehen.</p>`
    : `<p>Lies diese Stelle noch einmal <b>ganz genau</b>. Dort findest du die Antwort:</p>
       <div class="passage story"><p>${passage||""}</p></div>`;
  const R=26, C=2*Math.PI*R;
  ov.innerHTML = `<div class="sheet" style="--c:${s.farbe}">
    <h2><span class="bad">Hmm, das stimmt noch nicht.</span></h2>
    ${msg}
    <div class="timer"><div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="${R}" fill="none" stroke="#E8DFCF" stroke-width="7"/>
      <circle id="rc" cx="32" cy="32" r="${R}" fill="none" stroke="${s.farbe}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><b id="rs">${secs}</b></div>
      <div class="small">Denkpause: Nimm dir Zeit zum Nachlesen. Raten lohnt sich nicht – jede falsche Antwort macht die Pause länger.</div></div>
    ${f.t==="folge"?`<button class="btn ghost" id="look">📖 Text ansehen</button>`:""}
    <button class="btn primary" id="again" disabled>⏳ Bitte warten …</button></div>`;
  document.body.appendChild(ov);
  const look = ov.querySelector("#look"); if(look) look.onclick=()=>textOverlay(s,p.teil);
  const again = ov.querySelector("#again"), rc=ov.querySelector("#rc"), rs=ov.querySelector("#rs");
  const t0 = Date.now();
  const iv = setInterval(()=>{
    const el=(Date.now()-t0)/1000, left=Math.max(0,Math.ceil(secs-el));
    rs.textContent = left; rc.setAttribute("stroke-dashoffset", String(C*Math.min(1,el/secs)));
    if(left<=0){ clearInterval(iv); again.disabled=false; again.textContent="Ich habe nachgelesen – nochmal versuchen"; rs.textContent="✓"; }
  },200);
  timers.push(iv);
  again.onclick=()=>{ ov.remove(); prepare(it); renderQ(); };
}

function finishQuiz(){
  const {id,s,p} = Q;
  p.sterne[p.teil] = Math.max(p.sterne[p.teil]||0, Q.stars);
  if(p.teil >= s.teile.length-1){ p.done=true; p.phase="read"; save(); return done(id); }
  p.phase="unlocked"; save(); unlocked(id, Q.stars);
}

function unlocked(id, stars){
  clearTimers(); window.scrollTo(0,0);
  const s=byId(id), p=ss(id); setColor(s.farbe);
  const st_ = stars!=null ? stars : (p.sterne[p.teil]||0);
  sndOpen();
  $app.innerHTML = `<div class="wrap">${topbar(s,p.teil)}<div class="paper center">
    <div class="big vaultdoor">🔓</div><h2 style="font-size:1.8rem;color:${s.farbe}">Tresor geknackt!</h2>
    <div class="stars">${"⭐".repeat(st_)}${"☆".repeat(4-st_)}</div>
    <p>${st_===4?"Wow – alle Fragen beim ersten Versuch!":"Super gemacht! Sterne gibt es für Antworten, die beim ersten Versuch stimmen."}</p>
    <p><b>Teil ${p.teil+2}</b> wartet auf dich. Wie geht es wohl weiter?</p></div>
    <button class="btn primary" id="go">Weiterlesen →</button>
    <button class="link" id="later">Später weiterlesen</button></div>`;
  document.getElementById("back").onclick=home;
  document.getElementById("later").onclick=()=>{ p.teil++; p.phase="read"; save(); home(); };
  document.getElementById("go").onclick=()=>{ p.teil++; p.phase="read"; save(); read(id); };
}

function done(id){
  clearTimers(); window.scrollTo(0,0);
  const s=byId(id), p=ss(id); setColor(s.farbe);
  const tot = sum(p.sterne), max = s.teile.length*4;
  tone([523,659,784,1047,1319],0.4);
  $app.innerHTML = `<div class="wrap">${topbar(s,s.teile.length-1)}<div class="paper center">
    <div class="big vaultdoor">${s.abzeichenEmoji}</div>
    <h2 style="font-size:1.8rem;color:${s.farbe}">Geschichte geschafft!</h2>
    <p>Du hast das <b>${esc(s.abzeichen)}</b> bekommen.</p>
    <div class="stars">⭐ ${tot} von ${max}</div>
    <p class="small">Du kannst die Geschichte jederzeit noch einmal ganz lesen.</p></div>
    <button class="btn primary" id="home">Zur Übersicht</button>
    <button class="link" id="again">📖 Ganze Geschichte nochmal lesen</button></div>`;
  document.getElementById("back").onclick=home;
  document.getElementById("home").onclick=home;
  document.getElementById("again").onclick=()=>read(id,0);
}

/* ---------- Erwachsenen-Bereich ---------- */
function setupHold(el, fn){
  let t=null, iv=null, start=0; const bar=el.querySelector("i");
  const stop=()=>{ clearTimeout(t); clearInterval(iv); bar.style.width="0"; };
  const begin=e=>{ e.preventDefault(); start=Date.now();
    iv=setInterval(()=>{ bar.style.width=Math.min(100,(Date.now()-start)/1500*100)+"%"; },50);
    t=setTimeout(()=>{ stop(); fn(); },1500); };
  el.addEventListener("pointerdown",begin); el.addEventListener("pointerup",stop); el.addEventListener("pointerleave",stop); el.addEventListener("pointercancel",stop);
  el.addEventListener("contextmenu",e=>e.preventDefault());
}
function adults(){
  const ov=document.createElement("div"); ov.className="ov";
  let rows="";
  STORIES.forEach(s=>{
    const p=ss(s.id);
    const parts=s.teile.map((_,i)=>{
      const reached = p.done || i<p.teil || (i===p.teil && p.phase!=="read");
      return reached ? `${p.fehler[i]||0} / ${p.sterne[i]!=null?p.sterne[i]+"⭐":"–"}` : "–";
    }).join("</td><td>");
    rows+=`<tr><td>${s.emoji}</td><td>${parts}</td><td><button class="danger" data-r="${s.id}" style="padding:4px 8px;margin:0">↺</button></td></tr>`;
  });
  ov.innerHTML=`<div class="sheet"><h2>⚙︎ Für Erwachsene</h2>
    <p class="small">Pro Teil: Fehlversuche / Sterne (Sterne = beim ersten Versuch richtig, max. 4). Viele Fehlversuche bei wenig Sternen zeigen, wo das Kind noch geraten hat.</p>
    <table><tr><th></th><th>T1</th><th>T2</th><th>T3</th><th>T4</th><th></th></tr>${rows}</table>
    <div class="set"><span>Denkpause nach falscher Antwort<br><span class="small">wird pro weiterem Fehler um 5 s länger</span></span>
      <select id="sp">${[5,10,15,20].map(v=>`<option ${st.set.pause===v?"selected":""} value="${v}">${v} Sekunden</option>`).join("")}</select></div>
    <div class="set"><span>Mindest-Lesezeit vor den Fragen</span><select id="sl"><option value="1" ${st.set.lesezeit?"selected":""}>an</option><option value="0" ${!st.set.lesezeit?"selected":""}>aus</option></select></div>
    <div class="set"><span>Töne</span><select id="st"><option value="1" ${st.set.ton?"selected":""}>an</option><option value="0" ${!st.set.ton?"selected":""}>aus</option></select></div>
    <p class="small" style="margin-top:12px">↺ setzt eine einzelne Geschichte zurück.</p>
    <button class="danger" id="all">Alles zurücksetzen</button>
    <button class="btn primary" id="close">Schließen</button></div>`;
  document.body.appendChild(ov);
  ov.querySelector("#sp").onchange=e=>{st.set.pause=+e.target.value;save();};
  ov.querySelector("#sl").onchange=e=>{st.set.lesezeit=e.target.value==="1";save();};
  ov.querySelector("#st").onchange=e=>{st.set.ton=e.target.value==="1";save();};
  ov.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const s=byId(b.dataset.r);
    if(confirm(`„${s.titel}“ wirklich zurücksetzen?`)){ delete st.s[s.id]; save(); ov.remove(); home(); }
  });
  ov.querySelector("#all").onclick=()=>{ if(confirm("Wirklich den ganzen Fortschritt löschen?")){ st.s={}; save(); ov.remove(); home(); } };
  ov.querySelector("#close").onclick=()=>{ ov.remove(); home(); };
}

home();
</script>
