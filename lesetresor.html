{
 id:"luna2", titel:"Notsignal am Mondkrater", emoji:"🌕", thema:"Weltraum · Ella & Pixel 2", farbe:"#3D3F96",
 abzeichen:"Morse-Medaille", abzeichenEmoji:"📡",
 teile:[
  {text:[
   "Ein Jahr nach dem großen Alarm darf Ella wieder auf die Mondstation Luna 7. Pixel wartet schon an der Schleuse. Auf seinem Bildschirm blinkt ein rotes Herz, als er sie sieht. „Ella! Ich habe eine Überraschung“, piepst er. „Morgen fahren wir mit dem Mondauto zu einem großen Krater!“",
   "Das Mondauto heißt Hüpfer. Es hat sechs große Räder und eine Kabine aus Glas. Kommandant Okafor gibt Ellas Mutter letzte Anweisungen: „Ihr habt Sauerstoff für drei Stunden. Und haltet euch vom Kraterrand fern. Dort ist der Staub weich und tief.“",
   "Am nächsten Morgen ziehen Ella und ihre Mutter ihre Raumanzüge an. Pixel rollt hinten auf die Ladefläche. Dann geht es los. Der Hüpfer schaukelt über Steine und kleine Hügel. Hinter ihnen wird die Station immer kleiner.",
   "Nach einer Stunde erreichen sie den Krater. Er ist riesig, so groß wie eine ganze Stadt. Ellas Mutter sammelt Mondgestein in kleine Beutel. Ella hilft ihr. Sie findet einen Stein, der in der Sonne glitzert, als wären Sterne darin.",
   "„Ein paar Meter weiter vorne liegen besonders schöne Steine“, sagt Ellas Mutter und fährt den Hüpfer ein Stück näher heran. Doch plötzlich gibt der Boden nach. Das Mondauto kippt nach vorne. Und ganz langsam beginnt es, auf den Kraterrand zuzurutschen."
  ], fragen:[
   {t:"wort", q:"Wie heißt das Mondauto?", pre:"Es heißt", l:["Hüpfer"], b:"Das Mondauto heißt Hüpfer."},
   {t:"mc", q:"Für wie lange haben sie Sauerstoff dabei?", a:["Für drei Stunden","Für einen ganzen Tag","Für zehn Minuten","Für eine Woche"], b:"Ihr habt Sauerstoff für drei Stunden."},
   {t:"mc", q:"Warum sollen sie sich vom Kraterrand fernhalten?", a:["Dort ist der Staub weich und tief.","Dort ist es viel zu heiß.","Dort wohnen Mondtiere.","Dort gibt es kein Licht."], b:"Dort ist der Staub weich und tief."},
   {t:"mc", q:"Was ist an Ellas Stein besonders?", a:["Er glitzert, als wären Sterne darin.","Er ist ganz weich.","Er ist grün.","Er schwebt in der Luft."], b:"als wären Sterne darin"}
  ]},
  {text:[
   "Ellas Mutter tritt fest auf die Bremse. Mit einem Ruck bleibt der Hüpfer stehen – nur einen Meter vor dem Abgrund. Ella krallt sich an ihrem Sitz fest. Ihr Herz hämmert.",
   "„Alles in Ordnung?“, fragt ihre Mutter. Ella nickt. Ihre Mutter versucht, rückwärts zu fahren. Die Räder drehen sich, aber sie wirbeln nur Staub auf. Das vordere Rad steckt tief im weichen Mondstaub fest.",
   "„Ich rufe die Station“, sagt Ellas Mutter und drückt auf den Funkknopf. „Luna 7, hier Hüpfer. Bitte melden.“ Es rauscht nur. Pixel rollt zur Antenne auf dem Dach. „Die Antenne ist verbogen“, piepst er. „Ein Stein hat sie beim Rutschen getroffen. Wir können nicht funken.“",
   "Ella schaut auf die Anzeige an ihrem Handgelenk. Sauerstoff: noch zwei Stunden. Und die Station liegt hinter einem großen Hügel. Von dort kann niemand sie sehen.",
   "„Ich fahre auf den Hügel“, piepst Pixel. „Von oben kann ich die Station vielleicht mit meinem eigenen Funk erreichen.“ Bevor jemand etwas sagen kann, rollt er los. Ella beobachtet, wie er den steilen Hang hinaufkurvt. Fast ist er oben. Da rutscht er auf einem Stein aus, überschlägt sich und verschwindet hinter den Felsen."
  ], fragen:[
   {t:"mc", q:"Warum kann der Hüpfer nicht zurückfahren?", a:["Das vordere Rad steckt im weichen Staub fest.","Der Motor ist kaputt.","Es ist kein Strom mehr da.","Ein Felsen versperrt den Weg."], b:"Das vordere Rad steckt tief im weichen Mondstaub fest."},
   {t:"mc", q:"Warum können sie die Station nicht anfunken?", a:["Die Antenne ist verbogen.","Auf der Station schlafen alle.","Ella hat das Funkgerät verloren.","Es ist zu laut."], b:"Die Antenne ist verbogen"},
   {t:"mc", q:"Warum kann die Station sie nicht sehen?", a:["Die Station liegt hinter einem großen Hügel.","Es ist dunkel.","Der Hüpfer ist zu klein.","Die Fenster der Station sind schmutzig."], b:"Und die Station liegt hinter einem großen Hügel."},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Pixel begrüßt Ella an der Schleuse.","Ella findet einen glitzernden Stein.","Der Hüpfer rutscht auf den Kraterrand zu.","Pixel fährt auf den Hügel."]}
  ]},
  {text:[
   "„Pixel!“, ruft Ella. Ihre Mutter legt ihr die Hand auf die Schulter. „Wir holen ihn. Aber langsam und vorsichtig.“ Zusammen steigen sie aus dem Hüpfer. Auf dem Mond ist man viel leichter als auf der Erde. Mit großen, weichen Sprüngen hüpfen sie den Hügel hinauf.",
   "Hinter den Felsen liegt Pixel auf dem Rücken. Seine Räder drehen sich in der Luft. „Ich bin wie ein Käfer“, piepst er traurig. Ella und ihre Mutter drehen ihn vorsichtig um. Er ist zum Glück nicht kaputt.",
   "Von oben auf dem Hügel kann Ella in der Ferne die Station sehen. Ihre Lichter blinken klein wie Sterne. Pixel versucht zu funken. Aber sein Funk ist zu schwach. Niemand antwortet.",
   "Da hat Ella eine Idee. In der Schule hat sie das Morsealphabet gelernt. „SOS“, sagt sie. „Das ist das Notsignal. Drei kurze, drei lange, drei kurze. Wir können es mit der Lampe an meinem Helm blinken!“ Ihre Mutter staunt. „Die Station hat eine Kamera, die genau in unsere Richtung schaut. Versuch es!“",
   "Ella blinkt: kurz, kurz, kurz – lang, lang, lang – kurz, kurz, kurz. Wieder und wieder. Aber nichts passiert. Die Minuten vergehen. Dann piept es laut an Ellas Handgelenk. Auf der Anzeige leuchtet eine rote Warnung: Sauerstoff – noch 30 Minuten."
  ], fragen:[
   {t:"mc", q:"Warum können Ella und ihre Mutter so große Sprünge machen?", a:["Auf dem Mond ist man viel leichter als auf der Erde.","Sie haben Sprungfedern an den Schuhen.","Pixel schiebt sie an.","Der Hügel ist ganz flach."], b:"Auf dem Mond ist man viel leichter als auf der Erde."},
   {t:"mc", q:"Womit vergleicht sich Pixel, als er auf dem Rücken liegt?", a:["Mit einem Käfer","Mit einer Schildkröte","Mit einem Ball","Mit einem Stein"], b:"Ich bin wie ein Käfer"},
   {t:"wort", q:"Welches Notsignal blinkt Ella?", pre:"Das Notsignal heißt", l:["SOS"], b:"„SOS“, sagt sie."},
   {t:"mc", q:"Wie blinkt man SOS?", a:["Drei kurze, drei lange, drei kurze","Einmal ganz lang","Zehnmal ganz schnell","Zwei kurze und ein langer"], b:"Drei kurze, drei lange, drei kurze."}
  ]},
  {text:[
   "Ella blinkt weiter. Ihre Finger sind müde, aber sie hört nicht auf. Kurz, kurz, kurz – lang, lang, lang – kurz, kurz, kurz. Plötzlich blitzt es an der Station auf. Ein helles Licht. Es blinkt zurück: kurz, lang, kurz.",
   "„Was heißt das?“, fragt ihre Mutter. Ella strahlt. „Das ist ein R! Das bedeutet: Verstanden!“ Pixel dreht sich vor Freude im Kreis und wirbelt eine Staubwolke auf.",
   "Zwanzig Minuten später rollt ein zweites, größeres Mondauto über den Hügel. Am Steuer sitzt Kommandant Okafor. Er bringt neue Sauerstoffflaschen mit und ein langes Stahlseil. Damit zieht er den Hüpfer vorsichtig aus dem weichen Staub, weg vom Kraterrand.",
   "Zurück auf der Station gibt es heiße Schokolade. „Deine SOS-Zeichen haben wir auf der Kamera gesehen“, sagt Kommandant Okafor. „Ohne dich hätten wir euch nicht so schnell gefunden.“ Dann lacht er. „Ab morgen bringst du der ganzen Besatzung das Morsealphabet bei.“",
   "Pixel bekommt eine neue, extra starke Antenne. Und Ella behält den glitzernden Stein vom Kraterrand. Sie nennt ihn ihren Sternenstein. Am Abend blinkt Pixel ihr vor dem Schlafengehen eine Morsenachricht auf seinem Bildschirm. Ella übersetzt sie leise und lächelt: G-U-T-E N-A-C-H-T."
  ], fragen:[
   {t:"mc", q:"Was antwortet die Station mit ihrem Licht?", a:["Ein R – das bedeutet: Verstanden!","Ebenfalls SOS","Gar nichts","Ein buntes Feuerwerk"], b:"Das ist ein R! Das bedeutet: Verstanden!"},
   {t:"mc", q:"Was bringt Kommandant Okafor mit?", a:["Neue Sauerstoffflaschen und ein langes Stahlseil","Eine Leiter und ein Zelt","Ein neues Mondauto für Ella","Essen und Decken"], b:"Er bringt neue Sauerstoffflaschen mit und ein langes Stahlseil."},
   {t:"mc", q:"Was soll Ella ab morgen tun?", a:["Der Besatzung das Morsealphabet beibringen","Allein mit dem Hüpfer fahren","Pixel reparieren","Zur Erde zurückfliegen"], b:"Ab morgen bringst du der ganzen Besatzung das Morsealphabet bei."},
   {t:"wort", q:"Wie nennt Ella den glitzernden Stein?", pre:"Ihren", l:["Sternenstein"], b:"Sie nennt ihn ihren Sternenstein."}
  ]}
 ]
},
{
 id:"polizei2", titel:"Kommissarin Demir und der falsche Polizist", emoji:"📞", thema:"Polizei · Luis & Aylin 2", farbe:"#2456A6",
 abzeichen:"Sicherheits-Profi", abzeichenEmoji:"🛡️",
 teile:[
  {text:[
   "Kommissarin Demir besucht heute die Klasse von Luis und Aylin. Sie erzählt von ihrer Arbeit. Am Ende sagt sie etwas sehr Wichtiges: „Es gibt Betrüger, die am Telefon so tun, als wären sie von der Polizei. Sie wollen vor allem älteren Menschen Geld und Schmuck abnehmen. Aber merkt euch: Echte Polizisten fragen am Telefon niemals nach Geld oder Schmuck!“",
   "Am Nachmittag besucht Aylin ihre Oma Leyla. Oma wohnt allein in einer Wohnung im zweiten Stock. Es gibt Tee und frische Pfannkuchen. Aylin erzählt gerade von der Kommissarin, da klingelt das Telefon.",
   "Oma nimmt ab. Aylin hört nur, was Oma sagt. „Ja … Polizei? Oh nein … Einbrecher hier in der Straße? … Ja, ich habe Schmuck und etwas Geld im Schrank …“ Omas Gesicht wird immer blasser.",
   "Dann legt Oma auf. „Das war ein Kommissar Wolf“, sagt sie aufgeregt. „Er sagt, in unserer Straße sind Einbrecher unterwegs. Ein Polizist kommt gleich vorbei. Ich soll ihm meinen Schmuck und mein Geld geben. Er bringt alles in Sicherheit.“",
   "Aylin bekommt ein ganz komisches Gefühl im Bauch. Sie denkt an die Worte von Kommissarin Demir. „Oma, warte!“, sagt sie. Doch in diesem Moment klingelt es schon an der Wohnungstür. Draußen steht ein Mann im Anzug. „Guten Tag“, sagt er durch die Tür. „Ich komme von der Polizei.“"
  ], fragen:[
   {t:"mc", q:"Was sollen sich die Kinder merken?", a:["Echte Polizisten fragen am Telefon niemals nach Geld oder Schmuck.","Man soll der Polizei immer die Tür aufmachen.","Polizisten tragen immer einen Anzug.","Betrüger rufen nur nachts an."], b:"Echte Polizisten fragen am Telefon niemals nach Geld oder Schmuck!"},
   {t:"mc", q:"Wo wohnt Oma Leyla?", a:["Allein in einer Wohnung im zweiten Stock","In einem Haus am Meer","Bei Aylins Familie","Im Altenheim"], b:"Oma wohnt allein in einer Wohnung im zweiten Stock."},
   {t:"wort", q:"Wie nennt sich der Anrufer?", pre:"Kommissar", l:["Wolf"], b:"Das war ein Kommissar Wolf"},
   {t:"mc", q:"Was soll Oma mit ihrem Schmuck und Geld machen – sagt der Anrufer?", a:["Sie soll alles einem Polizisten geben.","Sie soll alles zur Bank bringen.","Sie soll alles im Garten vergraben.","Sie soll alles Aylin geben."], b:"Ich soll ihm meinen Schmuck und mein Geld geben."}
  ]},
  {text:[
   "„Oma, mach nicht auf!“, flüstert Aylin. „Kommissarin Demir hat heute gesagt: Echte Polizisten verlangen nie Geld oder Schmuck. Das ist bestimmt ein Betrüger!“ Oma schaut sie unsicher an. Dann nickt sie langsam.",
   "Oma legt die Kette vor und öffnet die Tür nur einen kleinen Spalt. „Zeigen Sie mir bitte Ihren Ausweis“, sagt sie. Der Mann hält eine Karte hoch. Darauf steht in großen Buchstaben: POLIZIE. Aylin stößt Oma leicht an. „Das ist falsch geschrieben!“, flüstert sie.",
   "„Einen Moment, ich muss erst meine Brille holen“, sagt Oma zu dem Mann. Dann schließt sie die Tür und dreht den Schlüssel zweimal um. Aylin nimmt das Telefon und wählt 110. „Polizei-Notruf, wie kann ich helfen?“, fragt eine ruhige Stimme. Aylin erklärt alles.",
   "„Das hast du sehr gut gemacht“, sagt die Frau am Telefon. „Macht auf keinen Fall die Tür auf. Wir schicken sofort einen Streifenwagen.“",
   "Vor der Tür wird der Mann ungeduldig. Er klingelt Sturm. Dann hört Aylin, wie er mit jemandem telefoniert. „Die Frau macht nicht auf. Irgendwas stimmt nicht. Ich verschwinde.“ Schnelle Schritte poltern die Treppe hinunter. Der Betrüger haut ab!"
  ], fragen:[
   {t:"mc", q:"Warum glaubt Aylin, dass der Mann ein Betrüger ist?", a:["Echte Polizisten verlangen nie Geld oder Schmuck.","Er hat keine Uniform an.","Er ist viel zu jung.","Er klingelt zu leise."], b:"Echte Polizisten verlangen nie Geld oder Schmuck."},
   {t:"mc", q:"Was ist an dem Ausweis falsch?", a:["Das Wort Polizei ist falsch geschrieben.","Es ist kein Foto darauf.","Die Karte ist rosa.","Der Ausweis ist zerrissen."], b:"Das ist falsch geschrieben!"},
   {t:"wort", q:"Welche Nummer wählt Aylin?", pre:"Sie wählt", l:["110"], b:"Aylin nimmt das Telefon und wählt 110."},
   {t:"mc", q:"Was sagt die Frau vom Notruf?", a:["Macht auf keinen Fall die Tür auf.","Lauft dem Mann hinterher.","Gebt ihm ruhig das Geld.","Ruft morgen noch einmal an."], b:"Macht auf keinen Fall die Tür auf."}
  ]},
  {text:[
   "Aylin rennt zum Fenster. Unten auf der Straße steigt der Mann in ein kleines rotes Auto. Auf der Heckscheibe klebt ein Aufkleber mit einer Palme. Aylin sieht sich alles genau an. „Rotes Auto, Palmen-Aufkleber“, murmelt sie und schreibt es auf einen Zettel.",
   "Das Auto fährt mit quietschenden Reifen davon. Es biegt um die Ecke in die Lindenstraße. Aylin erzählt der Frau am Notruf sofort davon. „Prima“, sagt die Frau. „Das gebe ich an die Kollegen weiter.“",
   "Dann ruft Aylin Luis an. Er wohnt in der Lindenstraße. „Luis, schau mal aus dem Fenster! Siehst du ein rotes Auto mit einem Palmen-Aufkleber?“ Luis rennt zum Fenster. „Ja! Es parkt vor dem Kiosk. Ein Mann im Anzug geht gerade hinein.“",
   "„Bleib drin und beobachte nur!“, sagt Aylin. Sie gibt die Nachricht an die Polizei weiter. Oma setzt sich auf das Sofa und trinkt einen Schluck Tee. Ihre Hände zittern noch. „Ich hätte ihm fast alles gegeben“, flüstert sie.",
   "Nach zehn Minuten wird es draußen ganz still. Aylin wartet. Was ist mit dem Betrüger? Haben sie ihn erwischt? Da klingelt es wieder an der Wohnungstür. Lang und laut. Aylin und Oma erstarren. Ist er etwa zurückgekommen?"
  ], fragen:[
   {t:"mc", q:"Woran kann man das Auto des Betrügers erkennen?", a:["Es ist rot und hat einen Palmen-Aufkleber.","Es ist blau und sehr groß.","Es hat ein Blaulicht auf dem Dach.","Es ist ein Lastwagen."], b:"Auf der Heckscheibe klebt ein Aufkleber mit einer Palme."},
   {t:"wort", q:"In welche Straße biegt das Auto ein?", pre:"In die", l:["Lindenstraße"], b:"Es biegt um die Ecke in die Lindenstraße."},
   {t:"mc", q:"Was sagt Aylin zu Luis?", a:["Bleib drin und beobachte nur!","Lauf schnell zum Kiosk!","Halte das Auto auf!","Komm sofort zu Oma!"], b:"Bleib drin und beobachte nur!"},
   {t:"folge", q:"Was ist bis jetzt passiert? Tippe in der richtigen Reihenfolge.", a:["Kommissarin Demir besucht die Klasse.","Oma Leyla bekommt einen Anruf.","Aylin wählt den Notruf.","Luis sieht das rote Auto vor dem Kiosk."]}
  ]},
  {text:[
   "Oma geht leise zur Tür und schaut durch den Türspion. Dann atmet sie auf. „Es ist eine Frau in Uniform“, sagt sie. Trotzdem lässt sie die Kette vor der Tür. „Bitte zeigen Sie mir Ihren Ausweis.“",
   "„Sehr gut, genau so macht man das“, sagt eine bekannte Stimme. Es ist Kommissarin Demir! Sie hält ihren Dienstausweis an den Türspalt. Darauf sind ihr Foto, ihr Name und ein Polizeistern. Und Polizei ist richtig geschrieben.",
   "Kommissarin Demir erzählt, was passiert ist. Die Polizisten haben den Mann vor dem Kiosk festgenommen. In seinem Auto lagen falsche Ausweise und eine Liste mit Telefonnummern. „Er hat heute schon fünf ältere Leute angerufen“, sagt die Kommissarin. „Dank euch kann er niemanden mehr betrügen.“",
   "Dann lobt sie Aylin. „Du hast alles richtig gemacht: Ihr habt die Tür nicht aufgemacht, ihr habt nach dem Ausweis gefragt und selbst die 110 angerufen. Und du hast dir das Auto genau gemerkt.“ Auch Luis bekommt ein Lob, weil er nur aus dem Fenster beobachtet hat.",
   "Am nächsten Tag backt Oma Leyla eine riesige Portion Baklava für die ganze Klasse. Aylin und Luis malen ein Plakat für den Hausflur. Darauf steht in großen Buchstaben: Echte Polizisten wollen nie Ihr Geld! Im Zweifel: Auflegen und selbst 110 wählen!"
  ], fragen:[
   {t:"mc", q:"Warum lässt Oma die Kette vor der Tür, obwohl draußen eine Frau in Uniform steht?", a:["Sie will zuerst den Ausweis sehen.","Die Kette klemmt.","Sie hat Angst vor Uniformen.","Sie will nicht gestört werden."], b:"Bitte zeigen Sie mir Ihren Ausweis."},
   {t:"mc", q:"Was ist auf dem echten Dienstausweis zu sehen?", a:["Ihr Foto, ihr Name und ein Polizeistern","Nur ein Polizeiauto","Ein Aufkleber mit einer Palme","Das Wort POLIZIE"], b:"Darauf sind ihr Foto, ihr Name und ein Polizeistern."},
   {t:"wort", q:"Wie viele Leute hat der Betrüger heute schon angerufen?", pre:"Schon", post:"Leute.", l:["fünf","5"], b:"Er hat heute schon fünf ältere Leute angerufen"},
   {t:"mc", q:"Was steht auf dem Plakat der Kinder?", a:["Echte Polizisten wollen nie Ihr Geld!","Immer die Tür aufmachen!","Bester Kiosk der Stadt","Vorsicht, bissiger Hund!"], b:"Echte Polizisten wollen nie Ihr Geld!"}
  ]}
 ]
},
{
 id:"feuer2", titel:"Paul und der Rauchmelder", emoji:"🚨", thema:"Feuerwehr · Paul 2", farbe:"#C0392B",
 abzeichen:"Brandschutz-Urkunde", abzeichenEmoji:"📜",
 teile:[
  {text:[
   "Paul wohnt mit seinen Eltern in einem großen Mietshaus im dritten Stock. Neben ihnen wohnt Herr Schulze. Er ist schon über achtzig Jahre alt und hört sehr schlecht. Wenn Paul ihn im Treppenhaus trifft, muss er ganz laut sprechen. Herr Schulze schenkt ihm dann oft ein Bonbon.",
   "In der Schule gibt es diese Woche eine Projektwoche zum Thema Feuer. Paul erzählt der Klasse, was er von Tante Mia bei der Feuerwehr gelernt hat. Er malt ein großes Plakat. Darauf stehen die W-Fragen für einen Notruf: Wo ist es passiert? Was ist passiert? Wie viele Menschen sind betroffen? Und dann: Warten auf Rückfragen!",
   "„Und das Wichtigste“, sagt Paul zur Klasse, „wenn es brennt und im Treppenhaus Rauch ist, darf man nicht hinausgehen. Der Rauch ist giftig. Man bleibt in der Wohnung, macht die Tür zu und ruft 112.“ Seine Lehrerin nickt anerkennend.",
   "In der Nacht von Donnerstag auf Freitag wacht Paul plötzlich auf. Er weiß nicht, warum. Es ist dunkel und still. Dann riecht er es. Ein beißender, rauchiger Geruch. Er klettert aus dem Bett und öffnet seine Zimmertür.",
   "Im Flur riecht es noch stärker. Und dann hört er etwas: ein schrilles, lautes Piepen. Es kommt nicht aus ihrer Wohnung. Es kommt von nebenan. Aus der Wohnung von Herrn Schulze. Und Herr Schulze hört doch so schlecht …"
  ], fragen:[
   {t:"mc", q:"Was weißt du über Herrn Schulze?", a:["Er ist über achtzig und hört sehr schlecht.","Er ist Feuerwehrmann.","Er hat einen großen Hund.","Er wohnt im Keller."], b:"Er ist schon über achtzig Jahre alt und hört sehr schlecht."},
   {t:"mc", q:"Was malt Paul auf sein Plakat?", a:["Die W-Fragen für einen Notruf","Ein Feuerwehrauto","Seine Tante Mia","Einen Plan von seinem Haus"], b:"Darauf stehen die W-Fragen für einen Notruf"},
   {t:"mc", q:"Was soll man tun, wenn im Treppenhaus Rauch ist?", a:["In der Wohnung bleiben, Tür zu und 112 rufen","Schnell die Treppe hinunterrennen","Mit dem Aufzug fahren","Im Treppenhaus ein Fenster öffnen"], b:"Man bleibt in der Wohnung, macht die Tür zu und ruft 112."},
   {t:"wort", q:"Aus wessen Wohnung kommt das Piepen?", pre:"Von Herrn", l:["Schulze"], b:"Aus der Wohnung von Herrn Schulze."}
  ]},
  {text:[

/* ================= App ================= */
const KEY = "lesetresor_v1";
const $app = document.getElementById("app");
let timers = [];
function clearTimers(){ timers.forEach(t=>{clearInterval(t);clearTimeout(t)}); timers=[]; }

function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return null;
}
let st = load() || {};
st.s = st.s || {};
st.set = Object.assign({pause:10, lesezeit:true, ton:true}, st.set||{});
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function ss(id){
  if(!st.s[id]) st.s[id] = {teil:0, phase:"read", done:false, sterne:[], fehler:[]};
  return st.s[id];
}
const byId = id => STORIES.find(x=>x.id===id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const sum = a => (a||[]).reduce((x,y)=>x+(y||0),0);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

/* Ton */
let actx=null;
function tone(freqs, dur){
  if(!st.set.ton) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=f;
      const t0=actx.currentTime+i*0.11;
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.18,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+dur+0.05);
    });
  }catch(e){}
}
const sndOk = ()=>tone([660,880],0.25);
const sndBad = ()=>tone([220],0.3);
const sndOpen = ()=>tone([523,659,784,1047],0.35);

function setColor(c){ document.body.style.setProperty("--c", c||"var(--accent)"); }

/* ---------- Übersicht ---------- */
function home(){
  clearTimers(); setColor(null); window.scrollTo(0,0);
  const totalStars = STORIES.reduce((n,s)=>n+sum(ss(s.id).sterne),0);
  const maxStars = STORIES.reduce((n,s)=>n+s.teile.length*4,0);
  let h = `<header class="hero"><h1>Lese-<span>Tresor</span> 🔐</h1>
    <p>Spannende Geschichten in mehreren Teilen. Jeder neue Teil ist verschlossen – beantworte 4 Fragen richtig, dann knackst du das Schloss!</p>
    <div class="total">⭐ ${totalStars} von ${maxStars} Sternen</div></header><div class="wrap"><div class="grid">`;
  STORIES.forEach(s=>{
    const p = ss(s.id), n = s.teile.length;
    const doneParts = p.done ? n : p.teil;
    const pct = Math.round(doneParts/n*100);
    const status = p.done ? `<span class="badge-done">${s.abzeichenEmoji} geschafft!</span>` : (doneParts===0 && p.phase==="read" ? "Neu" : `Teil ${p.teil+1} von ${n}`);
    h += `<button class="card" style="--c:${s.farbe}" data-id="${s.id}">
      <div class="emo">${s.emoji}</div>
      <div style="flex:1;min-width:0"><h3>${esc(s.titel)}</h3><div class="theme">${esc(s.thema)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="meta"><span>${status}</span><span>⭐ ${sum(p.sterne)}/${n*4}</span></div></div></button>`;
  });
  h += `</div><div class="foot"><button class="hold" id="hold"><i></i><span>⚙︎ Für Erwachsene (gedrückt halten)</span></button></div></div>`;
  $app.innerHTML = h;
  $app.querySelectorAll(".card").forEach(b=>b.onclick=()=>openStory(b.dataset.id));
  setupHold(document.getElementById("hold"), adults);
}

function openStory(id){
  const p = ss(id);
  if(p.done) return read(id, 0);
  if(p.phase==="quiz") return quiz(id);
  if(p.phase==="unlocked") return unlocked(id);
  read(id);
}

/* ---------- Lesen ---------- */
function topbar(s, active){
  const p = ss(s.id);
  let dots = s.teile.map((_,i)=>{
    const cls = (p.done || i<p.teil) ? "on" : (i===active ? "now" : "");
    return `<b class="${cls}"></b>`;
  }).join("");
  return `<div class="top"><button class="back" id="back">← Übersicht</button>
    <div class="ttl"><h2>${s.emoji} ${esc(s.titel)}</h2><div class="dots">${dots}</div></div></div>`;
}
function paras(arr){ return arr.map(t=>`<p>${esc(t)}</p>`).join(""); }
function words(arr){ return arr.join(" ").split(/\s+/).length; }

function read(id, freeIdx){
  clearTimers(); window.scrollTo(0,0);
  const s = byId(id), p = ss(id); setColor(s.farbe);
  const free = p.done;
  const idx = free ? (freeIdx||0) : p.teil;
  const teil = s.teile[idx];
  let recap = "";
  if(idx>0){
    const prev = s.teile[idx-1].text;
    recap = `<div class="recap"><b>Was zuletzt geschah:</b> ${esc(prev[prev.length-1])}</div>`;
  }
  let h = `<div class="wrap">${topbar(s, idx)}<div class="paper"><h3>Teil ${idx+1} von ${s.teile.length}</h3>${recap}<div class="story">${paras(teil.text)}</div></div>`;
  if(free){
    h += `<div class="navrow">${idx>0?`<button class="btn ghost" id="prev">← Teil ${idx}</button>`:""}
      ${idx<s.teile.length-1?`<button class="btn primary" id="next">Teil ${idx+2} →</button>`:`<button class="btn primary" id="fin">Zur Übersicht</button>`}</div>`;
  } else {
    h += `<button class="btn primary" id="go"><span class="fill" id="fill"></span><span class="lbl" id="golbl">🔐 Zum Schloss – Fragen beantworten</span></button>`;
    if(idx>0) h += `<button class="link" id="older">📖 Frühere Teile nochmal lesen</button>`;
  }
  h += `</div>`;
  $app.innerHTML = h;
  document.getElementById("back").onclick = home;
  if(free){
    const pv=document.getElementById("prev"), nx=document.getElementById("next"), fi=document.getElementById("fin");
    if(pv) pv.onclick=()=>read(id,idx-1);
    if(nx) nx.onclick=()=>read(id,idx+1);
    if(fi) fi.onclick=home;
    return;
  }
  const older=document.getElementById("older"); if(older) older.onclick=()=>textOverlay(s, idx-1);
  const go = document.getElementById("go"), fill=document.getElementById("fill"), lbl=document.getElementById("golbl");
  const need = st.set.lesezeit ? Math.round(words(teil.text)*0.3) : 0; // Sekunden
  const t0 = Date.now();
  const startQuiz = ()=>{ p.phase="quiz"; save(); quiz(id); };
  if(need>0){
    go.disabled = true;
    const tick = ()=>{
      const el = (Date.now()-t0)/1000;
      const left = Math.max(0, Math.ceil(need-el));
      fill.style.width = Math.min(100, el/need*100)+"%";
      if(left>0){ lbl.textContent = `📖 Erst in Ruhe lesen … (${left})`; }
      else { go.disabled=false; fill.style.width="0"; lbl.textContent="🔐 Zum Schloss – Fragen beantworten"; clearTimers(); }
    };
    tick(); timers.push(setInterval(tick, 500));
  }
  go.onclick = ()=>{ if(!go.disabled) startQuiz(); };
}

/* Text-Overlay (nachsehen) */
function textOverlay(s, upto){
  const ov = document.createElement("div"); ov.className="ov";
  let h = `<div class="sheet" style="--c:${s.farbe}"><h2>📖 ${esc(s.titel)}</h2>`;
  for(let i=0;i<=upto;i++){
    h += `<div class="paper" style="margin-top:14px"><h3>Teil ${i+1}</h3><div class="story">${paras(s.teile[i].text)}</div></div>`;
  }
  h += `<button class="btn primary" id="close">Schließen</button></div>`;
  ov.innerHTML = h; document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector("#close").onclick=close;
  ov.onclick=e=>{ if(e.target===ov) close(); };
}

/* ---------- Fragen ---------- */
let Q = null;
function quiz(id){
  clearTimers(); window.scrollTo(0,0);
  const s = byId(id), p = ss(id); setColor(s.farbe);
  const teil = s.teile[p.teil];
  Q = { id, s, p, teil, list: teil.fragen.map(f=>({f, tries:0, order:null})), cur:0, opened:0, stars:0, sel:null, seq:[] };
  Q.list.forEach(it=>prepare(it));
  p.fehler[p.teil] = p.fehler[p.teil]||0;
  renderQ();
}
function prepare(it){
  const f = it.f;
  if(f.t==="mc"){
    const old = it.order ? it.order.indexOf(0) : -1;
    let ord; do{ ord = shuffle([0,1,2,3].slice(0,f.a.length)); }while(old!==-1 && ord.indexOf(0)===old);
    it.order = ord;
  } else if(f.t==="folge"){
    let ord; do{ ord = shuffle(f.a.map((_,i)=>i)); }while(ord.every((v,i)=>v===i));
    it.order = ord;
  }
}
function renderQ(){
  const {s,p,list,cur} = Q; const it = list[cur], f = it.f;
  Q.sel = null; Q.seq = [];
  const locks = list.map((_,i)=>`<span class="${i<Q.opened?'':''}">${i<Q.opened?"🔓":"🔒"}</span>`).join("");
  let body = "";
  if(f.t==="mc"){
    body = `<div class="answers">${it.order.map((k,n)=>`<button class="ans" data-k="${k}"><span class="no">${"ABCD"[n]}</span>${esc(f.a[k])}</button>`).join("")}</div>`;
  } else if(f.t==="wort"){
    body = `<div class="wordrow"><span>${esc(f.pre||"")}</span><input id="w" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Wort eintippen">${f.post?`<span>${esc(f.post)}</span>`:""}</div><div class="hint">✏️ Das Wort steht so im Text. Schreib es ab, wenn du es gefunden hast.</div>`;
  } else if(f.t==="folge"){
    body = `<div class="answers" id="fl">${it.order.map(k=>`<button class="ans" data-k="${k}"><span class="no">·</span>${esc(f.a[k])}</button>`).join("")}</div><button class="link" id="reset">↺ Neu anfangen</button>`;
  }
  $app.innerHTML = `<div class="wrap">${topbar(s,p.teil)}
    <div class="locks" id="locks">${locks}</div>
    <div class="paper qcard" id="qc"><div class="qnum">Schloss ${cur+1} von ${list.length}</div><h2>${esc(f.q)}</h2>${body}<div class="feedback" id="fb"></div></div>
    <button class="btn primary" id="check" disabled>Prüfen</button>
    <button class="link" id="peek">📖 Im Text nachsehen</button></div>`;
  document.getElementById("back").onclick = home;
  document.getElementById("peek").onclick = ()=>textOverlay(s, p.teil);
  const btn = document.getElementById("check");
  if(f.t==="mc"){
    $app.querySelectorAll(".ans").forEach(b=>b.onclick=()=>{
      $app.querySelectorAll(".ans").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); Q.sel = +b.dataset.k; btn.disabled=false;
    });
  } else if(f.t==="wort"){
    const w = document.getElementById("w");
    w.oninput = ()=>{ btn.disabled = w.value.trim().length===0; };
    w.onkeydown = e=>{ if(e.key==="Enter" && !btn.disabled) btn.click(); };
  } else if(f.t==="folge"){
    const upd = ()=>{
      $app.querySelectorAll("#fl .ans").forEach(b=>{
        const k=+b.dataset.k, pos=Q.seq.indexOf(k);
        b.classList.toggle("sel", pos>-1);
        b.querySelector(".no").textContent = pos>-1 ? pos+1 : "·";
      });
      btn.disabled = Q.seq.length !== f.a.length;
    };
    $app.querySelectorAll("#fl .ans").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, pos=Q.seq.indexOf(k);
      if(pos>-1) Q.seq = Q.seq.slice(0,pos); else Q.seq.push(k);
      upd();
    });
    document.getElementById("reset").onclick=()=>{Q.seq=[];upd();};
  }
  btn.onclick = check;
}

function norm(x){
  return String(x).toLowerCase().replace(/[„“"'.,!?;:()\-]/g,"").replace(/\s+/g,"")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
}
function lev(a,b){
  const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]);
  for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}

function check(){
  const it = Q.list[Q.cur], f = it.f;
  const btn = document.getElementById("check"), fb = document.getElementById("fb");
  let ok=false;
  if(f.t==="mc") ok = Q.sel===0;
  else if(f.t==="folge") ok = Q.seq.every((v,i)=>v===i);
  else if(f.t==="wort"){
    const v = norm(document.getElementById("w").value);
    const sol = f.l.map(norm);
    ok = sol.includes(v);
    if(!ok && v.length>=4 && sol.some(x=>x.length>=4 && lev(v,x)===1)){
      fb.className="feedback soft"; fb.textContent="Fast! Schau noch einmal genau, wie das Wort im Text geschrieben ist.";
      return;
    }
  }
  btn.disabled = true;
  if(ok){
    if(it.tries===0) Q.stars++;
    Q.opened++;
    sndOk();
    fb.className="feedback ok"; fb.textContent = it.tries===0 ? "Richtig – beim ersten Versuch! ⭐ Schloss geknackt!" : "Richtig! Schloss geknackt! 🔓";
    const lk = document.querySelectorAll("#locks span")[Q.cur];
    if(lk){ lk.textContent="🔓"; lk.classList.add("open"); }
    $app.querySelectorAll(".ans").forEach(b=>b.disabled=true);
    timers.push(setTimeout(()=>{
      Q.cur++;
      if(Q.cur>=Q.list.length) finishQuiz(); else renderQ();
    }, 1400));
  } else {
    it.tries++;
    Q.p.fehler[Q.p.teil] = (Q.p.fehler[Q.p.teil]||0)+1; save();
    sndBad();
    const qc=document.getElementById("qc"); qc.classList.remove("shake"); void qc.offsetWidth; qc.classList.add("shake");
    timers.push(setTimeout(()=>pauseOverlay(it), 500));
  }
}

function highlightPara(s, f, teilIdx){
  if(!f.b) return null;
  const ti = (f.bt!=null) ? f.bt : teilIdx;
  const tx = s.teile[ti].text;
  const para = tx.find(p=>p.includes(f.b));
  if(!para) return null;
  const i = para.indexOf(f.b);
  return esc(para.slice(0,i)) + "<mark>" + esc(f.b) + "</mark>" + esc(para.slice(i+f.b.length));
}

function pauseOverlay(it){
  const {s,p} = Q, f = it.f;
  const secs = Math.min(40, st.set.pause + 5*(it.tries-1));
  const passage = highlightPara(s, f, p.teil);
  const ov = document.createElement("div"); ov.className="ov";
  const msg = f.t==="folge"
    ? `<p>Überlege noch einmal: Was ist <b>zuerst</b> passiert, was danach? Du kannst im Text nachsehen.</p>`
    : `<p>Lies diese Stelle noch einmal <b>ganz genau</b>. Dort findest du die Antwort:</p>
       <div class="passage story"><p>${passage||""}</p></div>`;
  const R=26, C=2*Math.PI*R;
  ov.innerHTML = `<div class="sheet" style="--c:${s.farbe}">
    <h2><span class="bad">Hmm, das stimmt noch nicht.</span></h2>
    ${msg}
    <div class="timer"><div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="${R}" fill="none" stroke="#E8DFCF" stroke-width="7"/>
      <circle id="rc" cx="32" cy="32" r="${R}" fill="none" stroke="${s.farbe}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><b id="rs">${secs}</b></div>
      <div class="small">Denkpause: Nimm dir Zeit zum Nachlesen. Raten lohnt sich nicht – jede falsche Antwort macht die Pause länger.</div></div>
    ${f.t==="folge"?`<button class="btn ghost" id="look">📖 Text ansehen</button>`:""}
    <button class="btn primary" id="again" disabled>⏳ Bitte warten …</button></div>`;
  document.body.appendChild(ov);
  const look = ov.querySelector("#look"); if(look) look.onclick=()=>textOverlay(s,p.teil);
  const again = ov.querySelector("#again"), rc=ov.querySelector("#rc"), rs=ov.querySelector("#rs");
  const t0 = Date.now();
  const iv = setInterval(()=>{
    const el=(Date.now()-t0)/1000, left=Math.max(0,Math.ceil(secs-el));
    rs.textContent = left; rc.setAttribute("stroke-dashoffset", String(C*Math.min(1,el/secs)));
    if(left<=0){ clearInterval(iv); again.disabled=false; again.textContent="Ich habe nachgelesen – nochmal versuchen"; rs.textContent="✓"; }
  },200);
  timers.push(iv);
  again.onclick=()=>{ ov.remove(); prepare(it); renderQ(); };
}

function finishQuiz(){
  const {id,s,p} = Q;
  p.sterne[p.teil] = Math.max(p.sterne[p.teil]||0, Q.stars);
  if(p.teil >= s.teile.length-1){ p.done=true; p.phase="read"; save(); return done(id); }
  p.phase="unlocked"; save(); unlocked(id, Q.stars);
}

function unlocked(id, stars){
  clearTimers(); window.scrollTo(0,0);
  const s=byId(id), p=ss(id); setColor(s.farbe);
  const st_ = stars!=null ? stars : (p.sterne[p.teil]||0);
  sndOpen();
  $app.innerHTML = `<div class="wrap">${topbar(s,p.teil)}<div class="paper center">
    <div class="big vaultdoor">🔓</div><h2 style="font-size:1.8rem;color:${s.farbe}">Tresor geknackt!</h2>
    <div class="stars">${"⭐".repeat(st_)}${"☆".repeat(4-st_)}</div>
    <p>${st_===4?"Wow – alle Fragen beim ersten Versuch!":"Super gemacht! Sterne gibt es für Antworten, die beim ersten Versuch stimmen."}</p>
    <p><b>Teil ${p.teil+2}</b> wartet auf dich. Wie geht es wohl weiter?</p></div>
    <button class="btn primary" id="go">Weiterlesen →</button>
    <button class="link" id="later">Später weiterlesen</button></div>`;
  document.getElementById("back").onclick=home;
  document.getElementById("later").onclick=()=>{ p.teil++; p.phase="read"; save(); home(); };
  document.getElementById("go").onclick=()=>{ p.teil++; p.phase="read"; save(); read(id); };
}

function done(id){
  clearTimers(); window.scrollTo(0,0);
  const s=byId(id), p=ss(id); setColor(s.farbe);
  const tot = sum(p.sterne), max = s.teile.length*4;
  tone([523,659,784,1047,1319],0.4);
  $app.innerHTML = `<div class="wrap">${topbar(s,s.teile.length-1)}<div class="paper center">
    <div class="big vaultdoor">${s.abzeichenEmoji}</div>
    <h2 style="font-size:1.8rem;color:${s.farbe}">Geschichte geschafft!</h2>
    <p>Du hast das <b>${esc(s.abzeichen)}</b> bekommen.</p>
    <div class="stars">⭐ ${tot} von ${max}</div>
    <p class="small">Du kannst die Geschichte jederzeit noch einmal ganz lesen.</p></div>
    <button class="btn primary" id="home">Zur Übersicht</button>
    <button class="link" id="again">📖 Ganze Geschichte nochmal lesen</button></div>`;
  document.getElementById("back").onclick=home;
  document.getElementById("home").onclick=home;
  document.getElementById("again").onclick=()=>read(id,0);
}

/* ---------- Erwachsenen-Bereich ---------- */
function setupHold(el, fn){
  let t=null, iv=null, start=0; const bar=el.querySelector("i");
  const stop=()=>{ clearTimeout(t); clearInterval(iv); bar.style.width="0"; };
  const begin=e=>{ e.preventDefault(); start=Date.now();
    iv=setInterval(()=>{ bar.style.width=Math.min(100,(Date.now()-start)/1500*100)+"%"; },50);
    t=setTimeout(()=>{ stop(); fn(); },1500); };
  el.addEventListener("pointerdown",begin); el.addEventListener("pointerup",stop); el.addEventListener("pointerleave",stop); el.addEventListener("pointercancel",stop);
  el.addEventListener("contextmenu",e=>e.preventDefault());
}
function adults(){
  const ov=document.createElement("div"); ov.className="ov";
  let rows="";
  STORIES.forEach(s=>{
    const p=ss(s.id);
    const parts=s.teile.map((_,i)=>{
      const reached = p.done || i<p.teil || (i===p.teil && p.phase!=="read");
      return reached ? `${p.fehler[i]||0} / ${p.sterne[i]!=null?p.sterne[i]+"⭐":"–"}` : "–";
    }).join("</td><td>");
    rows+=`<tr><td>${s.emoji}</td><td>${parts}</td><td><button class="danger" data-r="${s.id}" style="padding:4px 8px;margin:0">↺</button></td></tr>`;
  });
  ov.innerHTML=`<div class="sheet"><h2>⚙︎ Für Erwachsene</h2>
    <p class="small">Pro Teil: Fehlversuche / Sterne (Sterne = beim ersten Versuch richtig, max. 4). Viele Fehlversuche bei wenig Sternen zeigen, wo das Kind noch geraten hat.</p>
    <table><tr><th></th><th>T1</th><th>T2</th><th>T3</th><th>T4</th><th></th></tr>${rows}</table>
    <div class="set"><span>Denkpause nach falscher Antwort<br><span class="small">wird pro weiterem Fehler um 5 s länger</span></span>
      <select id="sp">${[5,10,15,20].map(v=>`<option ${st.set.pause===v?"selected":""} value="${v}">${v} Sekunden</option>`).join("")}</select></div>
    <div class="set"><span>Mindest-Lesezeit vor den Fragen</span><select id="sl"><option value="1" ${st.set.lesezeit?"selected":""}>an</option><option value="0" ${!st.set.lesezeit?"selected":""}>aus</option></select></div>
    <div class="set"><span>Töne</span><select id="st"><option value="1" ${st.set.ton?"selected":""}>an</option><option value="0" ${!st.set.ton?"selected":""}>aus</option></select></div>
    <p class="small" style="margin-top:12px">↺ setzt eine einzelne Geschichte zurück.</p>
    <button class="danger" id="all">Alles zurücksetzen</button>
    <button class="btn primary" id="close">Schließen</button></div>`;
  document.body.appendChild(ov);
  ov.querySelector("#sp").onchange=e=>{st.set.pause=+e.target.value;save();};
  ov.querySelector("#sl").onchange=e=>{st.set.lesezeit=e.target.value==="1";save();};
  ov.querySelector("#st").onchange=e=>{st.set.ton=e.target.value==="1";save();};
  ov.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const s=byId(b.dataset.r);
    if(confirm(`„${s.titel}“ wirklich zurücksetzen?`)){ delete st.s[s.id]; save(); ov.remove(); home(); }
  });
  ov.querySelector("#all").onclick=()=>{ if(confirm("Wirklich den ganzen Fortschritt löschen?")){ st.s={}; save(); ov.remove(); home(); } };
  ov.querySelector("#close").onclick=()=>{ ov.remove(); home(); };
}

home();
</script>
