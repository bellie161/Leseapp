<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Schulhund Klasse 1 und 2</title>
<meta name="apple-mobile-web-app-title" content="Schulhund Klasse 1 und 2">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6ec;--card:#fff;--ink:#3b2f2a;--muted:#8a7a70;--accent:#e98a3c;--accent2:#f6c66b;--good:#3fa65b;--bad:#d64545;--edge:#e8d5bd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Andika","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;font-size:20px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
header h1{flex:1;margin:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:none;background:rgba(255,255,255,.28);color:#fff;font:inherit;font-size:24px;border-radius:14px;min-width:50px;height:50px;cursor:pointer}
#starbox{background:#fff;color:var(--ink);border-radius:20px;padding:6px 14px;font-weight:700;font-size:20px;white-space:nowrap}
#starbox.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.35)}}
main{max-width:980px;margin:0 auto;padding:14px 16px 40px}
h2{font-size:32px;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:14px}
.tile{border:none;background:var(--card);border-radius:24px;padding:20px 12px;font:inherit;font-weight:700;font-size:24px;color:var(--ink);box-shadow:0 5px 0 var(--edge);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.tile .ic{font-size:64px;line-height:1}
.tile:active,.btn:active,.opt:active,.card:active,.pick:active{transform:translateY(3px)}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:0 3px 0 var(--edge);font-size:24px;font-weight:700;min-height:72px}
.task span{flex:1}
.task.bild span{font-size:15px;font-weight:400;color:var(--muted)}
.spk{border:none;background:var(--accent2);border-radius:50%;width:56px;height:56px;font-size:28px;cursor:pointer;flex:none}
.task.bild .spk{width:76px;height:76px;font-size:38px;animation:breathe 2s infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
.dogbox{position:relative;background:linear-gradient(#fffaf2,#f4e6d3);border-radius:24px;margin:14px 0;padding:6px;box-shadow:inset 0 0 0 3px #f0dcc2}
.dogbox.touch{touch-action:none}
svg.dog{display:block;width:100%;height:auto;max-height:56vh}
.zone{fill:rgba(0,0,0,0);pointer-events:all;cursor:pointer}
.zone.hl{fill:rgba(255,213,0,.5);stroke:#e0a100;stroke-width:3;animation:blink 1s infinite}
@keyframes blink{50%{fill:rgba(255,213,0,.15)}}
.zone.ok{fill:rgba(63,166,91,.5);stroke:#2b7a41;stroke-width:2}
.zone.no{fill:rgba(214,69,69,.38);stroke:#9a2d2d;stroke-width:2}
.zone.tapok{fill:rgba(63,166,91,.55)}
.zone.tapno{fill:rgba(214,69,69,.45)}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{border:none;background:var(--card);border-radius:20px;padding:14px 22px;font:inherit;font-size:26px;font-weight:700;color:var(--ink);box-shadow:0 4px 0 var(--edge);cursor:pointer;min-width:150px;min-height:70px}
.opt.emoji{font-size:60px;min-width:120px;padding:6px 18px;line-height:1.2}
.opt.right{background:#d8f2df;box-shadow:0 4px 0 #9fd3ad}
.opt.wrong{background:#f8d7d7;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:44px;text-align:center;font-size:24px;font-weight:700;margin:10px 0}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.fb .big{font-size:52px;display:block;line-height:1.1}
.progress{display:flex;gap:4px;justify-content:center;margin:8px 0 0;font-size:26px;flex-wrap:wrap}
.progress .off{opacity:.22;filter:grayscale(1)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{border:none;border-radius:18px;padding:12px 24px;font:inherit;font-size:22px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 4px 0 #b9662a;cursor:pointer;min-height:60px}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--edge)}
.btn.yes{background:var(--good);box-shadow:0 4px 0 #2b7a41;font-size:30px;min-width:160px;min-height:80px}
.btn.no{background:var(--bad);box-shadow:0 4px 0 #9a2d2d;font-size:30px;min-width:160px;min-height:80px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pick{border:none;background:var(--card);border-radius:24px;padding:8px;box-shadow:0 5px 0 var(--edge);cursor:pointer;font:inherit;font-size:28px;font-weight:700;color:var(--ink)}
.grid6{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.card{border:none;background:var(--card);border-radius:20px;padding:6px;box-shadow:0 4px 0 var(--edge);cursor:pointer;font:inherit;font-size:22px;font-weight:700;color:var(--ink)}
.card .em{font-size:40px;line-height:1.1}
.info{background:var(--card);border-radius:20px;padding:14px 18px;box-shadow:0 3px 0 var(--edge);font-size:22px}
.info ul{margin:6px 0 0;padding-left:26px}
.tun{display:flex;gap:12px;align-items:center;background:#fff4d6;border-left:8px solid var(--accent2);border-radius:14px;padding:12px 16px;margin-top:12px;font-size:22px;font-weight:700}
.tun.warn{background:#fde2e2;border-color:var(--bad)}
.tun .ic{font-size:44px}
input.write{font:inherit;font-size:34px;padding:10px 16px;border-radius:16px;border:3px solid var(--edge);width:min(420px,100%);text-align:center;-webkit-user-select:text;user-select:text;background:#fff;color:var(--ink)}
.hint{font-size:30px;letter-spacing:6px;text-align:center;color:var(--muted);min-height:40px;margin-top:8px}
.bigword{font-size:40px;font-weight:700;text-align:center;min-height:58px;display:flex;align-items:center;justify-content:center;gap:12px}
.rules{display:grid;gap:12px;margin-top:12px}
.rule{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:0 3px 0 var(--edge);font-size:22px;font-weight:700}
.rule .ic{font-size:50px;flex:none}
.rule span{flex:1}
.bild .rule span{font-size:16px;font-weight:400;color:var(--muted)}
.legend{display:grid;gap:8px;font-weight:700;font-size:20px}
.legend div{background:var(--card);border-radius:14px;padding:10px 14px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.nav .btn{min-width:150px;font-size:24px}
.btn.glow{background:var(--good);color:#fff;box-shadow:0 4px 0 #2b7a41;animation:breathe 1.2s infinite}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:12px;margin-top:12px}
.fact{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:0 3px 0 var(--edge);font-size:20px}
.fact .ic{font-size:42px;flex:none;width:64px;text-align:center;line-height:1.1}
.fact .txt{flex:1}
.fact .txt b{display:block;font-size:21px;margin-bottom:2px}
.fact.tipp{background:#fff4d6;border-left:8px solid var(--accent2)}
.bild .fact .txt{font-size:14px;color:var(--muted)}
.bild .fact .txt b{display:none}
.breedhead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:center}
.badge{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 4px 0 var(--edge);text-align:center}
.badge .nm{font-size:40px;font-weight:700}
.badge .rs{font-size:26px;color:var(--accent);font-weight:700}
@media (max-width:600px){.breedhead{grid-template-columns:1fr}.badge .nm{font-size:30px}}
.rulecols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:16px;margin-top:12px}
.rhead{font-size:28px;font-weight:700;border-radius:18px;padding:10px 16px;color:#fff}
.rhead.ok{background:var(--good)}.rhead.no{background:var(--bad)}
.rule.rok{border-left:8px solid var(--good)}.rule.rno{border-left:8px solid var(--bad)}
.scene{position:relative;display:grid;grid-template-columns:30% 70%;align-items:end;background:linear-gradient(#eef7ff,#f4e6d3);border-radius:24px;margin:14px 0;padding:10px;box-shadow:inset 0 0 0 3px #f0dcc2;min-height:220px}
.kidcol{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:6%}
.kid{font-size:min(100px,18vw);line-height:1;text-align:center;word-break:break-all}
.kid.flip{transform:scaleX(-1)}
.bubble{background:#fff;border-radius:16px;padding:6px 12px;font-weight:700;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.12);text-align:center}
.sdog{position:relative}
.prop{position:absolute;font-size:min(54px,9vw);transform:translate(-50%,-50%);line-height:1}
.confetti{font-size:64px;text-align:center;animation:pop 1.2s infinite}
@media (max-width:600px){body{font-size:18px}.task{font-size:20px}.tile .ic{font-size:48px}.opt{font-size:22px;min-width:120px}.opt.emoji{font-size:46px;min-width:90px}h2{font-size:26px}}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="backBtn" aria-label="Zurück" style="display:none">◀</button>
  <button class="hbtn" id="homeBtn" aria-label="Menü">🏠</button>
  <h1 id="title">Schulhund Klasse 1 und 2</h1>
  <button class="hbtn" id="voiceBtn" aria-label="Vorlesen an oder aus" style="display:none">🔇</button>
  <div id="starbox">⭐ <span id="stars">0</span></div>
</header>
<main id="app"></main>
<script>
const VARIANT="bild";          // "bild" = ohne Lesen, "lesen" = mit Lesen & Schreiben
const LESEN = VARIANT==="lesen";
const APPNAME = LESEN ? "Schulhund Klasse 3 und 4" : "Schulhund Klasse 1 und 2";
document.title = APPNAME;
let autoSpeak = !LESEN;

/* ---------- Hunde ---------- */
const DOGS={
  pepe:{name:"Pepe",fur:"#dcae74",dark:"#c08d55",light:"#f3dcb5",line:"#6b4a2e",nose:"#4a2e1f",collar:"#d64545",nom:"er",akk:"ihn",dat:"ihm",gen:"sein"},
  jade:{name:"Jade",collie:true,fur:"#2b2725",dark:"#45403c",light:"#f6f3ee",white:"#f6f3ee",line:"#0d0b0a",nose:"#111111",collar:"#22b5a5",nom:"sie",akk:"sie",dat:"ihr",gen:"ihr"}
};
function T(s,dk){const d=DOGS[dk];return s.replace(/\{N\}/g,d.name).replace(/\{A\}/g,d.akk).replace(/\{D\}/g,d.dat).replace(/\{nom\}/g,d.nom).replace(/\{G\}/g,d.gen);}

const POSES={
  neutral:  {legs:"stand",dy:0, tilt:0, hx:0, hy:0, hr:0, ear:0, tail:"up",    mouth:"smile", eyes:"open"},
  froehlich:{legs:"stand",dy:0, tilt:0, hx:0, hy:-4,hr:-4,ear:-6,tail:"wag",   mouth:"open",  eyes:"happy", extra:"hearts"},
  spielen:  {legs:"bow",  dy:0, tilt:16,hx:0, hy:0, hr:-20,ear:-6,tail:"wag",  mouth:"open",  eyes:"open",  extra:"ball"},
  muede:    {legs:"lie",  dy:55,tilt:0, hx:22,hy:48,hr:8, ear:6, tail:"flat",  mouth:"closed",eyes:"closed",extra:"zzz"},
  angst:    {legs:"crouch",dy:20,tilt:0,hx:-12,hy:28,hr:18,ear:55,tail:"tucked",mouth:"closed",eyes:"wide", extra:"shake"},
  stress:   {legs:"stand",dy:4, tilt:0, hx:0, hy:6, hr:4, ear:30,tail:"down",  mouth:"yawn",  eyes:"closed"},
  wut:      {legs:"stand",dy:0, tilt:0, hx:8, hy:-2,hr:-5,ear:-18,tail:"stiff",mouth:"teeth", eyes:"angry", extra:"hackles"}
};
const TAILS={
  up:"M100 150 Q62 118 80 70", wag:"M100 150 Q62 118 80 70",
  down:"M100 152 Q78 190 86 232", tucked:"M100 160 Q98 215 128 250",
  stiff:"M100 146 Q86 110 92 64", flat:"M100 168 Q66 205 26 210"
};
const HEART="M0 6 C0 -2 12 -2 12 6 C12 -2 24 -2 24 6 C24 14 12 20 12 24 C12 20 0 14 0 6Z";
let uid=0;

// Border-Collie-Kippohr: steht, die Spitze klappt nach vorne. Ohrwinkel umgekehrt zu Pepes Schlappohr
// (positiver Pose-Wert = Ohr nach hinten angelegt).
function collieEar(bx,by,d,p,u,far){
  const L=d.line,f=far?d.dark:d.fur;
  return `<g transform="translate(${bx} ${by}) rotate(${-p.ear}) scale(1.35)">
    <path d="M-15 8 L-6 -22 Q0 -30 7 -25 Q13 -21 17 -12 Q13 -11 10 -14 L13 -2 Z" fill="${f}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>
    ${far?"":`<path d="M-9 3 L-3 -17 Q2 -20 6 -16 L8 -3 Z" fill="#c98f8f" opacity=".8"/>`}
  </g>`;
}
function dogSVG(dk,pk,opt){
  opt=opt||{};
  const d=DOGS[dk], p=Object.assign({},POSES[pk],opt.over||{}), u="curl"+(uid++), L=d.line;
  const C=!!d.collie, W=d.white||"#fff", FL=C?"#d9d2c8":L; // FL = Linien im Gesicht/auf dem Fell
  const pass=(sh,fill,stroke)=>`<g fill="${fill}"${stroke?` stroke="${L}" stroke-width="6"`:""}>${sh}</g>`;
  const tri=sh=>pass(sh,d.fur,true)+pass(sh,d.fur)+pass(sh,`url(#${u})`);
  const bodySh='<ellipse cx="190" cy="165" rx="95" ry="50"/><circle cx="112" cy="150" r="30"/><circle cx="268" cy="172" r="28"/><ellipse cx="262" cy="138" rx="30" ry="42" transform="rotate(-25 262 138)"/>';
  const headSh=C?'<circle r="40"/><ellipse cx="4" cy="-8" rx="38" ry="34"/>':'<circle r="40"/><circle cx="-20" cy="-32" r="13"/><circle cx="0" cy="-41" r="14"/><circle cx="20" cy="-33" r="13"/>';

  // Schwanz
  const tp=TAILS[p.tail], sw=p.tail==="stiff"?12:(C?22:18);
  let tail=`<path d="${tp}" stroke="${L}" stroke-width="${sw+6}" fill="none" stroke-linecap="round"/><path d="${tp}" stroke="${d.fur}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
  if(C){const end=tp.trim().split(/\s+/).slice(-2).map(Number);tail+=`<circle cx="${end[0]}" cy="${end[1]}" r="${sw/2+1}" fill="${W}" stroke="${L}" stroke-width="2"/>`;}
  if(p.tail==="wag") tail=`<g>${tail}<animateTransform attributeName="transform" type="rotate" values="-14 100 150;16 100 150;-14 100 150" dur="0.5s" repeatCount="indefinite"/></g>`;

  // Beine
  const Lg=(x,top,bot,c)=>`<rect x="${x-13}" y="${top}" width="26" height="${bot-top}" rx="13" fill="${c}" stroke="${L}" stroke-width="2.5"/>`+(C?`<rect x="${x-11.5}" y="${bot-32}" width="23" height="28" rx="10" fill="${W}"/>`:"")+`<ellipse cx="${x+5}" cy="${bot-3}" rx="17" ry="9" fill="${C?W:c}" stroke="${L}" stroke-width="2.5"/>`;
  const Fa=(x,y,w,c)=>`<rect x="${x}" y="${y}" width="${w}" height="22" rx="11" fill="${c}" stroke="${L}" stroke-width="2.5"/>`+(C?`<rect x="${x+w-34}" y="${y+1.5}" width="33" height="19" rx="9.5" fill="${W}"/>`:"");
  let legsBack="",legsFront="";
  if(p.legs==="stand"||p.legs==="crouch"){const t=p.legs==="stand"?175:195;
    legsBack=Lg(118,t,264,d.dark)+Lg(250,t,264,d.dark)+Lg(142,t,264,d.fur)+Lg(272,t,264,d.fur);}
  else if(p.legs==="bow"){legsBack=Lg(118,170,264,d.dark)+Lg(142,170,264,d.fur)+Fa(240,236,100,d.dark)+Fa(255,242,100,d.fur);}
  else if(p.legs==="lie"){legsFront=`<ellipse cx="138" cy="234" rx="38" ry="30" fill="${d.fur}" stroke="${L}" stroke-width="3"/><ellipse cx="138" cy="234" rx="38" ry="30" fill="url(#${u})"/><ellipse cx="172" cy="260" rx="18" ry="9" fill="${C?W:d.fur}" stroke="${L}" stroke-width="2.5"/>`+Fa(238,238,105,d.dark)+Fa(252,244,105,d.fur);}

  // Augen
  const E={
    open:`<circle cx="14" cy="-8" r="9" fill="#fff" stroke="${L}" stroke-width="2"/><circle cx="16" cy="-7" r="5.5" fill="#2a1d17"/><circle cx="18" cy="-9" r="1.8" fill="#fff"/>`,
    happy:`<path d="M5 -6 Q14 -17 23 -6" stroke="#2a1d17" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    closed:`<path d="M5 -8 Q14 -1 23 -8" stroke="#2a1d17" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    wide:`<circle cx="14" cy="-8" r="11" fill="#fff" stroke="${L}" stroke-width="2"/><circle cx="9" cy="-7" r="4" fill="#2a1d17"/><path d="M2 -24 Q12 -27 24 -21" stroke="${FL}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    angry:`<circle cx="14" cy="-6" r="8" fill="#fff" stroke="${L}" stroke-width="2"/><circle cx="16" cy="-5" r="5" fill="#2a1d17"/><path d="M1 -22 L26 -12" stroke="${FL}" stroke-width="4.5" stroke-linecap="round"/>`
  }[p.eyes];
  // Maul
  let teeth="";for(let x=24;x<=52;x+=7)teeth+=`M${x} 22 L${x+3.5} 30 L${x+7} 22Z `;
  const M={
    closed:`<path d="M24 28 Q38 33 52 27" stroke="${L}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    smile:`<path d="M22 25 Q40 38 58 24" stroke="${L}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    open:`<path d="M22 24 Q40 54 60 22 Z" fill="#7a2a2a" stroke="${L}" stroke-width="2"/><ellipse cx="42" cy="44" rx="8" ry="11" fill="#f08a9a" stroke="#c45a6a" stroke-width="1.5"/>`,
    teeth:`<path d="M18 22 Q40 22 62 20 Q58 40 40 40 Q24 40 18 22Z" fill="#5a1c1c" stroke="${L}" stroke-width="2"/><path d="${teeth}" fill="#fff"/><path d="M28 -1 q4 -4 8 0 M33 6 q4 -4 8 0" stroke="${L}" stroke-width="2" fill="none"/>`,
    yawn:`<ellipse cx="40" cy="34" rx="15" ry="20" fill="#5a1c1c" stroke="${L}" stroke-width="2"/><ellipse cx="40" cy="45" rx="9" ry="7" fill="#f08a9a"/>`
  }[p.mouth];

  const head=`<g transform="translate(${305+p.hx} ${95+p.hy}) rotate(${p.hr})">
    <rect x="-44" y="8" width="15" height="50" rx="7" fill="${d.collar}" stroke="${L}" stroke-width="2" transform="rotate(-28 -36 33)"/>
    <circle cx="-24" cy="61" r="6" fill="#f2c94c" stroke="${L}" stroke-width="1.5"/>
    ${C?collieEar(4,-36,d,p,u,true):""}
    ${tri(headSh)}
    ${C?`<path d="M10 -44 Q22 -22 26 4 L46 4 Q34 -20 22 -46 Z" fill="${W}"/>`:""}
    <ellipse cx="36" cy="14" rx="28" ry="19" fill="${d.light}" stroke="${L}" stroke-width="2.5"/>
    ${M}
    <ellipse cx="60" cy="5" rx="10" ry="7.5" fill="${d.nose}"/><ellipse cx="57" cy="2" rx="3" ry="2" fill="#fff" opacity=".5"/>
    ${E}
    ${C?collieEar(-14,-32,d,p,u,false):`<g transform="rotate(${p.ear} -14 -20)"><ellipse cx="-22" cy="14" rx="16" ry="32" transform="rotate(12 -22 14)" fill="${d.dark}" stroke="${L}" stroke-width="2.5"/><ellipse cx="-22" cy="14" rx="16" ry="32" transform="rotate(12 -22 14)" fill="url(#${u})"/></g>`}
  </g>`;
  const hackles=p.extra==="hackles"?`<path d="M150 121 l7 -13 l7 12 l7 -14 l7 13 l7 -14 l7 13 l7 -13 l7 12 l7 -12 l7 10" fill="none" stroke="${C?"#8a827a":L}" stroke-width="5" stroke-linejoin="round"/>`:"";
  const tf=`translate(0 ${p.dy}) rotate(${p.tilt} 140 175)`;

  let extras="";
  if(p.extra==="hearts") extras=`<g fill="#ff6b8a"><path transform="translate(342 18) scale(.9)" d="${HEART}"><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></path><path transform="translate(370 2) scale(.6)" d="${HEART}"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin=".6s" repeatCount="indefinite"/></path></g>`;
  if(p.extra==="zzz") extras=`<text x="355" y="128" font-size="28" font-weight="700" fill="#6b7fd6" font-family="sans-serif">Z<tspan font-size="21" dy="-12">z</tspan><tspan font-size="15" dy="-10">z</tspan><animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/></text>`;
  if(p.extra==="ball") extras=`<circle cx="372" cy="250" r="15" fill="#e74c3c" stroke="#7a1f16" stroke-width="2.5"/><path d="M358 246 Q372 254 386 246" stroke="#fff" stroke-width="3" fill="none"/>`;

const clean=t=>t.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{200D}\u{FE0F}]/gu,"").replace(/\s+/g," ").trim();

// englische Namen als Lautschrift: Jade → „Dschejd“, Labradoodle → „Labraduudel“, Border Collie → „Bordercolli“.
function speakable(t){

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==="suspended")AC.resume();return AC;}
function tone(f,t0,dur,type,vol){const c=ac();if(!c)return;const t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);}
const okSound=()=>{tone(523,0,.2);tone(784,.1,.35);};
const noSound=()=>{tone(240,0,.22,"triangle",.3);tone(190,.14,.32,"triangle",.3);};
const happy=()=>{tone(660,0,.25);tone(880,.12,.3);tone(1175,.24,.45);};
function growl(){
  const c=ac();if(!c)return;const t=c.currentTime,dur=1.3;
  const master=c.createGain();master.gain.setValueAtTime(0.0001,t);master.gain.exponentialRampToValueAtTime(0.9,t+0.15);master.gain.setValueAtTime(0.9,t+dur-0.3);master.gain.exponentialRampToValueAtTime(0.0001,t+dur);master.connect(c.destination);
  const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=700;lp.Q.value=4;lp.connect(master);
  const trem=c.createGain();trem.gain.value=0.5;trem.connect(lp);
  const lfo=c.createOscillator();lfo.frequency.value=28;const lg=c.createGain();lg.gain.value=0.5;lfo.connect(lg);lg.connect(trem.gain);
  const o=c.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(85,t);o.frequency.linearRampToValueAtTime(112,t+0.5);o.frequency.linearRampToValueAtTime(80,t+dur);o.connect(trem);
  const o2=c.createOscillator();o2.type="square";o2.frequency.setValueAtTime(130,t);o2.frequency.linearRampToValueAtTime(152,t+0.6);o2.frequency.linearRampToValueAtTime(120,t+dur);const g2=c.createGain();g2.gain.value=0.25;o2.connect(g2);g2.connect(trem);
  const b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
  const n=c.createBufferSource();n.buffer=b;const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=350;bp.Q.value=1.5;const ng=c.createGain();ng.gain.value=0.6;n.connect(bp);bp.connect(ng);ng.connect(trem);
  [o,o2,lfo,n].forEach(s=>{s.start(t);s.stop(t+dur);});
}
function bark(t0){const c=ac();if(!c)return;const t=c.currentTime+(t0||0),o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type="sawtooth";o.frequency.setValueAtTime(430,t);o.frequency.exponentialRampToValueAtTime(220,t+0.15);f.type="bandpass";f.frequency.value=800;f.Q.value=2;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.connect(f);f.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.25);}

// Hilfe für alle Übungen mit mehreren Aufgaben: Zurück/Weiter, Wertung nur beim ersten Lösen
function rounds(n,render,onDone,parent){
  let i=0;const res=[];
  const api={
    get i(){return i;}, n,
    solved:(firstTry,star=true)=>{if(res[i]===undefined){res[i]=firstTry;if(star)addStar();}},
    isDone:()=>res[i]!==undefined,
    go:()=>{
      if(i>=n)return onDone(res);
      render(api);
      setBack(parent);
      bindNav(()=>{if(i>0){i--;api.go();}else parent();},()=>{i++;api.go();});
    }
  };
  api.go();
}

/* ---------- Körperteile: Finden ---------- */
function bodyFind(){
  const ids=shuffle(Object.keys(PARTS)).slice(0,10);const dogs=ids.map(rndDog);
  rounds(ids.length,R=>{
    const i=R.i,id=ids[i],p=PARTS[id],dk=dogs[i];let tries=0,locked=R.isDone();
    const q=LESEN?`Wo ist ${art(p)}? Tippe darauf!`:`Zeige auf ${akk(p)} von ${DOGS[dk].name}!`;
    view("Körperteile finden",`${task(q)}${progress(i,ids.length)}<div class="dogbox" id="box">${dogSVG(dk,"neutral",{zones:zoneEls(dk)})}</div><div class="fb" id="fb"></div>${navBar(i,ids.length)}`);
    talk(q);const box=$("#box");
    if(locked){mark(box,id,"tapok");fb(`Das ist ${art(p)}.`,"good");}
    box.addEventListener("pointerdown",e=>{const z=e.target.closest("[data-zone]");if(!z||locked)return;const zid=z.dataset.zone;
      if(zid===id){locked=true;R.solved(tries===0);okSound();unmark(box,"hl");mark(box,id,"tapok");
        const m=`Richtig! Das ist ${art(p)}.`;fb(m,"good");after(m);}
      else{tries++;noSound();mark(box,zid,"tapno");setTimeout(()=>unmark(box,"tapno"),700);
        const m=`Das ist ${art(PARTS[zid])}. Versuch es noch einmal!`;fb(m,"bad");talk(m);
        if(tries>=2)mark(box,id,"hl");}
    });
  },res=>finish("Körperteile finden",res,ids.length,bodyFind,bodyMenu),bodyMenu);
}

/* ---------- Körperteile: Lesen ---------- */
function bodyRead(){
  const ids=shuffle(Object.keys(PARTS)).slice(0,10);const dogs=ids.map(rndDog);
  const opts=ids.map(id=>shuffle([id,...shuffle(Object.keys(PARTS).filter(k=>k!==id)).slice(0,3)]));
  rounds(ids.length,R=>{
    const i=R.i,id=ids[i],p=PARTS[id],dk=dogs[i];let tries=0,locked=R.isDone();
    view("Wörter lesen",`${task("Wie heißt der gelbe Körperteil?")}${progress(i,ids.length)}<div class="dogbox" id="box">${dogSVG(dk,"neutral",{zones:zoneEls(dk)})}</div>
      <div class="opts">${opts[i].map(o=>`<button class="opt ${locked&&o===id?"right":""}" data-o="${o}">${art(PARTS[o])}</button>`).join("")}</div><div class="fb" id="fb"></div>${navBar(i,ids.length)}`);
    const box=$("#box");mark(box,id,"hl");
    app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(locked)return;
      if(b.dataset.o===id){locked=true;b.classList.add("right");R.solved(tries===0);okSound();const m=`Richtig! Das ist ${art(p)}.`;fb(m,"good");after(m);}
      else{tries++;b.classList.add("wrong");noSound();fb("Lies noch einmal genau!","bad");}
    });
  },res=>finish("Wörter lesen",res,ids.length,bodyRead,bodyMenu),bodyMenu);
}

/* ---------- Körperteile: Schreiben ---------- */
function bodyWrite(){
  const ids=shuffle(Object.keys(PARTS)).slice(0,10);const dogs=ids.map(rndDog);
  const norm=s=>s.trim().replace(/^(der|die|das)\s+/i,"").replace(/\s+/g," ");
  const fold=s=>s.toLowerCase().replace(/ue/g,"ü").replace(/ae/g,"ä").replace(/oe/g,"ö");
  rounds(ids.length,R=>{
    const i=R.i,id=ids[i],p=PARTS[id],dk=dogs[i];let tries=0,locked=R.isDone();
    view("Schreiben",`${task("Schreibe das Wort für den gelben Körperteil.")}${progress(i,ids.length)}<div class="dogbox" id="box">${dogSVG(dk,"neutral",{zones:zoneEls(dk)})}</div>
      <div class="row"><input class="write" id="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${p.a} …"></div>
      <div class="hint" id="hint"></div>
      <div class="row"><button class="btn" id="check">✔ Prüfen</button><button class="btn alt" id="tip">💡 Tipp</button></div><div class="fb" id="fb"></div>${navBar(i,ids.length)}`);
    const box=$("#box"),inp=$("#inp");mark(box,id,"hl");
    if(locked){inp.value=p.n;fb("Richtig! "+art(p)+".","good");}
    $("#tip").onclick=()=>{$("#hint").textContent=p.n[0]+" _".repeat(p.n.length-1);};
    const check=()=>{if(locked)return;const v=norm(inp.value);if(!v)return;
      if(v===p.n||fold(v)===fold(p.n)){locked=true;R.solved(tries===0);okSound();
        let m="Richtig! "+art(p)+".";
        if(v!==p.n){m=(v[0]===v[0].toLowerCase()?`Fast perfekt! Nomen schreibt man groß: `:`Richtig! Man schreibt: `)+p.n;}
        fb(m,"good");inp.blur();after(m);}
      else{tries++;noSound();
        if(tries>=2){fb(`Richtig ist: ${art(p)}. Schreib es ab!`,"bad");$("#hint").textContent=p.n;inp.value="";}
        else fb("Noch nicht. Versuch es noch einmal!","bad");}
    };
    $("#check").onclick=check;inp.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
  },res=>finish("Schreiben",res,ids.length,bodyWrite,bodyMenu),bodyMenu);
}

function petExplore(dk){
  const found=new Set();let lastAt=0,lastZone=null,moodT=null,down=false,over=false;
  const t=T("Streichle {N} mit dem Finger. Wo mag {nom} das? Finde die 4 Wohlfühlpunkte!",dk);
  view("Wohlfühlpunkte",`${task(t)}<div id="prog"></div><div class="dogbox touch" id="box"></div><div class="fb" id="fb"></div>
    <div class="nav"><button class="btn alt" id="prevBtn">◀ Zurück</button><button class="btn alt" id="nextBtn">Weiter ▶</button></div>`);
  setBack(petChoose);bindNav(petChoose,()=>petReveal(dk));
  const box=$("#box");
  const prog=()=>{$("#prog").innerHTML=progress(found.size,GOODS.length,"💚");};
  const draw=mood=>{const o=mood==="gut"?{eyes:"happy",mouth:"open",tail:"wag",extra:"hearts"}:mood==="boese"?{eyes:"angry",mouth:"closed",ear:40,tail:"down",extra:"grrr"}:{};
    box.innerHTML=dogSVG(dk,"neutral",{over:o,zones:zoneEls(dk)});found.forEach(id=>mark(box,id,"ok"));};
  draw();prog();talk(t);
  function react(id){
    const p=PARTS[id];clearTimeout(moodT);
    if(p.pet){happy();const isNew=!found.has(id);found.add(id);draw("gut");prog();if(isNew)addStar();
      const m=T(`Ja! ${cap(am(p))} mag {N} das. 💚`,dk);fb(m,"good");talk(m);
      if(found.size===GOODS.length){over=true;glowNext();later(()=>petReveal(dk),2600);return;}}
    else{growl();draw("boese");const m=T(`Grrr! ${cap(am(p))} mag {N} das nicht. ${p.why}`,dk);fb(m,"bad");
      if(autoSpeak)later(()=>say(m.replace("Grrr! ","")),1200);}
    moodT=later(()=>draw(),2400);
  }
  function check(e){if(over)return;const el=document.elementFromPoint(e.clientX,e.clientY);const z=el&&el.closest?el.closest("[data-zone]"):null;if(!z)return;
    const id=z.dataset.zone,now=Date.now();if(id===lastZone&&now-lastAt<1800)return;if(now-lastAt<700)return;lastZone=id;lastAt=now;react(id);}
  box.addEventListener("pointerdown",e=>{down=true;check(e);});
  box.addEventListener("pointermove",e=>{if(down)check(e);});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>box.addEventListener(ev,()=>down=false));
}

function petQuiz(){

      if(yes===p.pet){R.solved(true);okSound();

  view("Gefühle entdecken",`${task(f.emoji+" "+T(f.satz,dk))}${progress(i+1,FEEL.length,"🐾")}<div class="dogbox">${dogSVG(dk,f.id)}</div>

  if(f.id==="wut"){growl();later(()=>talk(full),1300);}else if(f.id==="froehlich"||f.id==="spielen"){bark(0);later(()=>talk(full),500);}else talk(full);

function feelQuiz(){
  let seq=[];while(seq.length<8){const s=shuffle(FEEL.map((_,k)=>k));if(seq.length&&s[0]===seq[seq.length-1])s.reverse();seq=seq.concat(s);}seq=seq.slice(0,8);
  const dogs=seq.map(rndDog);
  const opts=seq.map(k=>shuffle([FEEL[k],...shuffle(FEEL.filter(x=>x!==FEEL[k])).slice(0,2)]));
  rounds(seq.length,R=>{
    const i=R.i,f=FEEL[seq[i]],dk=dogs[i];let tries=0,locked=false;
    const q=T(LESEN?"Wie fühlt sich {N}?":"Wie fühlt sich {N}? Tippe auf das passende Gesicht.",dk);
    view("Gefühle-Quiz",`${task(q)}${progress(i,seq.length)}<div class="dogbox">${dogSVG(dk,f.id)}</div>
      <div class="opts">${opts[i].map(o=>`<button class="opt ${LESEN?"":"emoji"}" data-f="${o.id}">${LESEN?o.name:o.emoji}</button>`).join("")}</div>
      <div class="fb" id="fb"></div>${navBar(i,seq.length)}`);
    talk(q);
    const solve=(quiet)=>{locked=true;app.querySelector(`[data-f="${f.id}"]`).classList.add("right");
      const m=T(f.satz+" "+f.tun,dk);fb(m,"good");
      if(quiet)return;
      if(f.id==="wut"){growl();glowNext();later(()=>talk(m),1300);}else after(m);};
    if(R.isDone())solve(true);
    app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{if(locked)return;
      if(b.dataset.f===f.id){R.solved(tries===0);okSound();solve();}
      else{tries++;b.classList.add("wrong");noSound();
        if(tries>=2){R.solved(false,false);solve();}else{const m="Schau noch einmal genau hin: Wie sehen der Schwanz, die Ohren und das Maul aus?";fb(m,"bad");talk(m);}}
    });
  },res=>finish("Gefühle-Quiz",res,seq.length,feelQuiz,feelMenu),feelMenu);
}

  const all="Das darf ich! "+DARF.map(r=>r[1]).join(" ")+" Das lasse ich! "+LASSE.map(r=>r[1]).join(" ");
  view("Unsere Regeln",`${task("Unsere Regeln für den Umgang mit dem Schulhund")}
    <div class="row"><button class="btn alt" id="readAll">🔊 Alles vorlesen</button></div>
    <div class="rulecols ${LESEN?"":"bild"}">
      <div><div class="rhead ok">✅ Das darf ich!</div><div class="rules">${DARF.map(r=>li(r,"rok")).join("")}</div></div>
      <div><div class="rhead no">❌ Das lasse ich!</div><div class="rules">${LASSE.map(r=>li(r,"rno")).join("")}</div></div>
    </div>
    <p class="sub" style="margin-top:14px;font-weight:700">Ein respektvoller Umgang macht uns alle glücklich! ❤️</p>
    <div class="nav"><button class="btn alt" id="prevBtn">◀ Zurück</button><button class="btn glow" id="nextBtn">Weiter: Üben ▶</button></div>`);
  setBack(rulesMenu);bindNav(rulesMenu,rulesQuiz);
  $("#readAll").onclick=()=>{ac();say(all);};
  talk("Unsere Regeln für den Umgang mit dem Schulhund. Grün heißt: Das darf ich. Rot heißt: Das lasse ich. Tippe auf den Lautsprecher, dann hörst du die Regel.");
}
function rulesQuiz(){
  const pick=[...shuffle(SIT.filter(x=>x.ok)).slice(0,5),...shuffle(SIT.filter(x=>!x.ok)).slice(0,5)];
  const ids=shuffle(pick);const dogs=ids.map(rndDog);
  rounds(ids.length,R=>{
    const i=R.i,sit=ids[i],dk=dogs[i];let locked=R.isDone();
    const text=T(sit.s,dk),q=text+" Darf ich das?";
    view("Darf ich das?",`${task(q)}${progress(i,ids.length)}${scene(sit,dk)}
      <div class="row"><button class="btn yes" data-a="1">✅ ${LESEN?"Das darf ich":"Darf ich"}</button><button class="btn no" data-a="0">❌ ${LESEN?"Das lasse ich":"Lasse ich"}</button></div>
      <div class="fb" id="fb"></div>${navBar(i,ids.length)}`);
    talk(q);
    const react=()=>{const box=$("#sdog");box.innerHTML=dogSVG(dk,sit.after)+(sit.prop&&sit.after!=="wut"?`<span class="prop" style="left:${sit.prop[1]}%;top:${sit.prop[2]}%">${sit.prop[0]}</span>`:"");};
    const res=()=>(sit.ok?"Das darf ich! ":"Das lasse ich! ")+sit.why;
    if(locked){react();fb(res(),sit.ok?"good":"bad");}
    app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(locked)return;locked=true;
      const yes=b.dataset.a==="1",right=yes===sit.ok;
      R.solved(right,right);react();
      if(sit.growl)growl();
      if(right){okSound();if(sit.ok)happy();}else if(!sit.growl)noSound();
      const m=right?"Richtig! "+res():(sit.ok?"Doch, das darfst du! ":"Achtung, das lässt du lieber! ")+sit.why;
      fb(m,right?"good":"bad");
      glowNext();later(()=>talk(m),sit.growl?1300:200);
    });
  },res=>finish("Darf ich das?",res,ids.length,rulesQuiz,rulesMenu),rulesMenu);
}

/* ---------- Kopfleiste ---------- */
document.getElementById("backBtn").onclick=()=>{ac();if(backFn)backFn();};
document.getElementById("homeBtn").onclick=()=>{ac();menu();};
const vb=document.getElementById("voiceBtn");
if(LESEN){vb.style.display="";vb.onclick=()=>{autoSpeak=!autoSpeak;vb.textContent=autoSpeak?"🔊":"🔇";if(!autoSpeak&&"speechSynthesis" in window)speechSynthesis.cancel();};}
start();
</script>
