<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zahlendetektiv bis 1 Million</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
  :root {
    --bg: #f0f3f9; --card: #ffffff; --ink: #18223d; --muted: #56637f; --line: #d3dbea;
    --key: #f5f7fc; --accent: #2c4fa3; --accent-ink: #ffffff; --accent-soft: #e3eaf9;
    --plate: #bcd2f6; --rod: #bde6c8; --cube: #f9dc7c;
    --kilo: #f5b5a8; --zt: #d6c3f1; --ht: #a6dfd9; --mio: #f7c98c;
    --grid: #6f86b8;
    --good: #1b7a45; --good-bg: #e1f3e8; --miss: #a04a08; --miss-bg: #fdebd4;
    --font-body: "Andika", "Trebuchet MS", system-ui, sans-serif;
    --font-display: "Fredoka", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1729; --card: #18223a; --ink: #e9eefb; --muted: #a2b0cf; --line: #2c3a5e;
      --key: #202c4a; --accent: #86a8ff; --accent-ink: #0b1430; --accent-soft: #23325a;
      --plate: #4a6fb5; --rod: #3f8f5d; --cube: #d8b436;
      --kilo: #b8604f; --zt: #7b62a8; --ht: #2f8c84; --mio: #b9803a;
      --grid: #a9bde6;
      --good: #8fe0ad; --good-bg: #1b3a2a; --miss: #f3b36b; --miss-bg: #3e2d18;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 17px; line-height: 1.45;
    padding-inline: 16px; padding-block: 16px 32px;
  }
  .app { max-width: 1000px; margin-inline: auto; display: grid; gap: 16px; }
  h1, h2 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  button { font-family: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .top { display: grid; gap: 10px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 22px; }
  .brand svg { flex: none; }
  .home { border: 0; background: none; color: inherit; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 10px; font: inherit; }
  .count { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; }
  .progress, .dots { display: flex; gap: 5px; }
  .progress span, .dots span { flex: 1; height: 9px; border-radius: 5px; background: var(--line); }
  .progress span.cur { background: var(--accent); }
  .progress span.ok, .dots span.ok { background: var(--good); }
  .progress span.miss, .dots span.miss { background: var(--miss); }

  .card { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; }

  /* Startseite */
  .start { display: grid; gap: 16px; }
  .start-copy { display: grid; gap: 16px; align-content: start; }
  .start h1 { font-size: clamp(30px, 5.4vw, 44px); line-height: 1.08; }
  .pick-label { font-family: var(--font-display); font-weight: 500; font-size: 18px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 50px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line);
    background: var(--key); color: var(--ink); font-size: 18px; font-weight: 700; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .steps { display: grid; gap: 8px; }
  .step {
    display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; text-align: left;
    min-height: 64px; padding: 8px 14px; border-radius: 14px; border: 2px solid var(--line);
    background: var(--key); color: var(--ink); cursor: pointer;
  }
  .step .num {
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 2px solid var(--line); font-family: var(--font-display); font-weight: 600; font-size: 19px;
  }
  .step b { display: block; font-size: 18px; }
  .step small { display: block; color: var(--muted); font-size: 15px; line-height: 1.3; }
  .step[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .step[aria-pressed="true"] .num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .stats { color: var(--muted); font-size: 15px; }
  .ex-title { font-family: var(--font-display); font-weight: 500; font-size: 20px; margin-bottom: 8px; }
  .ex-note { margin-top: 12px; color: var(--muted); }
  .ex-note b { color: var(--ink); }
  .ladder { margin-top: 14px; padding-top: 12px; border-top: 1.5px dashed var(--line); display: grid; gap: 4px; font-size: 15px; color: var(--muted); }
  .ladder-title { color: var(--ink); font-weight: 700; }

  /* Aufgaben */
  .task { display: grid; gap: 16px; }
  .prompt { font-family: var(--font-display); font-weight: 500; font-size: 24px; margin-bottom: 10px; }
  .drawing svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; padding-top: 12px; border-top: 1.5px dashed var(--line); font-size: 14px; color: var(--muted); }
  .lg { display: inline-flex; align-items: center; gap: 7px; }
  .lg svg { flex: none; }

  .plate { fill: var(--plate); stroke: var(--ink); stroke-width: 1.3; }
  .rod { fill: var(--rod); stroke: var(--ink); stroke-width: 1.3; }
  .cube { fill: var(--cube); stroke: var(--ink); stroke-width: 1.3; }
  .kilo { fill: var(--kilo); }
  .zt { fill: var(--zt); }
  .ht { fill: var(--ht); }
  .mio { fill: var(--mio); }
  .face { stroke: var(--ink); stroke-width: 1.2; stroke-linejoin: round; }
  .lit { fill: #fff; opacity: .38; }
  .dim3 { fill: #000; opacity: .16; }
  .grid { fill: none; stroke: var(--grid); stroke-width: .5; }
  .grid3 { fill: none; stroke: var(--ink); stroke-width: .35; opacity: .55; }
  .guide { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 5; }
  .bignum { font-family: var(--font-display); font-weight: 600; fill: var(--ink); }

  .panel { display: grid; gap: 12px; align-content: start; }
  .answer-label { font-size: 15px; color: var(--muted); margin-bottom: 4px; }
  .answer {
    min-height: 78px; display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 2px solid var(--line); border-radius: 16px;
    font-size: clamp(38px, 6vw, 54px); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .03em;
  }
  .answer.edit { border-color: var(--accent); }
  .answer .ph { color: var(--line); }
  .answer.edit::after { content: ""; width: 3px; height: .85em; background: var(--accent); margin-left: 6px; animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .key {
    min-height: clamp(58px, 9vh, 74px); border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--key); color: var(--ink); font-size: 30px; font-weight: 700;
    box-shadow: 0 3px 0 var(--line); user-select: none; -webkit-user-select: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .key:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
  .key.ok { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .key:disabled { opacity: .4; cursor: default; transform: none; }

  .tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tf button {
    min-height: 92px; border-radius: 16px; border: 2px solid var(--line); background: var(--key); color: var(--ink);
    font-family: var(--font-display); font-weight: 500; font-size: 26px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .tf button:active:not(:disabled) { transform: translateY(2px); }
  .tf button:disabled { cursor: default; }
  .tf button.right { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .tf button.wrong { background: var(--miss-bg); border-color: var(--miss); color: var(--miss); }
  .tf button.dim { opacity: .45; }

  .feedback { border-radius: 16px; padding: 14px 16px; border: 2px solid var(--line); display: grid; gap: 8px; }
  .feedback.good { background: var(--good-bg); border-color: var(--good); }
  .feedback.miss { background: var(--miss-bg); border-color: var(--miss); }
  .feedback.hint { background: var(--accent-soft); border-color: var(--accent); }
  .fb-title { font-family: var(--font-display); font-weight: 600; font-size: 22px; }
  .feedback.good .fb-title { color: var(--good); }
  .feedback.miss .fb-title { color: var(--miss); }

  .stv { width: 100%; border-collapse: separate; border-spacing: 5px 0; table-layout: fixed; }
  .stv th { font-size: 13px; font-weight: 400; color: var(--muted); padding-bottom: 4px; overflow: hidden; text-overflow: ellipsis; }
  .stv td { text-align: center; font-size: 30px; font-weight: 700; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 0; color: var(--ink); }
  .stv td.zero { background: var(--miss-bg); border-color: var(--miss); color: var(--miss); }
  .stv.wide td { font-size: 24px; }
  .stv-sum { font-size: 17px; }
  .stv-sum b { font-size: 22px; }

  .primary {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 16px; min-height: 62px;
    font-size: 22px; font-weight: 700; padding: 0 28px; cursor: pointer; width: 100%;
  }
  .primary:active { transform: translateY(2px); }
  .secondary {
    background: transparent; color: var(--accent); border: 2px solid var(--accent); border-radius: 16px; min-height: 62px;
    font-size: 20px; font-weight: 700; padding: 0 24px; cursor: pointer; width: 100%;
  }

  .end-card { display: grid; gap: 14px; }
  .end-kicker { color: var(--muted); font-size: 15px; }
  .end-card h2 { font-size: clamp(30px, 5vw, 40px); }
  .end-score { font-size: 22px; }
  .end-score b { font-family: var(--font-display); font-size: 44px; font-weight: 600; margin-right: 6px; }
  .misses { display: grid; gap: 10px; }
  .misses h3 { font-family: var(--font-display); font-weight: 500; font-size: 20px; margin: 4px 0 0; }
  .miss-item { display: grid; grid-template-columns: minmax(110px, 190px) 1fr; gap: 14px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 14px; }
  .miss-item svg { width: 100%; height: auto; display: block; }
  .miss-item p { font-size: 16px; }
  .end-actions { display: grid; gap: 10px; }

  @media (min-width: 760px) {
    body { padding-inline: 28px; padding-block: 24px 40px; }
    .start { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: 28px; }
    .task { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; gap: 20px; }
    .end-actions { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .answer.edit::after { animation: none; }
  }
  /* Zahlen hören */
  .listen { display: grid; gap: 14px; justify-items: center; padding: 18px 0 8px; }
  .listen-btn { font-family: var(--font-display); font-weight: 600; font-size: 30px; min-height: 110px; width: min(100%, 360px); border: 0; border-radius: 24px; background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  .listen-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .listen-btn.pulse { animation: lpulse .9s ease-out; }
  @keyframes lpulse { 0% { box-shadow: 0 5px 0 rgba(0,0,0,.25), 0 0 0 0 rgba(44,79,163,.55); } 100% { box-shadow: 0 5px 0 rgba(0,0,0,.25), 0 0 0 26px rgba(44,79,163,0); } }
  .listen-slow { font-family: var(--font-display); font-weight: 500; font-size: 22px; min-height: 62px; width: min(100%, 360px); border-radius: 18px; border: 2px solid var(--accent); background: var(--card); color: var(--accent); cursor: pointer; }
  .listen-note { color: var(--muted); font-size: 15px; }
  .numword { font-family: var(--font-display); font-size: 20px; color: var(--muted); text-align: center; margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { .listen-btn.pulse { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <button class="home brand" id="btn-home" aria-label="Zur Startseite">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="3"/>
          <path d="M18.5 18.5 L26 26" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
          <rect x="8" y="8" width="8" height="8" rx="1.5" fill="var(--plate)" stroke="var(--ink)" stroke-width="1"/>
        </svg>
        <span>Zahlendetektiv bis 1 Million</span>
      </button>
      <div class="count" id="count" hidden></div>
    </div>
    <div class="progress" id="progress" hidden></div>
  </header>

  <!-- Startseite -->
  <section id="screen-start" class="start">
    <div class="start-copy">
      <h1>Löse die Fälle mit Würfeln, Platten und Stangen.</h1>
      <div>
        <p class="pick-label">Zahlenraum</p>
        <div class="chips" id="modes"></div>
      </div>
      <div>
        <p class="pick-label">Stufe</p>
        <div class="steps" id="steps"></div>
      </div>
      <button class="primary" id="btn-start">Aufgaben starten</button>
      <p class="stats" id="stats" hidden></p>
    </div>
    <div class="card">
      <p class="ex-title">So liest du eine Darstellung</p>
      <div class="drawing" id="ex-drawing"></div>
      <div class="legend" id="ex-legend"></div>
      <div id="ex-table" style="margin-top:14px"></div>
      <p class="ex-note" id="ex-note"></p>
      <div class="ladder" id="ex-ladder"></div>
    </div>
  </section>

  <!-- Aufgabe -->
  <section id="screen-task" class="task" hidden>
    <div class="card">
      <p class="prompt" id="prompt"></p>
      <div class="drawing" id="drawing"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <div>
        <p class="answer-label" id="answer-label"></p>
        <div class="answer" id="answer" aria-live="polite"></div>
      </div>
      <div class="feedback" id="feedback" aria-live="polite" hidden></div>
      <div class="keypad" id="keypad">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key" data-key="back" aria-label="Letzte Ziffer löschen">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>
        </button>
        <button class="key" data-key="0">0</button>
        <button class="key ok" data-key="ok" id="key-ok" aria-label="Zahl prüfen">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>
        </button>
      </div>
      <div class="tf" id="tf" hidden>
        <button id="btn-true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>
          richtig
        </button>
        <button id="btn-false">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          falsch
        </button>
      </div>
      <button class="primary" id="btn-next" hidden>Weiter</button>
    </div>
  </section>

  <!-- Ergebnis -->
  <section id="screen-end" hidden>
    <div class="card end-card">
      <p class="end-kicker" id="end-kicker"></p>
      <h2 id="end-title"></h2>
      <p class="end-score"><b id="end-n"></b>von <span id="end-total"></span> beim ersten Versuch richtig</p>
      <div class="dots" id="end-dots"></div>
      <div class="misses" id="end-misses" hidden>
        <h3>Das schauen wir uns noch einmal an</h3>
        <div id="end-list" class="misses"></div>
      </div>
      <div class="end-actions">
        <button class="secondary" id="btn-practice" hidden>Fehler noch einmal üben</button>
        <button class="primary" id="btn-again">Neue Runde</button>
      </div>
      <button class="secondary" id="btn-back">Zahlenraum oder Stufe wechseln</button>
    </div>
  </section>
</div>

<script src="lernlog.js"></script>
<script src="denkpause.js"></script>
<script>
(function () {
  'use strict';

  /*GEN-START*/
  var rand = function (a, b) { return a + Math.floor(Math.random() * (b - a + 1)); };
  var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };
  var shuffle = function (a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  };
  var POW = function (i) { return Math.pow(10, i); };
  var range = function (a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; };

  // Stellenwerte: Index 0 = Einer … 6 = Million
  var PL = [
    { item: 'Einerwürfel', items: 'Einerwürfel', sw: 'Einer', k: 'E' },
    { item: 'Zehnerstange', items: 'Zehnerstangen', sw: 'Zehner', k: 'Z' },
    { item: 'Hunderterplatte', items: 'Hunderterplatten', sw: 'Hunderter', k: 'H' },
    { item: 'Tausenderwürfel', items: 'Tausenderwürfel', sw: 'Tausender', k: 'T' },
    { item: 'Zehntausenderstange', items: 'Zehntausenderstangen', sw: 'Zehntausender', k: 'ZT' },
    { item: 'Hunderttausenderplatte', items: 'Hunderttausenderplatten', sw: 'Hunderttausender', k: 'HT' },
    { item: 'Millionenwürfel', items: 'Millionenwürfel', sw: 'Millionen', k: 'M' }
  ];
  var itemName = function (i, n) { return n === 1 ? PL[i].item : PL[i].items; };
  var swName = function (i, n) { return i === 6 ? (n === 1 ? 'Million' : 'Millionen') : PL[i].sw; };

  // Zahlenräume: top = höchste Stelle, die in Stufe 3 vorkommt
  var MODES = [
    { id: '1000', top: 2, label: 'bis 1 000' },
    { id: '10000', top: 3, label: 'bis 10 000' },
    { id: '100000', top: 4, label: 'bis 100 000' },
    { id: '1000000', top: 5, label: 'bis 1 Million' }
  ];

  function fmt(n) {
    var s = String(n);
    if (s.length < 5) return s;
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }
  function digitsOf(n) { var c = []; for (var i = 0; i <= 6; i++) c.push(Math.floor(n / POW(i)) % 10); return c; }
  function numOf(c) { var n = 0; for (var i = 0; i < c.length; i++) n += (c[i] || 0) * POW(i); return n; }
  function highest(c) { for (var i = c.length - 1; i >= 0; i--) if (c[i] > 0) return i; return 0; }

  function two() {
    var a = rand(1, 9), b = rand(1, 9);
    while (b === a) b = rand(1, 9);
    return [a, b];
  }

  /* ---- Aufgabenarten ---- */
  function entryTask(n) { return { type: 'entry', n: n, c: digitsOf(n), tries: 0, result: null, wrong: [] }; }
  function bundleTask(p) {
    var c = [0, 0, 0, 0, 0, 0, 0]; c[p] = 10;
    return { type: 'entry', bundle: true, bp: p, n: POW(p + 1), c: c, tries: 0, result: null, wrong: [] };
  }
  function countTask(p, k) {
    var n = k * POW(p);
    return { type: 'count', p: p, k: k, n: n, c: digitsOf(n), tries: 0, result: null, wrong: [] };

    if (i === 1) return '<svg width="9" height="22" viewBox="0 0 9 22" aria-hidden="true">' + rodEl(1, 1, 7, 20) + '</svg>';
    if (i === 2) return '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">' + plateEl(1, 1, 20) + '</svg>';
    if (i === 3) return '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">' + box3d(1, 1, 16, 16, 6, 'kilo', 0, 0, 0) + '</svg>';
    if (i === 4) return '<svg width="12" height="30" viewBox="0 0 12 30" aria-hidden="true">' + box3d(1, 1, 7, 25, 3, 'zt', 1, 5, 1) + '</svg>';
    if (i === 5) return '<svg width="27" height="27" viewBox="0 0 27 27" aria-hidden="true">' + box3d(1, 1, 22, 22, 3, 'ht', 5, 5, 1) + '</svg>';
    return '<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">' + box3d(1, 1, 20, 20, 8, 'mio', 4, 4, 4) + '</svg>';
  }
  function legendHTML(top) {
    var h = '';
    for (var i = Math.min(top + 1, 6); i >= 0; i--) h += '<span class="lg">' + legendIcon(i) + PL[i].item + ' = ' + fmt(POW(i)) + '</span>';
    return h;
  }

  function tableHTML(n, top, showNumber) {
    var d = digitsOf(n), hi = Math.max(top, highest(d)), cols = hi + 1, head = '', body = '';
    for (var i = hi; i >= 0; i--) {
      head += '<th>' + (cols <= 4 ? PL[i].sw : PL[i].k) + '</th>';
      body += '<td class="' + (d[i] === 0 ? 'zero' : '') + '">' + d[i] + '</td>';
    }
    return '<table class="stv' + (cols > 5 ? ' wide' : '') + '"><thead><tr>' + head + '</tr></thead><tbody><tr>' + body + '</tr></tbody></table>' +
      (showNumber ? '<p class="stv-sum">Die Zahl heißt <b>' + fmt(n) + '</b>.</p>' : '');
  }
  /*GEN-END*/

  /* ---------- Zustand ---------- */
  /* ---- Zahlen hören: Vorlesen ---- */
  var deVoice = null;
  function pickVoice() {
    try { var v = speechSynthesis.getVoices().filter(function (x) { return /^de/i.test(x.lang); }); deVoice = v.filter(function (x) { return /de-DE/i.test(x.lang); })[0] || v[0] || null; } catch (e) {}
  }
  try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
  function speakNum(n, slow) {
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(n));
      u.lang = 'de-DE'; if (deVoice) u.voice = deVoice;
      u.rate = slow ? 0.55 : 0.8;
      speechSynthesis.speak(u);
    } catch (e) {}
    var b = document.querySelector('.listen-btn');
    if (b) { b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); }
  }
  function listenHTML() {
    return '<div class="listen"><button type="button" class="listen-btn" data-listen="normal">🔊 Hör gut zu!</button>' +
      '<button type="button" class="listen-slow" data-listen="slow">🐢 Noch einmal langsam</button>' +
      '<p class="listen-note">Du kannst die Zahl so oft hören, wie du willst.</p></div>';
  }

  var $ = function (s) { return document.querySelector(s); };
  var LL = window.LernLog || null; // Lernstand-Aufzeichnung (Auswertung: lernstand.html)
  if (LL) LL.init('Zahlendetektiv bis 1 Million');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SEL_KEY = 'zahlendetektiv.auswahl';
  var sel = { mode: '1000', step: 3 };
  try { var rs = JSON.parse(localStorage.getItem(SEL_KEY) || 'null'); if (rs && rs.mode && rs.step) sel = rs; } catch (e) {}
  var modeTop = function (id) { for (var i = 0; i < MODES.length; i++) if (MODES[i].id === id) return MODES[i].top; return 2; };

  var S = { tasks: [], i: 0, input: '', phase: 'answer', practice: false, top: 2, step: 3 };
  var cur = function () { return S.tasks[S.i]; };

  function statKey(mode, step) { return mode === '1000' && step === 3 ? 'zahlendetektiv.v1' : 'zahlendetektiv.' + mode + '.' + step; }
  function loadStats(k) { try { var r = localStorage.getItem(k); if (r) return JSON.parse(r); } catch (e) {} return null; }
  function saveStats(k, st) { try { localStorage.setItem(k, JSON.stringify(st)); } catch (e) {} }
  function saveSel() { try { localStorage.setItem(SEL_KEY, JSON.stringify(sel)); } catch (e) {} }

  function stepInfo(t, step) {
    var U = POW(t);
    if (step === 1) return { title: PL[t].sw + 'zahlen', sub: '1 ' + PL[t].sw + ' = ' + fmt(U) + ', 2 ' + PL[t].sw + ' = ' + fmt(2 * U) + ' … und bündeln: 10 ' + PL[t - 1].items + ' = 1 ' + PL[t].item };
    if (step === 2) return { title: PL[t].sw + ' und ' + PL[t - 1].sw, sub: 'z. B. ' + fmt(3 * U + 4 * U / 10) + ', ' + fmt(4 * U + 3 * U / 10) + ' oder ' + fmt(4 * U / 10) };
    if (step === 4) return { title: 'Zahlen hören', sub: '🔊 Hör die Zahl und tippe sie ein, z. B. ' + (t === 2 ? '306, 360, 36' : t === 3 ? '4005, 4500, 450' : fmt(3 * POW(t) + 6)) };
    var ex = t === 2 ? '306, 540, 54' : t === 3 ? '4050, 4005, 405' : t === 4 ? fmt(40500) + ', ' + fmt(40050) : fmt(405000) + ', ' + fmt(400050);
    return { title: 'Alle Stellen', sub: 'Mit Nullen als Platzhalter, z. B. ' + ex };
  }

  /* ---------- Startseite ---------- */
  function renderStart() {
    var t = modeTop(sel.mode);
    $('#modes').innerHTML = MODES.map(function (m) {
      return '<button class="chip" data-mode="' + m.id + '" aria-pressed="' + (m.id === sel.mode) + '">' + m.label + '</button>';
    }).join('');
    $('#steps').innerHTML = [1, 2, 3, 4].map(function (st) {
      var info = stepInfo(t, st);
      return '<button class="step" data-step="' + st + '" aria-pressed="' + (st === sel.step) + '"><span class="num">' + st + '</span><span><b>' + info.title + '</b><small>' + info.sub + '</small></span></button>';
    }).join('');

    // Beispiel
    var c = [0, 0, 0, 0, 0, 0, 0], note;
    if (sel.step === 1) {
      c[t] = 3;
      note = 'Jede Sorte hat ihren Platz. Hier liegen nur ' + PL[t].items + ': <b>3 ' + PL[t].sw + '</b> sind <b>' + fmt(3 * POW(t)) + '</b>. Für die leeren Stellen schreibst du Nullen.';
    } else if (sel.step === 2) {
      c[t] = 3; c[t - 1] = 4;
      note = '<b>3 ' + PL[t].sw + '</b> und <b>4 ' + PL[t - 1].sw + '</b>. Die übrigen Stellen bekommen eine 0. Die Zahl heißt <b>' + fmt(numOf(c)) + '</b>.';
    } else if (sel.step === 4) {
      c[t] = 3; c[0] = 6;
      note = 'Du hörst „' + numWord(numOf(c)) + '“. Bei allen leeren Stellen schreibst du eine <b>0</b>. Die Zahl heißt <b>' + fmt(numOf(c)) + '</b>.';
    } else {
      var fill = [6, 3, 1, 4, 2];
      c[t] = 3; c[t - 1] = 0;
      for (var i = t - 2, k = 0; i >= 0; i--, k++) c[i] = fill[k];
      note = 'Es gibt keine ' + PL[t - 1].items + '. Für <b>0 ' + PL[t - 1].sw + '</b> schreibst du eine <b>0</b>. Die Zahl heißt <b>' + fmt(numOf(c)) + '</b>.';
    }
    $('#ex-drawing').innerHTML = svgBlocks(c, t);
    $('#ex-legend').innerHTML = legendHTML(t);
    $('#ex-table').innerHTML = tableHTML(numOf(c), t, false);
    $('#ex-note').innerHTML = note;

    var lad = '<p class="ladder-title">So wird gebündelt</p>';
    for (var p = 0; p <= Math.min(t, 5); p++) lad += '<p>10 ' + PL[p].items + ' = 1 ' + PL[p + 1].item + ' (' + fmt(POW(p + 1)) + ')</p>';
    $('#ex-ladder').innerHTML = lad;

    var st = loadStats(statKey(sel.mode, sel.step)), s = $('#stats');
    if (st && st.runden > 0) {
      s.hidden = false;
      s.textContent = 'In dieser Stufe bisher ' + st.runden + (st.runden === 1 ? ' Runde' : ' Runden') + ' gespielt. Bestes Ergebnis: ' + st.best + ' von 12.';
    } else s.hidden = true;
  }

  $('#modes').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    sel.mode = b.getAttribute('data-mode'); saveSel(); renderStart();
  });
  $('#steps').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    sel.step = Number(b.getAttribute('data-step')); saveSel(); renderStart();
  });

  function showScreen(name) {
    ['start', 'task', 'end'].forEach(function (n) { $('#screen-' + n).hidden = n !== name; });
    var inRound = name === 'task';
    if (!inRound && LL) LL.abbruch();
    $('#progress').hidden = !inRound;
    $('#count').hidden = !inRound;
    if (name === 'start') renderStart();
    window.scrollTo(0, 0);
  }

  function buildProgress() {
    var html = '';
    for (var i = 0; i < S.tasks.length; i++) html += '<span></span>';
    $('#progress').innerHTML = html;
  }
  function updateProgress() {
    var segs = $('#progress').children;
    for (var i = 0; i < segs.length; i++) {
      var t = S.tasks[i];
      segs[i].className = t.result ? t.result : (i === S.i ? 'cur' : '');
    }
    var m = MODES.filter(function (x) { return x.top === S.top; })[0];
    $('#count').textContent = m.label + ' · Stufe ' + S.step + ' · Aufgabe ' + (S.i + 1) + ' von ' + S.tasks.length;
  }

  function startRound(tasks, practice) {
    S = { tasks: tasks, i: 0, input: '', phase: 'answer', practice: practice, top: modeTop(sel.mode), step: sel.step, mode: sel.mode };
    $('#legend').innerHTML = legendHTML(S.top);
    buildProgress();
    showScreen('task');
    renderTask();
  }

  function bigNumberSVG(n) {
    return '<svg viewBox="0 0 400 130" role="img" aria-label="' + fmt(n) + '"><text class="bignum" x="200" y="88" text-anchor="middle" font-size="66">' + fmt(n) + '</text></svg>';
  }

  function renderTask() {
    var t = cur();
    S.input = ''; S.phase = 'answer';
    if (t.type === 'listen') {
      $('#prompt').textContent = 'Hör gut zu! Tippe die Zahl ein, die du hörst.';
      $('#drawing').innerHTML = listenHTML();
      $('#answer-label').textContent = 'Ich höre die Zahl';
    } else if (t.type === 'count') {
      $('#prompt').textContent = 'Wie viele ' + PL[t.p].items + ' brauchst du für diese Zahl?';
      $('#drawing').innerHTML = bigNumberSVG(t.n);
      $('#answer-label').textContent = 'Anzahl ' + PL[t.p].items;
    } else {
      $('#prompt').textContent = t.type === 'entry' ? 'Wie heißt die Zahl?' : 'Passt die Zahl zur Darstellung?';
      $('#drawing').innerHTML = svgBlocks(t.c, S.top);
      $('#answer-label').textContent = t.type === 'entry' ? 'Die Zahl heißt' : 'Dort steht die Zahl';
    }
    $('#legend').hidden = t.type === 'listen';
    var typing = t.type !== 'tf';
    $('#keypad').hidden = !typing;
    $('#tf').hidden = typing;
    $('#feedback').hidden = true;
    $('#btn-next').hidden = true;
    ['#btn-true', '#btn-false'].forEach(function (id) { var b = $(id); b.disabled = false; b.className = ''; });
    updateAnswer();
    updateProgress();
    window.scrollTo(0, 0);
    if (LL) {
      var mm = MODES.filter(function (x) { return x.top === S.top; })[0];
      var au = t.type === 'count' ? 'Wie viele ' + PL[t.p].items + ' für ' + fmt(t.n) + '? (richtig: ' + t.k + ')'
        : t.type === 'tf' ? 'Gezeigt: ' + fmt(t.n) + ', dort steht ' + fmt(t.label) + ' (passt: ' + (t.isTrue ? 'ja' : 'nein') + ')'
        : t.type === 'listen' ? 'Gesprochen: ' + fmt(t.n)
        : (t.bundle ? 'Bündeln: ' : 'Gezeigt: ') + fmt(t.n);
      LL.start(mm.label + ' · Stufe ' + S.step + ' ' + stepInfo(S.top, S.step).title + (S.practice ? ' (Wiederholung)' : ''), au);
    }
    if (t.type === 'listen') setTimeout(function () { speakNum(t.n); }, 350);
  }

  function updateAnswer() {
    var t = cur(), a = $('#answer');
    if (t.type !== 'tf') {
      a.className = 'answer' + (S.phase === 'answer' ? ' edit' : '');
      a.innerHTML = S.input ? fmt(S.input) : '<span class="ph">?</span>';
      $('#key-ok').disabled = S.input === '';
    } else {
      a.className = 'answer';
      a.textContent = fmt(t.label);
    }
  }

  function feedback(kind, title, text, table, showNumber) {
    var box = $('#feedback'), t = cur();
    box.className = 'feedback ' + kind;
    box.hidden = false;
    box.innerHTML = '<p class="fb-title">' + title + '</p>' +
      (text ? '<p>' + text + '</p>' : '') +
      (table ? tableHTML(t.n, S.top, showNumber) : '');
    box.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
  }

  function endTask() {
    S.phase = 'done';
    var t = cur();
    if (t.type !== 'tf') { $('#keypad').hidden = true; updateAnswer(); }
    if (t.type === 'count') $('#drawing').innerHTML = svgBlocks(t.c, S.top);
    if (t.type === 'listen') { $('#drawing').innerHTML = svgBlocks(t.c, S.top) + '<p class="numword">„' + numWord(t.n) + '“ = ' + fmt(t.n) + '</p>'; $('#legend').hidden = false; }
    var last = S.i === S.tasks.length - 1;
    var nb = $('#btn-next');
    nb.textContent = last ? 'Ergebnis ansehen' : 'Weiter';
    nb.hidden = false;
    updateProgress();
    nb.focus({ preventScroll: true });
    nb.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
  }

  var PRAISE = ['Richtig!', 'Genau!', 'Stimmt!', 'Gut erkannt!'];

  function solvedText(t) {
    if (t.type === 'count') return t.k + ' ' + itemName(t.p, t.k) + ' sind ' + t.k + ' ' + swName(t.p, t.k) + ' = ' + fmt(t.n) + '.';
    if (t.type === 'listen') return '„' + numWord(t.n) + '“: ' + compose(t, S.top) + '. Die Zahl heißt ' + fmt(t.n) + '.';
    return compose(t, S.top) + '. Die Zahl heißt ' + fmt(t.n) + '.';
  }

  function check() {
    var t = cur();
    if (t.type === 'tf' || S.phase !== 'answer' || S.input === '') return;
    var given = S.input, want = t.type === 'count' ? String(t.k) : String(t.n);
    t.tries++;
    if (given === want) {
      t.result = t.tries === 1 ? 'ok' : 'miss';
      if (LL) LL.fertig(true);
      if (window.ZD_star) window.ZD_star();
      feedback('good', t.tries === 1 ? pick(PRAISE) : 'Jetzt stimmt es!', solvedText(t), false);
      endTask();
      return;
    }
    t.wrong.push(given);
    var tip = t.type === 'listen' ? hintListen(t, given) : hintFor(t, given);
    if (LL) LL.fehler(t.type === 'count' ? given : fmt(given), tip);
    if (t.tries >= 2) {
      t.result = 'miss';
      if (LL) LL.fertig(false);
      feedback('miss', 'Das war knifflig.', tip + ' ' + solvedText(t), t.type !== 'count', true);
      endTask();
      if (window.Denkpause) Denkpause.falsch(tip + ' Schau dir danach die Lösung an.', 2, { loesung: true });
    } else {
      feedback('hint', 'Noch nicht ganz.', tip + ' Versuche es noch einmal.', false, false);
      if (window.Denkpause) Denkpause.falsch(tip, 1);
      S.input = '';
      updateAnswer();
    }
  }

  function answerTF(sayTrue) {
    var t = cur();
    if (t.type !== 'tf' || S.phase !== 'answer') return;
    var right = sayTrue === t.isTrue;
    t.result = right ? 'ok' : 'miss';
    if (right && window.ZD_star) window.ZD_star();
    if (LL) { if (!right) LL.fehler(sayTrue ? 'passt' : 'passt nicht'); LL.fertig(right); }
    var bt = $('#btn-true'), bf = $('#btn-false');
    bt.disabled = bf.disabled = true;
    var chosen = sayTrue ? bt : bf, other = sayTrue ? bf : bt;
    chosen.className = right ? 'right' : 'wrong';
    other.className = 'dim';
    if (right && t.isTrue) feedback('good', pick(PRAISE), compose(t, S.top) + '. ' + fmt(t.n) + ' passt.', false);
    else if (right) feedback('good', pick(PRAISE), 'Die Darstellung zeigt ' + fmt(t.n) + ', nicht ' + fmt(t.label) + '.', false);
    else if (t.isTrue) feedback('miss', 'Die Zahl passt doch.', 'Die Darstellung zeigt ' + fmt(t.n) + '.', true, true);
    else feedback('miss', 'Die Zahl passt nicht.', 'Dort steht ' + fmt(t.label) + ', die Darstellung zeigt aber ' + fmt(t.n) + '.', true, true);
    endTask();
    if (!right && window.Denkpause) Denkpause.falsch(t.isTrue ? 'Die Zahl passt doch. Die Darstellung zeigt ' + fmt(t.n) + '. Schau dir die Tabelle an.' : 'Die Zahl passt nicht. Dort steht ' + fmt(t.label) + ', die Darstellung zeigt aber ' + fmt(t.n) + '.', 1, { loesung: true });
  }

  function next() {
    if (S.phase !== 'done') return;
    if (window.ZD_rewardCheck && window.ZD_rewardCheck(function () { S.phase = 'done'; next(); })) { S.phase = 'reward'; return; }
    if (S.i < S.tasks.length - 1) { S.i++; renderTask(); }
    else showEnd();
  }

  function showEnd() {
    var total = S.tasks.length;
    var ok = S.tasks.filter(function (t) { return t.result === 'ok'; }).length;
    var misses = S.tasks.filter(function (t) { return t.result !== 'ok'; });
    var ratio = ok / total;

    $('#end-kicker').textContent = (S.practice ? 'Übungsrunde' : 'Fall abgeschlossen') + ' · Stufe ' + S.step;
    $('#end-title').textContent = ratio >= 0.9 ? 'Scharf beobachtet!' : ratio >= 0.6 ? 'Gut gespürt!' : 'Dranbleiben lohnt sich!';
    $('#end-n').textContent = ok;
    $('#end-total').textContent = total;
    $('#end-dots').innerHTML = S.tasks.map(function (t) { return '<span class="' + t.result + '"></span>'; }).join('');

    $('#end-list').innerHTML = misses.map(function (t) {
      var txt;
      if (t.type === 'count') txt = 'Für <b>' + fmt(t.n) + '</b> brauchst du <b>' + t.k + '</b> ' + itemName(t.p, t.k) + '. Erster Versuch: ' + t.wrong[0] + '.';
      else if (t.type === 'listen') txt = 'Gehört: <b>' + fmt(t.n) + '</b> („' + numWord(t.n) + '“). Erster Versuch: ' + fmt(t.wrong[0]) + '.';
      else if (t.type === 'entry') txt = 'Gezeigt war <b>' + fmt(t.n) + '</b>. Erster Versuch: ' + fmt(t.wrong[0]) + '.';
      else if (t.isTrue) txt = 'Die Zahl <b>' + fmt(t.n) + '</b> passte zur Darstellung.';
      else txt = 'Dort stand ' + fmt(t.label) + ', gezeigt war <b>' + fmt(t.n) + '</b>.';
      return '<div class="miss-item">' + svgBlocks(t.c, S.top) + '<p>' + txt + '</p></div>';
    }).join('');
    $('#end-misses').hidden = misses.length === 0;
    $('#btn-practice').hidden = misses.length === 0;

    if (!S.practice) {
      var k = statKey(S.mode, S.step);
      var st = loadStats(k) || { runden: 0, best: 0 };
      st.runden += 1;
      st.best = Math.max(st.best, ok);
      saveStats(k, st);
    }
    S.missed = misses;
    showScreen('end');
  }

  /* ---------- Ereignisse ---------- */
  function press(k) {
    var t = cur();
    if (S.phase !== 'answer' || t.type === 'tf') return;
    var max = t.type === 'count' ? 2 : S.top + 2;
    if (k === 'back') S.input = S.input.slice(0, -1);
    else if (k === 'ok') { check(); return; }
    else if (S.input.length < max && !(S.input === '' && k === '0')) S.input += k;
    updateAnswer();
  }

  $('#keypad').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) press(b.getAttribute('data-key'));
  });
  $('#drawing').addEventListener('click', function (e) {
    var b = e.target.closest('[data-listen]'); var t = cur();
    if (!b || !t || t.type !== 'listen') return;
    speakNum(t.n, b.getAttribute('data-listen') === 'slow');
  });
  $('#btn-true').addEventListener('click', function () { answerTF(true); });
  $('#btn-false').addEventListener('click', function () { answerTF(false); });
  $('#btn-next').addEventListener('click', next);
  $('#btn-start').addEventListener('click', function () { startRound(buildRound(modeTop(sel.mode), sel.step), false); });
  $('#btn-again').addEventListener('click', function () { startRound(buildRound(S.top, S.step), false); });
  $('#btn-back').addEventListener('click', function () { showScreen('start'); });
  $('#btn-home').addEventListener('click', function () { showScreen('start'); });
  $('#btn-practice').addEventListener('click', function () {
    var again = S.missed.map(function (t) {
      var c = {}; for (var k in t) c[k] = t[k];
      c.tries = 0; c.result = null; c.wrong = [];
      return c;
    });
    var keep = { top: S.top, step: S.step, mode: S.mode };
    startRound(again, true);
    S.top = keep.top; S.step = keep.step; S.mode = keep.mode;
  });

  document.addEventListener('keydown', function (e) {
    if ($('#screen-task').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) { press(e.key); }
    else if (e.key === 'Backspace') { press('back'); e.preventDefault(); }
    else if (e.key === 'Enter') {
      var ae = document.activeElement;
      if (ae && ae.tagName === 'BUTTON' && ae.offsetParent !== null) return;
      if (S.phase === 'done') next(); else press('ok');
    }
  });

  renderStart();
})();
</script>
<!-- Belohnung: Gummi-Schleuder nach 10 richtigen Aufgaben (3 Runden) -->
<style>
  .zd-stars{font-family:var(--font-display);font-size:18px;font-weight:600;color:#b7791f;background:#FFF6D6;border-radius:12px;padding:4px 10px;white-space:nowrap;margin-left:auto}
  .zd-ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(20,30,50,.5)}
  .zd-ov.on{display:flex}
  .zd-card{background:#fff;color:#1F2A37;border-radius:26px;padding:22px 28px;max-width:560px;width:92%;text-align:center;font-family:var(--font-body);font-size:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .zd-card .big{font-size:76px;line-height:1}
  .zd-card h2{font-family:var(--font-display);margin:8px 0;font-size:30px}
  .zd-card button,.zd-bar button{font-family:var(--font-display);font-size:22px;font-weight:600;border:none;border-radius:16px;padding:12px 20px;margin:6px;color:#fff;background:#F28C28;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}

  .zd-bar button{background:#fff;color:#1F2A37;box-shadow:0 3px 0 rgba(0,0,0,.15);border:2px solid #d3dbea;margin:0}

  @keyframes zdfall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
<div class="zd-ov" id="zdRewardOv"><div class="zd-card">
  <div class="big">🏆</div><h2>Super gemacht!</h2><p id="zdRewardTxt"></p>
  <button id="zdRewardGo">🎯 Zur Gummi-Schleuder</button>
</div></div>
<div class="zd-ov" id="zdEndOv"><div class="zd-card">
  <div class="big">🎉</div><h2 id="zdEndTxt"></h2>
  <button class="light" id="zdBack">Zurück</button><button id="zdAgain">Nochmal schießen</button>
</div></div>
<div class="zd-game" id="zdGame">
  <div class="zd-bar"><button id="zdHome">⬅</button><span>🎯 Gummi-Schleuder – Zieh den Gummi zurück und lass los!</span></div>
  <svg id="zdSvg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
</div>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg',GOAL=10,SHOTS=10,MAXR=3,KEY='zahlendetektiv.belohnung';
  var R={done:0};try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)R=x;}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(R));}catch(e){}}
  var g=function(id){return document.getElementById(id);};
  var badge=document.createElement('span');badge.className='zd-stars';var row=document.querySelector('.top-row');if(row)row.appendChild(badge);
  function upd(){var r=Math.max(0,GOAL-R.done);badge.textContent=r?'⭐ noch '+r+' bis 🎯':'🎯 frei!';}
  upd();
  var pending=null;
  window.ZD_star=function(){R.done++;save();upd();};
  window.ZD_rewardCheck=function(cont){if(R.done<GOAL)return false;pending=cont;g('zdRewardTxt').textContent='Du hast '+GOAL+' Aufgaben richtig gelöst. Jetzt darfst du mit der Gummi-Schleuder schießen!';g('zdRewardOv').classList.add('on');confetti();sound('ok');return true;};
  function el(tag,a,p){var e=document.createElementNS(NS,tag);for(var k in a)if(a[k]!=null)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
  function txt(p,x,y,t,a){var o={x:x,y:y,'text-anchor':'middle','dominant-baseline':'central','font-family':'Fredoka, Trebuchet MS, sans-serif','font-weight':700};for(var k in a)o[k]=a[k];var e=el('text',o,p);e.textContent=t;return e;}
  var rnd=function(a,b){return a+Math.random()*(b-a);},pick=function(a){return a[Math.floor(Math.random()*a.length)];};
  var COLORS=['#E63946','#1D7FD8','#2A9D4B','#F28C28','#8E44AD','#D6338A','#0FA3A3'];
  var AC=null;function tone(f,t0,d,type){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),gn=AC.createGain();o.type=type||'sine';o.frequency.value=f;gn.gain.setValueAtTime(0.0001,AC.currentTime+t0);gn.gain.exponentialRampToValueAtTime(0.22,AC.currentTime+t0+0.02);gn.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t0+d);o.connect(gn);gn.connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d+0.05);}catch(e){}}
  function sound(k){if(k==='ok'){tone(660,0,.18);tone(880,.15,.25);tone(1100,.3,.35);}}
  function boing(){tone(380,0,.12);}
  function confetti(){for(var i=0;i<45;i++){var c=document.createElement('div');c.className='zd-conf';c.style.left=rnd(0,100)+'vw';c.style.background=pick(COLORS);c.style.animationDuration=rnd(1.8,3.2)+'s';c.style.animationDelay=rnd(0,.6)+'s';document.body.appendChild(c);(function(c){setTimeout(function(){c.remove();},4200);})(c);}}
  function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.85;speechSynthesis.speak(u);}catch(e){}}
  var svg=g('zdSvg'),SANC={x:160,y:430},SPL={x:126,y:400},SPR={x:194,y:400},SBR=17,SGRAV=900;
  var G=null,raf=null,last=0,rounds=0;
  function pt(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
  function newTgt(){return{shape:pick(['num','num','bal']),c:pick(COLORS),x:rnd(560,920),y0:rnd(130,430),amp:rnd(20,60),sp:rnd(.6,1.4),ph:rnd(0,6.28),sz:rnd(46,58),hit:0,y:0,lab:pick(['1','10','100','1000','10 000','100 000'])};}
  function start(){G={shots:SHOTS,hits:0,ball:{x:SANC.x,y:SANC.y,vx:0,vy:0},state:'ready',targets:[newTgt(),newTgt(),newTgt()],pops:[],t:0,aim:null};if(raf)cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop);}
  function open(){R.done=0;save();upd();rounds=0;g('zdGame').classList.add('on');start();say('Zieh den Gummi zurück und lass los. Triff die Zahlen!');}
  function close(){if(raf)cancelAnimationFrame(raf);raf=null;g('zdGame').classList.remove('on');g('zdEndOv').classList.remove('on');var c=pending;pending=null;if(c)c();}
  g('zdRewardGo').onclick=function(){g('zdRewardOv').classList.remove('on');open();};
  g('zdHome').onclick=close;g('zdBack').onclick=close;
  g('zdAgain').onclick=function(){if(rounds>=MAXR)return;g('zdEndOv').classList.remove('on');start();};
  svg.addEventListener('pointerdown',function(e){if(G&&G.state==='aim'&&e.isPrimary)G.state='ready';if(!G||G.state!=='ready')return;var p=pt(e);if(p.x>480)return;e.preventDefault();G.state='aim';G.aim=e.pointerId;try{svg.setPointerCapture(e.pointerId);}catch(_){}aim(p);boing();});
  window.addEventListener('pointermove',function(e){if(!G||G.state!=='aim'||e.pointerId!==G.aim)return;aim(pt(e));});
  function aim(p){var dx=p.x-SANC.x,dy=p.y-SANC.y,d=Math.hypot(dx,dy),mx=150;if(d>mx){dx*=mx/d;dy*=mx/d;}G.ball.x=SANC.x+dx;G.ball.y=SANC.y+dy;}
  function rel(e){if(!G||G.state!=='aim'||e.pointerId!==G.aim)return;var dx=SANC.x-G.ball.x,dy=SANC.y-G.ball.y;if(Math.hypot(dx,dy)<20){G.ball.x=SANC.x;G.ball.y=SANC.y;G.state='ready';return;}G.ball.vx=dx*7.2;G.ball.vy=dy*7.2;G.state='fly';tone(500,0,.08);tone(300,.05,.12);}
  window.addEventListener('pointerup',rel);window.addEventListener('pointercancel',rel);
  function shape(gg,t){var s=t.sz,c=t.c;if(t.shape==='bal'){el('line',{x1:0,y1:s*.55,x2:4,y2:s*1.3,stroke:'#666','stroke-width':2},gg);el('ellipse',{cx:0,cy:0,rx:s*.45,ry:s*.56,fill:c},gg);el('ellipse',{cx:-s*.15,cy:-s*.2,rx:s*.1,ry:s*.16,fill:'#fff',opacity:.5},gg);return;}
    var r=s*.62;el('circle',{cx:0,cy:0,r:r+5,fill:c},gg);el('circle',{cx:0,cy:0,r:r,fill:'#fff'},gg);txt(gg,0,1,t.lab,{'font-size':t.lab.length>4?r*.42:r*.62,fill:c});}
  function loop(now){var dt=Math.min(.033,(now-last)/1000);last=now;G.t+=dt;G.targets.forEach(function(t){t.y=t.y0+Math.sin(G.t*t.sp+t.ph)*t.amp;});var b=G.ball;
    if(G.state==='fly'){b.vy+=SGRAV*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
      G.targets.forEach(function(t,i){if(!t.hit&&Math.hypot(b.x-t.x,b.y-t.y)<t.sz*.62+SBR){t.hit=1;G.hits++;sound('ok');for(var k=0;k<14;k++)G.pops.push({x:t.x,y:t.y,vx:rnd(-260,260),vy:rnd(-300,120),c:t.c,life:.8});setTimeout(function(){G.targets[i]=newTgt();},500);}});
      if(b.x>1040||b.y>660||b.x<-40){G.shots--;if(G.shots<=0){G.state='over';setTimeout(end,500);}else{b.x=SANC.x;b.y=SANC.y;b.vx=b.vy=0;G.state='ready';}}}
    G.pops.forEach(function(p){p.vy+=SGRAV*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});G.pops=G.pops.filter(function(p){return p.life>0;});
    draw();if(G.state!=='over'||G.pops.length)raf=requestAnimationFrame(loop);}
  function draw(){var s=svg;s.innerHTML='';var d=el('defs',{},s),sky=el('linearGradient',{id:'zdsky',x1:0,y1:0,x2:0,y2:1},d);el('stop',{offset:0,'stop-color':'#BFE3FF'},sky);el('stop',{offset:1,'stop-color':'#EAF6FF'},sky);
    el('rect',{x:0,y:0,width:1000,height:620,fill:'url(#zdsky)'},s);
    [[220,90],[640,60],[850,150]].forEach(function(q){var c=el('g',{opacity:.9},s);[[0,0,34],[30,-12,40],[64,0,30]].forEach(function(w){el('circle',{cx:q[0]+w[0],cy:q[1]+w[1],r:w[2],fill:'#fff'},c);});});
    el('rect',{x:0,y:540,width:1000,height:80,fill:'#7BC96F'},s);el('rect',{x:0,y:540,width:1000,height:10,fill:'#5DAE52'},s);
    G.targets.forEach(function(t){if(t.hit)return;shape(el('g',{transform:'translate('+t.x+','+t.y+') rotate('+Math.sin(G.t*t.sp)*8+')'},s),t);});
    G.pops.forEach(function(p){el('circle',{cx:p.x,cy:p.y,r:7*p.life+2,fill:p.c},s);});
    el('path',{d:'M'+SANC.x+',560 L'+SANC.x+',470 L'+SPL.x+','+SPL.y+' M'+SANC.x+',470 L'+SPR.x+','+SPR.y,stroke:'#8B5A2B','stroke-width':16,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},s);
    var b=G.ball,pulled=G.state==='aim'||G.state==='ready';
    if(G.state==='aim'){var vx=(SANC.x-b.x)*7.2,vy=(SANC.y-b.y)*7.2;for(var k=1;k<=14;k++){var tt=k*.06;el('circle',{cx:b.x+vx*tt,cy:b.y+vy*tt+SGRAV*tt*tt/2,r:9-k*.25,fill:'#F28C28',stroke:'#7A2E00','stroke-width':3,opacity:1-k*.02},s);}}
    if(pulled)el('line',{x1:SPL.x,y1:SPL.y,x2:b.x,y2:b.y,stroke:'#E63946','stroke-width':8,'stroke-linecap':'round'},s);else el('line',{x1:SPL.x,y1:SPL.y,x2:SPR.x,y2:SPR.y,stroke:'#E63946','stroke-width':8,'stroke-linecap':'round'},s);
    if(G.state!=='over'){el('circle',{cx:b.x,cy:b.y,r:SBR,fill:'#444'},s);el('circle',{cx:b.x-5,cy:b.y-5,r:5,fill:'#999'},s);}
    if(pulled)el('line',{x1:SPR.x,y1:SPR.y,x2:b.x,y2:b.y,stroke:'#C1121F','stroke-width':8,'stroke-linecap':'round'},s);
    [SPL,SPR].forEach(function(p){el('circle',{cx:p.x,cy:p.y,r:10,fill:'#eef0f3',stroke:'#7a5a30','stroke-width':2},s);});
    for(var i=0;i<G.shots;i++)el('circle',{cx:30+i*30,cy:30,r:11,fill:'#444'},s);
    el('rect',{x:600,y:10,width:185,height:46,rx:14,fill:'#fff',opacity:.9},s);txt(s,692,34,'Runde '+Math.min(rounds+1,MAXR)+' von '+MAXR,{'font-size':22,fill:'#1F2A37'});
    el('rect',{x:800,y:10,width:185,height:46,rx:14,fill:'#fff',opacity:.9},s);txt(s,892,34,'🎯 Treffer: '+G.hits,{'font-size':24,fill:'#1F2A37'});
    if(G.state==='ready'&&G.shots===SHOTS&&G.t<6)txt(s,330,520,'👆 Ball festhalten, zurückziehen, loslassen!',{'font-size':22,fill:'#1F2A37'});}
  function end(){rounds++;var lastR=rounds>=MAXR;g('zdEndTxt').textContent='Du hast '+G.hits+' Mal getroffen!'+(lastR?' Das waren 3 Runden.':'');
    g('zdAgain').style.display=lastR?'none':'';g('zdAgain').textContent='Nochmal schießen (Runde '+(rounds+1)+' von '+MAXR+')';
    g('zdBack').textContent=lastR?'Weiter üben ➜':'Zurück';g('zdEndOv').classList.add('on');confetti();sound('ok');
    say('Toll! Du hast '+G.hits+' Mal getroffen.'+(lastR?' Das waren drei Runden. Jetzt geht es weiter mit dem Üben.':''));}
})();
</script>
