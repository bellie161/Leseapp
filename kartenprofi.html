<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Karten-Profi</title>
<style>
:root{--bg:#f4f7fb;--ink:#1d2433;--blue:#2b6fd6;--green:#2e9d4f;--red:#d63b3b;--orange:#f08a24;--card:#fff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:22px}
button{font-family:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:3px solid #dfe6f0;position:sticky;top:0;z-index:5}
header h1{font-size:28px;margin:0;flex:1;text-align:center}
.hbtn{background:#eef3fb;border:2px solid #c9d6ea;border-radius:14px;padding:8px 14px;font-size:18px;color:var(--ink);text-decoration:none;white-space:nowrap}
.testbar{background:#ffe08a;text-align:center;font-weight:bold;padding:6px;font-size:18px}
main{max-width:1100px;margin:0 auto;padding:14px}
h2{font-size:26px;margin:18px 4px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{background:var(--card);border:3px solid #d6e0ee;border-radius:20px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;font-size:22px;color:var(--ink);min-height:96px}
.tile .ic{font-size:44px;line-height:1}
.tile b{display:block;font-size:22px}
.tile small{display:block;font-size:17px;color:#55617a;margin-top:4px}
.sec-saar .tile{border-color:#f3b37a;background:#fff8f1}
.exhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;background:#dfe6f0;border:2px solid #c3cfe0}
.dot.on{background:var(--green);border-color:#1f7a3a}
.extitle{font-size:20px;color:#55617a;font-weight:bold}
.qbar{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #cfe0f7;border-radius:18px;padding:12px 16px;margin-bottom:12px}
.q{font-size:28px;font-weight:bold;flex:1;line-height:1.3}
.spk{font-size:30px;background:#eef3fb;border:2px solid #c9d6ea;border-radius:14px;padding:6px 12px;flex:none}
.vis{display:flex;justify-content:center;align-items:center;flex-direction:column;gap:12px}
.vis svg{max-width:100%;height:auto;touch-action:manipulation}
.mapbox{width:100%;display:flex;justify-content:center}
.mapbox svg{height:auto;display:block}
.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:14px 0}
.ch{min-width:180px;min-height:72px;font-size:26px;font-weight:bold;padding:10px 20px;border-radius:18px;border:3px solid #9fb6d8;background:#fff;color:var(--ink)}
.ch.sym{min-width:150px;padding:8px}
.ch.right,[data-ans].right{background:#c9f0d3!important;border-color:var(--green)!important}
.ch.wrong{background:#ffd5d5!important;border-color:var(--red)!important}
svg [data-ans]{cursor:pointer}
svg .wrong{fill:#ff8a8a!important}
svg .right{fill:#7ddc95!important}
svg .river.right,svg .river.wrong{fill:none!important}
.show-me{animation:pulse 1s infinite}
svg .show-me{stroke:#ffcc00!important;stroke-width:6!important;stroke-opacity:1!important}
.ch.show-me{border-color:#ffb300!important;box-shadow:0 0 0 6px #ffe28a}
@keyframes pulse{50%{opacity:.45}}
.hint{background:#fff7d6;border:3px solid #f3cf55;border-radius:18px;padding:12px 16px;font-size:24px;display:flex;gap:12px;align-items:center;margin-top:8px}
.hint .ht{flex:1;line-height:1.35}
.wait{font-weight:bold;color:#a55c00;white-space:nowrap}
.locked [data-ans]{pointer-events:none}
.locked .choices{opacity:.55}
.big-sym{background:#fff;border:3px solid #d6e0ee;border-radius:20px;padding:14px}
.legend{display:flex;flex-direction:column;gap:4px;background:#fff;border:2px solid #ccd;border-radius:12px;padding:10px;font-size:20px}
.legend div{display:flex;align-items:center;gap:10px}
.legend span.sw{width:44px;height:26px;border:1px solid #777;display:inline-block}
.row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center}
.done{text-align:center}
.done .big{font-size:80px}
.bigbtn{font-size:26px;font-weight:bold;padding:16px 28px;border-radius:18px;border:3px solid #1f7a3a;background:#d9f5e1;margin:10px;color:var(--ink)}
.bigbtn.alt{border-color:#9fb6d8;background:#fff}
canvas{width:100%;max-width:900px;height:auto;border-radius:18px;border:3px solid #cbd9ec;touch-action:none;background:#bfe3ff;display:block;margin:0 auto}
.rwinfo{text-align:center;font-size:24px;font-weight:bold;margin:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20}
.modal .box{background:#fff;border-radius:18px;padding:20px;max-width:900px;width:94%;max-height:90vh;overflow:auto;font-size:19px}
.modal input[type=number]{font-size:26px;width:120px;padding:6px}
.adm h3{margin:14px 0 6px;font-size:21px}
.adm label{display:flex;gap:8px;align-items:center;padding:4px 0}
.adm input[type=checkbox]{width:24px;height:24px}
.adm table{border-collapse:collapse;width:100%;font-size:16px}
.adm td,.adm th{border:1px solid #ccd;padding:4px 6px;text-align:left;vertical-align:top}
.adm .seg button{font-size:17px;padding:6px 12px;border-radius:10px;border:2px solid #9fb6d8;background:#fff;margin-right:6px}
.adm .seg button.on{background:#2b6fd6;color:#fff;border-color:#2b6fd6}
.msg{background:#e3f6e8;border:3px solid #7cc893;border-radius:16px;padding:12px;font-size:24px;text-align:center;margin:10px 0}
.info{background:#eef5ff;border:2px solid #b9d0f0;border-radius:14px;padding:10px 14px;font-size:21px;line-height:1.35;max-width:640px}
</style>
</head>

"use strict";
/* =========================================================
   Speicher
   ========================================================= */
const KEY='kartenprofi_v1';
let S;
function loadS(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  S=Object.assign({ex:{},items:{},off:{},blStage:1,wait:4,log:[]},d||{});
}
let TEST=false;
function saveS(){ if(TEST) return; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
loadS();

/* =========================================================
   Hilfen
   ========================================================= */
const $=s=>document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function opts3(correct,pool){return shuffle([correct,...shuffle(pool.filter(x=>x!==correct)).slice(0,2)]);}
function btns(labels){return '<div class="choices">'+labels.map(l=>`<button class="ch" data-ans="${esc(l)}">${l}</button>`).join('')+'</div>';}
function btnsH(list){return '<div class="choices">'+list.map(o=>`<button class="ch sym" data-ans="${esc(o.id)}">${o.html}</button>`).join('')+'</div>';}

/* gewichtete Auswahl: unsichere Dinge kommen öfter */
function pick(ex,items,keyFn){
  const last=CUR&&CUR.lastKey;
  let cand=items.filter(it=>keyFn(it)!==last); if(!cand.length) cand=items;
  const w=cand.map(it=>{const st=S.items[ex+'|'+keyFn(it)]; if(!st) return 3; return st.s>=3?1:(st.s>=1?2:4);});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<cand.length;i++){r-=w[i]; if(r<=0) return cand[i];}
  return cand[cand.length-1];
}

/* =========================================================
   Vorlesen (nur auf Tippen)
   ========================================================= */
let deVoice=null;
function findVoice(){try{const v=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));deVoice=v.find(x=>/Anna|Petra|Helena|Google/i.test(x.name))||v[0]||null;}catch(e){}}
try{speechSynthesis.onvoiceschanged=findVoice;findVoice();}catch(e){}
function cleanSpeech(t){
  return String(t)
    .replace(/<[^>]+>/g,' ')
    .replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu,' ')
    .replace(/\bSt\.\s?/g,'Sankt ')
    .replace(/\bz\.\s?B\./g,'zum Beispiel')
    .replace(/\bca\./g,'ungefähr')
    .replace(/(\d)\s?km\b/g,'$1 Kilometer')
    .replace(/(\d)\s?m\b/g,'$1 Meter')
    .replace(/(\d+)\.(\s|$)/g,'$1$2')
    .replace(/\bLies\b/g,'Liehs').replace(/\blies\b/g,'liehs')
    .replace(/[()„“"▲]/g,' ')
    .replace(/–/g,' bis ')
    .replace(/\s+/g,' ').trim();
}
function speak(t){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cleanSpeech(t));u.lang='de-DE';if(deVoice)u.voice=deVoice;u.rate=0.9;speechSynthesis.speak(u);}catch(e){}
}

let AC=null;
function tone(f,d,type='sine',vol=0.15,delay=0){
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();

  o.connect(g);g.connect(AC.destination);const t=AC.currentTime+delay;o.start(t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.stop(t+d+0.05);}catch(e){}
}

/* =========================================================
   Projektion & SVG-Bausteine
   ========================================================= */
function proj(lon0,lon1,lat0,lat1,W,k){k=k||0.63;const s=W/((lon1-lon0)*k);return {W,H:(lat1-lat0)*s,x:lon=>(lon-lon0)*k*s,y:lat=>(lat1-lat)*s,s};}
const PDE=proj(5.4,15.4,47.1,55.25,520);
const PEU=proj(3.0,17.4,45.6,56.0,600);
const PSL=proj(6.25,7.6,49.03,49.72,620,0.65);
function dP(pr,a){return 'M'+a.map(p=>pr.x(p[0]).toFixed(1)+' '+pr.y(p[1]).toFixed(1)).join('L')+'Z';}
function dL(pr,a){return 'M'+a.map(p=>pr.x(p[0]).toFixed(1)+' '+pr.y(p[1]).toFixed(1)).join('L');}
function XY(pr,p){return [pr.x(p[0]),pr.y(p[1])];}
function txt(x,y,t,o){o=o||{};return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${o.a||'middle'}" font-size="${o.fs||13}" font-weight="${o.fw||'bold'}" fill="${o.fill||'#1d2433'}" stroke="#fff" stroke-width="${o.sw==null?3:o.sw}" paint-order="stroke" style="pointer-events:none">${t}</text>`;}
function multiline(x,y,t,o){const parts=t.split('|');const fs=(o&&o.fs)||13;return parts.map((p,i)=>txt(x,y+(i-(parts.length-1)/2)*fs*1.05,p,o)).join('');}
function wrap(x0,y0,w,h,g,maxw){const ar=(w/h).toFixed(3);return `<div class="mapbox"><svg viewBox="${x0} ${y0} ${w.toFixed(0)} ${h.toFixed(0)}" style="width:min(100%, ${maxw||760}px, calc(64vh * ${ar}))" xmlns="http://www.w3.org/2000/svg">${g}</svg></div>`;}
function stateD(pr,s){let d=dP(pr,s.pts);if(s.raw2)d+=dP(pr,s.raw2);return d;}

/* Deutschland-Karte */
function deSVG(o){
  o=o||{};const pr=PDE;let g='';
  g+=`<rect x="0" y="0" width="${pr.W}" height="${pr.H.toFixed(0)}" fill="#e7e9ee"/>`;
  const seaTap=o.tapSeas;
  g+=`<path d="${dP(pr,SEA_N)}" fill="#a9d3f5" ${seaTap?'data-ans="nordsee"':''}/>`;
  g+=`<path d="${dP(pr,SEA_O)}" fill="#a9d3f5" ${seaTap?'data-ans="ostsee"':''}/>`;
  g+=`<path d="${dP(pr,DK1)}${dP(pr,DK2)}" fill="#e7e9ee" stroke="#c5c9d3" style="pointer-events:none"/>`;
  if(o.seaLabels){g+=txt(pr.x(6.9),pr.y(54.55),'Nordsee',{fs:16,fill:'#1c5fa8'});g+=txt(pr.x(12.4),pr.y(54.85),'Ostsee',{fs:16,fill:'#1c5fa8'});}
  // Bundesländer
  const allD=STATES.map(s=>stateD(pr,s)).join('');
  if(o.bands){
    g+=`<defs><clipPath id="deClip"><path d="${allD}"/></clipPath></defs>`;
    g+=`<path d="${allD}" fill="#fff"/>`;
    g+=`<g clip-path="url(#deClip)">`;
    Object.entries(BANDS).forEach(([k,b])=>{
      let fill=b.col;if(o.bandHl&&o.bandHl!==k)fill='#eceff3';
      g+=`<path d="${dP(pr,b.poly)}" fill="${fill}" ${o.tapBands?`data-ans="${k}"`:''} stroke="none"/>`;
    });
    g+=`</g>`;
    g+=`<path d="${allD}" fill="none" stroke="#8a93a6" stroke-width="0.8" style="pointer-events:none"/>`;
  }else{
    STATES.forEach(s=>{
      let fill=o.plain?'#fbf6df':s.col;
      if(o.hl){fill=(o.hl===s.id)?s.col:'#eef0f4';}
      if(o.only&&!o.only.includes(s.id))fill='#f1f2f5';
      g+=`<path d="${stateD(pr,s)}" fill="${fill}" stroke="#8d6fa8" stroke-width="${o.hl===s.id?2.5:1}" ${o.tapStates?`data-ans="${s.id}"`:''}/>`;
    });
  }
  g+=`<path d="${dP(pr,BODENSEE)}" fill="#a9d3f5" stroke="#5a9bd8" stroke-width="0.8" style="pointer-events:none"/>`;
  // Flüsse
  (o.rivers||[]).forEach(id=>{
    const r=DE_RIVERS[id];const hl=o.riverHl===id;
    g+=`<path d="${dL(pr,r.p)}" fill="none" stroke="${hl?'#0a49b8':'#3a86e0'}" stroke-width="${hl?6:2.6}" stroke-linejoin="round" stroke-linecap="round" style="pointer-events:none"/>`;
    if(o.riverLabels){const m=r.p[Math.floor(r.p.length/2)];g+=txt(pr.x(m[0])+4,pr.y(m[1])-6,r.n,{fs:12,fill:'#1c5fa8',a:'start'});}
  });
  if(o.tapRivers)(o.rivers||[]).forEach(id=>{g+=`<path class="river" d="${dL(pr,DE_RIVERS[id].p)}" fill="none" stroke="#000" stroke-opacity="0" stroke-width="22" data-ans="${id}" style="pointer-events:stroke"/>`;});
  // Namen
  if(o.names){STATES.forEach(s=>{if(o.only&&!o.only.includes(s.id))return;if(s.small&&s.id!=='SL')return;g+=multiline(pr.x(s.lab[0]),pr.y(s.lab[1]),s.name.replace('-','-|'),{fs:12});});}
  if(o.nameOf){const s=ST_BY[o.nameOf];g+=multiline(pr.x(s.lab[0]),pr.y(s.lab[1])-(s.small?18:0),s.name.replace('-','-|'),{fs:15});}
  // Städte
  (o.cities||[]).forEach(c=>{
    const ci=c.p?c:DE_CITIES[c.id];const [x,y]=XY(pr,ci.p);
    const sq=c.square;
    g+=sq?`<rect x="${x-6}" y="${y-6}" width="12" height="12" fill="#e03b3b" stroke="#6b0f0f" stroke-width="2"/>`:`<circle cx="${x}" cy="${y}" r="${c.big?7:5.5}" fill="#e03b3b" stroke="#6b0f0f" stroke-width="2"/>`;
    if(c.label)g+=txt(x+9,y+5,ci.n,{fs:14,a:'start'});
    if(c.tap)g+=`<circle cx="${x}" cy="${y}" r="20" fill="#fff" fill-opacity="0.01" stroke="#ffcc00" stroke-opacity="0" stroke-width="0" data-ans="${c.id}"/>`;
  });
  (o.mounts||[]).forEach(id=>{const m=DE_MOUNT[id];const [x,y]=XY(pr,m.p);
    g+=`<polygon points="${x},${y-9} ${x+8},${y+5} ${x-8},${y+5}" fill="#3b2f2f"/>`;
    if(o.mountLabels)g+=txt(x+10,y+2,m.n+' '+m.hm+' m',{fs:13,a:'start'});

function compass(o){
  o=o||{};const c=150;let g=`<circle cx="${c}" cy="${c}" r="125" fill="#fff" stroke="#9fb6d8" stroke-width="3"/>`;
  const arms={N:[0,-1],O:[1,0],S:[0,1],W:[-1,0]};
  Object.entries(arms).forEach(([k,[dx,dy]])=>{
    const tip=[c+dx*105,c+dy*105],l=[c-dy*22,c+dx*22],r=[c+dy*22,c-dx*22];
    const fill=o.hl===k?'#f08a24':(k==='N'?'#d63b3b':'#7d8799');
    g+=`<polygon points="${tip.join(',')} ${l.join(',')} ${r.join(',')}" fill="${fill}" stroke="#333" stroke-width="2" ${o.tap?`data-ans="${k}"`:''}/>`;
  });
  g+=`<circle cx="${c}" cy="${c}" r="10" fill="#333"/>`;
  Object.entries(arms).forEach(([k,[dx,dy]])=>{
    if(o.labels==='all'||(o.labels==='N'&&k==='N'))g+=`<text x="${c+dx*130}" y="${c+dy*130+10}" text-anchor="middle" font-size="30" font-weight="bold" style="pointer-events:none">${k}</text>`;
  });
  return `<svg viewBox="-20 -20 340 340" width="300" height="300">${g}</svg>`;
}

/* ---- Planquadrate ---- */
const PQ_ICONS=[['🏠','das Haus'],['🌳','der Baum'],['⛪','die Kirche'],['🏫','die Schule'],['🐕','der Hund'],['🏰','die Burg'],['⛵','das Boot'],['🚗','das Auto']];
function pqGrid(n,items,o){
  o=o||{};const cols='ABCD'.slice(0,n);const cs=n===3?110:90;let h='<table style="border-collapse:collapse;font-size:28px;font-weight:bold;background:#fff">';
  h+='<tr><td></td>'+[...cols].map(c=>`<td style="text-align:center;color:#2b6fd6;height:40px;${o.hlCol===c?'background:#dbe8ff':''}">${c}</td>`).join('')+'</tr>';
  for(let r=1;r<=n;r++){h+=`<tr><td style="width:40px;text-align:center;color:#d6532b;${o.hlRow==r?'background:#ffe3d6':''}">${r}</td>`;
    [...cols].forEach(c=>{const cell=c+r;const it=items.find(x=>x.cell===cell);
      const bg=(o.hlCol===c&&o.hlRow==r)?'#fff3b0':(o.hlCol===c?'#eef4ff':(o.hlRow==r?'#fff2ec':'#fff'));
      h+=`<td ${o.tap?`data-ans="${cell}"`:''} style="width:${cs}px;height:${cs}px;border:3px solid #333;text-align:center;font-size:${n===3?52:44}px;background:${bg}">${it?it.ic:''}</td>`;});
    h+='</tr>';}
  return h+'</table>';
}
addEx({id:'planquadrat',t:'karte',ic:'🔢',n:'Planquadrate',d:'Buchstabe und Zahl finden',gen(){

  const H='Erst den Buchstaben oben suchen, dann die Zahl an der Seite. Wo sich beide treffen, ist das Planquadrat.';
  const r=Math.random();
  if(n===4&&r<0.3){
    const towns=Object.entries(SL_TOWNS).filter(([k,t])=>['saarbruecken','saarlouis','merzig','wendel','homburg','neunkirchen','perl','dillingen','lebach','blieskastel'].includes(k)&&slCell(t.p).clear);
    const [k,t]=pick('planquadrat',towns,x=>'sl'+x[0]);const cell=slCell(t.p).cell;

    return {key:'w'+n,q:`In welchem Planquadrat ist ${target.name} ${target.ic}?`,hint:H,html:pqGrid(n,items)+btns(opts3(target.cell,near.length>=2?near:cells)),correct:target.cell,

  }

}});

function hill(tap){const cols=['#5aa65a','#a6d27a','#f3e47a','#f2b45e','#c2783f'];let g='<rect width="320" height="220" fill="#fff"/>';

function ruler(n,showNums){const w=70;let g='';for(let i=0;i<n;i++){g+=`<rect x="${20+i*w}" y="40" width="${w}" height="34" fill="${i%2?'#fff':'#ffe9a8'}" stroke="#333" stroke-width="2"/>`;

  g+=`<circle cx="20" cy="57" r="13" fill="#e03b3b"/><text x="20" y="63" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">A</text>`;
  g+=`<circle cx="${20+n*w}" cy="57" r="13" fill="#2e9d4f"/><text x="${20+n*w}" y="63" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">B</text>`;

const EX_BY={};EX.forEach(e=>EX_BY[e.id]=e);

/* =========================================================
   Ablauf
   ========================================================= */
const ROUND=10;
let CUR=null;
function exStat(id){return S.ex[id]||(S.ex[id]={rounds:0,tasks:0,first:0,wrong:0,last:null});}
function itemStat(k){return S.items[k]||(S.items[k]={s:0,w:0,r:0});}

function showHome(msg){
  CUR=null;try{speechSynthesis.cancel();}catch(e){}
  let h=msg?`<div class="msg">${msg}</div>`:'';
  TOPICS.forEach(t=>{
    const list=EX.filter(e=>e.t===t.id&&!S.off[e.id]);if(!list.length)return;
    h+=`<section class="${t.id==='saar'?'sec-saar':''}"><h2>${t.ic} ${t.n}</h2><div class="tiles">`;
    list.forEach(e=>{const st=S.ex[e.id];const stars=st?Math.min(5,st.rounds):0;
      h+=`<button class="tile" data-ex="${e.id}"><span class="ic">${e.ic}</span><span><b>${e.n}</b><small>${e.d}</small><small>${'⭐'.repeat(stars)||'&nbsp;'}</small></span></button>`;});
    h+='</div></section>';
  });
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>startEx(b.dataset.ex));
  window.scrollTo(0,0);
}

function startEx(id){
  CUR={id,n:0,first:0,wrong:0,t0:Date.now(),lastKey:null};
  nextTask();
}
function nextTask(){
  const ex=EX_BY[CUR.id];let t;let guard=0;
  do{t=ex.gen();guard++;}while(t.key===CUR.lastKey&&guard<6);
  CUR.task=t;CUR.tries=0;CUR.lastKey=t.key;CUR.locked=false;
  render();
}
function render(){
  const t=CUR.task,ex=EX_BY[CUR.id];
  let dots='';for(let i=0;i<ROUND;i++)dots+=`<span class="dot ${i<CUR.n?'on':''}"></span>`;
  $('#app').innerHTML=`<div class="exhead"><button class="hbtn" id="homeB">🏠 Übersicht</button><div class="dots">${dots}</div><span class="extitle">${ex.ic} ${ex.n}</span></div>
   <div class="qbar"><div class="q">${t.q}</div><button class="spk" id="spQ">🔊</button></div>
   <div id="task"><div class="vis">${t.html}</div><div id="hint"></div></div>`;
  $('#homeB').onclick=()=>showHome();
  $('#spQ').onclick=()=>speak(t.say||t.q);
  $('#task').addEventListener('click',onAnswer);
  window.scrollTo(0,0);
}
function isCorrect(id){const c=CUR.task.correct;return Array.isArray(c)?c.includes(id):c===id;}
function onAnswer(ev){
  const el=ev.target.closest('[data-ans]');if(!el||CUR.locked)return;
  const id=el.getAttribute('data-ans');
  if(isCorrect(id)){
    CUR.locked=true;sndRight();
    document.querySelectorAll(`[data-ans="${CSS.escape(id)}"]`).forEach(e=>e.classList.add('right'));
    const st=itemStat(CUR.id+'|'+CUR.task.key);
    if(CUR.tries===0){st.s++;st.r++;CUR.first++;}
    CUR.n++;
    setTimeout(()=>{CUR.n>=ROUND?finishRound():nextTask();},CUR.tries===0?900:1300);
  }else{
    sndWrong();CUR.tries++;CUR.wrong++;
    const st=itemStat(CUR.id+'|'+CUR.task.key);st.s=0;st.w++;
    el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),900);
    if(CUR.task.onWrong)try{CUR.task.onWrong();}catch(e){}
    if(CUR.tries>=2)showMe();
    lockWithHint();
  }
}
function showMe(){
  const c=CUR.task.correct;(Array.isArray(c)?c:[c]).forEach(id=>document.querySelectorAll(`[data-ans="${CSS.escape(id)}"]`).forEach(e=>{e.classList.add('show-me');if(e.tagName==='circle')e.setAttribute('stroke-opacity','1');}));
}
function lockWithHint(){
  CUR.locked=true;const task=$('#task');task.classList.add('locked');
  let sec=(S.wait||4)+(CUR.tries>=2?2:0);
  $('#hint').innerHTML=`<div class="hint"><span style="font-size:36px">💡</span><span class="ht">${CUR.task.hint}</span><button class="spk" id="spH">🔊</button><span class="wait" id="wt">⏳ ${sec}</span></div>`;
  $('#spH').onclick=()=>speak(CUR.task.hint);
  const myTask=CUR.task;
  const iv=setInterval(()=>{
    if(!CUR||CUR.task!==myTask){clearInterval(iv);return;}
    sec--;const w=$('#wt');if(w)w.textContent=sec>0?'⏳ '+sec:'👉 Jetzt du!';
    if(sec<=0){clearInterval(iv);CUR.locked=false;task.classList.remove('locked');}
  },1000);
}
function finishRound(){
  const ex=EX_BY[CUR.id];const st=exStat(CUR.id);
  st.rounds++;st.tasks+=ROUND;st.first+=CUR.first;st.wrong+=CUR.wrong;st.last=new Date().toISOString();
  S.log.push({d:new Date().toISOString(),ex:CUR.id,ok:CUR.first,err:CUR.wrong,sec:Math.round((Date.now()-CUR.t0)/1000)});
  if(S.log.length>400)S.log=S.log.slice(-400);
  let stageMsg='';
  if(ex.stage&&(S.blStage||1)<3){
    const set=blSet();const all=['blfinden','blname'].every(e=>set.every(id=>(S.items[e+'|'+id]||{s:0}).s>=2));
    if(all){S.blStage=(S.blStage||1)+1;stageMsg='🎉 Super! Jetzt kommen neue Bundesländer dazu.';}
  }
  saveS();
  const done=CUR.id;
  startReward(()=>{
    $('#app').innerHTML=`<div class="done"><div class="big">🏆</div><h2>Toll gemacht!</h2>${stageMsg?`<div class="msg">${stageMsg}</div>`:''}
      <button class="bigbtn" id="again">🔁 Noch eine Runde</button><button class="bigbtn alt" id="home2">🏠 Übersicht</button></div>`;
    $('#again').onclick=()=>startEx(done);$('#home2').onclick=()=>showHome();
  });
}

/* =========================================================
   Belohnung: Gummi-Schleuder (3 Durchgänge)
   ========================================================= */
function startReward(onDone){
  CUR=null;
  $('#app').innerHTML=`<h2 style="text-align:center">🎯 Gummi-Schleuder</h2><div class="rwinfo" id="rwInfo"></div>
    <canvas id="cv" width="900" height="520"></canvas><div class="rwinfo">Ziehe die Kugel nach hinten und lass los!</div>
    <div style="text-align:center"><button class="bigbtn" id="rwDone" hidden>Weiter ➜</button></div>`;
  const cv=$('#cv'),ctx=cv.getContext('2d');const W=900,H=520,GY=470,G=1100,BS=46;
  const anchor={x:170,y:340};let round=0,shots=3,ball,boxes=[],hits=0,dragging=false,flying=false,flyT=0,running=true,waiting=false,last=performance.now();
  const COLS=['#f6c95a','#9fd27a','#7fb2e5','#e7a6d6','#f3a05a','#c9b4f0'];
  function col(x,n,arr){for(let i=0;i<n;i++)arr.push({x,y:GY-BS*(i+1),f:false,vx:0,vy:0,a:0,av:0,c:rnd(COLS)});}
  const layouts=[
    ()=>{const a=[];col(600,1,a);col(646,2,a);col(692,3,a);col(738,2,a);col(784,1,a);return a;},
    ()=>{const a=[];col(580,4,a);col(626,2,a);col(760,4,a);col(806,2,a);return a;},
    ()=>{const a=[];col(620,3,a);col(666,5,a);col(712,3,a);col(800,2,a);return a;}
  ];
  function info(){$('#rwInfo').textContent=`Durchgang ${round+1} von 3   •   Kugeln: ${'🔴'.repeat(shots)}   •   Treffer: ${hits}`;}
  function resetBall(){ball={x:anchor.x,y:anchor.y,vx:0,vy:0,r:17};flying=false;flyT=0;}
  function newRound(){boxes=layouts[round]();shots=3;resetBall();info();waiting=false;}
  function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
  cv.addEventListener('pointerdown',e=>{if(flying||waiting||shots<=0)return;const p=pos(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<80){dragging=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}}});
  cv.addEventListener('pointermove',e=>{if(!dragging)return;const p=pos(e);let dx=p.x-anchor.x,dy=p.y-anchor.y;const L=Math.hypot(dx,dy),M=140;if(L>M){dx*=M/L;dy*=M/L;}ball.x=anchor.x+dx;ball.y=anchor.y+dy;});
  const up=()=>{if(!dragging)return;dragging=false;const dx=anchor.x-ball.x,dy=anchor.y-ball.y;if(Math.hypot(dx,dy)<15){resetBall();return;}
    ball.vx=dx*7.8;ball.vy=dy*7.8;flying=true;shots--;info();tone(300,0.15,'sawtooth',0.06);};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  function knock(b,vx,vy){b.f=true;b.vx=vx;b.vy=vy;b.av=(Math.random()-.5)*8;hits++;sndPop();info();
    boxes.forEach(o=>{if(!o.f&&Math.abs(o.x-b.x)<BS*0.9&&o.y<b.y){o.f=true;o.vx=vx*0.4+(Math.random()-.5)*80;o.vy=-80;o.av=(Math.random()-.5)*6;hits++;}});}
  function afterShot(){waiting=true;setTimeout(()=>{if(!running)return;
    if(boxes.every(b=>b.f)||shots<=0){round++;if(round<3){$('#rwInfo').textContent=`Durchgang ${round} geschafft! 🎉`;setTimeout(()=>running&&newRound(),1100);}
      else{$('#rwInfo').textContent=`Fertig! Du hast ${hits} Kisten getroffen! 🎉`;resetBall();$('#rwDone').hidden=false;}}
    else{resetBall();waiting=false;}},700);}
  function step(dt){
    if(flying){flyT+=dt;ball.vy+=G*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
      if(ball.y+ball.r>GY){ball.y=GY-ball.r;ball.vy*=-0.35;ball.vx*=0.8;if(Math.abs(ball.vy)<60)ball.vy=0;}
      boxes.forEach(b=>{if(b.f)return;const cx=Math.max(b.x,Math.min(ball.x,b.x+BS)),cy=Math.max(b.y,Math.min(ball.y,b.y+BS));
        if(Math.hypot(ball.x-cx,ball.y-cy)<ball.r){knock(b,ball.vx*0.6+60,Math.min(-150,ball.vy*0.3-200));ball.vx*=0.75;ball.vy*=0.75;}});
      if(ball.x>W+60||ball.x<-60||flyT>6||(ball.vy===0&&Math.abs(ball.vx)<25)){flying=false;afterShot();}}
    boxes.forEach(b=>{if(!b.f)return;b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.av*dt;});
  }
  function draw(){
    const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#9fd4ff');sky.addColorStop(1,'#e6f5ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#7cc35a';ctx.fillRect(0,GY,W,H-GY);ctx.fillStyle='#5aa23f';ctx.fillRect(0,GY,W,6);
    ctx.strokeStyle='#6b3e1f';ctx.lineWidth=14;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(anchor.x,GY);ctx.lineTo(anchor.x,anchor.y+40);ctx.lineTo(anchor.x-26,anchor.y-6);ctx.moveTo(anchor.x,anchor.y+40);ctx.lineTo(anchor.x+26,anchor.y-6);ctx.stroke();
    if(!flying){ctx.strokeStyle='#3b2a1a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(anchor.x-26,anchor.y-6);ctx.lineTo(ball.x,ball.y);ctx.lineTo(anchor.x+26,anchor.y-6);ctx.stroke();}
    if(dragging){let x=ball.x,y=ball.y,vx=(anchor.x-ball.x)*7.8,vy=(anchor.y-ball.y)*7.8;ctx.fillStyle='rgba(255,255,255,.9)';
      for(let i=0;i<26;i++){const d=0.035;vy+=G*d;x+=vx*d;y+=vy*d;if(y>GY)break;if(i%2===0){ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();}}}
    boxes.forEach(b=>{ctx.save();ctx.translate(b.x+BS/2,b.y+BS/2);ctx.rotate(b.a);ctx.fillStyle=b.c;ctx.strokeStyle='#5a4a2a';ctx.lineWidth=3;
      ctx.fillRect(-BS/2,-BS/2,BS,BS);ctx.strokeRect(-BS/2,-BS/2,BS,BS);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-9,-5,4,0,7);ctx.arc(9,-5,4,0,7);ctx.fill();
      ctx.beginPath();ctx.lineWidth=3;ctx.arc(0,4,10,0.2,Math.PI-0.2);ctx.stroke();ctx.restore();});
    if(shots>0||flying){ctx.fillStyle='#d62020';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(ball.x-5,ball.y-6,5,0,7);ctx.fill();}
  }
  function loop(t){if(!running)return;const dt=Math.min(0.033,(t-last)/1000);last=t;step(dt);draw();requestAnimationFrame(loop);}
  newRound();requestAnimationFrame(loop);
  $('#rwDone').onclick=()=>{running=false;onDone();};
}

$('#admBtn').onclick=()=>{
  const a=3+Math.floor(Math.random()*6),b=4+Math.floor(Math.random()*5);
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><h3>⚙️ Nur für Erwachsene</h3><p>Wie viel ist ${a} · ${b}?</p><input type="number" id="gate"> <button class="bigbtn" id="gok">OK</button> <button class="bigbtn alt" id="gx">Abbrechen</button></div>`;
  document.body.appendChild(m);
  m.querySelector('#gx').onclick=()=>m.remove();
  m.querySelector('#gok').onclick=()=>{if(+m.querySelector('#gate').value===a*b){m.remove();adminPanel();}else m.querySelector('#gate').value='';};
};
function fmtD(iso){if(!iso)return '–';const d=new Date(iso);return d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}
function adminPanel(){
  const m=document.createElement('div');m.className='modal';
  const build=()=>{
    let h=`<div class="box adm"><h3>⚙️ Einstellungen für Erwachsene</h3>
    <label><input type="checkbox" id="tm" ${TEST?'checked':''}> 🧪 Testmodus (Eingaben werden nicht gespeichert)</label>
    <h3>Wartezeit nach einem Fehler</h3><div class="seg">${[3,4,6,8].map(s=>`<button data-w="${s}" class="${(S.wait||4)===s?'on':''}">${s} s</button>`).join('')}</div>
    <h3>Bundesländer: wie viele üben?</h3><div class="seg">${[[1,'6 Länder'],[2,'12 Länder'],[3,'alle 16']].map(([v,l])=>`<button data-st="${v}" class="${(S.blStage||1)===v?'on':''}">${l}</button>`).join('')}</div>
    <p style="font-size:16px;color:#555">Es geht automatisch weiter, wenn Jakob alle Länder der Stufe beim Finden und Benennen mindestens zweimal hintereinander richtig hatte.</p>
    <h3>Übungen ein- und ausschalten</h3>`;
    TOPICS.forEach(t=>{h+=`<b>${t.ic} ${t.n}</b>`;EX.filter(e=>e.t===t.id).forEach(e=>{h+=`<label><input type="checkbox" data-on="${e.id}" ${S.off[e.id]?'':'checked'}> ${e.ic} ${e.n}</label>`;});});
    h+=`<h3>📊 Auswertung</h3><table><tr><th>Übung</th><th>Runden</th><th>1. Versuch richtig</th><th>Zuletzt</th><th>Noch unsicher</th></tr>`;
    EX.forEach(e=>{const st=S.ex[e.id];if(!st)return;
      const pct=st.tasks?Math.round(100*st.first/st.tasks):0;
      const weak=Object.entries(S.items).filter(([k,v])=>k.startsWith(e.id+'|')&&v.w>0&&v.s<2).sort((a,b)=>b[1].w-a[1].w).slice(0,5).map(([k])=>prettyKey(e.id,k.split('|')[1]));
      h+=`<tr><td>${e.ic} ${e.n}</td><td>${st.rounds}</td><td>${pct} %</td><td>${fmtD(st.last)}</td><td>${weak.join(', ')||'–'}</td></tr>`;});
    h+=`</table><h3>Letzte Runden</h3><table><tr><th>Datum</th><th>Übung</th><th>1. Versuch richtig</th><th>Fehler</th><th>Zeit</th></tr>`;
    S.log.slice(-12).reverse().forEach(l=>{h+=`<tr><td>${fmtD(l.d)}</td><td>${EX_BY[l.ex]?EX_BY[l.ex].n:l.ex}</td><td>${l.ok} von 10</td><td>${l.err}</td><td>${Math.floor(l.sec/60)} min ${l.sec%60} s</td></tr>`;});
    h+=`</table><p><button class="bigbtn alt" id="rst">🗑️ Fortschritt löschen</button> <button class="bigbtn" id="cls">Fertig</button></p></div>`;
    m.innerHTML=h;
    m.querySelector('#tm').onchange=e=>{TEST=e.target.checked;$('#testbar').hidden=!TEST;if(!TEST)loadS();};
    m.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{S.wait=+b.dataset.w;saveS();build();});
    m.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.blStage=+b.dataset.st;saveS();build();});
    m.querySelectorAll('[data-on]').forEach(c=>c.onchange=()=>{if(c.checked)delete S.off[c.dataset.on];else S.off[c.dataset.on]=true;saveS();});
    let armed=false;m.querySelector('#rst').onclick=e=>{if(!armed){armed=true;e.target.textContent='⚠️ Wirklich löschen? Nochmal tippen';return;}
      S={ex:{},items:{},off:S.off,blStage:1,wait:S.wait,log:[]};saveS();build();};
    m.querySelector('#cls').onclick=()=>{m.remove();if(!CUR)showHome();};
  };
  build();document.body.appendChild(m);
}
function prettyKey(ex,k){
  if(ST_BY[k])return ST_BY[k].name;
  if(/^[a-z]?[A-Z]{2,3}$/.test(k)){const id=k.replace(/^[a-z]/,'');if(ST_BY[id])return ST_BY[id].name;if(KR_BY[id])return KR_BY[id].n;if(NBC[id])return NBC[id].n;if(SL_NB[id])return SL_NB[id].n;}
  if(SYM[k])return SYM[k].n;
  const m=k.match(/^(?:rv|rt|c|sl|s|t|h|w|m)([a-z]+)$/);
  if(m){const id=m[1];if(DE_RIVERS[id])return DE_RIVERS[id].n;if(DE_CITIES[id])return DE_CITIES[id].n;if(SL_TOWNS[id])return SL_TOWNS[id].n;if(SL_RIVERS[id])return SL_RIVERS[id].n;if(SL_MARKS[id])return SL_MARKS[id].n;}
  return k.length>40?k.slice(0,40)+'…':k;
}

showHome();
